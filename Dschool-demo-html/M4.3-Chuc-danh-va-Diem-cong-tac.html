<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M4.3 Chức danh &amp; Điểm công tác — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
mark{background:#fef08a;padding:0 1px;border-radius:2px}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:12px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:17px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:8px 0 0;flex-wrap:wrap;align-items:flex-end}
.tfil{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:5px;flex-wrap:wrap}
.tab1{padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}

.scope{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:7px 12px;font-size:12px;color:var(--ink2);margin:8px 0 9px;flex-wrap:wrap}
.scope.past{border-left-color:var(--amber);background:var(--amber-soft);color:#92400e}
.scope b{color:var(--ink)}
.scope.past b{color:#78350f}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12.5px;background:#fff;min-width:172px}
.ms{position:relative}
.msb{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap}
.msb.act{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.msb .cnt{background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:8px}
.msp{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:0 8px 22px rgba(15,23,42,.14);min-width:250px;max-height:270px;overflow-y:auto;z-index:20;display:none;padding:5px}
.msp.on{display:block}
.mso{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:12.5px;cursor:pointer}
.mso:hover{background:var(--bg)}
.mso input{width:15px;height:15px;flex:0 0 15px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;cursor:pointer}
.grow:hover{background:#eef2f7}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.miss{color:var(--amber);font-weight:700}
.miss.r{color:var(--red)}
.hrow{display:grid;gap:9px;padding:8px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px;
 grid-template-columns:1.9fr 1.5fr 1.5fr 1fr .9fr}
.stage.open .hrow{grid-template-columns:1.9fr 1.4fr}
.stage.open .hcol{display:none}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.gone{opacity:.62}
.hrow.vac{background:#fffafa;border-left-color:#fecaca}
.who2{display:flex;gap:9px;align-items:center;min-width:0}
.ava2{width:31px;height:31px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 31px}
.ava2.vac{background:#fee2e2;color:#991b1b}
.who2 .i{min-width:0}
.who2 .i b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who2 .i span{font-size:11px;color:var(--ink3)}
.hdrow{display:grid;gap:9px;padding:7px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
 grid-template-columns:1.9fr 1.5fr 1.5fr 1fr .9fr}
.stage.open .hdrow{grid-template-columns:1.9fr 1.4fr}
.stage.open .hdrow div.hcol{display:none}
.hrow input[type=checkbox],.hdrow input[type=checkbox]{width:15px;height:15px}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}

.ph{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ava3{width:48px;height:48px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:16px;font-weight:700;flex:0 0 48px}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.ptabs{display:flex;gap:2px;padding:0 11px;border-bottom:1px solid var(--line);background:#fafbfc;overflow-x:auto}
.ptab{padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptab.on{color:var(--brand);border-bottom-color:var(--brand);background:#fff}
.pbody{padding:13px 15px;max-height:calc(100vh - 230px);overflow-y:auto}

.card{border:1px solid var(--line);border-radius:11px;margin-bottom:11px;overflow:hidden}
.ch{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.f{display:grid;grid-template-columns:158px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.rolnk.rd{color:#991b1b;background:var(--red-soft);border-color:#fecaca}
.rolnk.am{color:#92400e;background:var(--amber-soft);border-color:#fde68a}

/* BLOOP #2 2/10/2026 — §6.2.5 bảng nhiệm kỳ bổ nhiệm trong panel F2 */
.nkr{display:grid;grid-template-columns:1fr 86px 86px 118px;gap:8px;align-items:start;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.nkr:last-child{border-bottom:0}
.nkr.hd{background:#f8fafc;font-weight:700;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px}
.nkr.hl{background:var(--amber-soft)}
.nkr .d{color:var(--ink2);font-variant-numeric:tabular-nums}
.nkr .ops{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.nkr .sub{font-size:11.5px;color:var(--amber);margin-top:3px;font-weight:600}
.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.r::before{background:var(--red)}
.logi.g::before{background:var(--green)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}

.blk{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:12.5px}
.blk .ic{flex:0 0 16px;color:var(--ink3)}
.sech{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
.prev{display:flex;flex-direction:column;gap:5px}
.pv{display:grid;grid-template-columns:96px 1fr;gap:9px;font-size:12.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
.pv.o{background:var(--red-soft);border-color:#fecaca}
.pv.n{background:var(--green-soft);border-color:#a7f3d0}
.pv .t{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink3)}
.pv.o .t{color:#991b1b}.pv.n .t{color:#065f46}
.chain{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.chi{position:relative;padding:7px 0;font-size:12.5px}
.chi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--ink3);border:2px solid #fff}
.chi.now::before{background:var(--green)}
.chi b{font-weight:700}
.chi .mm{color:var(--ink3);font-size:11.5px}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:720px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.din{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.ta{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px;min-height:56px;resize:vertical}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:10px}
.drop{border:2px dashed var(--line2);border-radius:10px;padding:12px;text-align:center;color:var(--ink3);font-size:12.5px;margin-top:5px;cursor:pointer}
.drop:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.drop.has{border-style:solid;border-color:var(--green);background:var(--green-soft);color:#065f46;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:700px){.g2{grid-template-columns:1fr}}

.cdchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;
 padding:3px 10px;font-size:12px;margin:0 5px 5px 0;background:#fff}
.cdchip.main{background:var(--brand-soft);border-color:#bfdbfe;color:#1e40af;font-weight:600}
.cdchip.bn{background:#f5f3ff;border-color:#ddd6fe;color:#5b21b6}
.cdchip .x{color:var(--ink3);font-weight:700;cursor:pointer;padding:0 2px}
.cdchip .x:hover{color:var(--red)}
.cdchip .pv2{color:var(--ink3);font-size:11px}
.cdadd{border:1px dashed var(--line2);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--brand);background:#fff}
.cdadd:hover{border-color:var(--brand);background:var(--brand-soft)}

.rolebar{background:#0f172a;color:#cbd5e1;padding:7px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.bulkbar{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#0f172a;color:#fff;font-size:12.5px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bulkbar .sp{flex:1}
.noacc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:40px;text-align:center}
.noacc h3{font-size:17px;margin-bottom:9px}
.noacc p{color:var(--ink2);font-size:13px;max-width:560px;margin:0 auto 9px}
</style>
</head>
<body>
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="FULL">🔓 Đủ quyền (demo)</button>
  <button class="rb" data-r="HT">HT</button>
  <button class="rb" data-r="TCNS">TCNS</button>
  <button class="rb" data-r="PHT_CM">PHT_CM</button>
  <button class="rb" data-r="PHT_DT">PHT_DT</button>
  <button class="rb" data-r="TTCM">TTCM</button>
  <button class="rb" data-r="GVCN">GVCN</button>
  <span class="note">Chỉ <b>HT</b> và <b>TCNS</b> có quyền Sửa — hàng rào nằm ở ma trận M10.4, không nằm trong màn hình này</span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="hnam"><option>Năm học 2026-2027</option><option>Năm học 2025-2026</option></select>
  <select class="sel" id="hdt"><option value="">Toàn trường</option></select>
  <span class="lockico" id="dtlock"></span>
  <div class="spacer"></div>
  <button class="icobtn">🔔<span class="dot">3</span></button>
  <button class="icobtn">💬<span class="dot">2</span></button>
  <div class="avatar" id="ava">DQ</div>
</header>

<div class="wrap">
  <main class="main">
    <div class="tophd"><h1>Chức danh &amp; Điểm công tác</h1><div class="spacer"></div>
      <button class="btn sm" data-x="ghiChu">💡 Ghi chú thiết kế</button>
      <button class="btn sm" data-x="xuat">⬇ Xuất</button></div>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>
</div>

<div class="mask" id="mask"><div class="modal">
  <div class="mh" id="mh"></div><div class="mb" id="mb"></div><div class="mf" id="mf"></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const HOMNAY=new Date(2026,7,29);
const p2=n=>String(n).padStart(2,'0');
const d2s=d=>p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();
const s2d=s=>{const a=s.split('/').map(Number);return new Date(a[2],a[1]-1,a[0])};

function themMoc(nsId,cd,dv,tu,den,qd,nguon){
 MOC.push({id:'M'+(++MSEQ),ns:nsId,cd:cd,dv:dv||'',tu:tu,den:den||null,qd:qd||'',nguon:nguon||'tay'});
 return MOC[MOC.length-1]}

/* Chuyển dữ liệu gieo của v2.x sang mô hình mới.
   🔑 Bản ghi có `tu` === `den` là ca BẤM NHẦM ⇒ ⛔ sinh mốc, để nó mang nhãn «Đã hủy — thêm nhầm». */
(function(){
 const cu=BN.slice(); BN=[];
 cu.forEach(function(b){
  const nham = b.den && key(b.den)===key(b.tu);
  const ng = b.nguon==='M4.1' ? 'M4.1' : 'M4.2';
  let m=null;
  if(!nham) m=themMoc(b.ns,b.cd,b.dv,b.tu,b.den,b.qd,ng);
  themLS(b.ns,b.cd,b.dv,'them',b.boi,b.tu,nham?'tay':ng,m?m.id:null);
  if(b.den) themLS(b.ns,b.cd,b.dv,'tat',b.boi,b.den,'tay',m?m.id:null);
  const da=BN.filter(x=>x.ns===b.ns&&x.cd===b.cd&&(x.dv||'')===(b.dv||''))[0];
  if(da){ if(!b.den) da.tat=0; return }
  BN.push({id:b.id,ns:b.ns,cd:b.cd,dv:b.dv||'',tat:b.den?1:0,
           nguon:b.nguon,boi:b.boi,tuCap:b.tuCap||0,qd:b.qd,nk:b.nk||0});
 });
})();

/* số lớp đang được phân công cho GVCN — chiếu từ M4.5 */
const PC={N09:1,N11:1,N13:1,N14:1,N18:1,N10:1,N27:1,N28:1,N19:0,N12:0};
const TONGLOP=30, DACOGVCN=28;

/* ===== TRUY VẤN THEO THỜI GIAN ===== */
/* ═══ CDHT 5/10/2026 — LỚP TRUY VẤN, nay chỉ hỏi TRẠNG THÁI HIỆN TẠI ═══
   🛑 ⛔ còn chiều thời gian ở menu này: ⛔ hieuLuc theo ngày, ⛔ luật đè khoảng,
   ⛔ luật kế nhiệm trong ngày chuyển giao. Câu «ngày D ai giữ» hỏi MOC (M4.1). */
function hieuLuc(b,d){return !b.tat}
function cdTai(nsId,d){return BN.filter(b=>b.ns===nsId&&!b.tat)}
function cdTat(nsId){return BN.filter(b=>b.ns===nsId&&b.tat)}
function giuTai(cd,dv,d){return BN.filter(b=>b.cd===cd&&(b.dv||'')===(dv||'')&&!b.tat)}
function lichSu(nsId){return BN.filter(b=>b.ns===nsId)}

/* nhật ký thao tác của MỘT người — mới nhất lên trên */
function lsCua(nsId){return LS.filter(x=>x.ns===nsId).sort((a,b)=>key(b.luc)-key(a.luc))}
/* 🔑 «đã gắn» là SUY RA: dòng này có trỏ về một mốc quá trình công tác ⛔ */
function daGan(l){return !!l.moc && MOC.some(m=>m.id===l.moc)}
function mocBy(id){return MOC.filter(m=>m.id===id)[0]}
/* đếm hai chiều — con số này bày ở M4.1 «Hồ sơ cần hoàn thiện» (§6.2.5) */
function chuaGan(nsId){const d=LS.filter(x=>(!nsId||x.ns===nsId)&&!daGan(x));
 return {bat:d.filter(x=>x.hd==='them'||x.hd==='bat').length, tat:d.filter(x=>x.hd==='tat').length, ds:d}}
/* 🆕 §6.2.7 — «Đã hủy, thêm nhầm»: đã tắt · ⛔ mốc nào · ⛔ dữ liệu hoạt động nào */
function laHuy(b){return !!b.tat && !b.nk &&
 !LS.some(x=>x.ns===b.ns&&x.cd===b.cd&&(x.dv||'')===(b.dv||'')&&daGan(x))}
/* chuỗi người đã giữ một chức danh — ĐỌC TỪ M4.1, ⛔ từ bản ghi của menu này (§7.1) */
function chuoi(cd,dv){return MOC.filter(m=>m.cd===cd&&(m.dv||'')===(dv||'')).sort((a,b)=>key(a.tu)-key(b.tu))}

function dlink(m,l){return '<button class="rolnk" data-x="dl" data-m="'+m+'">↗ '+(l||m)+'</button>'}
function sidebar(){

function base(){
 let a=NS.filter(conLam);
 if(R().scope==='Branch')a=a.filter(p=>p.dt===R().dt);
 if(R().scope==='Group')a=a.filter(p=>p.to===R().to);
 return a}
function cdChinh(p){const c=cdTai(p.id,NGAY);
 const b=c.filter(x=>cdBy(x.cd).nhom<3).sort((x,y)=>CD.findIndex(z=>z.ma===x.cd)-CD.findIndex(z=>z.ma===y.cd))[0];
 return b||c.filter(x=>x.cd==='GVCN')[0]||c.filter(x=>x.cd==='GVBM')[0]||null}
function cdKiem(p){const ch=cdChinh(p);return cdTai(p.id,NGAY).filter(x=>!ch||x.id!==ch.id)}
function soMenu(p){const c=cdTai(p.id,NGAY);return c.length?Math.max.apply(null,c.map(x=>cdBy(x.cd).mn)):0}
function chuaPC(p){return cdTai(p.id,NGAY).filter(x=>x.cd==='GVCN'&&!PC[p.id])}
/* dòng T3 */
function dongBM(){const r=[];
 CD.filter(c=>c.nhom<3).forEach(function(c){dsDV(c.ma).forEach(function(d){
  r.push({cd:c.ma,dv:d,giu:giuTai(c.ma,d,NGAY)})})});
 return r}

  (suaDuoc()?'<button class="btn sm" data-x="mLoat">⇉ Đổi hàng loạt'+(selNS.size?' ('+selNS.size+')':'')+'</button>':'');
 return oQ('Tìm họ tên, mã…')+msCD()+

function chips(){
 const k=khuyet(),h=[];
 if(k.length)h.push('<button class="rolnk rd" data-x="xemKhuyet">🔴 '+k.length+' chức danh khuyết</button>');

 if(cp)h.push('<button class="rolnk am" data-x="xemChuaPC">⏰ '+cp+' người chưa phân công lớp</button>');
 h.push('<button class="rolnk'+(AIS.length>2?' rd':'')+'" data-x="aiSua">🔑 '+AIS.length+' người có quyền sửa</button>');
 if(!R().sua)h.push('<button class="rolnk off" data-x="viSaoDoc">🔒 chỉ đọc</button>');
 return h.join(' ')}

 if(tab==='cd'){const a=loc();return '<span class="st2 n">hiện '+a.length+'/'+base().length+'</span>'}
 if(tab==='bm'){const r=dongBM();return '<span class="st2 n">'+(r.length+2)+' dòng</span>'+

 const l=base().filter(lech).length;

function msCD(){
 return '<div class="ms"><button class="msb'+(fCD.size?' act':'')+'" data-x="msTog">Chức danh'+
  (fCD.size?'<span class="cnt">'+fCD.size+'</span>':' ▾')+'</button><div class="msp" id="mspCD">'+
  CD.map(function(c){return '<label class="mso"><input type="checkbox" data-cdf="'+c.ma+'"'+(fCD.has(c.ma)?' checked':'')+'>'+

function loc(){
 let a=base();
 if(q){const k=kd(q);a=a.filter(p=>kd(p.ten).indexOf(k)>=0||p.ma.toLowerCase().indexOf(k)>=0)}
 if(fCD.size)a=a.filter(p=>cdTai(p.id,NGAY).some(b=>fCD.has(b.cd)));
 if(fDT)a=a.filter(p=>p.dt===fDT);
 if(fRS==='Chỉ chức danh chính')a=a.filter(p=>cdTai(p.id,NGAY).length<=1);
 if(fRS==='Có kiêm nhiệm')a=a.filter(p=>cdTai(p.id,NGAY).length>1);
 if(fRS==='⚠ Chưa phân công')a=a.filter(p=>chuaPC(p).length);
 if(fRS==='Chưa có chức danh')a=a.filter(p=>!cdTai(p.id,NGAY).length);
 return a}

 h+='<div class="stage'+(cur?' open':'')+'"><div class="listw">'+

  '<div class="hcol">Quyền truy cập</div><div class="hcol">Hiệu lực từ</div></div>';
 if(!a.length)h+='<div class="empty">Không có nhân sự nào khớp bộ lọc.</div>';
 else{
  const G={};
  a.forEach(function(p){let k='—';
   if(fGOM==='Gom: chức danh'){const c=cdChinh(p);k=c?cdBy(c.cd).ten:'Chưa có chức danh'}
   if(fGOM==='Gom: điểm trường')k=dtBy(p.dt).ten;
   if(fGOM==='Gom: tổ')k=p.to?toBy(p.to).ten:'Không thuộc tổ chuyên môn';
   (G[k]=G[k]||[]).push(p)});
  Object.keys(G).forEach(function(k){

   G[k].forEach(function(p){h+=nsRow(p)})});
 }
 h+='</div>'+(cur?panel():'')+'</div>';

   (b.dv?'<span class="pv2">'+esc(dvTen(b.dv))+'</span>':'')+

   (suaDuoc()?'<button class="rolnk am" data-x="mTat" data-b="'+b.id+'">○ Tắt</button>':'')+'</span>'});
 /* 🆕 §6.2.7 — chức danh đã tắt vẫn Ở LẠI; nhãn tách «từng giữ» với «bấm nhầm» */
 tat.forEach(function(b){const cd=cdBy(b.cd), huy=laHuy(b);
  h+='<span class="cdchip" style="opacity:.72"><b>'+esc(cd.ten)+'</b>'+

 if(suaDuoc())h+='<button class="cdadd" data-x="mThem">＋ Thêm chức danh</button>';

 const cho=cdTai(p.id,NGAY).filter(choPV);
 if(cho.length)h+='<div class="warn">⏳ <b>'+cho.length+' bản ghi chờ gắn phạm vi</b> — sinh từ <b>M4.1</b> khi tạo hồ sơ bằng biểu mẫu bảy ô '+
  '<i>(chức danh gắn đơn vị, mà biểu mẫu ⛔ không có ô phạm vi — M4.3 §3.4.1)</i>. '+
  'Người này <b>đã có vai trò</b> nhưng phạm vi <b>rỗng</b> ⇒ vào menu thấy <b>danh sách rỗng</b> — 🛑 ⛔ <b>không</b> rơi về Toàn trường.</div>';
 const cp=chuaPC(p);
 if(cp.length)h+='<div class="warn">⏰ Có chức danh <b>Giáo viên chủ nhiệm</b> nhưng <b>chưa được phân công lớp nào</b>. '+
  'Người này vào được Không gian lớp học nhưng <b>danh sách lớp rỗng</b> — đây là trạng thái trung gian hợp lệ. '+dlink('M4.5','Phân công lớp')+'</div>';
 h+='<div class="card"><div class="ch">Quyền truy cập sinh ra</div><div style="padding:10px 12px;font-size:12.5px;color:var(--ink2)">'+
  (c.length?'Mở được tối đa <b style="color:var(--ink)">'+soMenu(p)+' menu</b>. Phạm vi dữ liệu: '+
    [...new Set(c.map(b=>choPV(b)?'⏳ rỗng — chưa gắn phạm vi':(b.dv?(dtBy(b.dv)?'Branch — '+dtBy(b.dv).vt:'Group — '+toBy(b.dv).ten):(cdBy(b.cd).nhom===3?'Class':'School'))))]
    .map(x=>'<span class="st2 v">'+esc(x)+'</span>').join(' ')
   :'Không có phạm vi nào.')+

function luuThem(){
 const p=nsBy(cur);
 if(!F.cd){toast('⚠ Chưa chọn chức danh');return}
 const c=cdBy(F.cd);
 /* 🩹 CDHT 5/10/2026 — chỉ LOẠI 1 mới đòi phạm vi. `GVCN` khai dv:'lop' nhưng là nhóm ③,
    phạm vi của nó đến từ phân công ở M4.5 (§3.4) ⇒ guard cũ chặn oan, ⛔ thêm được GVCN. */
 if(c.nhom<3&&c.dv&&!F.dv){toast('⛔ <b>Chức danh loại 1 bắt buộc có phạm vi</b> — không gắn đơn vị thì truy vấn scope trả về rỗng');return}
 const gk=giuTai(c.ma,F.dv||'',HOMNAY);
 if(c.don&&gk.length){toast('⛔ Chặn cứng — <b>'+esc(nsBy(gk[0].ns).ten)+'</b> đang giữ chức danh này');return}
 const tu=cdTai(p.id,HOMNAY).filter(b=>cdBy(b.cd).don&&cdBy(b.cd).nhom<3);
 if(c.don&&tu.length){toast('⛔ Chặn cứng — kiêm nhiệm chéo hai chức danh đơn nhất');return}
 /* CDHT 5/10/2026 — ⛔ ngày, ⛔ chứng cứ, ⛔ luật đè khoảng. Chỉ chặn trùng chức danh ĐANG giữ. */
 if(cdTai(p.id,HOMNAY).some(b=>b.cd===c.ma&&(b.dv||'')===(F.dv||''))){
  toast('⛔ '+esc(p.ten)+' <b>đang giữ</b> chức danh này');return}
 const cu=cdTat(p.id).filter(b=>b.cd===c.ma&&(b.dv||'')===(F.dv||''))[0];
 const boi=nsBy(ME[role]).ten+' ('+R().ten+')';
 let b;
 if(cu){ b=cu; b.tat=0; themLS(p.id,c.ma,F.dv,'bat',boi,d2s(HOMNAY),'tay',null) }
 else{
  b={id:'B'+(++BSEQ),ns:p.id,cd:c.ma,dv:F.dv||'',tat:0,nguon:'',boi:boi,
     tuCap:p.id===ME[role]?1:0,qd:'',nk:0};
  BN.push(b);
  themLS(p.id,c.ma,F.dv,'them',boi,d2s(HOMNAY),'tay',null);
 }
 closeModal();render();
 toast('Đã cấp <b>'+esc(c.ten)+'</b> cho <b>'+esc(p.ten)+'</b> — <b>hiệu lực ngay</b> · mở thêm quyền vào <b>'+c.mn+' menu</b>'+
  (b.tuCap?' · <b>⚑ tự cấp</b> đã ghi audit':'')+' · <b>1 lượt chưa gắn mốc</b>')}

function doGanPV(){
 const b=BN.filter(x=>x.id===GPV.b)[0],p=nsBy(b.ns),c=cdBy(b.cd);
 if(!GPV.dv){toast('⚠ Chưa chọn đơn vị');return}
 const gk=giuTai(c.ma,GPV.dv,HOMNAY).filter(x=>x.id!==b.id);
 if(c.don&&gk.length){toast('⛔ Chặn — <b>'+esc(nsBy(gk[0].ns).ten)+'</b> đang giữ chức danh này ở <b>'+esc(dvTen(GPV.dv))+'</b>');return}
 b.dv=GPV.dv; b.nguon=''; b.boi=nsBy(ME[role]).ten+' ('+R().ten+')';
 closeModal();render();
 /* BLOOP 2/10/2026 — §6.2.4 nói «GẮN hoặc ĐỔI phạm vi» ⇒ cửa gắn cũng phải nhắc.
    nhacDiemCT() tự im khi phạm vi ⛔ phải một điểm trường, hoặc đã trùng Điểm trường công tác. */
 if(dtBy(GPV.dv)&&GPV.dv!==p.dt){nhacDiemCT(p,c,GPV.dv,'',b.qd,b.tu);return}
 toast('Đã gắn phạm vi <b>'+esc(dvTen(GPV.dv))+'</b> cho <b>'+esc(p.ten)+'</b> — truy vấn của <b>'+esc(c.ten)+'</b> nay trả về dữ liệu của đơn vị này')}
/* ═══ BLOOP 2/10/2026 · §6.2.4 — ĐỔI PHẠM VI, và NHẮC «Điểm trường công tác» ═══
   Đổi = đóng bản cũ (Đến ngày = D) + mở bản mới (Từ ngày = D) trong CÙNG MỘT thao tác (§3.3).
   Trong ngày D, bản kế nhiệm thắng ở panel (§3.3.1 — biKeNhiem) nên người dùng thấy ĐÚNG MỘT dòng. */
let DPV=null;
function mDoiPV(bId){

 modal('⇄ Đổi phạm vi — '+esc(c.ten)+' · '+esc(p.ten),'<div id="dpvBody"></div>',
  '<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="doDoiPV">💾 Đổi phạm vi</button>');

 let h='<div class="info">Đang giữ <b>'+esc(c.ten)+' — '+esc(dvTen(b.dv))+'</b> từ '+esc(b.tu)+'.<br>'+
  'Đổi là <b>MỘT thao tác</b>: đóng bản ghi cũ <code>Đến ngày = '+esc(DPV.hl)+'</code> và mở bản mới '+
  '<code>Từ ngày = '+esc(DPV.hl)+'</code> <i>(§3.3)</i>. 🛑 ⛔ bắt gỡ rồi tạo lại.</div>'+
  '<label class="lbl">Đơn vị MỚI <b>*</b></label>'+
  '<select class="din" data-f="dpv"><option value="">— chọn đơn vị —</option>'+

  else h+='<div class="ro" style="margin-top:9px">✓ <b>'+esc(dvTen(DPV.dv))+'</b> chưa có người giữ <b>'+esc(c.ten)+'</b>.</div>';
 }

function doDoiPV(){
 const b=BN.filter(x=>x.id===DPV.b)[0],p=nsBy(b.ns),c=cdBy(b.cd);
 if(!DPV.dv){toast('⚠ Chưa chọn đơn vị mới');return}
 if(!DPV.ly.trim()){toast('⚠ <b>Bắt buộc ghi lý do</b> khi đổi phạm vi');return}
 const gk=giuTai(c.ma,DPV.dv,HOMNAY).filter(x=>x.ns!==b.ns);
 if(c.don&&gk.length){toast('⛔ Chặn — <b>'+esc(nsBy(gk[0].ns).ten)+'</b> đang giữ chức danh này ở <b>'+esc(dvTen(DPV.dv))+'</b>');return}
 const dvCu=b.dv;
 /* CDHT 5/10/2026 — đổi THẲNG trên bản ghi, ⛔ còn đóng bản cũ mở bản mới (§6.2.4) */
 b.dv=DPV.dv;
 themLS(b.ns,b.cd,DPV.dv,'doipv',nsBy(ME[role]).ten+' ('+R().ten+')',d2s(HOMNAY),'tay',null);
 closeModal();render();
 nhacDiemCT(p,c,DPV.dv,dvCu,DPV.qd,d2s(HOMNAY));
}

  return}
 modal('✅ Đã gắn phạm vi — '+esc(c.ten)+' · '+esc(dvTen(dvMoi)),
  '<div class="ro">✅ <b>Đã lưu.</b> '+esc(c.ten)+' · <b>'+esc(dvTen(dvMoi))+'</b> — hiệu lực từ '+esc(hl)+
   (qd?' · QĐ '+esc(qd):'')+'<div style="margin-top:4px">Trong ngày chuyển giao, panel hiện <b>đúng một dòng</b>; bản cũ vào <b>Lịch sử</b> <i>(§3.3.1)</i>.</div></div>'+

   'điểm trường công tác nói <i>«ngồi làm việc ở đâu»</i> <i>(§6.4.4 · §3.4.1 — cùng một tên cột, hai nghĩa)</i>. '+

  '<button class="btn" data-x="close">Để nguyên '+esc(dtBy(p.dt).vt)+'</button>'+
  (suaDuoc()?'<button class="btn p" data-x="nhacDoiDCT" data-p="'+p.id+'" data-dt="'+dvMoi+'" data-qd="'+esc(qd||'')+'" data-hl="'+esc(hl)+'">✎ Đổi điểm trường công tác sang '+esc(dtBy(dvMoi).vt)+'</button>':''));
}
