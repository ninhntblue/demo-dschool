<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1.9 Nạp dữ liệu trường lên hệ thống — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
mark{background:#fef08a;padding:0 1px;border-radius:2px}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:206px;flex:0 0 206px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:250px}
.ms{position:relative}
.msb{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap}
.msb.act{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.msb .cnt{background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:8px}
.msp{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:0 8px 22px rgba(15,23,42,.14);min-width:230px;max-height:260px;overflow-y:auto;z-index:20;display:none;padding:5px}
.msp.on{display:block}
.mso{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:12.5px;cursor:pointer}
.mso:hover{background:var(--bg)}
.mso input{width:15px;height:15px;flex:0 0 15px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

/* dai canh bao */
.alerts{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.alert{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600}
.alert .sp{flex:1}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}

/* layout tang 2 */
.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage.open .listw{flex:1 1 0;max-width:none}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;cursor:pointer}
.grow:hover{background:#eef2f7}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.miss{color:var(--amber);font-weight:700}
.miss.r{color:var(--red)}
.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px;
 grid-template-columns:26px 1.9fr 1.5fr 1.35fr 1.1fr 1fr}
.stage.open .hrow{grid-template-columns:26px 1.9fr 1.35fr}
.stage.open .hcol{display:none}
.stage.open .hcol.keep{display:block}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.sub{padding-left:26px}
.who2{display:flex;gap:9px;align-items:center;min-width:0}
.ava2{width:32px;height:32px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 32px}
.who2 .i{min-width:0}
.who2 .i b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who2 .i span{font-size:11px;color:var(--ink3)}
.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
 grid-template-columns:26px 1.9fr 1.5fr 1.35fr 1.1fr 1fr}
.stage.open .hdrow{grid-template-columns:26px 1.9fr 1.35fr}
.stage.open .hdrow div{display:none}
.stage.open .hdrow div.kc{display:block}
.hrow input[type=checkbox],.hdrow input[type=checkbox]{width:15px;height:15px}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}
.viewer{display:grid;grid-template-columns:1fr 210px;gap:13px}
@media(max-width:700px){.viewer{grid-template-columns:1fr}}
.vpage{background:#334155;border-radius:10px;min-height:300px;display:grid;place-items:center;color:#94a3b8;position:relative;overflow:hidden}
.vsheet{background:#fff;width:78%;height:88%;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:14px 16px;font-size:9px;color:#334155;line-height:1.7;overflow:hidden}
.vsheet h4{font-size:10px;text-align:center;font-weight:800;margin-bottom:7px}
.vsheet .ln{height:5px;background:#e2e8f0;border-radius:3px;margin:5px 0}
.vtool{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.86);border-radius:999px;padding:4px 6px;display:flex;gap:3px}
.vtool button{color:#e2e8f0;font-size:11.5px;padding:3px 9px;border-radius:999px}
.vtool button:hover{background:#334155;color:#fff}
.vmeta{font-size:11.5px}
.vmeta .r{padding:6px 0;border-bottom:1px solid var(--line)}
.vmeta .r b{display:block;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.tag{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tag.gh{background:#ede9fe;color:#5b21b6}.tag.moi{background:var(--bg);color:var(--ink2)}
.tag.dup{background:var(--red-soft);color:var(--red)}
.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.r::before{background:var(--red)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}

/* panel */
.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ava3{width:50px;height:50px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:17px;font-weight:700;flex:0 0 50px}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.ptabs{display:flex;gap:2px;padding:0 11px;border-bottom:1px solid var(--line);background:#fafbfc;overflow-x:auto}
.ptab{padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptab.on{color:var(--brand);border-bottom-color:var(--brand);background:#fff}
.pbody{padding:14px 15px;max-height:calc(100vh - 250px);overflow-y:auto}

/* the dien uu tien */
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.exp{border-color:#fecaca}
.card.rev{opacity:.72}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:150px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}

/* chuoi ky hieu luc */
.ky{display:flex;flex-direction:column;gap:5px}
.kyi{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 8px;border-radius:7px;background:var(--bg)}
.kyi.now{background:var(--green-soft);color:#065f46;font-weight:600}
.kyi.old{color:var(--ink3)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap;margin-left:6px}
.rolnk:hover{background:#e0e7ff}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:660px;max-width:94vw;max-height:86vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.bulkbar{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#0f172a;color:#fff;font-size:12.5px;border-bottom:1px solid var(--line)}
.bulkbar .sp{flex:1}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}

/* ══════════════ M1.9 — riêng ══════════════ */
.pv{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:11px 0}
.pv b{color:var(--ink)}
.hintline{background:#fffbeb;border:1px solid #fde68a;color:#78350f;padding:8px 12px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.ai{display:inline-block;font-size:9.5px;font-weight:700;background:#ede9fe;color:#5b21b6;border-radius:4px;padding:1px 5px;white-space:nowrap}

/* wizard */
.wz{display:flex;align-items:center;gap:0;margin:13px 0 15px;flex-wrap:wrap}
.wzs{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink3);font-weight:600}
.wzs .n{width:23px;height:23px;border-radius:50%;background:var(--bg);color:var(--ink3);display:grid;place-items:center;font-size:11.5px;font-weight:700;border:1px solid var(--line2)}
.wzs.on{color:var(--brand)}
.wzs.on .n{background:var(--brand);color:#fff;border-color:var(--brand)}
.wzs.done{color:var(--green)}
.wzs.done .n{background:var(--green-soft);color:var(--green);border-color:#a7f3d0}
.wzl{width:34px;height:2px;background:var(--line);margin:0 9px}

.drop{border:2px dashed var(--line2);border-radius:12px;padding:30px;text-align:center;background:#fcfdfe}
.drop b{display:block;font-size:14px;margin-bottom:5px}
.drop .sub{font-size:12.5px;color:var(--ink3);margin-bottom:13px}
.filechip{display:inline-flex;align-items:center;gap:8px;background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;
 border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600}

.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px;margin-bottom:13px}
.met{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.met .k{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.met .v{font-size:21px;font-weight:800;margin-top:2px;line-height:1.15}
.met.r{border-color:#fecaca;background:var(--red-soft)}   .met.r .v{color:var(--red)}
.met.w{border-color:#fde68a;background:var(--amber-soft)} .met.w .v{color:var(--amber)}
.met.g{border-color:#a7f3d0;background:var(--green-soft)} .met.g .v{color:var(--green)}

.dcrow{display:grid;grid-template-columns:38px 60px 1.6fr 1fr 2.4fr;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:start}
.dcrow.hd2{background:#f8fafc;font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.dcrow.r{background:var(--red-soft)} .dcrow.w{background:var(--amber-soft)}
.dcrow .why{color:var(--ink2);font-size:12px;line-height:1.55}
.dcrow .fix{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}

/* xep lop */
.xl{display:grid;grid-template-columns:290px 1fr;gap:13px;align-items:start}
@media(max-width:1080px){.xl{grid-template-columns:1fr}}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:70px}
.qh{padding:10px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.qb{max-height:520px;overflow-y:auto;padding:7px}
.qi{border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-bottom:5px;font-size:12.5px;cursor:grab;background:#fff}
.qi:hover{border-color:var(--brand);background:var(--brand-soft)}
.qi.sel{border-color:var(--brand);background:#dbeafe;box-shadow:0 0 0 2px #bfdbfe}
.qi b{display:block;font-weight:600}
.qi .mm{font-size:11px;color:var(--ink3);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.src{font-size:9.5px;font-weight:700;border-radius:4px;padding:1px 5px;white-space:nowrap}
.src.lo{background:#e0e7ff;color:#3730a3}  .src.ts{background:#ecfdf5;color:#065f46}
.src.tn{background:#fef3c7;color:#92400e}  .src.kc{background:#f1f5f9;color:#475569}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px}
.cls{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 11px;min-height:104px}
.cls.drop2{border-color:var(--brand);background:var(--brand-soft)}
.cls.full{border-color:#fecaca;background:var(--red-soft)}
.cls h4{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.cls .gv{font-size:11px;color:var(--ink3);margin-top:1px}
.cls .num{font-size:12px;font-weight:700;margin-top:6px}

function veXepLop(){
  /* Khối lấy từ HD chứ KHÔNG từ dsChuaLop(): em vừa gán mà chưa lưu vẫn phải
     thấy khối của mình, nếu không thì gán xong là khối biến mất khỏi bộ lọc. */
  const khois = [...new Set(HD.map(h => h.k))].sort((a, b) => a - b);
  if (!khois.length) return '<div class="card"><div class="cb"><div class="empty">✅ Không còn học sinh nào chưa có lớp trong năm học ' + NAM + '.</div></div></div>';
  /* khối vừa LƯU hết thì không đứng lại ở màn hình rỗng — nhảy sang khối còn việc */
  if (!khois.includes(fKhoi)) fKhoi = khois[0];
  const dsK = HD.filter(h => h.k === fKhoi && !GAN[h.ma]);
  const lops = LOP.filter(l => l.k === fKhoi && (R().sc === 'Branch' ? l.dt === 'A' : true));

  let h = '<div class="info">Hàng đợi gồm <b>mọi học sinh chưa có lớp</b> trong năm học đang chọn — ' +
    '<b>mọi khối 1–12</b>, <b>mọi nguồn</b>. Khác <code>M1.4</code> F8 ở chỗ đó: F8 chỉ khối 1/6/10 và chỉ gom em ' +
    '<i>đã xác nhận nhập học từ một đợt tuyển sinh</i>, nên các khối còn lại trước nay không có đường nào.</div>';

  h += '<div class="bar"><b style="font-size:12.5px">Khối:</b> ' +
    khois.map(k => '<button class="btn sm' + (k === fKhoi ? ' p' : '') + '" data-x="khoi" data-k="' + k + '">Khối ' + k +
      (LOP.some(l => l.k === k) ? '' : ' ⛔') +
      ' <span style="opacity:.7">(' + dsChuaLop().filter(x => x.k === k).length + ')</span></button>').join(' ') +
    '<div class="spacer"></div>' + theAi('xeplop') +
    '<button class="btn sm" data-x="gan-lo">📄 Gán theo lô</button>' +
    '<button class="btn sm p" data-x="goiy">✨ Gợi ý tự động</button></div>';

  if (!lops.length){
    return h + '<div class="danger">⛔ <b>Khối ' + fKhoi + ' chưa có lớp nào</b> trong danh mục năm ' + NAM + '. ' +
      'Không có lớp đích thì không xếp được ai. <button class="btn xs" data-x="di-m102">↗ M10.1 ③ — khai lớp khối ' + fKhoi + '</button></div>' +
      '<div class="qb" style="max-width:320px;padding:0">' + dsK.map(veQi).join('') + '</div>' + thanhLuu();
  }

  h += '<div class="xl"><div class="q"><div class="qh">⏳ Chờ xếp lớp — khối ' + fKhoi +
    '<div class="spacer" style="flex:1"></div><span class="st2 n">' + dsK.length + '</span></div><div class="qb">' +
    (dsK.length ? dsK.map(veQi).join('') : '<div class="empty" style="padding:24px">Hết em nào chưa có lớp ở khối này ✓</div>') +
    '</div></div><div><div class="grid">' + lops.map(veCls).join('') + '</div>';

  h += thanhLuu();

  h += '<div class="ro"><b>Không có bước duyệt và ký công bố ở đây</b> — khác <code>M1.4</code> F8 <i>(PHT_ĐT duyệt → HT ký số Nhóm A)</i>. ' +
    'Ở F8 có một <b>quyết định trúng tuyển</b> để công bố; ở đây chỉ là ghi nhận hiện trạng một trường đang chạy. ' +
    'Vết vẫn đủ vì chỉ <b>HT và PHT_ĐT</b> thao tác được, và mọi lượt xếp đều vào lịch sử lô.</div>';

  return h + '</div></div>';
}

  const them = Object.keys(GAN).filter(m => GAN[m] === l.id);
  const ss = l.ss + them.length;
  const conCho = l.max - ss - l.giu;
  const day = conCho <= 0;
  return '<div class="cls' + (day ? ' full' : '') + '" data-lop="' + l.id + '">' +
    '<h4>🏫 ' + l.id + (l.he !== 'Đại trà' ? ' <span class="st2 v">' + l.he + '</span>' : '') + '</h4>' +
    '<div class="gv">' + (l.gvcn ? 'GVCN ' + esc(l.gvcn) : '<span style="color:var(--red)">chưa có GVCN</span>') + ' · ' + dtTen(l.dt) + '</div>' +
    '<div class="num">' + ss + '/' + l.max + (l.giu ? ' <span class="st2 w">+' + l.giu + ' giữ chỗ</span>' : '') +
    (day ? ' <span class="st2 r">đủ</span>' : ' <span style="color:var(--ink3);font-weight:400">còn ' + conCho + '</span>') + '</div>' +
    '<div class="bar2"><i style="width:' + Math.min(100, Math.round((ss + l.giu) / l.max * 100)) + '%"></i></div>' +
    (them.length ? '<div class="adds">' + them.map(m => '<span class="chipx">' + esc(HD.find(x => x.ma === m).n) +
      '<button data-x="go" data-ma="' + m + '">✕</button></span>').join('') + '</div>' : '') +
    '</div>';
}

      '<code>M10.1</code>: <i>"Danh mục lớp không lưu sĩ số hiện tại, nó tính ra"</i>. ' +
      'Nhìn <b>33/35</b> mà thực tế còn một chỗ vì có em bảo lưu sắp về là sai lệch dẫn thẳng tới vượt sĩ số.</div>',

      '<button class="btn" data-x="di-m102">↗ M10.1 ③ — sĩ số tối đa của lớp</button>');

/* Dải «ba loại lô» nay là ba TAB — dòng dẫn dưới đây thay cho ba nút chọn loại cũ,
   để người đang ở một tab vẫn biết hai tab kia làm gì và khác mình ở chỗ nào. */
function daiBaLo(hien){
  const L = [
    ['hoso', '🧩 Bổ sung hồ sơ',       'Loại 2a + Loại 3 dạng data — thứ phải hỏi gia đình. <b>Không tạo hồ sơ mới bao giờ.</b>'],
    ['diem', '⌨ Điểm nhập trực tiếp',  'ĐGtx · ĐGgk · ĐGck của kỳ đã trôi qua trước ngày lên hệ thống.'],
    ['cc',   '📅 Chuyên cần tổng hợp', 'Số buổi nghỉ có phép / không phép theo kỳ — <b>không dựng lại từng ngày.</b>'],
  ];
  return '<div class="lotype">' + L.map(([id, ten, mo]) =>
    '<button class="lt' + (hien === id ? ' on' : '') + '" data-t2="' + id + '"><b>' + ten + '</b><span>' + mo + '</span></button>'
  ).join('') + '</div>';
}

function buHoSo(){
  const n = Object.keys(nhomBu).filter(k => nhomBu[k]).length;
  return '<div class="info">💡 <b>Xuất ra rồi nạp lại, không phải mẫu trống.</b> Hệ thống xuất tệp đã có sẵn ' +
    '<code>mã định danh</code> · <code>họ tên</code> · <code>lớp</code> cộng đúng các cột bạn tick — ' +
    '<b>ô nào hệ thống đã có thì điền sẵn, ô trống chính là ô cần bù</b>. Ba cái lợi: không còn bài toán đối khớp, ' +
    'người dùng thấy đúng thứ còn thiếu, và tệp hẹp theo nhu cầu thay vì 20 cột một lượt.</div>' +
    '<div class="card"><div class="ch">① Chọn nhóm trường cần bù</div><div class="cb">' +
    Object.keys(NHOMBU).map(k => {
      const g = NHOMBU[k];
      return '<label class="mso" style="padding:9px 13px;border-bottom:1px solid #f1f5f9">' +
        '<input type="checkbox" data-x="nhom" data-n="' + k + '"' + (nhomBu[k] ? ' checked' : '') + '>' +
        '<span><b>' + g[0] + '</b> <span class="st2 n">Loại ' + g[2] + '</span><br><span style="color:var(--ink2);font-size:12px">' + g[1] + '</span>' +
        (g[3] ? '<br><span style="color:var(--ink3);font-size:11.5px">' + g[3] + '</span>' : '') + '</span></label>';
    }).join('') + '</div>' +
    '<div class="cact"><span style="font-size:12px;color:var(--ink2)">Đã chọn <b>' + n + '</b> nhóm · tệp sẽ có <b>' + (3 + n * 2) + '</b> cột · <b>1.274</b> dòng</span>' +
    '<div class="spacer" style="flex:1"></div>' + theAi('buhoso') +
    '<button class="btn sm p" data-x="xuat-bu"' + (n ? '' : ' disabled') + '>⬇ Xuất tệp để điền</button>' +
    '<button class="btn sm" data-x="nap-bu">⬆ Nạp tệp đã điền</button></div></div>' +
    '<div class="ro">🏠 <b>Địa chỉ trong mẫu ② là BA cột, không phải một</b> <i>(HDCS ① · M1.1 §6.3.8 — cụm CSDL 19/9/2026)</i>: ' +
    '<code>Tỉnh / Thành phố</code> · <code>Phường / Xã</code> · <code>Chi tiết / Địa chỉ đầy đủ</code>. ' +
    'Hai cột đầu có giá trị và khớp danh mục ⇒ <b>chế độ danh mục</b>; hai cột đầu trống mà cột ba có giá trị ⇒ <b>chế độ tự do</b>, dòng mang nhãn <b>⚠ chưa chuẩn hóa</b>.<br>' +
    '🛑 <b>Địa chỉ ở chế độ tự do là ✓ Hợp lệ</b> — ⛔ không phải ⚠ Cảnh báo mềm, ⛔ không phải ⛔ Chặn. ' +
    'Chặn ở đây là bắt trường đi tra 1.284 mã hành chính <b>trước khi được phép lên hệ thống</b>, và đó là cách chắc nhất để họ không lên nữa.<br>' +
    '📋 <b>Mẫu ưu tiên giống tệp xuất từ cổng CSDL ngành.</b> Cột của cổng mà hệ thống không dùng <i>(Quận/Huyện · Phân ban · Xếp loại học lực)</i> ⇒ ' +
    '<b>bỏ qua và NÊU TÊN ở bước đối chiếu</b>, ⛔ không báo lỗi, ⛔ không chặn dòng. Nhưng ⛔ <b>im lặng bỏ qua cũng sai</b> — trường tưởng đã nạp cả cột đó rồi đi tìm nó trong hồ sơ.</div>' +
    '<div class="ro">📎 <b>Giấy tờ không đi qua Excel.</b> Giấy khai sinh, xác nhận cư trú, học bạ cấp trước… vào bằng ba đường đã có ở <code>M1.1</code>: ' +
    'phụ huynh tải qua App <i>(F2 Yêu cầu cập nhật)</i> · nhà trường tải hộ <i>(§6.6.3)</i> · duyệt nhanh bằng ô tích <code>Đã đối chiếu bản gốc</code>. ' +
    'Menu này chỉ thêm nhánh <b>data</b> — ba nhánh kia đã dựng xong từ trước.</div>';
}

function buDiem(){
  const k = KY.find(x => x.id === kyChon);
  const [lp, mn] = lopMon.split('|');
  const m = MON.find(x => x.lop === lp && x.mon === mn);
  const th = lopOf(lp) && lopOf(lp).cap === 'TH';

  let h = daiBaLo('diem') +
    '<div class="warn">🚪 <b>Cổng chặn: <code>Ngày bắt đầu vận hành trên hệ thống</code> = ' + NGAY_VANHANH + '</b> <i>(khai ở M10.1)</i>. ' +
    'Chỉ nhập trực tiếp được cho kỳ <b>kết thúc trước</b> mốc này; từ mốc đó trở đi chỉ còn đường thường — ' +
    'lượt kiểm tra <b>gắn tiết học</b> <i>(M2.5 §6.0b)</i> và kỳ thi <i>(M2.8)</i>. ' +
    'Không có mốc này thì cơ chế nhập trực tiếp sẽ được dùng để né ràng buộc tiết học <b>vĩnh viễn</b>.</div>';

  h += '<div class="bar"><b style="font-size:12.5px">Học kỳ:</b> ' +
    KY.map(x => '<button class="btn sm' + (x.id === kyChon ? ' p' : '') + (x.truoc ? '' : ' ') + '" data-x="ky" data-k="' + x.id + '">' +
      x.ten + ' <span style="opacity:.7">kết thúc ' + x.het + '</span>' + (x.truoc ? '' : ' ⛔') + '</button>').join(' ') + '</div>';

  if (!k.truoc){
    return h + '<div class="danger">⛔ <b>' + k.ten + ' kết thúc ' + k.het + '</b> — <b>sau</b> ngày bắt đầu vận hành ' + NGAY_VANHANH + '. ' +
      'Kỳ này trường đã chạy trên hệ thống, nên điểm phải đi đường thường.<br>' +
      '<button class="btn xs" data-x="di-m25">↗ M2.5 — tạo lượt kiểm tra gắn tiết</button> ' +
      '<button class="btn xs" data-x="di-m28">↗ M2.8 — tổ chức kỳ thi định kỳ</button></div>';
  }

  h += '<div class="bar"><b style="font-size:12.5px">Lớp × Môn:</b> <select class="fs" id="lm">' +
    MON.map(x => '<option value="' + x.lop + '|' + x.mon + '"' + (lopMon === x.lop + '|' + x.mon ? ' selected' : '') + '>' +
      x.lop + ' · ' + x.mon + ' — ' + x.tiet + ' tiết/năm</option>').join('') + '</select>' +
    '<div class="spacer"></div>' + theAi('budiem') +
    '<button class="btn sm" data-x="xuat-diem">⬇ Xuất tệp ' + (th ? '' : m.cot + ' cột') + '</button>' +
    '<button class="btn sm p" data-x="nap-diem">⬆ Nạp và đối chiếu</button></div>';

  if (th){
    return h + '<div class="danger">⛔ <b>Lớp ' + lp + ' là Tiểu học — không dùng điểm số.</b> ' +
      '<code>TT 27/2020</code> Điều 6: đánh giá thường xuyên ở Tiểu học thực hiện <b>bằng nhận xét</b>, kết quả môn là <b>mức</b> ' +
      '<i>Hoàn thành tốt / Hoàn thành / Chưa hoàn thành</i>. Nhập mức định kỳ cho Tiểu học là một mẫu khác hẳn — ' +
      'đang ở <b>§14 điểm 2 Điểm cần xác nhận</b> của tệp mô tả.</div>';
  }

  h += '<div class="card"><div class="ch">Xem trước — ' + lp + ' · ' + mn + ' · ' + k.ten +
    '<div class="sp"></div><span class="st2 v">' + m.cot + ' cột ĐGtx — suy từ ' + m.tiet + ' tiết/năm theo TT 22/2021 Điều 6</span></div>' +
    '<div class="cb" style="overflow-x:auto"><table class="bd2"><thead><tr><th>Học sinh</th>' +
    Array.from({length: m.cot}, (_, i) => '<th class="kt">ĐGtx ' + (i + 1) + '<span class="colke">⌨ Nhập trực tiếp</span><span class="colke" style="color:var(--ink3)">— không có ngày</span></th>').join('') +
    '<th class="kt">ĐGgk<span class="colke">⌨ Nhập trực tiếp</span></th><th class="kt">ĐGck<span class="colke">⌨ Nhập trực tiếp</span></th>' +
    '<th>TB môn</th></tr></thead><tbody>' +
    XEM_DIEM.map(r => {
      const tx = r[1].slice(0, m.cot);
      const tb = ((tx.reduce((a, b) => a + b, 0) + 2 * r[2] + 3 * r[3]) / (tx.length + 5)).toFixed(1);
      return '<tr><td><b>' + esc(r[0]) + '</b></td>' + tx.map(v => '<td class="cell-ke">' + v.toFixed(1) + '</td>').join('') +
        '<td class="cell-ke">' + r[2].toFixed(1) + '</td><td class="cell-ke">' + r[3].toFixed(1) + '</td>' +
        '<td><b>' + tb + '</b></td></tr>';
    }).join('') + '</tbody></table></div></div>';

  h += '<div class="info">🔑 <b>Không dựng loại điểm thứ hai.</b> Cột nhập trực tiếp là <b>một cột ĐGtx hợp lệ</b>, chỉ khác ở trường <code>nguồn</code>: ' +
    'thay vì <i>tiết học trong TKB</i> thì là <i>lô nhập trực tiếp</i>. Vì cấu trúc cột không đổi, ' +
    '<b>M3.1 chạy tính, M1.3 dựng học bạ, M3.3 xét lên lớp đều không phải sửa một dòng nào</b> — ' +
    'công thức <code>ĐTBmhk = (ΣĐĐGtx + 2×ĐĐGgk + 3×ĐĐGck) / (số ĐĐGtx + 5)</code> chạy y hệt.</div>';

  h += '<div class="ro">🗓 <b>Ô <code>Ngày kiểm tra</code> để trống vĩnh viễn, không có ô nhập tay.</b> ' +
    'Cùng nguyên tắc <code>M10.8</code> §14d–14e <i>("Chưa khảo sát" không ánh xạ thành "Không" · "Miễn" không ánh xạ thành 0)</i>: ' +
    '<b>một ngày bịa ra tệ hơn một ô trống</b> — ô trống thì nhìn là biết, ngày bịa thì mãi mãi không ai phát hiện. Và ngày đó sẽ đi vào học bạ.</div>';

  h += '<div class="ro">🧮 <b>Số cột lệch với sổ cũ thì mẫu tự ép, không cần màn hình ánh xạ.</b> ' +
    '<code>TT 22/2021</code> quy định số cột ĐGtx là <b>số ĐÚNG</b> (2/3/4), không phải số tối thiểu. Sổ cũ thường nhiều hơn — ' +
    '5 điểm miệng + 3 điểm 15 phút là chuyện thường. Tệp xuất ra có <b>đúng ' + m.cot + ' cột</b> nên trường tự chọn ' + m.cot + ' điểm để điền; ' +
    'điểm dư muốn giữ vết thì đổ vào <b>Lượt tham khảo</b> — cơ chế <code>M2.5</code> §3.2 đã có sẵn: <i>"có điểm, có lịch sử, không vào công thức"</i>.</div>';

  h += '<div class="ro">🏛 <b>ĐGgk · ĐGck ghi thẳng, không dựng lại kỳ thi.</b> Không ai tái dựng được phòng thi, số báo danh và bảng phách ' +
    'của một kỳ thi đã diễn ra trước khi có hệ thống — ép làm thế thì trường khai bừa cho xong. ' +
    'Hai cột vẫn <b>chỉ đọc tại M2.5</b>, giữ nguyên ranh giới D1 với M2.8.</div>';
  return h;
}

function buCC(){
  const k = KY.find(x => x.id === kyChon);
  let h = '<div class="bar"><b style="font-size:12.5px">Học kỳ:</b> ' +
    KY.map(x => '<button class="btn sm' + (x.id === kyChon ? ' p' : '') + '" data-x="ky" data-k="' + x.id + '">' + x.ten + (x.truoc ? '' : ' ⛔') + '</button>').join(' ') +
    '<div class="spacer"></div>' + theAi('budiem') +
    '<button class="btn sm" data-x="xuat-cc">⬇ Xuất tệp</button><button class="btn sm p" data-x="nap-cc">⬆ Nạp và đối chiếu</button></div>';

  if (!k.truoc) return h + '<div class="danger">⛔ ' + k.ten + ' nằm sau ngày bắt đầu vận hành ' + NGAY_VANHANH + ' — điểm danh kỳ này đi đường thường theo tiết.</div>';

  h += '<div class="card"><div class="ch">Xem trước — chuyên cần ' + k.ten + ' · đơn vị lô là (Lớp × Học kỳ)</div>' +
    '<div class="cb"><table><thead><tr><th>Lớp</th><th>Sĩ số</th><th>Nghỉ CÓ phép (lượt)</th><th>Nghỉ KHÔNG phép (lượt)</th><th>Nhãn</th></tr></thead><tbody>' +
    XEM_CC.map(r => '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td>' +
      '<td><span class="st2 v">⌨ Tổng hợp</span></td></tr>').join('') + '</tbody></table></div></div>';

  h += '<div class="info">📅 <b>Nhập ở mức TỔNG, không sinh bản ghi điểm danh từng ngày.</b> ' +
    'Dựng lại 90 ngày × 5 tiết là thứ <b>không trường nào có dữ liệu để cung cấp</b> — sổ giấy chỉ ghi tổng số buổi nghỉ. ' +
    'Sinh bản ghi từng ngày ở đây là <b>bịa dữ liệu</b>, cùng loại sai với việc gõ ngày kiểm tra giả.</div>' +
    '<div class="ro">Màn hình chuyên cần của kỳ đó hiện dải nói rõ <i>"Kỳ I là số liệu tổng hợp nhập trực tiếp — không có chi tiết theo ngày"</i>, ' +
    'tránh việc GVCN mở ra rồi tưởng dữ liệu bị mất.</div>';
  return h;
}

/* ═══════════════ TAB ⑥ — LỊCH SỬ LÔ ═══════════════ */
function veLS(){
  const ds = R().sc === 'Branch' && role === 'VT' ? LS.filter(l => l.u.indexOf('Văn thư') >= 0) : LS;
  let h = '';
  if (role === 'VT') h += '<div class="ro">🔎 Văn thư có bộ lọc bản ghi <code>authored</code> — chỉ thấy lô của chính mình. ' +
    'Đây là <b>ràng buộc dữ liệu</b>, không phải ẩn nút: lô của người khác không có trong dữ liệu trả về.</div>';

  h += '<div class="card"><div class="ch">Lịch sử lô — đơn vị dòng là <b>một lô</b></div><div class="cb">' +
    '<table><thead><tr><th>Mã lô</th><th>Thời điểm</th><th>Người chạy</th><th>Loại</th><th>Phạm vi</th>' +
    '<th style="text-align:right">Ghi</th><th style="text-align:right">Bỏ qua</th><th>Trạng thái</th><th></th></tr></thead><tbody>' +
    (ds.length ? ds.map(l => '<tr><td><code>' + l.id + '</code></td><td>' + l.t + '</td><td>' + esc(l.u) + '</td>' +
      '<td>' + esc(l.loai) + '</td><td style="color:var(--ink2)">' + esc(l.pv) + '</td>' +
      '<td style="text-align:right"><b>' + l.ghi.toLocaleString('vi-VN') + '</b></td>' +
      '<td style="text-align:right;color:' + (l.bo ? 'var(--red)' : 'var(--ink3)') + '">' + l.bo + '</td>' +
      '<td>' + (l.huy ? '<span class="st2 n">Không ghi dòng nào</span>' : l.ht ? '<span class="st2 o">Hoàn tác được</span>' : '<span class="st2 n">Đã quá 7 ngày</span>') + '</td>' +
      '<td><button class="btn xs" data-x="ls-xem" data-id="' + l.id + '">Xem</button></td></tr>').join('')
     : '<tr><td colspan="9"><div class="empty">Không có lô nào trong phạm vi của bạn</div></td></tr>') +
    '</tbody></table></div></div>';

  h += '<div class="ro"><b>Không vai trò nào có quyền XOÁ lô.</b> Lô là căn cứ truy vết cho hàng nghìn hồ sơ — xoá lô là mất vết của cả một đợt khai báo. ' +
    'Gỡ sai bằng <b>hoàn tác</b>, và lô bị hoàn tác <b>vẫn nằm lại ở đây</b> với nhãn <code>Đã hoàn tác</code>.</div>';
  return h;
}

function xemLo(id){
  const l = LS.find(x => x.id === id);
  let b = '<div class="f"><div class="k">Thời điểm · người chạy</div><div class="v">' + l.t + ' · ' + esc(l.u) + '</div></div>' +
    '<div class="f"><div class="k">Loại lô</div><div class="v">' + esc(l.loai) + '</div></div>' +
    '<div class="f"><div class="k">Phạm vi</div><div class="v">' + esc(l.pv) + '</div></div>' +
    '<div class="f"><div class="k">Tệp gốc</div><div class="v">📄 ' + esc(l.tep) +
    ' <button class="btn xs" data-x="tai-kq">⬇ Tải lại</button><div style="font-weight:400;font-size:11.5px;color:var(--ink2);margin-top:4px">' +
    'Tệp gốc lưu kèm lô và tải lại được — bắt buộc, vì dữ liệu cá nhân trẻ em thuộc <b>Luật BVDLCN 91/2025</b> và mọi lô ghi audit mức ② ở M10.7.</div></div></div>' +
    '<div class="f"><div class="k">Kết quả</div><div class="v">' + l.ghi.toLocaleString('vi-VN') + ' dòng ghi · ' + l.bo + ' dòng bỏ qua</div></div>';
  if (l.hq.length) b += '<div class="f"><div class="k">Hệ quả</div><div class="v" style="font-weight:400">' +
    l.hq.map(x => '· ' + esc(x)).join('<br>') + '</div></div>';
  if (l.ht && l.khoa.length){
    b += '<div class="warn" style="margin-top:11px">↺ <b>Hoàn tác được đến hết 7 ngày, nhưng có hai giới hạn thật:</b><br>' +
      l.khoa.map(x => '· ' + esc(x)).join('<br>') +
      '<div style="margin-top:6px">Lý do: em đã có điểm và điểm danh thì <b>xoá hồ sơ là mất cả những thứ đó</b>; ' +
      'còn hồ sơ đã có phụ huynh liên kết App thì xoá đi là cắt kênh liên lạc của một gia đình đang dùng.</div></div>';
  }
  modal('📦 ' + l.id, b,
    (l.ht ? '<button class="btn d" data-x="hoantac" data-id="' + l.id + '">↺ Hoàn tác lô này</button>' : '') +
    '<button class="btn" data-x="dong">Đóng</button>');
}

/* ═══════════════ MODAL · TOAST ═══════════════ */
function modal(h, b, f){ $('#mh').innerHTML = h; $('#mb').innerHTML = b; $('#mf').innerHTML = f || '<button class="btn" data-x="dong">Đóng</button>'; $('#mask').classList.add('on'); }
function dong(){ $('#mask').classList.remove('on'); }
let tmr;
function bao(t){ const e = $('#toast'); e.innerHTML = t; e.classList.add('on'); clearTimeout(tmr); tmr = setTimeout(() => e.classList.remove('on'), 3400); }
const chuaDung = m => modal('🚧 Ngoài phạm vi demo', '<div class="ro">' + m + '</div>');

/* ═══════════════ SỰ KIỆN ═══════════════ */

/* kéo thả */
document.addEventListener('dragstart', e => { const q = e.target.closest('.qi'); if (q){ selHS = q.dataset.ma; e.dataTransfer.setData('text/plain', q.dataset.ma); } });
document.addEventListener('dragover',  e => { const c = e.target.closest('.cls'); if (c){ e.preventDefault(); c.classList.add('drop2'); } });
document.addEventListener('dragleave', e => { const c = e.target.closest('.cls'); if (c) c.classList.remove('drop2'); });
document.addEventListener('drop', e => {
  const c = e.target.closest('.cls'); if (!c) return;
  e.preventDefault(); c.classList.remove('drop2');
  const ma = e.dataTransfer.getData('text/plain'); if (ma) xepVao(ma, c.dataset.lop);
});

ve();

      (n.cum || []).forEach(function(cm){ cm.forEach(function(ma){ if (!cd.some(function(c){ return c.ma === ma; })) loi.push('nhom_phai_gan trỏ cột «' + ma + '» không có trong phần'); }); });
    });
    ['sdt', 'ho_ten', 'ngay', 'email'].forEach(function(kk){
      var ds = cd.filter(function(c){ return c.kieu === kk; });
      for (var i = 0; i < ds.length; i++) for (var j = i + 1; j < ds.length; j++){
        var cung = (pd.cap_de_nham || []).some(function(g){ return g.indexOf(ds[i].ma) >= 0 && g.indexOf(ds[j].ma) >= 0; });
        if (!cung) loi.push('«' + ds[i].nhan + '» và «' + ds[j].nhan + '» cùng kiểu ' + kk + ' mà ⛔ chung nhóm cap_de_nham — khai báo thiếu');
      }
    });
  });
  return loi;
};

/* ───────────── kho mẫu ───────────── */
function idMoi(loai){ B.kho.dem[loai]++; return (loai === 'mn' ? 'MN-' : 'MX-') + String(B.kho.dem[loai]).padStart(4, '0'); }
function napCongTy(ds, kho, loai){
  (ds || []).forEach(function(m){
    var id = m[loai === 'mn' ? 'mau_nhap_id' : 'mau_xuat_id'];
    if (kho.some(function(x){ return x[loai === 'mn' ? 'mau_nhap_id' : 'mau_xuat_id'] === id; })) return;
    var b = sao(m); b.nguon = 'cong_ty'; b.trang_thai = b.trang_thai || 'dung'; b.lich_su = b.lich_su || []; b.tao_boi = b.tao_boi || 'Công ty — phát hành kèm bản cập nhật'; b.tao_luc = b.tao_luc || '—';
    kho.push(b);
  });
}
/* ⑨ — mẫu gắn số hiệu mẫu đích CŨ ⇒ «cần rà lại», ⛔ tự áp, ⛔ tự nâng */
/* HDMX bản 2 ② mục 4 — một Feature NHIỀU mẫu đích: mẫu thuộc (ma_feature × tên gốc mẫu đích) */
function cungDuong(m, duong){ return m.duong_nhap.ma_feature === duong.ma_feature && tenMauGoc(m.duong_nhap.mau_dich) === tenMauGoc(duong.mau_dich); }
function raPhienBan(duong){
  B.kho.mauNhap.forEach(function(m){
    if (!cungDuong(m, duong) || m.trang_thai !== 'dung' || m.duong_nhap.mau_dich === duong.mau_dich) return;
    m.lich_su.push({boi:'Hệ thống', luc:bayGio(), thay_doi:'Mẫu đích đổi ' + m.duong_nhap.mau_dich + ' → ' + duong.mau_dich + ' — chuyển «cần rà lại», ⛔ tự áp'});
    m.trang_thai = 'can_ra_lai';
  });
}
function mauCuaDuong(duong, truong){
  return B.kho.mauNhap.filter(function(m){ return cungDuong(m, duong) && (m.nguon === 'cong_ty' || m.truong === truong); });
}

/* ═══════════════ KHUNG HIỂN THỊ (hai lớp: hộp chính · hộp phụ) ═══════════════ */
var LOP = null, PHU = null;
function dungLop(){
  if (LOP) return;
  LOP = document.createElement('div'); LOP.className = 'bnx-lop'; LOP.id = 'bnx-lop';
  LOP.innerHTML = '<div class="bnx-hop" role="dialog" aria-modal="true"><div class="bnx-dau" id="bnx-dau"></div><div class="bnx-than" id="bnx-than"></div><div class="bnx-chan" id="bnx-chan"></div></div>';
  PHU = document.createElement('div'); PHU.className = 'bnx-lop bnx-lop-phu'; PHU.id = 'bnx-phu';
  PHU.innerHTML = '<div class="bnx-hop bnx-hop-nho"><div class="bnx-dau" id="bnx-pdau"></div><div class="bnx-than" id="bnx-pthan"></div><div class="bnx-chan" id="bnx-pchan"></div></div>';
  document.body.appendChild(LOP); document.body.appendChild(PHU);
  [LOP, PHU].forEach(function(el){
    el.addEventListener('click', function(e){
      var t = e.target.closest('[data-bnx]');
      if (!t || !el.contains(t) || t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') return;
      xuLy(t.dataset.bnx, t, e);
    });
    el.addEventListener('change', function(e){
      var t = e.target.closest('[data-bnx]');
      if (!t || !el.contains(t)) return;
      if (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') xuLy(t.dataset.bnx, t, e);
    });
  });
}
/* 🔁 MNXL-Z — hộp bộ máy ⛔ che TOAST / MODAL của menu (quy ước demo: #toast · #mask.on).
   Trong lúc hộp mở: body mang lớp bnx-dang-mo ⇒ #toast nổi trên hộp (style.08); modal của menu MỞ
   SAU khi hộp mở ⇒ gắn bnx-tren-hop, nổi trên hộp; modal đã mở TRƯỚC (vd hộp Import của M4.1) giữ dưới. */
var QS_MASK = null;
function theoDoiMask(){
  var mk = document.getElementById('mask');
  if (!mk || QS_MASK || !window.MutationObserver) return;
  QS_MASK = new MutationObserver(function(){
    var on = mk.classList.contains('on'), mo = LOP && LOP.classList.contains('bnx-mo');
    var tren = mk.classList.contains('bnx-tren-hop');   /* ⛔ ghi lại lớp đã có — tránh vòng lặp của chính trình theo dõi */
    if (on && mo && !mk._bnxTruoc && !tren) mk.classList.add('bnx-tren-hop');
    if (!on){ if (tren) mk.classList.remove('bnx-tren-hop'); mk._bnxTruoc = false; }
  });
  QS_MASK.observe(mk, {attributes:true, attributeFilter:['class']});
}
function mo(){
  dungLop(); theoDoiMask();
  var mk = document.getElementById('mask'); if (mk) mk._bnxTruoc = mk.classList.contains('on');
  LOP.classList.add('bnx-mo'); document.body.classList.add('bnx-dang-mo');
}
B.dong = function(){
  if (LOP){ LOP.classList.remove('bnx-mo'); PHU.classList.remove('bnx-mo'); }
  document.body.classList.remove('bnx-dang-mo');
  var mk = document.getElementById('mask'); if (mk){ mk.classList.remove('bnx-tren-hop'); mk._bnxTruoc = false; }
  B._che = null;
};
/* BNX.bao(chu, loai) — toast NẰM TRÊN hộp bộ máy, cho menu nói một câu khi hộp đang mở (⛔ phải dựng hộp phụ) */
var BAO = null, BAO_T = null;

  BAO.className = 'bnx-bao bnx-bao-' + (loai || 'tin') + ' bnx-mo';
  BAO.innerHTML = chu;
  clearTimeout(BAO_T); BAO_T = setTimeout(function(){ BAO.classList.remove('bnx-mo'); }, 3600);
};
/* hộp phụ dùng chung — menu cũng gọi được (vd nút tạm ở app.09) */

var hanhDongMenu = {};
/* menu đăng ký nút riêng trong hộp phụ: <button data-bnx="menu:ten"> */
B.dangKyNut = function(ten, fn){ hanhDongMenu[ten] = fn; };
function veLai(){
  if (!LOP) return;

function the(loai, chu){ return '<span class="bnx-the bnx-the-' + loai + '">' + chu + '</span>'; }
function nhanTrangThai(m){
  return m.trang_thai === 'dung' ? the('luc', 'Đang dùng') : m.trang_thai === 'can_ra_lai' ? the('vang', 'Cần rà lại') : the('xam', 'Đã ngừng');
}

/* ═══════════════════════════ NHẬP ═══════════════════════════ */
var S = null;
B.moNhap = function(duong, cb){
  cb = cb || {};
  napCongTy(duong.mau_cong_ty, B.kho.mauNhap, 'mn');
  raPhienBan(duong);
  S = {duong:duong, cb:cb, buoc:1, tepChon:null, tep:null, phan:[], thongBao:[], mau:null, daSua:false,
       cach_gan:'tay', l3:null, loc:'dung', moKho:false, raLai:null, khop:[], khaiBao:B.kiemKhaiBao(duong),
       luuTen:'', ketQua3:null, ketQua4:null, hoanTac:null, maLo:null, chup:null};
  if (S.khaiBao.length && window.console) console.warn('[BNX] khai báo đường nhập thiếu:', S.khaiBao);
  B._che = 'nhap'; mo(); veLai();
};
function nguoiDung(cb){ var n = cb && cb.nguoi; return typeof n === 'function' ? n() : (n || 'Người dùng demo'); }
function truongCua(cb){ var t = cb && cb.truong; return typeof t === 'function' ? t() : (t || 'Trường demo'); }
function tenGoc(P, key){ var h = P.doc.tieuDe.filter(function(x){ return x.key === key; })[0]; return h ? h.goc + (key.indexOf('#') > 0 ? ' (' + key.split('#')[1] + ')' : '') : key; }
function napPhan(P){ P.doc = docSheet(S.tep.sheet[P.sheet], P.dong_tieu_de); }

/* ④ — tự gợi ý: khớp ĐÚNG MỘT cột nguồn ⇒ gán; nhiều / không ⇒ để trống, người chọn */
function goiY(P){
  P.gan = {}; P.goiY = {}; P.mauThieu = {};
  var cd = P.def.cot_dich, ungVien = {}, nguonDen = {};
  cd.forEach(function(c){
    var ten = [chuanHoa(c.nhan)].concat((c.ten_goi_y || []).map(chuanHoa));
    ungVien[c.ma] = P.doc.tieuDe.filter(function(h){ return ten.indexOf(h.base) >= 0; }).map(function(h){ return h.key; });
    ungVien[c.ma].forEach(function(k){ (nguonDen[k] = nguonDen[k] || []).push(c.ma); });
  });
  cd.forEach(function(c){
    var uv = ungVien[c.ma];
    if (uv.length === 1 && nguonDen[uv[0]].length === 1){ P.gan[c.ma] = {cot_nguon:[uv[0]], bien_doi:[]}; P.goiY[c.ma] = {trang:'tu', uv:uv}; }
    else if (uv.length > 1) P.goiY[c.ma] = {trang:'nhieu', uv:uv};
    else if (uv.length === 1) P.goiY[c.ma] = {trang:'trung_nguon', uv:uv, dich:nguonDen[uv[0]]};
    else P.goiY[c.ma] = {trang:'khong', uv:[]};
  });
}
/* ④ mục 2 — tệp là MẪU TRỐNG hệ thống xuất: gán 100 % theo nhan (vẫn chạy L1…L5, vẫn bắt tích L3) */
function ganTheoNhan(P){
  P.gan = {}; P.goiY = {}; P.mauThieu = {};
  P.def.cot_dich.forEach(function(c){
    var h = P.doc.tieuDe.filter(function(x){ return x.base === chuanHoa(c.nhan); })[0];
    if (h){ P.gan[c.ma] = {cot_nguon:[h.key], bien_doi:[]}; P.goiY[c.ma] = {trang:'mau_trong', uv:[h.key]}; }
    else P.goiY[c.ma] = {trang:'khong', uv:[]};
  });
}
function chonSheet(pd, tep, daDung){
  var goi = (pd.ten_sheet_goi_y || []).map(chuanHoa), i;
  for (i = 0; i < tep.sheet.length; i++) if (daDung.indexOf(i) < 0 && goi.indexOf(chuanHoa(tep.sheet[i].ten)) >= 0) return i;
  for (i = 0; i < tep.sheet.length; i++) if (daDung.indexOf(i) < 0) return i;
  return 0;
}
/* sheet nào của tệp mang đúng vân tay của một phần mẫu (theo dòng tiêu đề của mẫu) */
function sheetKhop(tp){
  for (var i = 0; i < S.tep.sheet.length; i++) if (vtBang(docSheet(S.tep.sheet[i], tp.dong_tieu_de).vanTay, tp.van_tay_tieu_de)) return i;
  return -1;
}
function mauKhopVanTay(m){ return m.phan.every(function(tp){ return sheetKhop(tp) >= 0; }); }

function docTep(tep){
  var d = S.duong;
  S.tep = tep; S.thongBao = []; S.mau = null; S.daSua = false; S.l3 = null; S.raLai = null; S.khop = []; S.cach_gan = 'tay';
  var daDung = [];
  S.phan = d.phan.map(function(pd){
    var i = chonSheet(pd, tep, daDung); daDung.push(i);
    var P = {ma_phan:pd.ma_phan, def:pd, sheet:i, dong_tieu_de:dongTieuDeMacDinh(tep.sheet[i]), gan:{}, goiY:{}, mauThieu:{}};
    napPhan(P); return P;
  });
  var soMauTrong = 0;
  S.phan.forEach(function(P){
    var a1 = a1Cua(tep.sheet[P.sheet]);
    if (a1 && a1 === d.mau_dich){ ganTheoNhan(P); P.mauTrong = true; soMauTrong++; return; }
    goiY(P);
    if (a1 && tenMauGoc(a1) === tenMauGoc(d.mau_dich)){
      /* ④ mục 3 (P-1 ✅): số hiệu CŨ ⇒ ⛔ gán 100 %; câu KT-6 + chênh lệch, đi đường ánh xạ thường */
      var co = P.doc.tieuDe.map(function(h){ return h.base; });
      var nhan = P.def.cot_dich.map(function(c){ return chuanHoa(c.nhan); });
      var moi = P.def.cot_dich.filter(function(c){ return co.indexOf(chuanHoa(c.nhan)) < 0; }).map(function(c){ return c.nhan; });
      var bo = P.doc.tieuDe.filter(function(h){ return nhan.indexOf(h.base) < 0; }).map(function(h){ return h.goc; });
      S.thongBao.push({loai:'vang', chu:'Tệp dùng mẫu <code>' + esc(a1) + '</code>, hệ thống đang dùng <code>' + esc(d.mau_dich) + '</code>' +
        (moi.length ? ' — bản mới thêm cột: <b>' + moi.map(esc).join(', ') + '</b>' : '') +
        (bo.length ? ' · cột tệp có mà mẫu mới ⛔ có: <b>' + bo.map(esc).join(', ') + '</b>' : '') +
        '. ⛔ Gán 100 % tự động — đi <b>đường ánh xạ thường</b> (tự gợi ý · bạn chọn).'});
    } else if (/^MAU-/.test(a1)){
      S.thongBao.push({loai:'vang', chu:'Ô A1 mang số hiệu <code>' + esc(a1) + '</code> — đường nhập này là <code>' + esc(d.mau_dich) + '</code>. Đi đường ánh xạ thường.'});
    }
  });
  if (soMauTrong === S.phan.length){
    S.cach_gan = 'tu_dong_mau_trong';
    S.thongBao.push({loai:'luc', chu:'Tệp mang đúng số hiệu <code>' + esc(d.mau_dich) + '</code> (mẫu trống hệ thống xuất) ⇒ <b>gán 100 % tự động theo tên cột</b>. Vẫn phải xem trước và tích ở dưới.'});
    return;
  }
  /* ④ mục 5 — nhận mẫu đã lưu theo vân tay: một ⇒ tự áp (vẫn dừng ở ②) · nhiều ⇒ người chọn */
  var ds = mauCuaDuong(d, truongCua(S.cb));
  S.khop = ds.filter(function(m){ return m.trang_thai === 'dung' && m.duong_nhap.mau_dich === d.mau_dich && mauKhopVanTay(m); });
  ds.filter(function(m){ return m.trang_thai === 'can_ra_lai' && mauKhopVanTay(m); }).forEach(function(m){
    S.thongBao.push({loai:'vang', chu:'Mẫu <b>«' + esc(m.ten) + '»</b> khớp vân tay tệp nhưng đang <b>cần rà lại</b> (gắn <code>' + esc(m.duong_nhap.mau_dich) + '</code>) — ⛔ tự áp. ' +
      (m.nguon === 'truong' ? '<button class="bnx-nut bnx-nho" data-bnx="ra-lai" data-bnx-id="' + m.mau_nhap_id + '">Rà lại mẫu này</button>' : 'Mẫu công ty chờ bản cập nhật sau — có thể <button class="bnx-nut bnx-nho" data-bnx="nhan-ban" data-bnx-id="' + m.mau_nhap_id + '">Nhân bản thành mẫu của trường</button> rồi rà lại bản nhân bản.')});
  });
  if (S.khop.length === 1){
    apMau(S.khop[0]);
    S.thongBao.push({loai:'xanh', chu:'Tệp cùng khuôn với mẫu <b>«' + esc(S.khop[0].ten) + '»</b> ⇒ <b>đã tự áp mẫu</b>. Máy vẫn dừng ở bước ② — xem trước và tích mới sang được ③.'});
  } else if (S.khop.length > 1){
    S.thongBao.push({loai:'vang', chu:'Tệp khớp <b>' + S.khop.length + ' mẫu</b> — ⛔ tự chọn. Bạn chọn một: ' +
      S.khop.map(function(m){ return '<button class="bnx-nut bnx-nho" data-bnx="ap-mau" data-bnx-id="' + m.mau_nhap_id + '">' + esc(m.ten) + ' · ' + (m.nguon === 'cong_ty' ? 'công ty' : 'trường') + '</button>'; }).join(' ')});
  }
}
function apMau(m){
  S.mau = m; S.daSua = false; S.cach_gan = 'ap_mau'; S.l3 = null;
  m.phan.forEach(function(tp){
    var P = S.phan.filter(function(p){ return p.ma_phan === tp.ma_phan; })[0]; if (!P) return;
    var i = sheetKhop(tp); if (i >= 0) P.sheet = i;
    P.dong_tieu_de = tp.dong_tieu_de; napPhan(P);
    P.gan = {}; P.goiY = {}; P.mauThieu = {}; P.mauTrong = false;
    P.def.cot_dich.forEach(function(c){ P.goiY[c.ma] = {trang:'mau_khong', uv:[]}; });
    var keys = P.doc.tieuDe.map(function(h){ return h.key; });
    tp.cot.forEach(function(c){
      var co = c.cot_nguon.filter(function(k){ return keys.indexOf(k) >= 0; });
      var thieu = c.cot_nguon.filter(function(k){ return keys.indexOf(k) < 0; });
      if (thieu.length) P.mauThieu[c.cot_dich] = thieu;
      /* cột nguồn mẫu cần mà tệp không có ⇒ ô gán TRỐNG, ⛔ đoán (④ mục 5) */
      if (co.length || laHang(c)) P.gan[c.cot_dich] = {cot_nguon:co, bien_doi:sao(c.bien_doi)};
      P.goiY[c.cot_dich] = {trang:'mau', uv:co};
    });
  });
}
function suaGan(){ S.l3 = null; if (S.mau) S.daSua = true; if (S.cach_gan === 'tu_dong_mau_trong') S.cach_gan = 'tay'; }

/* ───────────── tính toàn bộ bước ② (L1 · L2 · chặn · cột thừa · giá trị lạ) ───────────── */
function tinhPhan(P){
  var pd = P.def, d = S.duong, kq = {dong:[], l2:[], thieuBB:[], thieuPG:[], thieuNhom:[], dacBiet:{}, cotThua:[], la:{}, hangLoi:[], trungNguon:[], gopThieu:[], goiYNgay:{}};
  var dung = {};
  pd.cot_dich.forEach(function(c){
    var g = P.gan[c.ma]; if (!g) return;
    g.cot_nguon.forEach(function(k){ (dung[k] = dung[k] || []).push({c:c, truc:!(g.bien_doi || []).length}); });
  });
  kq.cotThua = P.doc.tieuDe.filter(function(h){ return !dung[h.key]; }).map(function(h){ return tenGoc(P, h.key); });
  Object.keys(dung).forEach(function(k){
    var tr = dung[k].filter(function(x){ return x.truc; });
    if (tr.length >= 2) kq.trungNguon.push({nguon:tenGoc(P, k), dich:tr.map(function(x){ return x.c.nhan; })});
  });
  P.doc.dong.forEach(function(dg){
    var gt = {}, loi = [];
    pd.cot_dich.forEach(function(c){
      var g = P.gan[c.ma];
      var r = g ? chay(g, dg.o, function(la){ var m = kq.la[c.ma] = kq.la[c.ma] || {}; m[la] = (m[la] || 0) + 1; }) : {v:'', goc:''};
      gt[c.ma] = r.v;
      if (laDacBiet(c, r.v)){ var db = kq.dacBiet[c.ma] = kq.dacBiet[c.ma] || {}; var tv = String(r.v).trim(); db[tv] = (db[tv] || 0) + 1; }
      var e = r.loi || kiemL1(c, r.v, d, P.gan);
      if (e) loi.push({cot_dich:c.ma, nhan:c.nhan, gia_tri_goc:r.goc, loi:e});
    });
    kq.dong.push({so_dong:dg.so_dong, gia_tri:gt, loi_l1:loi});
  });
  pd.cot_dich.forEach(function(c){

const KT_DT = [{t:'Điểm trường A', n:612}, {t:'Điểm trường B', n:455}, {t:'Điểm trường C', n:230}];
const KT_TONG = KT_DT.reduce((a, b) => a + b.n, 0);

/* bảng tra mã cũ → mới (§5.1b) — cột Mã định danh ĐỂ TRỐNG với em chưa có mã */
const KT_TRA = [
  {dt:'A', cu:'HS-0312', md:'79.01.2012.004312', ds:'HS-2027-0001', ten:'Nguyễn Minh Khuê', ns:'18/02/2012', lop:'8A2'},
  {dt:'A', cu:'HS-0188', md:'79.01.2011.008907', ds:'HS-2027-0002', ten:'Trần Gia Bảo',     ns:'05/11/2011', lop:'9A1'},
  {dt:'B', cu:'HS-0312', md:'79.01.2013.001255', ds:'HS-2027-0003', ten:'Lê Thanh Hà',      ns:'22/07/2013', lop:'7A3'},
  {dt:'B', cu:'HS-0455', md:'',                  ds:'HS-2027-0004', ten:'Phạm Bảo Ngọc',    ns:'09/03/2012', lop:'8A1'},
];

/* ───────── bọc ve(): dải luồng đặt trên cùng ───────── */
const _veGoc19 = ve;
ve = function(){
  _veGoc19.apply(null, arguments);
  const c = document.getElementById('content'); if (!c) return;
  c.insertAdjacentHTML('afterbegin', daiKT19());
};

/* ───────── bọc buDiem()/buCC(): đồng bộ chữ mốc với KT_MOC ─────────
   KY[n].truoc là cổng chặn THẬT của app.js; KT_MOC chỉ là chữ hiển thị.
   Lùi mốc mở cổng ⇒ phải đổi cả hai, nếu không màn hình nói một đằng chặn một nẻo. */
function ktThayMoc(h){ return String(h).split(NGAY_VANHANH).join(KT_MOC); }
const _buDiemGoc = buDiem; buDiem = function(){ return ktThayMoc(_buDiemGoc.apply(null, arguments)); };
const _buCCGoc   = buCC;   buCC   = function(){ return ktThayMoc(_buCCGoc.apply(null, arguments)); };

/* ───────── thao tác demo ───────── */
function ktBuoc(b){ KT_BUOC = b; ve(); }
function ktLuiMoc(){
  KT_MOC = '01/09/2026'; KY[1].truoc = 1;
  bao('📅 Đã lùi mốc về <b>01/09/2026</b> — <b>Học kỳ II mở cửa nhập</b>. 🛑 Lùi mốc chỉ MỞ CỬA NHẬP, ⛔ không tự đổi một ô dữ liệu nào <i>(M10.1 §7.1b.1)</i>.');
  ve();
}
function ktTraMoc(){ KT_MOC = NGAY_VANHANH; KY[1].truoc = 0; bao('↩ Trả mốc về <b>' + NGAY_VANHANH + '</b> — cổng chặn Cơ chế ③ đóng lại.'); ve(); }
function ktXacNhan(b){
  KT_XN[b] = true;
  bao('✓ Ghi <b>' + esc(R().cd) + '</b> lúc <b>' + HOMNAY + ' 11:04</b>. 🛑 Đây ⛔ KHÔNG phải ô tick trạng thái — thứ máy tính được là <b>con số</b>, «đủ chưa» là <b>kết luận nghiệp vụ</b>.');
  ve();
}
function ktBangTra(){
  modal('🔑 Bảng tra mã cũ → mới của HỌC SINH <span style="font-weight:400;color:#64748b">M1.9 §5.1b</span>',
    '<div class="ro">Khuôn dùng chung với <code>M4.1</code> §6.11.4 và <code>M1.4</code> §5.1 — ⛔ không dựng khuôn thứ hai. ' +
    '🛑 <b>Mã cũ ⛔ KHÔNG phải khóa chống trùng</b>: hai dòng <code>HS-0312</code> dưới đây thuộc <b>hai cơ sở khác nhau</b> và là <b>hai em khác nhau</b>.</div>' +
    '<table style="width:100%;margin-top:9px"><thead><tr>' +
    '<th>Điểm trường</th><th>Mã cũ tại cơ sở</th><th>Mã định danh CSDL ngành</th><th>Mã hồ sơ Dschool</th><th>Họ và tên</th><th>Ngày sinh</th><th>Lớp</th>' +
    '</tr></thead><tbody>' +
    KT_TRA.map(r => '<tr><td>' + r.dt + '</td><td><code>' + r.cu + '</code></td>' +
      '<td>' + (r.md ? '<code>' + r.md + '</code>'
                     : '<span class="tag dup">② Chờ mã định danh</span>') + '</td>' +
      '<td><code>' + r.ds + '</code></td><td><b>' + esc(r.ten) + '</b></td><td>' + r.ns + '</td><td>' + r.lop + '</td></tr>').join('') +
    '</tbody></table>' +
    '<div class="warn" style="margin-top:9px">🔑 Cột <b>Mã định danh</b> để <b>TRỐNG</b> với em chưa có mã — ⛔ không lấp bằng mã hồ sơ Dschool cho «đỡ trống». ' +
    'Trống ở đây là <b>một câu trả lời đúng</b>, và đúng là thứ <code>M10.8</code> §6.7 đọc để <b>gán mã vào hồ sơ đang có</b> thay vì tạo hồ sơ thứ hai.</div>',
    '<button class="btn" data-x="dong">Đóng</button>');
}

/* ───────── dải luồng ───────── */
function daiKT19(){
  const nut = (b, t) => '<button class="btn sm' + (KT_BUOC === b ? ' p' : '') + '" onclick="ktBuoc(\'' + b + '\')">' + t + '</button>';
  let h = '<div class="card"><div class="ch">🧭 <b>Luồng khởi tạo lần đầu</b> — <code>M1.9</code> mang <b>HAI mã bước</b>' +
    '<div class="sp"></div><span style="font-size:11px;color:#64748b">M10.12 · HDKT ③ · M1.9 §3.2</span></div><div class="cb" style="padding:10px 12px">';

  h += '<div style="margin-bottom:9px"><b>Ngữ cảnh (demo):</b> ' +
       nut('B09', 'Bước 9 — nạp danh sách + xếp lớp') + ' ' +
       nut('B10', 'Bước 10 — bù hồ sơ · điểm · chuyên cần') + ' ' +
       nut('', 'Ngoài luồng (vào thẳng M1.9)') + '</div>';

  if (!KT_BUOC){
    h += '<div class="ro">Trường đang ở trạng thái <b>dang_van_hanh</b> — luồng khởi tạo đã khép ở bước 14. ' +
         'Menu chạy bình thường; ⛔ không dải luồng, ⛔ không nút <code>↩ Về tiến độ</code>. ' +
         '<i>Khối giao diện là <b>MỘT</b>, dùng cho cả hai ngữ cảnh — ⛔ không viết hai bản (kiến trúc §6.3 ①).</i></div>';
    return h + '</div></div>' + daiMoc19();
  }

  /* ── B09 ── */
  if (KT_BUOC === 'B09'){
    const conLai = dsChuaLop().length;
    h += '<div class="info">🔗 <b>Deep-link vào:</b> <code>/M1.9?ctx=khoi_tao&buoc=B09&tab=' +
         (tab === 'xeplop' ? 'xep_lop' : 'nhap_danh_sach') + '&return=M10.12</code> · ' +
         '<b>về luồng:</b> <code>/M10.12?tab=luong&buoc=B09</code> ' +
         '<button class="btn xs" onclick="bao(\'↩ Quay về khung luồng M10.12 — nút này CHỈ hiện khi trường ở trạng thái <b>dang_khoi_tao</b> (HDKT ①).\')">↩ Về tiến độ khởi tạo</button></div>';

    h += '<table style="width:100%;margin-top:8px"><thead><tr><th style="width:62px">Phần</th><th>Tab</th><th style="width:72px">Hạng</th><th>Xong khi</th></tr></thead><tbody>' +
      '<tr><td><b>B09①</b></td><td>① 📥 Nhập danh sách</td><td><span class="tag dup">N</span></td><td>Máy <b>đếm theo từng điểm trường</b>, <b>người kết luận</b></td></tr>' +
      '<tr><td><b>B09②</b></td><td>② 🎯 Xếp lớp</td><td><span class="tag gh">M</span></td><td>Hàng đợi <code>Chờ xếp lớp</code> <b>rỗng</b> — ⛔ không hỏi ai</td></tr>' +
      '</tbody></table>';

    h += '<div class="danger" style="margin-top:9px">🔴 <b>B09 đổi hạng <code>M</code> → <code>N</code></b> <i>(§3.2.2)</i> — ' +
         '«hàng đợi rỗng» trả lời <i>«em đã nạp có lớp chưa»</i>, ⛔ <b>không</b> trả lời <i>«đã nạp đủ em chưa»</i>. ' +
         'Máy ⛔ không biết trường có 1.297 hay 1.300 em. 🛑 Và <b>trước lô đầu tiên hàng đợi cũng rỗng</b> ⇒ bước <b>tự báo xong khi chưa ai làm gì</b>.</div>';

    h += '<div class="ro" style="margin-top:9px;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px">' +
      'Đã nạp ' + KT_TONG.toLocaleString('vi-VN') + ' học sinh — ' + KT_DT.map(d => d.t + ': ' + d.n).join(' · ') + '.\n' +
      'Hàng đợi Chờ xếp lớp: ' + conLai + ' em.' + (conLai ? '          ⚠ phần ② CHƯA xong' : '          ← phần ② máy tự kết luận: xong') +
      '</div>';

    h += KT_XN.B09
      ? '<div class="info" style="margin-top:8px">✅ <b>' + esc(R().cd) + '</b> đã xác nhận lúc <b>' + HOMNAY + ' 11:04</b>' +
        (conLai ? ' — nhưng bước <b>vẫn chưa xong</b>: điều kiện của bước là <b>hội (AND)</b> của hai phần, và phần ② còn ' + conLai + ' em.' : ' ⇒ <b>bước 9 XONG</b>.') + '</div>'
      : '<div class="warn" style="margin-top:8px">Danh sách đã đủ chưa? ' +
        '<button class="btn sm" onclick="bao(\'Bước giữ trạng thái <b>đang làm</b> — ⛔ máy không kết luận hộ.\')">Chưa đủ</button> ' +
        '<button class="btn sm p" onclick="ktXacNhan(\'B09\')">✓ Đủ — xác nhận</button></div>';

    h += '<div class="ro" style="margin-top:8px">🔑 <b>Bảng tra mã cũ → mới</b> sinh sau mỗi lô, gắn vào bản ghi lô ở tab ⑥ <i>(§5.1b · §10.6)</i>. ' +
         'Bản ghi lô cũng lưu <b>số hiệu mẫu</b> <code>MAU-B09-danh-sach-hoc-sinh-v1</code> <i>(giải KB-1)</i>. ' +
         '<button class="btn xs" onclick="ktBangTra()">🔍 Xem bảng tra mã</button></div>';
  }

  /* ── B10 ── */
  if (KT_BUOC === 'B10'){
    h += '<div class="info">🔗 <b>Deep-link vào:</b> <code>/M1.9?ctx=khoi_tao&buoc=B10&tab={bo_sung_ho_so | diem_nhap_truc_tiep | chuyen_can_tong_hop}&return=M10.12</code> · ' +
         '<b>Bước TÙY CHỌN</b> — trường lên hệ thống đầu năm thì ⛔ không có kỳ nào đã trôi qua để bù.</div>';

    h += '<table style="width:100%;margin-top:8px"><thead><tr><th style="width:62px">Phần</th><th>Tab · Feature</th><th>Chức danh có ô quyền</th></tr></thead><tbody>' +
      '<tr><td><b>B10③</b></td><td>③ 🧩 Bổ sung hồ sơ · <code>m1.9.bo_sung_ho_so</code></td><td><b>VT</b> thực hiện · PHT_ĐT</td></tr>' +
      '<tr><td><b>B10④</b></td><td>④ ⌨ Điểm nhập trực tiếp · <code>m1.9.diem_nhap_truc_tiep</code></td><td><b>PHT_CM</b> chủ (X T S) · VT (X T, ⛔ không S) · GVBM chỉ đọc</td></tr>' +
      '<tr><td><b>B10⑤</b></td><td>⑤ 📅 Chuyên cần tổng hợp · <code>m1.9.chuyen_can_tong_hop</code></td><td><b>PHT_CM</b> · VT</td></tr>' +
      '</tbody></table>';

    h += '<div class="danger" style="margin-top:9px">🛑 <b>Luồng ⛔ KHÔNG được gộp ba tab này thành một màn hình</b> <i>(§3.2.1)</i> — ' +
         'ô quyền của màn gộp là <b>hợp</b> của ba hàng ở §12: Văn thư nhận <code>S</code> trên lô điểm, và ' +
         '<b>giáo viên bộ môn đọc luôn lô nhân thân, địa chỉ, hoàn cảnh gia đình</b>. ' +
         'Đó đúng là phương án §3.1 đã bác <b>sáng cùng ngày</b>. ' +
         '⚠ <b>Quyền khởi tạo tạm</b> <i>(HDKT ④)</i> thêm <b>hai người</b> vào từng ô quyền, ⛔ <b>không gộp ba ô quyền làm một</b>.</div>';

    h += KT_XN.B10
      ? '<div class="info" style="margin-top:8px">✅ <b>' + esc(R().cd) + '</b> đã xác nhận lúc <b>' + HOMNAY + ' 11:09</b> ⇒ <b>bước 10 XONG</b>.</div>'
      : '<div class="warn" style="margin-top:8px">Đã chạy <b>2 lô</b> · ghi <b>4.318 ô</b>. Bù dữ liệu đã đủ chưa? ' +
        '<button class="btn sm" onclick="bao(\'Bước tùy chọn — ⛔ không chặn luồng dù để nguyên.\')">Chưa đủ</button> ' +
        '<button class="btn sm p" onclick="ktXacNhan(\'B10\')">✓ Đủ — xác nhận</button></div>';
  }

  return h + '</div></div>' + daiMoc19();
}

/* ───────── mốc Ngày bắt đầu vận hành (§4.2 — E-2 của PHIEU-KTLD-1C) ───────── */
function daiMoc19(){
  const lui = KT_MOC !== NGAY_VANHANH;
  return '<div class="' + (lui ? 'warn' : 'info') + '" style="margin-bottom:12px">' +
    '📅 <b>Ngày bắt đầu vận hành trên hệ thống = ' + KT_MOC + '</b> — đọc từ <code>M10.1</code> §7.1b ' +
    '<i>(một mốc, BA loại dữ liệu: lô điểm · lô chuyên cần · khoản thu)</i>. ' +
    (lui
      ? '🛑 Mốc <b>đã lùi về quá khứ</b> — Học kỳ II <b>mở cửa nhập</b>. <b>Lùi mốc chỉ MỞ CỬA NHẬP</b>, ⛔ không tự đổi một ô dữ liệu nào, ⛔ không im lặng ghi đè ô đã có nguồn «gắn tiết». ' +
        '<button class="btn xs" onclick="ktTraMoc()">↩ Trả mốc về ' + NGAY_VANHANH + '</button>'
      : 'Mốc <b>LÙI VỀ QUÁ KHỨ ĐƯỢC</b> <i>(HT · ⛔ không giới hạn số lần · audit mức ② + lý do bắt buộc)</i>. ' +
        '<button class="btn xs" onclick="ktLuiMoc()">📅 Lùi mốc về 01/09/2026</button>') +
    '</div>';
}

ve();
</script>
