<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M4.1 Hồ sơ nhân sự — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
mark{background:#fef08a;padding:0 1px;border-radius:2px}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:240px}
.ms{position:relative}
.msb{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap}
.msb.act{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.msb .cnt{background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:8px}
.msp{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:0 8px 22px rgba(15,23,42,.14);min-width:236px;max-height:270px;overflow-y:auto;z-index:20;display:none;padding:5px}
.msp.on{display:block}
.mso{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:12.5px;cursor:pointer}
.mso:hover{background:var(--bg)}
.mso input{width:15px;height:15px;flex:0 0 15px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alerts{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.alert{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;cursor:pointer}
.grow:hover{background:#eef2f7}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.miss{color:var(--amber);font-weight:700}
.miss.r{color:var(--red)}
.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px;
 grid-template-columns:2fr 1.5fr 1.15fr 1.3fr 1fr}
.stage.open .hrow{grid-template-columns:2fr 1.3fr}
.stage.open .hcol{display:none}
.stage.open .hcol.keep{display:block}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.sub{padding-left:26px}
.hrow.gone{opacity:.6}
.who2{display:flex;gap:9px;align-items:center;min-width:0}
.ava2{width:32px;height:32px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 32px}
.ava2.noimg{background:#fee2e2;color:#991b1b}
.who2 .i{min-width:0}
.who2 .i b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who2 .i span{font-size:11px;color:var(--ink3)}
.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
 grid-template-columns:2fr 1.5fr 1.15fr 1.3fr 1fr}
.stage.open .hdrow{grid-template-columns:2fr 1.3fr}
.stage.open .hdrow div{display:none}
.stage.open .hdrow div.kc{display:block}
.hrow input[type=checkbox],.hdrow input[type=checkbox]{width:15px;height:15px}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ava3{width:50px;height:50px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:17px;font-weight:700;flex:0 0 50px}
.ava3.noimg{background:#fee2e2;color:#991b1b;font-size:11px;text-align:center;line-height:1.15}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.ptabs{display:flex;gap:2px;padding:0 11px;border-bottom:1px solid var(--line);background:#fafbfc;overflow-x:auto}
.ptab{padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptab.on{color:var(--brand);border-bottom-color:var(--brand);background:#fff}
.pbody{padding:14px 15px;max-height:calc(100vh - 230px);overflow-y:auto}

.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.exp{border-color:#fecaca}
.card.rev{opacity:.72}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:172px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.f.t2{background:#fffdf5}
.f.t3{background:#f8fafc}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.mask-val{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px}
.eye{font-size:11px;color:var(--brand);border:1px solid #c7d2fe;background:#eef2ff;border-radius:999px;padding:1px 7px}
.eye:hover{background:#e0e7ff}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}

.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.r::before{background:var(--red)}
.logi.g::before{background:var(--green)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}

.viewer{display:grid;grid-template-columns:1fr 200px;gap:13px}
@media(max-width:700px){.viewer{grid-template-columns:1fr}}
.vpage{background:#334155;border-radius:10px;min-height:270px;display:grid;place-items:center;color:#94a3b8;position:relative;overflow:hidden}
.vsheet{background:#fff;width:80%;height:88%;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:14px 16px;font-size:9px;color:#334155;line-height:1.7;overflow:hidden}
.vsheet h4{font-size:10px;text-align:center;font-weight:800;margin-bottom:7px}
.vsheet .ln{height:5px;background:#e2e8f0;border-radius:3px;margin:5px 0}
.vtool{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.86);border-radius:999px;padding:4px 6px;display:flex;gap:3px}
.vtool button{color:#e2e8f0;font-size:11.5px;padding:3px 9px;border-radius:999px}
.vtool button:hover{background:#334155;color:#fff}
.vmeta{font-size:11.5px}
.vmeta .r{padding:6px 0;border-bottom:1px solid var(--line)}
.vmeta .r b{display:block;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}

.diff{display:grid;grid-template-columns:1fr 22px 1fr;gap:8px;align-items:center;font-size:12.5px;padding:7px 0}
.diff .old{background:var(--red-soft);border:1px solid #fecaca;border-radius:7px;padding:6px 9px;color:#991b1b}
.diff .new{background:var(--green-soft);border:1px solid #a7f3d0;border-radius:7px;padding:6px 9px;color:#065f46;font-weight:700}
.diff .ar{text-align:center;color:var(--ink3)}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:700px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}
.drop{border:2px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;color:var(--ink3);font-size:12.5px;margin-top:5px;cursor:pointer}
.drop:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.drop.has{border-style:solid;border-color:var(--green);background:var(--green-soft);color:#065f46;font-weight:600}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.bulkbar{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#0f172a;color:#fff;font-size:12.5px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bulkbar .sp{flex:1}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}

/* ===== T3 — dòng gộp một người một dòng (§6.7.2b) ===== */
.t3h,.t3g{grid-template-columns:24px 22px 2fr 2.2fr .9fr 1.4fr 1.1fr}
.t3h.nar,.t3g.nar{grid-template-columns:24px 22px 2fr 1.3fr}
.t3h.nar div:nth-child(n+5),.t3g.nar div:nth-child(n+5){display:none}
.t3s{grid-template-columns:24px 22px 2.6fr 1.7fr 1.3fr;background:#fbfdff;border-left-color:#dbeafe}
.t3s.nar{grid-template-columns:24px 22px 2.6fr}
.t3s.nar div:nth-child(n+4){display:none}
.t3hd{padding:5px 13px 5px 46px;background:#f1f5f9;border-bottom:1px solid var(--line);
  font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.t3none{padding:7px 13px 7px 46px;font-size:11.5px;color:var(--ink3);border-bottom:1px solid var(--line)}
.xp{width:20px;height:20px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;
  font-size:10px;color:var(--ink2);line-height:1;padding:0}
.xp:hover{background:var(--brand-soft);border-color:var(--brand)}
.kho{color:var(--ink3);font-size:15px;line-height:1}
/* ===== Tab Lý lịch — một nút sửa cho mỗi NHÓM thông tin (§6.2.3b) ===== */
.ch .gsua{margin-left:auto}
.card.ged{box-shadow:0 0 0 2px var(--brand) inset}
.gbar{display:flex;gap:8px;align-items:center;padding:9px 13px;background:#0f172a;color:#fff;font-size:12px;flex-wrap:wrap}
.gbar .sp{flex:1}
.gf{display:grid;grid-template-columns:200px 1fr;gap:9px;padding:7px 13px;border-bottom:1px solid var(--line);
  font-size:12.5px;align-items:center}
.gf>.k{color:var(--ink2);font-weight:600}
.gf input[type=text],.gf select{width:100%;max-width:340px;padding:5px 7px;border:1px solid var(--line);
  border-radius:6px;font:inherit;font-size:12.5px}
.gf.t2{background:#fffbeb}
.gf.t3{background:#f8fafc}
.gf.ro{background:#f8fafc;color:var(--ink3)}
.gf.hl{background:#fef9c3;box-shadow:0 0 0 2px #facc15 inset}
.gf .why{font-size:11px;color:var(--ink3);font-weight:400;display:block}
.gdai{padding:8px 13px;background:#f1f5f9;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink2)}
.gchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.gchip{padding:3px 9px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;
  font:inherit;font-size:11.5px;color:var(--ink2)}
.gchip:hover{border-color:var(--brand);color:var(--brand)}
.gchip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}

/* ═══ MNXL-0B — BỘ NHẬP / XUẤT DÙNG CHUNG · style.08-bo-nhap-xuat.css ═══
   🔁 MNXL-Z 26/9/2026 (HDMX bản 2): + .bnx-bao (BNX.bao) · toast #toast và modal #mask.bnx-tren-hop của menu nổi TRÊN hộp.

/* HS03 mục II — DẪN XUẤT từ sáu bảng 32.x, dòng có Từ – Đến CHẠM kỳ khai (MYC-2A · 1B E.4).

const thang=s=>{const m=String(s||'').match(/(\d{1,2})\/(\d{4})/);return m?(+m[2])*12+(+m[1]):null};

 HVBANG.forEach(([k,so,ten])=>(p.hv[k]||[]).forEach(r=>{

}

/* ================= BỘ LỌC ================= */
/* BLOOP 2/10/2026 — §6.1.2b ①: nut loc hien TEN gia tri dang chon, KHONG hien con so dem.
   0 => ten o loc tron · 1 => ten · 2 => hai ten · >=3 => ten dau + "+N" · chon het => "tat ca". */
function nhanLoc(label,set,opts){
 const ch=opts.filter(o=>set.has(o));           // giu dung thu tu danh muc
 if(!ch.length)return label;
 if(ch.length===opts.length)return label+': tất cả';
 if(ch.length<=2)return label+': '+ch.join(', ');
 return label+': '+ch[0]+' ＋'+(ch.length-1);
}
function msBtn(id,label,set,opts){
 const nhan=nhanLoc(label,set,opts);
 const tip=set.size?opts.filter(o=>set.has(o)).join(' · '):'';
 return `<div class="ms"><button class="msb ${set.size?'act':''}" data-ms="${id}"${tip?` title="${tip}"`:''}>${nhan}
   ${set.size?'':'<span style="color:var(--ink3)">▾</span>'}</button>
  <div class="msp" id="msp-${id}">${opts.map(o=>
   `<label class="mso"><input type="checkbox" data-msv="${id}" value="${o}" ${set.has(o)?'checked':''}>${o}</label>`).join('')}</div></div>`;
}

/* Đơn vị dòng = Nhân sự × Hạng mục còn thiếu */
function t3rows(){
 /* Đơn vị HẠNG MỤC (⛔ đổi — MYC-3): ① Nhân sự × trường · ② Nhân sự × NHÓM · ③ Nhân sự × trường · việc: Nhân sự × việc.
    Đơn vị DÒNG của danh sách thì nay là NGƯỜI — gộp ở t3groups() (§6.7.2b).
    `nh` = nhắc được không · `x` = object nhóm ② (mang tt · con) để dòng gộp đọc hạn. */
 const o=[];
 rows().forEach(p=>{const m=myc(p);
  m.m1.forEach((f,i)=>o.push({p,t:['⛔ Thiếu thông tin định danh — '+f,'lylich','r','Mức ① · hồ sơ cũ nhập TRƯỚC luật MYC-1 — sửa ngay','1'],k:p.id+'-m1-'+i,nh:true,g:gNhom1(f)}));
  m.m2.forEach(x=>o.push({p,t:['Thiếu nhóm «'+x.ten+'»: '+x.truong.join(' · '),x.tab,ttMau[x.tt],'Mức ② · '+ttChu(x),'2'],k:p.id+'-m2-'+x.nh,nh:true,x,g:gNhom2(x)}));
  m.m3.forEach((f,i)=>o.push({p,t:['⚪ '+f,'lylich','n','Mức ③ · nên có — ⛔ không tính là thiếu, ⛔ không nhắc','3'],k:p.id+'-m3-'+i,nh:false,g:gNhom1(f)}));
  m.viec.forEach((v,i)=>o.push({p,t:[v[0],v[1],v[2],v[3],'v'],k:p.id+'-v-'+i,nh:!!v[4]}));
 });
 return o;
}
/* §6.7.2b — GỘP MỘT NGƯỜI MỘT DÒNG.
   🛑 Danh sách con khi MỞ và con số khi ĐÓNG sinh từ ĐÚNG mảng này ⇒ ⛔ có đường nào để hai bên lệch nhau
   (ràng buộc 121). Bộ lọc Mức và lọc ctx áp Ở ĐÂY, một lần. */
function t3groups(){
 const byP=new Map();
 t3rows().forEach(o=>{
  if(t3Ctx&&o.p.id!==t3Ctx)return;
  if(!fMUC.has(o.t[4]))return;
  let g=byP.get(o.p.id); if(!g){g={p:o.p,thieu:[],viec:[]};byP.set(o.p.id,g)}
  (o.t[4]==='v'?g.viec:g.thieu).push(o);
 });
 return [...byP.values()].map(g=>{
  /* hạng nặng: ① = 0 · ② quá hạn = 1 · ② còn hạn = 2 · ② chưa tới hạn = 3 · ③ = 4 · chỉ có việc = 5 */
  let w=5, han=null;
  g.thieu.forEach(o=>{
   const r = o.t[4]==='1' ? 0
     : o.t[4]==='2' ? (o.x.tt==='qua'?1:o.x.tt==='con'?2:3)
     : 4;
   if(r<w)w=r;
   if(o.x&&o.x.con!==null&&(han===null||o.x.con<han))han=o.x.con;
  });
  g.w=w; g.han=han;
  g.n1=g.thieu.filter(o=>o.t[4]==='1').length;
  g.n2=g.thieu.filter(o=>o.t[4]==='2').length;
  g.n3=g.thieu.filter(o=>o.t[4]==='3').length;
  g.cl = g.n1?'r' : g.thieu.some(o=>o.x&&o.x.tt==='qua')?'r' : g.thieu.some(o=>o.x&&o.x.tt==='con')?'w' : g.n2?'n' : 'n';
  return g;
 }).sort((a,b)=>a.w-b.w
   || ((a.han===null?9e9:a.han)-(b.han===null?9e9:b.han))
   || a.p.n.localeCompare(b.p.n,'vi'));
}

 return head

}

   phải nhớ «bằng thạc sĩ khai ở bảng nào». */

/* Thứ bậc văn bằng — ĐỌC TỪ GHI CHÚ CỦA CHÍNH MẪU (HS02 mục 27 · HS03 mục II):
   «TSKH, TS, chuyên khoa II, Ths, chuyên khoa I, đại học, cao đẳng, trung cấp, sơ cấp, chứng chỉ».
   Mẫu liệt kê TỪ CAO XUỐNG THẤP ⇒ thứ bậc này là của Bộ Nội vụ, ⛔ không phải tôi tự đặt. */
const VB_BAC=[['tiến sĩ khoa học',9],['tskh',9],['tiến sĩ',8],['chuyên khoa ii',7],['thạc sĩ',6],
              ['chuyên khoa i',5],['đại học',4],['cao đẳng',3],['trung cấp',2],['sơ cấp',1]];
const LLCT_BAC=[['cao cấp',3],['trung cấp',2],['sơ cấp',1]];
const QLNN_BAC=[['chuyên viên cao cấp',4,'Chuyên viên cao cấp'],['chuyên viên chính',3,'Chuyên viên chính'],
                ['chuyên viên',2,'Chuyên viên'],['cán sự',1,'Cán sự']];
const bacTheo=(t,bang)=>{const x=(t||'').toLowerCase();let b=0;bang.forEach(r=>{if(x.includes(r[0])&&r[1]>b)b=r[1]});return b};
const mmyy=v=>{const m=/^(\d{1,2})\/(\d{4})$/.exec(v||'');return m?(+m[2])*12+(+m[1]):0};
const hvMoiNhat=rs=>(rs||[]).slice().sort((a,b)=>mmyy(b.den)-mmyy(a.den))[0]||null;
/* CAO NHẤT, ⛔ KHÔNG phải dòng cuối cùng — bằng sau chưa chắc cao hơn bằng trước
   (rất thật: thầy cô học thêm một bằng đại học thứ hai SAU khi đã có thạc sĩ). */
function hvCaoNhat(rs,truong,bang){
 let best=null,bb=0;
 (rs||[]).forEach(r=>{const b=bacTheo(r[truong],bang);
   if(b>0&&(b>bb||(b===bb&&best&&mmyy(r.den)>mmyy(best.den)))){bb=b;best=r}});
 return best;
}

 const n=hlCon(r);
 return n<0 ? '<span class="st2 n">Đã hết hạn '+esc(r.hl)+'</span>'
  : n<=HL_NGUONG ? '<span class="st2 w">⚠ sắp hết hạn — còn '+n+' ngày</span><div style="font-size:10.5px;color:var(--ink3)">'+esc(r.hl)+'</div>'
  : '<b>'+esc(r.hl)+'</b>';
}
const hlTinHieu=p=>HL_BANG.flatMap(k=>(p.hv&&p.hv[k]||[]).filter(r=>{const n=hlCon(r);return n!==null&&n<=HL_NGUONG}));
function hvBang(p,spec){
 const key=spec[0],so=spec[1],ten=spec[2],phu=spec[3],cols=spec[4], coHL=HL_BANG.includes(key);
 const rs=p.hv[key]||[], R0=R();
 const nut = R0.edit
  ? '<button class="btn xs" data-x="sua2" data-ns="'+p.id+'" data-f="Học vấn — bảng '+so+'">+ Thêm dòng</button>'
  : '';
 return '<div style="margin:12px 0 0">'
  +'<div style="font-weight:700;font-size:12.5px;margin-bottom:4px"><span class="chip">'+so+'</span> '+ten
  +(phu?' <span style="font-weight:400;color:var(--ink3);font-size:11px">('+phu+')</span>':'')
  +(rs.length?' <span class="tg c">'+rs.length+' dòng</span>':'')+'</div>'
  +(rs.length
    ? '<table><thead><tr><th style="width:125px">Tháng/năm'
      +'<div style="font-weight:400;font-size:10px;color:var(--ink3)">Từ — Đến</div></th>'
      +cols.map(function(c){return '<th>'+c[1]+'</th>'}).join('')
      +'<th style="width:135px">Nguồn dòng</th>'
      +(coHL?'<th style="width:140px">Hiệu lực đến <div style="font-weight:400;font-size:10px;color:var(--ink3)">nội bộ · ⛔ không in</div></th>':'')
      +'</tr></thead><tbody>'
      +rs.map(function(r){
        return '<tr><td><b>'+esc(r.tu)+'</b> — <b>'+esc(r.den)+'</b></td>'
        +cols.map(function(c){
           const v=r[c[0]]; let ex='';
           if(key==='b3'&&c[0]==='cc'&&r.loai){const q=B3LOAI[r.loai]||['—','n'];ex=' <span class="st2 '+q[1]+'">'+q[0]+'</span>'}
           if(key==='b6'&&c[0]==='cc'){ex=(r.loai?' <span class="chip">'+esc(r.loai)+'</span>':'')
                                          +(r.bac?' <span class="chip">'+esc(r.bac)+'</span>':'')}
           return '<td>'+(v?esc(v):'<span style="color:var(--ink3)">—</span>')+ex+'</td>';
         }).join('')
        +'<td>'+hvNguonO(r)+'</td>'+(coHL?'<td>'+hlO(r)+'</td>':'')+'</tr>';
       }).join('')
      +'</tbody></table>'
    : '<div class="empty" style="padding:5px 10px;font-size:11.5px;text-align:left">— chưa có dòng nào —</div>')

function boDau(s){

}
/* ⑤ — máy GỢI Ý khuôn chỉ khi mọi ô khác rỗng khớp ĐÚNG MỘT khuôn; ⛔ đoán */

/* ───────────── ⑥ L1 — kiểm kiểu theo cột đích, từng ô ───────────── */
function kiemL1(c, v, duong, gan){

  if (/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/.test(String(v))) return 'Có ký tự điều khiển';
  var k = kieuCua(c), s;
  switch (k.loai){
    case 'chuoi':  return t.length > 255 ? 'Dài quá 255 ký tự' : null;
    case 'ho_ten': return t.length > 100 ? 'Họ tên dài quá 100 ký tự' : null;
    case 'ngay':   return docNgay(t, 'dd/mm/yyyy') ? null : '«' + t + '» không phải ngày dd/mm/yyyy có thật';
    case 'so':     return /^-?\d+([.,]\d+)?$/.test(t) ? null : '«' + t + '» không phải số';
    case 'sdt':
      s = t.replace(/[\s.\-]/g, '');
      if (/^[1-9]\d{8}$/.test(s)) return '«' + t + '» mất số 0 đầu (ô số) — ⛔ tự thêm';
      return /^0\d{9}$/.test(s) ? null : '«' + t + '» không phải SĐT 10 chữ số bắt đầu bằng 0';

    case 'ma_dinh_danh':

/* ───────────── ⑤ PHÉP BIẾN ĐỔI — danh sách ĐÓNG (N3) ───────────── */

var BD_THEM = ['gop_cot', 'tach_ho_ten', 'doi_dinh_dang_ngay', 'bang_doi_gia_tri', 'chuan_hoa_chuoi'];
function bdMoi(ma){

function laHang(g){ return !!(g && g.bien_doi && g.bien_doi.length && g.bien_doi[0].ma === 'gia_tri_hang'); }
function coGop(g){ return !!(g && g.bien_doi && g.bien_doi.length && g.bien_doi[0].ma === 'gop_cot'); }
/* một cột đích: {cot_nguon[], bien_doi[]} × một dòng ⇒ {v, loi, goc} — chạy THEO THỨ TỰ KHAI */
function chay(g, o, ghiLa){
  var bd = g.bien_doi || [];
  if (laHang(g)) return {v:String(bd[0].gia_tri == null ? '' : bd[0].gia_tri), goc:''};
  var vals = (g.cot_nguon || []).map(function(k){ return o[k] == null ? '' : String(o[k]); });
  var v, loi = null, i0 = 0;

  else v = vals.length ? vals[0] : '';
  for (var i = i0; i < bd.length; i++){
    var f = BD[bd[i].ma]; if (!f || !f.chay) continue;
    var r = f.chay(v, bd[i]);

/* ───────────── đọc tệp giả · vân tay ④ ───────────── */
function khoaTieuDe(hdr){
  var raw = hdr.map(function(h, i){ return {i:i, goc:h == null ? '' : String(h).trim(), base:chuanHoa(h)}; });
  var dem = {}, thu = {}, td = [];
  raw.forEach(function(h){ if (h.base) dem[h.base] = (dem[h.base] || 0) + 1; });
  raw.forEach(function(h){
    if (!h.base) return;
    var key = h.base;
    if (dem[h.base] > 1){ thu[h.base] = (thu[h.base] || 0) + 1; key = h.base + '#' + thu[h.base]; }
    td.push({i:h.i, goc:h.goc, base:h.base, key:key});
  });

}
/* van_tay_tieu_de = TẬP (⛔ thứ tự) các chuan_hoa(tiêu đề) khác rỗng; trùng ⇒ #1 #2 */
B.vanTay = function(hdr){ return khoaTieuDe(hdr).map(function(h){ return h.key; }).sort(); };
function docSheet(sh, dongTD){
  var rows = (sh && sh.o) || [], td = khoaTieuDe(rows[dongTD - 1] || []), dong = [];
  for (var r = dongTD; r < rows.length; r++){
    var row = rows[r] || [];
    if (!row.some(function(v){ return !laTrong(v); })) continue;
    var o = {};
    td.forEach(function(h){ o[h.key] = row[h.i] == null ? '' : String(row[h.i]); });
    dong.push({so_dong:r + 1, o:o});                   /* số DÒNG EXCEL, ⛔ STT */
  }
  return {tieuDe:td, dong:dong, vanTay:td.map(function(h){ return h.key; }).sort()};
}
function a1Cua(sh){ return String((((sh && sh.o) || [])[0] || [])[0] == null ? '' : sh.o[0][0]).trim(); }
function dongTieuDeMacDinh(sh){

  var rows = (sh && sh.o) || [];
  for (var r = 0; r < rows.length; r++) if ((rows[r] || []).some(function(v){ return !laTrong(v); })) return r + 1;

}
function vtBang(a, b){ return (a || []).slice().sort().join('|') === (b || []).slice().sort().join('|'); }
function soChung(a, b){ var s = {}; (b || []).forEach(function(x){ s[x] = 1; }); return (a || []).filter(function(x){ return s[x]; }).length; }

/* ───────────── ② kiểm khai báo đường nhập (HDMX ② mục 1–2) ───────────── */
B.kiemKhaiBao = function(duong){

      if (k.loai === 'ma_dinh_danh' && !(c.loai_ma && B.khuonMa[c.loai_ma])) loi.push('Cột «' + c.nhan + '» kiểu ma_dinh_danh thiếu loai_ma (khuôn đọc tham số M10.8 — ⛔ khai khuôn số cứng)');

    });

/* 🔁 MNXL-Z — hộp bộ máy ⛔ che TOAST / MODAL của menu (quy ước demo: #toast · #mask.on).

    if (uv.length === 1 && nguonDen[uv[0]].length === 1){ P.gan[c.ma] = {cot_nguon:[uv[0]], bien_doi:[]}; P.goiY[c.ma] = {trang:'tu', uv:uv}; }

/* ④ mục 2 — tệp là MẪU TRỐNG hệ thống xuất: gán 100 % theo nhan (vẫn chạy L1…L5, vẫn bắt tích L3) */
function ganTheoNhan(P){
  P.gan = {}; P.goiY = {}; P.mauThieu = {};

    if (h){ P.gan[c.ma] = {cot_nguon:[h.key], bien_doi:[]}; P.goiY[c.ma] = {trang:'mau_trong', uv:[h.key]}; }

function chonSheet(pd, tep, daDung){

/* sheet nào của tệp mang đúng vân tay của một phần mẫu (theo dòng tiêu đề của mẫu) */
function sheetKhop(tp){

function docTep(tep){

function apMau(m){

  m.phan.forEach(function(tp){
    var P = S.phan.filter(function(p){ return p.ma_phan === tp.ma_phan; })[0]; if (!P) return;
    var i = sheetKhop(tp); if (i >= 0) P.sheet = i;

    P.def.cot_dich.forEach(function(c){ P.goiY[c.ma] = {trang:'mau_khong', uv:[]}; });

      if (co.length || laHang(c)) P.gan[c.cot_dich] = {cot_nguon:co, bien_doi:sao(c.bien_doi)};

function suaGan(){ S.l3 = null; if (S.mau) S.daSua = true; if (S.cach_gan === 'tu_dong_mau_trong') S.cach_gan = 'tay'; }

/* ───────────── tính toàn bộ bước ② (L1 · L2 · chặn · cột thừa · giá trị lạ) ───────────── */
function tinhPhan(P){

    if (laHang(g)){

    kq.l2.push({cot_dich:c.ma, nhan:c.nhan, ti_le:tl, dat:dat, mau:mau, ket:ket, nguon:g.cot_nguon.map(function(k){ return tenGoc(P, k); }), c:c});
    if (kieuCua(c).loai === 'ngay' && !(g.bien_doi || []).some(function(b){ return b.ma === 'doi_dinh_dang_ngay'; }) && dat < mau){
      var vals = P.doc.dong.map(function(dg){ return dg.o[g.cot_nguon[0]]; });

/* gợi ý cột nguồn gần đúng — theo TÊN (lệch ≤ 2) và theo DỮ LIỆU (≥ 90 % ô qua L1 của cột đích) */
function goiYNguon(P, c, boQua){

    var gan = ten.some(function(t){ if (!t || !h.base) return false; var n = Math.min(t.length, h.base.length); return lev(t, h.base) <= (n <= 4 ? 0 : n <= 8 ? 1 : 2); });

function tenBD(b){

/* menu gọi để hiện bản chụp ở chi tiết lô (tab lịch sử lô) */

/* ===================== §6.2.3c — Ô ⛔ ÁP DỤNG cho người đang xem =====================
   🛑 ⛔ có cờ «Là hồ sơ viên chức» nào: công tắc là `Diện làm việc` (laVC) ＋ cờ `Thuộc diện
   khai CSDL ngành` (p.csdl) — HAI TRỤC, ⛔ gộp. Trạng thái này là DẪN XUẤT, ⛔ lưu.
   Phần tử thứ 6 của mỗi ô = nguồn yêu cầu: bnv · gd · ch (cả hai) · nb (nội bộ) · gd! (ngoại lệ). */
var gHienHet=false;   /* công tắc 👁 — trạng thái của MỘT LƯỢT XEM, ⛔ nhớ qua lượt sau */
function gApDung(p,f){
 const ng=f[5];
 if(ng==='ch'||ng==='nb')return true;                 /* cả hai · nội bộ ⇒ mọi người */
 if(ng==='gd!')return true;                           /* ngoại lệ: ô có MENU KHÁC đọc (ràng buộc 134) */
 if(f[3]==='ro'||f[2]===0)return true;                /* `dẫn xuất` · `ánh xạ` — nguồn là menu của trường */
 if(ng==='bnv')return laVC(p);
 if(ng==='gd')return !!p.csdl;
 return true;
}
/* thu gọn khi ĐỦ BỐN điều kiện — ô ĐÃ CÓ GIÁ TRỊ thì ⛔ bao giờ thu gọn (ràng buộc 132) */
const gThuGon=(p,f)=>!gHienHet&&!gApDung(p,f)&&!coGiaTri(gCur(p,f[0]));
const gGapNhom=(p,gk)=>GNHOM[gk].f.every(f=>gThuGon(p,f));
function gViSao(p){
 return laVC(p)? '' : 'người này là <b>'+esc(dien(p.dien).ten)+'</b>';
}
/* dải đầu tab Lý lịch — nói ra con số, ⛔ ẩn im lặng */
function gDaiLyLich(p){
 if(typeof GNHOM==='undefined')return '';
 const het=[]; for(const k in GNHOM) GNHOM[k].f.forEach(f=>{if(!gApDung(p,f))het.push(f)});
 const trong=het.filter(f=>!coGiaTri(gCur(p,f[0]))).length;
 const daKhai=het.length-trong;
 if(!het.length) return `<div class="info">👤 <b>${esc(dien(p.dien).ten)}</b>${p.csdl?' · <b>thuộc diện khai CSDL ngành</b>':''}
   — mọi ô của tab này đều áp dụng cho người này.</div>`;
 return `<div class="info w">👤 <b>${esc(dien(p.dien).ten)}</b>${p.csdl?' · thuộc diện khai CSDL ngành':' · ⛔ thuộc diện khai CSDL ngành'}
   — <b>${het.length}</b> ô của tab này <b>⛔ áp dụng</b> cho người này
   <span style="color:var(--ink3)">(mẫu 38 mục của Bộ Nội vụ là mẫu của <b>cán bộ · công chức · viên chức</b>;
   người hợp đồng lên cơ sở dữ liệu quốc gia bằng <b>mẫu hợp đồng lao động</b> Phụ lục II TT 05/2023 — ⏳ §9 dòng 40)</span>.
   <b>${trong}</b> ô trống ⇒ <b>thu gọn</b>${daKhai?` · <b>${daKhai}</b> ô <b>đã có giá trị</b> ⇒ <b>vẫn hiện đủ</b> kèm cảnh báo`:''}.
   <button class="btn xs" data-x="g-hien-het">👁 ${gHienHet?'Thu gọn lại':'Hiện cả ô không áp dụng'}</button>
   <div style="font-size:11px;color:var(--ink3);margin-top:3px">🛑 Thu gọn ⛔ đụng <b>phép đếm</b> (T3 · T1 · F12 · M9.4),
   ⛔ đụng <b>bản in</b> HS01 · HS02 · 38 mục, ⛔ ẩn <b>cả một tab</b>, ⛔ ẩn ô <code>dẫn xuất</code> · <code>ánh xạ</code>.</div></div>`;
}

/* 🛑 app.js chạy render() LẦN ĐẦU TRƯỚC khi tệp này gán GNHOM (một <script>, var mới hoisted).
   Lần paint ấy ⛔ cần con trỏ nhóm; app.70 gọi render() lại sau khi mọi phần đã nạp. */
function gNhom1(nhan){
 if(typeof GNHOM==='undefined')return null;
 const s=String(nhan||'').toLowerCase();
 for(const k in GNHOM) if(GNHOM[k].f.some(f=>s.indexOf(f[1].toLowerCase())>=0||f[1].toLowerCase().indexOf(s)>=0)) return k;
 return null;
}

    ⇒ mở nhóm sửa của TRƯỜNG THIẾU ĐẦU TIÊN, ⛔ của nhóm đếm */
 return (x.truong&&x.truong.length&&gNhom1(x.truong[0]))||NHOM2G[x.nh]||null;
}

 return false;

   o=`<select data-gi="${path}">${['c','k','cks'].map(k=>`<option value="${k}" ${v===k?'selected':''}>${CO3[k][0]}</option>`).join('')}</select><span class="why">${why}</span>`;
  else if(kieu.indexOf('s|')===0)
   o=`<select data-gi="${path}">${kieu.slice(2).split('|').map(k=>`<option ${v===k?'selected':''}>${k}</option>`).join('')}</select><span class="why">${why}</span>`;
  else
   o=`<input type="text" data-gi="${path}" value="${esc(v)}"><span class="why">${why}</span>`;
  const cls=ycKhoa(p.id,nhan)||kieu==='ro'?'ro':tang===2?'t2':tang===3?'t3':'';
  /* ô ⛔ áp dụng mà ĐÃ CÓ GIÁ TRỊ ⇒ vẫn hiện đủ, kèm cảnh báo — nó thường là VẾT của một lần đổi diện làm việc */
  const kap=!gApDung(p,f)?`<span class="st2 w">⚠ đã khai nhưng ⛔ áp dụng cho diện làm việc hiện tại</span>`:'';

  <div class="lgd"><span>Một lượt <b>💾 Lưu = MỘT giao dịch</b>: ⛔ có ca «lưu được ba ô tầng 1 rồi hủy ở hộp thoại minh chứng».

function gChan(p,gk,doi){
 const loi=[];
 /* ① mức ① ⛔ xóa trắng — chạy ĐÚNG phép kiểm của §2c.1, ⛔ bản thứ hai */
 const sau={}; M1F.forEach(([k,ten])=>sau[k]=m1Val(p,k));
 doi.forEach(f=>{const k={'n':'n','sinh':'sinh','gt':'gt','cccd':'cccd','tk.sdt':'sdt'}[f[0]]; if(k)sau[k]=gNhap[f[0]]});
 M1F.forEach(([k,ten])=>{if(sau[k]!==undefined&&!coGiaTri(sau[k])&&coGiaTri(m1Val(p,k)))
   loi.push('Mức ① «'+ten+'» ⛔ được xóa trắng — §2c.1')});
 /* ② trùng định danh đăng nhập toàn trường (§4b.7) */
 doi.forEach(f=>{
  if(f[0]==='tk.sdt'){const t=NS.find(x=>x.id!==p.id&&x.tk&&x.tk.sdt&&x.tk.sdt.replace(/\s/g,'')===gNhap[f[0]].replace(/\s/g,''));
   if(t)loi.push('Số điện thoại trùng với <b>'+t.n+'</b> — định danh đăng nhập phải duy nhất toàn trường')}
  if(f[0]==='tk.mail'){const t=NS.find(x=>x.id!==p.id&&x.tk&&x.tk.mail&&x.tk.mail.toLowerCase()===gNhap[f[0]].toLowerCase());
   if(t)loi.push('Email trùng với <b>'+t.n+'</b> — định danh đăng nhập phải duy nhất toàn trường')}
  if(f[0]==='cccd'){const t=NS.find(x=>x.id!==p.id&&x.cccd===gNhap[f[0]]);
   if(t)loi.push('Số căn cước trùng với <b>'+t.n+'</b> — khóa chống trùng (§4b.8)')}
 });
 return loi;
}
function gGhi(p,gk,doi,mcTheoTruong){
 gLuot++;
 const ma='LUU-'+String(gLuot).padStart(3,'0');
 const ng=d2s(HOMNAY), ai=R().n||role;
 const t1=[],t2=[],t3=[];
 doi.forEach(f=>{
  const cu=gCur(p,f[0]), moi=gNhap[f[0]];
  /* 🛑 kiểm LẠI ở nhánh ghi: trong lúc form mở có thể đã sinh yêu cầu chờ duyệt */
  if(!gCanGhi(p,f))return;
  gSet(p,f[0],moi);
  const nhanh=f[2]===2?t2:f[2]===1?t1:t3;
  nhanh.push([f[1],cu,moi]);
  /* audit MỘT BẢN GHI MỖI TRƯỜNG (ràng buộc 126) — mang mã lượt lưu chung */
  (AUDIT[p.id]=AUDIT[p.id]||[]).unshift([ng,ai,
    (f[2]===2?'Sửa trường nhạy cảm — ':'Sửa hồ sơ — ')+f[1],
    '«'+(cu||'—')+'» → «'+(moi||'—')+'» · nhóm '+GNHOM[gk].ten+' · lượt '+ma
      /* 🔑 audit ghi ĐÚNG tệp đã trỏ cho Ô NÀY, ⛔ cả danh sách tệp của lượt —
         câu «ai đổi số tài khoản này, bằng tờ giấy nào» phải trả lời được ở một bản ghi */
      +(f[2]===2?' · minh chứng: '+((mcTheoTruong&&mcTheoTruong[f[1]])||'—'):''),
    f[2]===2?'w':'']);
 });
 return {ma,t1,t2,t3};
}
function gKetQua(p,gk,r,boQua,mcLuot){
 const kh=a=>a.map(x=>`<tr><td>${esc(x[0])}</td><td style="color:var(--ink3)">${esc(x[1])||'—'}</td><td><b>${esc(x[2])||'—'}</b></td></tr>`).join('');
 const bang=(ten,a)=>a.length?`<h4 style="margin:10px 0 5px">${ten} <span class="cnt">${a.length}</span></h4>
   <table><thead><tr><th>Trường</th><th style="width:150px">Giá trị cũ</th><th style="width:180px">Giá trị mới</th></tr></thead><tbody>${kh(a)}</tbody></table>`:'';
 modal('💾 Đã lưu nhóm «'+GNHOM[gk].ten+'» — lượt '+r.ma,
  `<div class="info">✓ <b>MỘT giao dịch</b>, <b>${r.t1.length+r.t2.length+r.t3.length}</b> trường đã ghi ·
    <b>${r.t1.length+r.t2.length+r.t3.length}</b> bản ghi audit (<b>một bản ghi mỗi trường</b>, cùng mã lượt <b>${r.ma}</b>) ·
    <b>1</b> thông báo cho chính chủ <b>${esc(p.n)}</b> — ⛔ một thông báo mỗi trường.</div>
   ${bang('Tầng 1 — ghi thẳng',r.t1)}
   ${bang('Tầng 2 — audit loại «Sửa trường nhạy cảm»',r.t2)}
   ${bang('Tầng 3 — TCNS là chủ',r.t3)}
   ${r.t2.length?`<div class="ro" style="margin-top:9px">Minh chứng của lượt này: <b>${(mcLuot||[]).map(m=>esc(m.ten)).join(' · ')||'—'}</b>.
     Mỗi trường tầng 2 trỏ tới ít nhất một tệp — ⛔ một tệp chung đứng tên cho cả nhóm.</div>`:''}
   ${boQua.length?`<div class="danger" style="margin-top:9px">⚠ <b>${boQua.length}</b> trường <b>BỎ QUA, nêu đích danh</b>
     — ⛔ ghi đè, ⛔ im lặng: ${boQua.map(x=>'<b>'+esc(x)+'</b>').join(' · ')}</div>`:''}`,
  `<button class="btn" data-x="close">Đóng</button>`);
}

 case 'g-luu2': {

/* ═══════════════════════════════════════════════════════════════════════════════════
   M4.1 v1.30 §6.4 — PHẦN E NHẬN THÊM MỘT VAI: NƠI LƯU NHIỆM KỲ CHỨC DANH
                                                        (6/10/2026 · cụm CDHT)

   `M4.3` v3.0 thôi giữ nhiệm kỳ — ở đó chỉ còn TRẠNG THÁI bật / tắt của hiện tại.
   ⟹ Câu «ngày D người này giữ chức danh gì» có ĐÚNG MỘT nguồn: Phần E của hồ sơ này.

   Bốn thứ tệp này dựng:
     ① HAI LOẠI MỐC, MỘT CHỖ LƯU — mốc ngoài trường (ô chữ tự do, giữ nguyên) ⟂ mốc
        chức danh tại trường (chức danh từ danh mục · đơn vị · văn bản căn cứ · trỏ ngược
        về lượt thay đổi ở M4.3 · nguồn). ⛔ tách thành mục riêng: Phần E là mẫu 38 mục
        của Bộ Nội vụ — MỘT chuỗi quá trình công tác, ⛔ phân biệt nơi làm.
     ② BA ĐƯỜNG MỐC SINH RA — M4.2 / ô ghi hộ M10.1 (máy, ngày theo quyết định) ·
        nút `＋ Tạo mốc công tác` của M4.3 (người tự nhập, ô ngày để TRỐNG) · nhập trực tiếp.
     ③ Sửa · Xóa mốc là chuyện BÌNH THƯỜNG ở đây — và 🛑 nó ⛔ ĐỔI trạng thái chức danh
        hiện tại ở M4.3. Thứ duy nhất đổi theo là GIÁ TRỊ SUY RA `Đã gắn / Chưa gắn`.
     ④ Phép đếm «lượt thay đổi chức danh chưa gắn mốc» ở T3, TÁCH HAI CHIỀU — ⛔ chặn gì.

   🛑 Tệp này ⛔ sửa một byte nào của app.js: khai lại `pQuaTrinh` (mảnh nạp sau thắng),
      nối hai dòng vào `M2F` bằng push, và dùng listener click RIÊNG với tên thao tác MỚI
      (`moc-*`) nên switch của app.js ⛔ bắt phải.
   ═══════════════════════════════════════════════════════════════════════════════════ */

const TRUONG41 = 'THCS & THPT Nguyễn Tất Thành';

/* ── Danh mục chức danh — bản chiếu M10.4. [tên, nhóm, cần đơn vị?]
      nhóm ①② gắn văn bản (số QĐ + tệp) · nhóm ③ chỉ cần ngày (M4.3 §6.2.1 · ràng buộc 8) ── */
const CDMUC41 = [
  ['Hiệu trưởng', 1, ''], ['Phó HT Chuyên môn', 1, ''], ['Phó HT phụ trách điểm trường', 1, 'dt'],
  ['Tổ trưởng chuyên môn', 2, 'to'], ['Tổ phó chuyên môn', 2, 'to'],
  ['Tổ chức nhân sự', 2, ''], ['Kế toán', 2, ''], ['Thủ quỹ', 2, ''], ['Văn thư', 2, ''],
  ['Y tế học đường', 2, ''], ['Bảo vệ', 2, ''], ['Nhân viên phục vụ', 2, ''],
  ['Giáo viên bộ môn', 3, ''], ['Giáo viên chủ nhiệm', 3, '']
];
const cdMuc41 = ten => CDMUC41.find(x => x[0] === ten);

/* ── Kho LƯỢT THAY ĐỔI CHỨC DANH — bản chiếu M4.3 §6.2.5. Demo chỉ ĐỌC kho này;
      thao tác bật / tắt vẫn thuộc M4.3, ⛔ mở ở đây. ── */
const KIEU41 = { them: ['＋ Thêm', 'Bắt đầu nhiệm kỳ', 'bat'],
                 bat:  ['● Bật',   'Bắt đầu nhiệm kỳ', 'bat'],
                 tat:  ['○ Tắt',   'Kết thúc nhiệm kỳ', 'tat'] };
const NGUON41 = { m42: '🔗 từ Biến động nhân sự', m101: '🔗 từ ô ghi hộ M10.1',
                  m43: '✎ thao tác tay tại M4.3', tay: '✎ nhập trực tiếp tại M4.1' };

let LS41 = [], LSEQ41 = 0, MSEQ41 = 0;

const themLuot41 = (ns, cd, dv, kieu, luc, nguon, mocId) =>
  LS41.push({ id: 'LS' + (++LSEQ41), ns: ns, cd: cd, dv: dv || '', kieu: kieu,
              luc: luc, nguon: nguon, moc: mocId || null });

/* `Đã gắn` là GIÁ TRỊ SUY RA, ⛔ một cột lưu: xóa mốc ở đây thì dòng bên M4.3 tự về
   `Chưa gắn` — ⛔ có dữ liệu nào chạy ngược từ hồ sơ sang menu nguồn (ràng buộc 35). */
const mocCua41 = id => { for (const p of NS) for (const m of (p.qt || [])) if (m[5] && m[5].id === id) return m; return null };
const daGan41  = l => !!l.moc && !!mocCua41(l.moc);
const chuaGan41 = (p, chieu) => LS41.filter(l => l.ns === p.id && !daGan41(l) &&
                                 (!chieu || KIEU41[l.kieu][2] === chieu));

/* ── Bốn hồ sơ có ticket biến động ở M4.2 ⇒ mốc của họ do TICKET sinh, ⛔ ô ghi hộ:
      id 16 tạm nghỉ · 17 chuyển đi · 18 nghỉ việc · 6 chuyển diện làm việc.
      Mốc ấy CHỈ ĐỌC tại đây — sửa thì sửa ở M4.2, ⛔ thì quá trình công tác sẽ nói
      khác quyết định đã ký (luật cũ, giữ nguyên). ── */
const M42_41 = [6, 16, 17, 18];

/* ── GIEO: nâng mốc tại trường của dữ liệu cũ thành mốc có cấu trúc, rồi dựng lượt ── */
(function gieoMoc41() {
  NS.forEach(function (p) {
    let dauTien = true;
    (p.qt || []).forEach(function (m) {
      if (m[2] !== TRUONG41) return;                       /* mốc ngoài trường: giữ nguyên */
      const c = cdMuc41(p.cd) || ['Giáo viên bộ môn', 3, ''];
      const dv = c[2] === 'to' ? p.to : c[2] === 'dt' ? p.dt : '';
      const tuTicket = M42_41.includes(p.id);
      m[5] = { id: 'MC' + (++MSEQ41), cd: dauTien ? p.cd : m[3], dv: dv,
               vb: c[1] < 3 ? 'QĐ ' + (100 + p.id) + '/QĐ-NTT' : '',
               nguon: tuTicket ? 'm42' : 'm101' };
      if (dauTien) {
        themLuot41(p.id, m[5].cd, dv, 'them', m[0], m[5].nguon, m[5].id);
        m[5].luot = LS41[LS41.length - 1].id;
        dauTien = false;
      }
    });
  });

  /* 🔴 CA MẪU — lượt CHƯA GẮN MỐC, dựng đúng hai chiều.
     Người dùng bấm thẳng ở M4.3 (đường NHANH) ⇒ trạng thái đổi ngay, hồ sơ còn thiếu mốc. */
  const bat = [[5, 'Giáo viên chủ nhiệm', ''], [9, 'Tổ phó chuyên môn', 'to'], [22, 'Giáo viên chủ nhiệm', '']];
  const tat = [[12, 'Thủ quỹ', ''], [13, 'Văn thư', '']];

  bat.forEach(function (x) { const p = byId(x[0]); if (!p) return;
    const c = cdMuc41(x[1]); const dv = x[2] === 'to' ? p.to : x[2] === 'dt' ? p.dt : '';
    themLuot41(p.id, x[1], dv, 'bat', '01/09/2026', 'm43', null); });

  tat.forEach(function (x) { const p = byId(x[0]); if (!p) return;
    /* chức danh kiêm nhiệm vừa thôi giữ — lượt tắt đã chạy, mốc thì chưa ai khai */
    themLuot41(p.id, x[1], '', 'tat', '31/08/2026', 'm43', null); });
})();

/* ── T3 — hạng mục kiểm, TÁCH HAI CHIỀU.
      Hai dòng thay vì một, vì «tách hai chiều» phải đọc ra được từ chính màn hình:
      gộp một dòng là mất đúng cái thông tin khiến chiều TẮT nguy hơn. ── */
M2F.push(
  ['QT', 'Mốc chức danh chưa khai — lượt <b>BẬT</b> chưa gắn mốc',
   p => true, p => chuaGan41(p, 'bat').length === 0, 'dot'],
  ['QT', 'Mốc chức danh chưa khai — lượt <b>TẮT</b> chưa gắn mốc (🛑 chiều nguy hơn)',
   p => true, p => chuaGan41(p, 'tat').length === 0, 'dot']
);

/* ════════════════════ BỀ MẶT — §6.4 ════════════════════ */

const nhanMoc41 = m => m[5] ? '<span class="tg a">🏫 Chức danh tại trường</span>'
                            : '<span class="tg c">🧳 Ngoài trường</span>';
const suaDuoc41 = m => !m[5] || ['m43', 'tay'].includes(m[5].nguon);

function pQuaTrinh(p) {
  const edit = R().edit;
  const qt = p.qt || [];
  const cBat = chuaGan41(p, 'bat'), cTat = chuaGan41(p, 'tat');

  const dong = qt.map(function (m, ix) {
    const meta = m[5];
    const l = meta && meta.luot ? LS41.find(x => x.id === meta.luot) : null;
    return `<tr>
      <td>${esc(m[0])} — ${esc(m[1])}</td>
      <td>${esc(m[2])}<div style="font-size:11px;color:var(--ink3)">${nhanMoc41(m)}</div></td>
      <td>${esc(meta ? meta.cd : m[3])}
        ${meta && meta.dv ? `<div style="font-size:11px;color:var(--ink3)">${esc(meta.dv)}</div>` : ''}</td>
      <td style="font-weight:400;font-size:11.5px">${meta
        ? (meta.vb ? esc(meta.vb) : '<span style="color:var(--ink3)">— chỉ cần ngày (nhóm ③)</span>')
        : '<span style="color:var(--ink3)">—</span>'}</td>
      <td style="font-weight:400;font-size:11.5px">${meta ? NGUON41[meta.nguon] : '—'}
        ${l ? `<div style="font-size:11px;color:var(--ink3)">↔ lượt ${l.id} · ${KIEU41[l.kieu][0]}</div>` : ''}</td>
      <td>${suaDuoc41(m)

  return `<div class="ro">🔴 <b>v1.30 — mục này nhận thêm MỘT VAI: nơi lưu NHIỆM KỲ CHỨC DANH tại trường.</b>

const oVal41 = id => { const e = document.getElementById(id); return e ? e.value.trim() : '' };

function formMoc41(p, m, ls) {
  const meta = m ? m[5] : null;
  const cdHien = ls ? ls.cd : meta ? meta.cd : '';
  const dvHien = ls ? ls.dv : meta ? meta.dv : '';
  const c = cdMuc41(cdHien);
  const nhom3 = c && c[1] === 3;
  return `
   ${ls ? `<div class="info">Mốc này sinh từ <b>lượt ${ls.id} · ${KIEU41[ls.kieu][0]}</b> ở <code>M4.3</code> —
     loại mốc là <b>${KIEU41[ls.kieu][1]}</b>, suy từ chiều của lượt.<br>
     🛑 <b>Ô ngày để TRỐNG, bắt buộc nhập.</b> Máy ⛔ điền hộ: thời điểm <i>bấm nút</i> ở M4.3 thường
     ⛔ phải thời điểm <i>hiệu lực</i> của nhiệm kỳ <i>(ràng buộc 36)</i>.</div>` : ''}
   <label class="lbl">Cơ quan, đơn vị</label>
   <input class="fldi" id="mc-cq" value="${esc(ls || meta ? TRUONG41 : (m ? m[2] : ''))}" ${ls || meta ? 'readonly' : ''}>
   <label class="lbl">Chức vụ ${ls || meta ? '<span class="tg c">danh mục M10.4</span>' : '<span class="tg c">ô chữ tự do — mốc ngoài trường</span>'}</label>
   ${ls || meta
      ? `<input class="fldi" id="mc-cd" value="${esc(cdHien)}" readonly>`
      : `<input class="fldi" id="mc-cd" value="${esc(m ? m[3] : '')}">`}
   ${dvHien ? `<label class="lbl">Đơn vị</label><input class="fldi" id="mc-dv" value="${esc(dvHien)}" readonly>` : ''}
   <label class="lbl">Từ ngày <span style="color:var(--red)">*</span>
     ${ls ? '<span class="tg c">⛔ máy điền hộ</span>' : ''}</label>
   <input class="fldi" id="mc-tu" placeholder="dd/mm/yyyy" value="${esc(ls ? '' : (m ? m[0] : ''))}">
   <label class="lbl">Đến ngày <span style="color:var(--ink3)">(để trống nghĩa là còn đang giữ)</span></label>
   <input class="fldi" id="mc-den" placeholder="dd/mm/yyyy hoặc «nay»" value="${esc(ls ? '' : (m ? m[1] : ''))}">
   <label class="lbl">Văn bản căn cứ ${nhom3
      ? '<span class="tg c">nhóm ③ — chỉ cần ngày, ⛔ bắt số QĐ</span>'
      : '<span style="color:var(--red)">* nhóm ' + (c ? c[1] : '②') + ' — bắt buộc số QĐ</span>'}</label>
   <input class="fldi" id="mc-vb" placeholder="vd. QĐ 118/QĐ-NTT" value="${esc(meta ? meta.vb : '')}">`;
}

function moModalMoc41(p, m, ls, ix) {
  modal(ls ? '＋ Tạo mốc công tác — từ lượt ' + ls.id : m ? '✎ Sửa mốc quá trình công tác' : '+ Thêm mốc quá trình công tác',
    formMoc41(p, m, ls),
    `<button class="btn" data-x="close">Hủy</button>
     <button class="btn p" data-x="moc-luu" data-ns="${p.id}" data-ix="${ix == null ? '' : ix}" data-ls="${ls ? ls.id : ''}">💾 ${ls ? 'Tạo mốc' : 'Lưu'}</button>`);
}

document.addEventListener('click', function (e) {
  const t = e.target.closest('[data-x]');
  if (!t) return;
  const x = t.dataset.x;
  if (!/^moc-/.test(x)) return;
  const p = byId(+t.dataset.ns);

  if (x === 'moc-them') { moModalMoc41(p, null, null, null); return }

  if (x === 'moc-sua') { const ix = +t.dataset.ix, m = p.qt[ix];
    if (!suaDuoc41(m)) { toast('⛔ Mốc do <b>' + NGUON41[m[5].nguon] + '</b> — <b>chỉ đọc tại M4.1</b>. Sửa thì sửa ở nguồn, ⛔ thì quá trình công tác sẽ nói khác quyết định đã ký'); return }
    moModalMoc41(p, m, null, ix); return }

  if (x === 'moc-tao') { const ls = LS41.find(l => l.id === t.dataset.ls); moModalMoc41(p, null, ls, null); return }

  if (x === 'moc-xoa') { const ix = +t.dataset.ix, m = p.qt[ix];
    if (!suaDuoc41(m)) { toast('⛔ Mốc do <b>' + NGUON41[m[5].nguon] + '</b> — chỉ đọc tại M4.1'); return }
    const l = m[5] && m[5].luot ? LS41.find(z => z.id === m[5].luot) : null;
    modal('🗑 Xóa mốc quá trình công tác',
      `<div class="ro">Đây là <b>hồ sơ</b>, và hồ sơ thì <b>được đính chính</b> — khai sai thì xóa, đó là việc bình thường.
        Khác hẳn <code>M4.3</code>: bản ghi bên ấy là <b>công tắc quyền</b>, xóa nó làm dữ liệu hoạt động quá khứ
        mất chỗ dựa, nên ở đó chỉ có <b>Tắt</b>.</div>
       <div class="warn">🛑 Xóa mốc này ⛔ <b>ĐỔI trạng thái chức danh hiện tại ở M4.3</b>.
        ${l ? 'Thứ duy nhất đổi theo: dòng <b>lượt ' + l.id + '</b> bên ấy <b>tự trở về <code>Chưa gắn</code></b> — đó là <b>giá trị suy ra</b>, ⛔ một cột lưu.'
            : 'Mốc này ⛔ gắn với lượt nào nên ⛔ có gì đổi theo.'}</div>`,
      `<button class="btn" data-x="close">Hủy</button>
       <button class="btn d" data-x="moc-xoa-ok" data-ns="${p.id}" data-ix="${ix}">🗑 Xóa mốc</button>`); return }

  if (x === 'moc-xoa-ok') { const ix = +t.dataset.ix, m = p.qt[ix];
    const l = m[5] && m[5].luot ? LS41.find(z => z.id === m[5].luot) : null;
    p.qt.splice(ix, 1); closeModal(); render();
    toast(l ? 'Đã xóa mốc — lượt <b>' + l.id + '</b> ở M4.3 tự về <b>Chưa gắn</b>, <b>trạng thái chức danh ⛔ đổi</b>'
            : 'Đã xóa mốc — <b>trạng thái chức danh ở M4.3 ⛔ đổi</b>'); return }

  if (x === 'moc-luu') {
    const tu = oVal41('mc-tu'), den = oVal41('mc-den'), vb = oVal41('mc-vb'),
          cq = oVal41('mc-cq'), cd = oVal41('mc-cd');
    const ls = t.dataset.ls ? LS41.find(l => l.id === t.dataset.ls) : null;
    const ix = t.dataset.ix === '' ? null : +t.dataset.ix;
    if (!tu) { toast('⛔ <b>Bắt buộc nhập ngày</b> — máy ⛔ điền hộ: ngày bấm nút ở M4.3 thường ⛔ phải ngày hiệu lực của nhiệm kỳ'); return }
    const c = cdMuc41(cd);
    if (c && c[1] < 3 && !vb) { toast('⛔ Chức danh <b>nhóm ' + c[1] + '</b> bắt buộc có <b>số quyết định</b> — nhóm ③ mới chỉ cần ngày'); return }

    if (ix != null) {                                   /* sửa mốc đang có */
      const m = p.qt[ix]; m[0] = tu; m[1] = den || 'nay'; m[2] = cq; m[3] = cd;
      if (m[5]) { m[5].cd = cd; m[5].vb = vb }
      closeModal(); render();
      toast('Đã sửa mốc — <b>audit đã ghi</b>. 🛑 Trạng thái chức danh ở <b>M4.3 ⛔ đổi</b>'); return }

    const meta = { id: 'MC' + (++MSEQ41), cd: cd, dv: ls ? ls.dv : '', vb: vb,
                   nguon: ls ? 'm43' : 'tay', luot: ls ? ls.id : null };
    const laTruong = ls || cq === TRUONG41;
    p.qt.unshift(laTruong ? [tu, den || 'nay', TRUONG41, cd, 0, meta] : [tu, den || 'nay', cq, cd, 0]);
    if (ls) ls.moc = meta.id;
    closeModal(); render();
    toast(ls ? 'Đã tạo mốc — lượt <b>' + ls.id + '</b> chuyển sang <b>Đã gắn</b>' : 'Đã thêm mốc quá trình công tác');
    return }
});

/* ════════════════════ PHÉP KIỂM ════════════════════ */
function kiemMoc41() {
  const k = [], ok = (t, d) => k.push([!!d, t]);
  const taiChuc = NS.filter(p => TAICHUC.includes(p.tt));

  ok('Mọi mốc tại trường đều có khối cấu trúc (chức danh · đơn vị · văn bản · nguồn)',
     NS.every(p => (p.qt || []).every(m => m[2] !== TRUONG41 || !!m[5])));
  ok('Mốc NGOÀI trường ⛔ bị gắn cấu trúc — hai loại mốc, một chỗ lưu',
     NS.every(p => (p.qt || []).every(m => m[2] === TRUONG41 || !m[5])));

  const cB = taiChuc.reduce((s, p) => s + chuaGan41(p, 'bat').length, 0);
  const cT = taiChuc.reduce((s, p) => s + chuaGan41(p, 'tat').length, 0);
  ok('Phép đếm TÁCH HAI CHIỀU và ra số khác nhau: bật ' + cB + ' · tắt ' + cT, cB === 3 && cT === 2);

  ok('T3 có ĐÚNG HAI hạng mục mốc chức danh, ⛔ gộp một dòng',
     M2F.filter(f => /Mốc chức danh chưa khai/.test(f[1])).length === 2);
  ok('Hai hạng mục ấy áp cho MỌI hồ sơ, ⛔ chỉ viên chức',
     M2F.filter(f => /Mốc chức danh chưa khai/.test(f[1])).every(f => NS.every(p => f[2](p) === true)));

  const coThieu = taiChuc.filter(p => chuaGan41(p, 'bat').length || chuaGan41(p, 'tat').length);
  ok('Người có lượt chưa gắn thì T3 đếm ra, người đủ mốc thì ⛔ (' + coThieu.length + ' người)',
     coThieu.length === 5 &&
     coThieu.every(p => myc(p).m2.some(g => g.nh === 'QT' && g.truong.some(x => /Mốc chức danh chưa khai/.test(x)))) &&
     taiChuc.filter(p => !coThieu.includes(p))
            .every(p => !myc(p).m2.some(g => g.nh === 'QT' && g.truong.some(x => /Mốc chức danh chưa khai/.test(x)))));

  ok('`Đã gắn` là GIÁ TRỊ SUY RA: gỡ mốc khỏi hồ sơ ⇒ lượt tự về Chưa gắn, ⛔ ai ghi cột nào',
     (function () {
       const l = LS41.find(z => daGan41(z)); if (!l) return false;
       const p = NS.find(q => q.id === l.ns), ix = (p.qt || []).findIndex(m => m[5] && m[5].id === l.moc);
       const luu = p.qt[ix]; p.qt.splice(ix, 1);
       const sau = daGan41(l); p.qt.splice(ix, 0, luu);
       return sau === false && daGan41(l) === true;
     })());

  ok('Mốc do M4.2 / ô ghi hộ M10.1 sinh thì ⛔ sửa, ⛔ xóa được tại đây',
     NS.some(p => (p.qt || []).some(m => m[5] && ['m42', 'm101'].includes(m[5].nguon))) &&
     NS.every(p => (p.qt || []).every(m => !m[5] || !['m42', 'm101'].includes(m[5].nguon) || !suaDuoc41(m))));

  ok('Mốc sinh từ lượt của M4.3 và mốc nhập trực tiếp thì SỬA · XÓA được',
     ['m43', 'tay'].every(ng => suaDuoc41([0, 0, TRUONG41, '', 0, { nguon: ng }])));

  ok('Ba đường mốc sinh ra đều có mặt trong dữ liệu đang chạy (M4.2 · ô ghi hộ M10.1 · lượt tay ở M4.3)',
     ['m42', 'm101'].every(ng => NS.some(p => (p.qt || []).some(m => m[5] && m[5].nguon === ng))) &&
     LS41.some(l => l.nguon === 'm43' && !daGan41(l)));

  ok('Đúng bốn hồ sơ có mốc do ticket M4.2 sinh, và cả bốn đều CHỈ ĐỌC tại đây',
     NS.filter(q => (q.qt || []).some(m => m[5] && m[5].nguon === 'm42')).map(q => q.id).sort((a, b) => a - b).join(',') === '6,16,17,18');

  ok('Chiều TẮT chưa gắn mốc rơi đúng vào hai hồ sơ đã khai làm ca mẫu',
     taiChuc.filter(p => chuaGan41(p, 'tat').length).map(p => p.id).sort().join(',') === '12,13');

  const dat = k.filter(z => z[0]).length;
  console.log('M4.1 v1.30 — phép kiểm mốc chức danh (§6.4): ' + dat + '/' + k.length + ' đạt');
  k.forEach(z => console.log((z[0] ? '  ✓ ' : '  ✗ ') + z[1]));
  return dat + '/' + k.length;
}

kiemMoc41();

     (daDu41 ? '✅ <b>Đã xác nhận đủ</b> — Nguyễn Thu Hà <i>(Tổ chức nhân sự)</i> · 23/09/2026 15:41. '+
               'Bước 4 <b>xong</b>; bước 5 mở. <button class="rolnk" data-kt="dat">↺ Đặt lại (demo)</button>'
             : 'Đã nạp <b>'+tong+' hồ sơ nhân sự</b> — '+DEM41.map(x=>x[0]+': <b>'+x[1]+'</b>').join(' · ')+'.<br>'+

}

/* ===== MYC-3A — deep-link ĐẾN T3 «Hồ sơ cần hoàn thiện» (M4.1 §6.7.4 · PHIEU-MYC-2B E.4) =====
   Nguyên văn M0.2 §4.2.2e dòng V2: ?tab=ho_so_can_hoan_thien&ctx={ns_id}&return=M0.2 — ⛔ không đặt tên khác.
   ctx nhận mã nhân sự (NS-…) — cũng nhận id nội bộ cho tiện gõ tay. Mở T3, lọc đúng người, mở sẵn panel đúng tab của nhóm thiếu đầu tiên.
   Chỉ demo: &vai=<mã vai thanh đen> (mặc định giữ vai đang chọn) · &xem=sau (đồng hồ ② như ngày 15/11/2026 = chip «Ngày xem hồ sơ» 15/11 của M0.2).
   Thiếu / sai tham số ⇒ mở chỗ gần nhất và NÓI ra — ⛔ không im lặng. Vai không có quyền X ở T3 hoặc người ngoài phạm vi ⇒ ⛔ không lộ tên. */
var t3Ctx=null, t3Return=null;
(function t3DeepLink(){const q=new URLSearchParams(location.search), tb=q.get('tab');
 if(!tb)return;
 const vai=q.get('vai'); if(vai&&ROLE[vai]){const btn=document.querySelector(`.rb[data-r="${vai}"]`);if(btn)btn.click();}
 if(q.get('xem')==='sau')NGAYXEM=NGAYXEM_SAU;
 if(tb!=='ho_so_can_hoan_thien'){render();toast('Tham số tab «'+esc(tb)+'» không nhận ra — mở Danh sách nhân sự');return}
 if(!tabList().some(t=>t[0]==='thieu')){render();toast('Vai '+role+' không có tab Hồ sơ cần hoàn thiện — mở Danh sách nhân sự');return}
 tab='thieu'; t3Return=q.get('return');
 const ctx=q.get('ctx'), p=ctx?NS.find(x=>x.ma===ctx||String(x.id)===ctx):null;
 let bao;
 if(!ctx) bao='Thiếu tham số ctx — mở T3 cả trường';
 else if(!p||!rows().includes(p)) bao='Không có hồ sơ «'+esc(ctx)+'» trong phạm vi của vai '+role+' — mở T3 cả trường';
 else{t3Ctx=p.id; cur=p.id;
  /* §6.7.2b.6 — ngoại lệ DUY NHẤT của luật «mọi dòng đóng khi vào tab»: đường V2 đã nói rõ đi xem MỘT người */
  t3Open.add(p.id);
  const m=myc(p);
  /* đích = hạng mục ĐẦU TIÊN của dòng đã sắp xếp, ⛔ phải nhóm ② đầu tiên của mảng thô */
  const g0=t3groups().find(x=>x.p.id===p.id), o0=g0&&(g0.thieu[0]||g0.viec[0]);
  ptab=(o0&&o0.t[1])||'lylich';
  bao=`T3 · lọc đúng một người: <b>${p.n}</b> — ${m.m2.length?'thiếu '+m.m2.length+' nhóm':'không còn nhóm ② nào thiếu'}`;}
 render(); toast(bao+(NGAYXEM!==HOMNAY?' · đồng hồ ② xem như 15/11/2026':''));
 /* dải lọc đứng ngay đầu T3 ⇒ chỉ cần giữ trang ở đầu: tắt khôi phục cuộn của trình duyệt (bài học MYC-2B), ⛔ scrollIntoView — nó đẩy dải khỏi tầm nhìn */
 try{history.scrollRestoration='manual'}catch(e){} setTimeout(()=>window.scrollTo(0,0),60);
})();
</script>
