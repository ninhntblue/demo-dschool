<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1.7 Chuyển lớp — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:12px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:var(--bg);color:var(--ink2)}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:206px;flex:0 0 206px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;overflow-x:auto}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;margin-left:2px}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:290px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap;align-items:center}
.sum b{color:var(--ink)}
.chip{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12.5px;background:#fff;white-space:nowrap}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700}
.chip .cb{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;margin-left:5px}
.scopebar{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;padding:8px 12px;border-radius:9px;font-size:12.5px;margin-bottom:11px;display:flex;gap:8px;align-items:flex-start}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
.stage.open .hcol{display:none}
@media(max-width:1180px){.stage.open .listw{display:none}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;cursor:pointer}
.grow:hover{background:#eef2f7}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:8px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
tr.tr:hover td{background:var(--brand-soft);cursor:pointer}
tr.tr.on td{background:#eff6ff}
tr:last-child td{border-bottom:none}
.wrapx{overflow-x:auto}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph h2{font-size:16px;font-weight:700}
.ph .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pbody{padding:14px 15px;max-height:calc(100vh - 210px);overflow-y:auto}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:10px 13px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px;line-height:1.6}
.ok{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px;line-height:1.6}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap;margin-left:5px}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:default}

.hb{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:13px}
.lbh{padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.lbh .sp{flex:1}
.f2{display:grid;grid-template-columns:158px 1fr;gap:10px;padding:7px 12px;font-size:12.5px}
.f2+.f2{border-top:1px solid #f1f5f9}
.f2 .k{color:var(--ink2)}
.f2 .v{font-weight:600}

.tl{border-left:2px solid var(--line);margin-left:9px;padding-left:17px}
.tli{position:relative;padding:8px 0;font-size:12.5px}
.tli::before{content:"";position:absolute;left:-23px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid #fff}
.tli.now::before{background:var(--amber);box-shadow:0 0 0 3px #fef3c7}
.tli.wait::before{background:var(--line2)}
.tli.no::before{background:var(--red)}
.tli.now{background:var(--amber-soft);border-radius:8px;padding:8px 10px;margin-left:-10px}
.tli b{display:block}
.tli span{color:var(--ink3);font-size:11.5px}

.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fff}
.ck.done{background:var(--green-soft);border-color:#a7f3d0}
.ck .ic{font-size:15px;flex:0 0 20px;text-align:center}
.ck .bd{flex:1;min-width:0}
.ck .bd b{display:block;font-size:12.5px}
.xnrow{display:flex;gap:11px;align-items:flex-start;cursor:pointer;user-select:none}
.xnrow.off{cursor:not-allowed;opacity:.72}
.xnrow:not(.off):hover .bd b{color:var(--brand)}
.xncb{width:19px;height:19px;flex:0 0 19px;margin-top:2px;cursor:pointer;accent-color:var(--green)}
.xncb:disabled{cursor:not-allowed}
.ck .bd span{font-size:11.5px;color:var(--ink3)}
.who{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;white-space:nowrap}
.who.may{background:#e0e7ff;color:#3730a3}
.who.ng{background:#fef3c7;color:#92400e}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;font-size:12.5px}
.cmp .h{background:#f8fafc;padding:7px 10px;font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;border-bottom:1px solid var(--line)}
.cmp .c{padding:7px 10px;border-bottom:1px solid #f1f5f9}
.cmp .c.bad{background:var(--red-soft);color:#991b1b;font-weight:700}
.cmp .lb{font-size:10.5px;color:var(--ink3);display:block;font-weight:400}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:880px;max-width:95vw;max-height:88vh;display:flex;flex-direction:column}
.modal.sm{width:620px}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.drop{border:2px dashed var(--line2);border-radius:10px;padding:18px;text-align:center;color:var(--ink3);font-size:12.5px;margin-top:4px;cursor:pointer}
.drop:hover{border-color:var(--brand);color:var(--brand)}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.ai{display:inline-block;margin-left:6px;padding:0 6px;border-radius:5px;font-size:9.5px;font-weight:700;
 letter-spacing:.03em;background:rgba(0,0,0,.09);color:inherit;opacity:.85;vertical-align:middle;white-space:nowrap}
.btn.p .ai,.btn.d .ai,.btn.g .ai{background:rgba(255,255,255,.26)}
.hintline .ai{background:#e0e7ff;color:#3730a3;opacity:1}
.ck .bd b .ai{background:#e0e7ff;color:#3730a3}
.hintline{background:var(--bg);border:1px dashed var(--line2);color:var(--ink2);
 padding:7px 11px;border-radius:8px;font-size:12px;margin-bottom:11px}
.hint{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:7px 11px;border-radius:8px;font-size:12px;margin:9px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:36px;text-align:center;color:var(--ink3)}
.noacc{padding:50px 30px;text-align:center}
.noacc .ic{font-size:38px;margin-bottom:12px}
.wk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;background:#fff}
.wk:hover{border-color:var(--brand);background:var(--brand-soft)}
.wk.on{border-color:var(--brand);background:#eff6ff}
.wk .ic{font-size:17px;flex:0 0 24px}
.wk .bd{flex:1;min-width:0}
.wk .bd b{display:block;font-size:13px}
.wk .bd span{font-size:11.5px;color:var(--ink3)}
.cols{display:flex;gap:13px;align-items:flex-start}
.colL{flex:0 0 340px;max-width:340px}
.colR{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media(max-width:1100px){.cols{flex-direction:column}.colL{flex:1;max-width:none;width:100%}}
.chip .cb{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;margin-left:5px}
.tab1 .b{margin-left:2px}
.actbar{position:sticky;top:0;z-index:5;display:flex;gap:7px;flex-wrap:wrap;align-items:center;
 padding:10px 15px;background:#f8fafc;border-bottom:1px solid var(--line)}
.syncbar{display:flex;gap:11px;align-items:center;flex-wrap:wrap;background:#eef2ff;border:1px solid #c7d2fe;
 color:#3730a3;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px}
.gtrow{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:9px;background:#fff}
.gtrow .drop{padding:12px}
.hslist{border:1px solid var(--line);border-radius:9px;max-height:200px;overflow-y:auto;margin-top:7px}
.hsr{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:12.5px}
.hsr:last-child{border-bottom:none}
.hsr:hover{background:var(--brand-soft)}
.hsr.on{background:#eff6ff}
.hsr>div{flex:1;min-width:0}
.hsr b{display:block}
.hsr span.lbl,.hsr div span{display:block;font-size:11px;color:var(--ink3)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fff}
.ck.done{background:var(--green-soft);border-color:#a7f3d0}
.ck .ic{font-size:15px;flex:0 0 20px;text-align:center}
.ck .bd{flex:1;min-width:0}
.ck .bd b{display:block;font-size:12.5px}
.ck .bd span{font-size:11.5px;color:var(--ink3)}
.who{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;white-space:nowrap}
.who.may{background:#e0e7ff;color:#3730a3}
.who.ng{background:#fef3c7;color:#92400e}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;font-size:12.5px}
.cmp .h{background:#f8fafc;padding:7px 10px;font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;border-bottom:1px solid var(--line)}
.cmp .c{padding:7px 10px;border-bottom:1px solid #f1f5f9}
.cmp .c.bad{background:var(--red-soft);color:#991b1b;font-weight:700}
.cmp .lb{font-size:10.5px;color:var(--ink3);display:block;font-weight:400}
.tli.no::before{background:var(--red)}
.pbody{max-height:calc(100vh - 250px)}

/* ═══════════ TAB 🎯 XẾP LỚP — lưới kéo thả (6/10/2026) ═══════════════════
   Khuôn vẽ app.10-luoi-xep-lop.js chỉ PHÁT RA tên lớp CSS, ⛔ mang theo bộ y
   phục; khối này thiếu nên mọi thẻ học sinh rơi về chữ trần. Vá ở ĐÂY, ⛔ ở
   khuôn — luật GC-6 bắt khuôn trùng từng byte với gốc demo M1.4.
   Khác M1.4 một điểm có lý do: ở M1.7 mọi lượt kéo chỉ là ĐANG CHỜ ghi nhận,
   nên thẻ phải mang được màu của trạng thái ấy (vàng = chờ, ⛔ xanh = xong). */
.plwrap{display:grid;grid-template-columns:356px 1fr;gap:13px;align-items:start}
@media(max-width:1060px){.plwrap{grid-template-columns:1fr}}

/* ---- hàng đợi ---- */
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qbox.over{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.qh{padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;
 display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.45}

/* Thẻ học sinh — THẺ thật: khung riêng, nẹp màu bên trái, nhấc nhẹ khi trỏ vào. */
.qi{position:relative;margin:8px;padding:9px 10px;background:#fff;border:1px solid var(--line);
 border-left:3px solid var(--line2);border-radius:10px;font-size:12.5px;cursor:grab;
 transition:border-color .12s,box-shadow .12s,transform .12s}
.qi+.qi{margin-top:0}
.qi:hover{border-color:var(--brand);border-left-color:var(--brand);box-shadow:0 2px 8px rgba(29,78,216,.10)}
.qi:active{cursor:grabbing}
.qi.drag{opacity:.45;border-style:dashed;box-shadow:none}
.qi .nm{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;line-height:1.35}
.qi .nm::before{content:"⠿";flex:0 0 auto;color:var(--ink3);font-size:13px;font-weight:400;letter-spacing:-1.5px}

/* Dải chip nhận dạng — ⛔ một dãy chữ xám dính liền nhau. */
.qi .mt{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:7px;font-size:11px;color:var(--ink2)}
.qi .mt>span:not(.st2){background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.qi .mt>span.gm{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
.qi .mt>span.gf{background:#fdf2f8;border-color:#fbcfe8;color:#9d174d}
.qi .idl{margin-top:6px;font-size:10.5px;color:var(--ink3);letter-spacing:.01em}

/* Tầng trạng thái — nói thẳng «đang chờ ghi vào lớp nào» và cho đường lùi. */
.qi .stg{margin-top:8px;display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:8px;
 font-size:11.5px;font-weight:700;background:#fff7ed;border:1px dashed #fcd34d;color:#92400e}
.qi .stg.lk{background:var(--bg);border-color:var(--line2);color:var(--ink2);font-weight:400}
.qi.staged{background:var(--amber-soft);border-color:#fde68a;border-left-color:var(--amber)}
.qi.staged:hover{border-color:var(--amber);border-left-color:var(--amber);box-shadow:0 2px 8px rgba(217,119,6,.14)}
.qi.locked{cursor:default;opacity:.74}
.qi.locked:hover{border-color:var(--line);border-left-color:var(--line2);box-shadow:none}

  v:lm.ss+'/'+lm.max+(lm.giu?' (+'+lm.giu+' giữ chỗ)':'')+' — '+(con>0?'còn '+con+' chỗ':con===0?'đã đủ':'vượt '+(-con)),

 if(nhanhB(t)||khacHe(t))
  O.push({c:'w',l:'Thay đổi kéo theo',
   v:[nhanhB(t)?'Khác điểm trường':'',khacHe(t)?'Khác hệ đào tạo':''].filter(Boolean).join(' · '),

     (khacHe(t)?'Cần <b>điều chỉnh khoản thu</b> từ tháng hiệu lực — hệ '+heCua(t.lopCu)+' → '+heCua(t.lopMoi)+'. ':'')+
     'Xem khối <i>Dữ liệu sẽ cập nhật</i> bên dưới.'});

    Với GIA ĐÌNH, chuyển khác điểm trường nhìn y hệt chuyển trường: đổi địa điểm đưa đón,
    đổi GVCN, đổi TOÀN BỘ giáo viên bộ môn, có khi đổi cả suất ăn và tiền.
    Với PHÁP LUẬT, nó là điều chuyển nội bộ trong MỘT pháp nhân — mã định danh ⛔ không đổi. */
 if(nhanhB(t)){
  /* ⛔ CHẶN 3: điểm trường đến có khối lớp này không (bậc học là thuộc tính của ĐIỂM TRƯỜNG) */
  O.push(dtCoKhoi(dtCua(t.lopMoi),lm.k)
   ?{c:'o',l:'🏫 Điểm trường đến có khối lớp này',v:dtCua(t.lopMoi)+' có khối '+lm.k,s:''}
   :{c:'r',l:'🏫 Điểm trường đến có khối lớp này',v:dtCua(t.lopMoi)+' ⛔ KHÔNG có khối '+lm.k,
     s:'<b>Bậc học là thuộc tính của Điểm trường</b>. Bộ chọn lớp vốn đã lọc theo khối nên ca này gần như ⛔ không xảy ra; xảy ra thì là <b>dữ liệu hỏng</b>, ⛔ không phải sai chính sách.'});
  /* ⛔ CHẶN 4: ký túc xá — NGOẠI LỆ CÓ CHỦ Ý, xem §4.1 */
  const kt=ktxCua(t.ma);
  O.push(!kt
   ?{c:'o',l:'🛏 Ký túc xá',v:'Em ⛔ không ở ký túc xá',s:''}
   :{c:'r',l:'🛏 Ký túc xá',v:'⛔ Em đang ở KTX '+kt.khu+' · phòng '+kt.phong+' tại '+dtCua(t.lopCu),
     s:'🆕 <b>Loại chặn thứ BA — việc chưa có phương án cho một nhu cầu sinh hoạt của học sinh.</b> '+
       'Sĩ số, kỳ thi, số lần chuyển đều là thứ <b>nhà trường đã bàn với gia đình rồi</b>. Còn <b>chỗ ngủ đêm nay</b> thì ⛔ <b>không nằm trong cuộc bàn về việc đổi lớp</b> — '+
       'nó là một cuộc bàn khác, với <b>quản sinh và người xếp phòng</b>, và rất dễ ⛔ <b>không ai nhớ ra</b>. '+
       'Chặn ở đây ⛔ không phải bắt người ta xin phép chính mình; là <b>bắt hỏi một người chưa được hỏi</b>.',go:'M6.10'});
  /* ⚠ CHỈ BÀY RA: khoảng cách — 🛑 máy ⛔ KHÔNG tính đường, ⛔ không đo km */
  O.push({c:'w',l:'📍 Hai điểm trường',
   v:dtCua(t.lopCu)+' → '+dtCua(t.lopMoi),
   s:'<b>'+dtCua(t.lopCu)+'</b> — '+dcDT(dtCua(t.lopCu))+'<br><b>'+dtCua(t.lopMoi)+'</b> — '+dcDT(dtCua(t.lopMoi))+'<br>'+
     '🛑 Máy ⛔ <b>không tính đường, không đo km</b> — nhưng người duyệt <b>phải nhìn thấy em đang chuyển đi đâu</b>.'});
 }
 return O}

function choToi(t){const r=R();

  if(nhanhB(t))return !!r.ky;                       /* khác ĐT → HT duyệt */
  return !!r.duyet&&dtCua(t.lopCu)===r.dt||!!r.ky;  /* cùng ĐT → PHT_ĐT hoặc HT */
 }
 return false}
function loaiCho(t){const r=R();

 if(t.tt==='nhap')return chan(t).length?['r','Vướng: '+chan(t).map(x=>x.l).join(' · ')]:['b','Chờ bạn gửi duyệt'];
 if(t.tt==='duyet')return ['v','Chờ bạn duyệt'];

function nutQL(t){

/* ═══ 🆕 RSHS-2B — CHIP CHIẾU 🔗 hợp đồng HDTC ═══
   🛑 CHỈ ĐỌC. Tích ở M10.8, một lần, một chỗ — M1.7 ⛔ KHÔNG có ô tích riêng (D2). */
function chipTay(t){
 if(t.tt!=='hl') return '';

  (xong?'✅ <b>Đã xử lý trên CSDL ngành</b> — '+t.tayXong.ai+' · '+t.tayXong.ngay

   'menu này ⛔ <b>không có ô tích riêng</b>. <i>Đặt ô tích rời ở năm menu là năm nguồn sự thật, và sẽ không ai tích: '+
   'người mở ticket là PHT_ĐT, người gõ cổng là Văn thư và họ gõ cả lô một lần.</i>'+
   '<span class="rolnk" data-go="M10.8">→ M10.8 tab ④ · Việc chưa xong</span></div></div>'}

/* ---- hoàn tất: duyệt xong là cập nhật dữ liệu ngay ---- */
function xong(t,nh){
 const hl=$('#fhl')?$('#fhl').value.trim():NGAY3, yk=$('#fyk')?$('#fyk').value.trim():'';
 if(!hl){toast('Phải nhập ngày có hiệu lực');return}
 const luuY=nh&&nh.length?' · Lưu ý khi duyệt: '+nh.map(x=>x.l).join(' · '):'';
 t.tt='hl';t.hieuluc=hl;t.duyet={ai:R().n,ngay:NGAY3};
 t.log.push(lg(R().n,'Duyệt yêu cầu chuyển lớp · ngày hiệu lực '+hl,
  'Không sinh quyết định, không ký số'+(yk?' · '+yk:'')+luuY));

 toast('Đã duyệt · dữ liệu cập nhật từ '+hl);render()}

/* Áp dụng thay đổi khi có hiệu lực */
function apDung(t){
 const h=hsOf(t.ma), lc=lopOf(t.lopCu), lm=lopOf(t.lopMoi);
 if(lc.ss)lc.ss--; if(lm)lm.ss++;
 h.lop=t.lopMoi; h.moiDen=1;
 const x=LS.find(y=>y.ma===t.ma);
 if(x)x.chang.push([t.lopCu,t.lopMoi,t.hieuluc,t.id]);
 else LS.push({ma:t.ma,chang:[[t.lopCu,t.lopMoi,t.hieuluc,t.id]]});
 t.log.push(lg('Hệ thống','Cập nhật hồ sơ HS: lớp '+t.lopCu+' → '+t.lopMoi+' từ '+t.hieuluc+' (M1.1)',
  'Điểm số và chuyên cần giữ nguyên, đi theo học sinh · sổ đầu bài không ảnh hưởng'));
 if(nhanhB(t)){
  t.log.push(lg('Hệ thống','Cập nhật Điểm trường: '+dtCua(t.lopCu)+' → '+dtCua(t.lopMoi),''));
  t.log.push(lg('Hệ thống','Hủy đăng ký bán trú tại '+dtCua(t.lopCu)+' — đã hỏi gia đình đăng ký lại (M6.1)',''));
  if(khacHe(t))t.log.push(lg('Hệ thống','Điều chỉnh khoản thu từ tháng hiệu lực (M7.2)','Hệ '+heCua(t.lopCu)+' → '+heCua(t.lopMoi)));
 }
 t.log.push(lg('Hệ thống','Tự rời nhóm chat lớp '+t.lopCu+', vào nhóm lớp '+t.lopMoi+' (M8.2)','Lịch sử chat cũ vẫn xem được'));}

  if (ma === 'bang_doi_gia_tri') return {ma:ma, cap:[], phan_biet_hoa_thuong:false};
  if (ma === 'chuan_hoa_chuoi') return {ma:ma, cat_khoang_trang:true, hoa_thuong:'giu'};
  return {ma:'gia_tri_hang', gia_tri:''};
}
function laHang(g){ return !!(g && g.bien_doi && g.bien_doi.length && g.bien_doi[0].ma === 'gia_tri_hang'); }
function coGop(g){ return !!(g && g.bien_doi && g.bien_doi.length && g.bien_doi[0].ma === 'gop_cot'); }
/* một cột đích: {cot_nguon[], bien_doi[]} × một dòng ⇒ {v, loi, goc} — chạy THEO THỨ TỰ KHAI */
function chay(g, o, ghiLa){
  var bd = g.bien_doi || [];
  if (laHang(g)) return {v:String(bd[0].gia_tri == null ? '' : bd[0].gia_tri), goc:''};
  var vals = (g.cot_nguon || []).map(function(k){ return o[k] == null ? '' : String(o[k]); });
  var v, loi = null, i0 = 0;
  if (coGop(g)){ v = vals.map(function(s){ return s.trim(); }).filter(Boolean).join(bd[0].noi == null ? ' ' : bd[0].noi); i0 = 1; }
  else v = vals.length ? vals[0] : '';
  for (var i = i0; i < bd.length; i++){
    var f = BD[bd[i].ma]; if (!f || !f.chay) continue;
    var r = f.chay(v, bd[i]);
    if (r.la != null && ghiLa) ghiLa(r.la);
    if (r.loi && !loi) loi = r.loi;
    v = r.v;
  }
  return {v:v, loi:loi, goc:vals.join(' | ')};
}
B.bienDoi = {danhSach:BD, chay:chay, moi:bdMoi};

/* ───────────── đọc tệp giả · vân tay ④ ───────────── */
function khoaTieuDe(hdr){
  var raw = hdr.map(function(h, i){ return {i:i, goc:h == null ? '' : String(h).trim(), base:chuanHoa(h)}; });
  var dem = {}, thu = {}, td = [];
  raw.forEach(function(h){ if (h.base) dem[h.base] = (dem[h.base] || 0) + 1; });
  raw.forEach(function(h){
    if (!h.base) return;
    var key = h.base;
    if (dem[h.base] > 1){ thu[h.base] = (thu[h.base] || 0) + 1; key = h.base + '#' + thu[h.base]; }
    td.push({i:h.i, goc:h.goc, base:h.base, key:key});
  });
  return td;
}
/* van_tay_tieu_de = TẬP (⛔ thứ tự) các chuan_hoa(tiêu đề) khác rỗng; trùng ⇒ #1 #2 */
B.vanTay = function(hdr){ return khoaTieuDe(hdr).map(function(h){ return h.key; }).sort(); };
function docSheet(sh, dongTD){
  var rows = (sh && sh.o) || [], td = khoaTieuDe(rows[dongTD - 1] || []), dong = [];
  for (var r = dongTD; r < rows.length; r++){
    var row = rows[r] || [];
    if (!row.some(function(v){ return !laTrong(v); })) continue;
    var o = {};
    td.forEach(function(h){ o[h.key] = row[h.i] == null ? '' : String(row[h.i]); });
    dong.push({so_dong:r + 1, o:o});                   /* số DÒNG EXCEL, ⛔ STT */
  }
  return {tieuDe:td, dong:dong, vanTay:td.map(function(h){ return h.key; }).sort()};
}
function a1Cua(sh){ return String((((sh && sh.o) || [])[0] || [])[0] == null ? '' : sh.o[0][0]).trim(); }
function dongTieuDeMacDinh(sh){
  if (/^MAU-/.test(a1Cua(sh))) return 2;              /* tệp mẫu hệ thống ⇒ dòng 2 */
  var rows = (sh && sh.o) || [];
  for (var r = 0; r < rows.length; r++) if ((rows[r] || []).some(function(v){ return !laTrong(v); })) return r + 1;
  return 1;
}
function vtBang(a, b){ return (a || []).slice().sort().join('|') === (b || []).slice().sort().join('|'); }
function soChung(a, b){ var s = {}; (b || []).forEach(function(x){ s[x] = 1; }); return (a || []).filter(function(x){ return s[x]; }).length; }

/* ───────────── ② kiểm khai báo đường nhập (HDMX ② mục 1–2) ───────────── */
B.kiemKhaiBao = function(duong){
  var loi = [];
  (duong.phan || []).forEach(function(pd){
    var cd = pd.cot_dich || [];
    cd.forEach(function(c){
      if (!c.kieu || !c.muc) loi.push('Cột đích «' + c.nhan + '» thiếu kieu hoặc muc — ⛔ dựng được L1 L2');
      var k = kieuCua(c);
      if (k.loai === 'danh_muc' && !((duong.danh_muc || {})[k.dm])) loi.push('Cột «' + c.nhan + '» trỏ danh mục «' + k.dm + '» mà đường nhập không khai');
      if (k.loai === 'ma_dinh_danh' && !(c.loai_ma && B.khuonMa[c.loai_ma])) loi.push('Cột «' + c.nhan + '» kiểu ma_dinh_danh thiếu loai_ma (khuôn đọc tham số M10.8 — ⛔ khai khuôn số cứng)');
      if (c.phai_gan && c.muc === 'bat_buoc') loi.push('Cột «' + c.nhan + '»: phai_gan chỉ đi với tuy_chon · co_dieu_kien (bat_buoc đã phải gán)');
    });
    (pd.nhom_phai_gan || []).forEach(function(n){
      (n.cum || []).forEach(function(cm){ cm.forEach(function(ma){ if (!cd.some(function(c){ return c.ma === ma; })) loi.push('nhom_phai_gan trỏ cột «' + ma + '» không có trong phần'); }); });
    });
    ['sdt', 'ho_ten', 'ngay', 'email'].forEach(function(kk){
      var ds = cd.filter(function(c){ return c.kieu === kk; });
      for (var i = 0; i < ds.length; i++) for (var j = i + 1; j < ds.length; j++){
        var cung = (pd.cap_de_nham || []).some(function(g){ return g.indexOf(ds[i].ma) >= 0 && g.indexOf(ds[j].ma) >= 0; });
        if (!cung) loi.push('«' + ds[i].nhan + '» và «' + ds[j].nhan + '» cùng kiểu ' + kk + ' mà ⛔ chung nhóm cap_de_nham — khai báo thiếu');
      }
    });
  });
  return loi;
};

/* ───────────── kho mẫu ───────────── */
function idMoi(loai){ B.kho.dem[loai]++; return (loai === 'mn' ? 'MN-' : 'MX-') + String(B.kho.dem[loai]).padStart(4, '0'); }
function napCongTy(ds, kho, loai){

/* ⑨ — mẫu gắn số hiệu mẫu đích CŨ ⇒ «cần rà lại», ⛔ tự áp, ⛔ tự nâng */
/* HDMX bản 2 ② mục 4 — một Feature NHIỀU mẫu đích: mẫu thuộc (ma_feature × tên gốc mẫu đích) */
function cungDuong(m, duong){ return m.duong_nhap.ma_feature === duong.ma_feature && tenMauGoc(m.duong_nhap.mau_dich) === tenMauGoc(duong.mau_dich); }
function raPhienBan(duong){

/* ═══════════════ KHUNG HIỂN THỊ (hai lớp: hộp chính · hộp phụ) ═══════════════ */
var LOP = null, PHU = null;

}
/* 🔁 MNXL-Z — hộp bộ máy ⛔ che TOAST / MODAL của menu (quy ước demo: #toast · #mask.on).
   Trong lúc hộp mở: body mang lớp bnx-dang-mo ⇒ #toast nổi trên hộp (style.08); modal của menu MỞ
   SAU khi hộp mở ⇒ gắn bnx-tren-hop, nổi trên hộp; modal đã mở TRƯỚC (vd hộp Import của M4.1) giữ dưới. */
var QS_MASK = null;
function theoDoiMask(){
  var mk = document.getElementById('mask');
  if (!mk || QS_MASK || !window.MutationObserver) return;
  QS_MASK = new MutationObserver(function(){
    var on = mk.classList.contains('on'), mo = LOP && LOP.classList.contains('bnx-mo');
    var tren = mk.classList.contains('bnx-tren-hop');   /* ⛔ ghi lại lớp đã có — tránh vòng lặp của chính trình theo dõi */
    if (on && mo && !mk._bnxTruoc && !tren) mk.classList.add('bnx-tren-hop');
    if (!on){ if (tren) mk.classList.remove('bnx-tren-hop'); mk._bnxTruoc = false; }
  });
  QS_MASK.observe(mk, {attributes:true, attributeFilter:['class']});
}
function mo(){
  dungLop(); theoDoiMask();
  var mk = document.getElementById('mask'); if (mk) mk._bnxTruoc = mk.classList.contains('on');
  LOP.classList.add('bnx-mo'); document.body.classList.add('bnx-dang-mo');
}
B.dong = function(){
  if (LOP){ LOP.classList.remove('bnx-mo'); PHU.classList.remove('bnx-mo'); }
  document.body.classList.remove('bnx-dang-mo');

};
/* BNX.bao(chu, loai) — toast NẰM TRÊN hộp bộ máy, cho menu nói một câu khi hộp đang mở (⛔ phải dựng hộp phụ) */

var hanhDongMenu = {};
/* menu đăng ký nút riêng trong hộp phụ: <button data-bnx="menu:ten"> */
B.dangKyNut = function(ten, fn){ hanhDongMenu[ten] = fn; };
function veLai(){

function the(loai, chu){ return '<span class="bnx-the bnx-the-' + loai + '">' + chu + '</span>'; }
function nhanTrangThai(m){

}

/* ═══════════════════════════ NHẬP ═══════════════════════════ */
var S = null;
B.moNhap = function(duong, cb){
  cb = cb || {};
  napCongTy(duong.mau_cong_ty, B.kho.mauNhap, 'mn');
  raPhienBan(duong);
  S = {duong:duong, cb:cb, buoc:1, tepChon:null, tep:null, phan:[], thongBao:[], mau:null, daSua:false,
       cach_gan:'tay', l3:null, loc:'dung', moKho:false, raLai:null, khop:[], khaiBao:B.kiemKhaiBao(duong),
       luuTen:'', ketQua3:null, ketQua4:null, hoanTac:null, maLo:null, chup:null};
  if (S.khaiBao.length && window.console) console.warn('[BNX] khai báo đường nhập thiếu:', S.khaiBao);
  B._che = 'nhap'; mo(); veLai();
};
function nguoiDung(cb){ var n = cb && cb.nguoi; return typeof n === 'function' ? n() : (n || 'Người dùng demo'); }
function truongCua(cb){ var t = cb && cb.truong; return typeof t === 'function' ? t() : (t || 'Trường demo'); }
function tenGoc(P, key){ var h = P.doc.tieuDe.filter(function(x){ return x.key === key; })[0]; return h ? h.goc + (key.indexOf('#') > 0 ? ' (' + key.split('#')[1] + ')' : '') : key; }
function napPhan(P){ P.doc = docSheet(S.tep.sheet[P.sheet], P.dong_tieu_de); }

/* ④ — tự gợi ý: khớp ĐÚNG MỘT cột nguồn ⇒ gán; nhiều / không ⇒ để trống, người chọn */
function goiY(P){
  P.gan = {}; P.goiY = {}; P.mauThieu = {};
  var cd = P.def.cot_dich, ungVien = {}, nguonDen = {};
  cd.forEach(function(c){
    var ten = [chuanHoa(c.nhan)].concat((c.ten_goi_y || []).map(chuanHoa));
    ungVien[c.ma] = P.doc.tieuDe.filter(function(h){ return ten.indexOf(h.base) >= 0; }).map(function(h){ return h.key; });
    ungVien[c.ma].forEach(function(k){ (nguonDen[k] = nguonDen[k] || []).push(c.ma); });
  });
  cd.forEach(function(c){
    var uv = ungVien[c.ma];
    if (uv.length === 1 && nguonDen[uv[0]].length === 1){ P.gan[c.ma] = {cot_nguon:[uv[0]], bien_doi:[]}; P.goiY[c.ma] = {trang:'tu', uv:uv}; }
    else if (uv.length > 1) P.goiY[c.ma] = {trang:'nhieu', uv:uv};
    else if (uv.length === 1) P.goiY[c.ma] = {trang:'trung_nguon', uv:uv, dich:nguonDen[uv[0]]};
    else P.goiY[c.ma] = {trang:'khong', uv:[]};
  });
}
/* ④ mục 2 — tệp là MẪU TRỐNG hệ thống xuất: gán 100 % theo nhan (vẫn chạy L1…L5, vẫn bắt tích L3) */
function ganTheoNhan(P){
  P.gan = {}; P.goiY = {}; P.mauThieu = {};
  P.def.cot_dich.forEach(function(c){
    var h = P.doc.tieuDe.filter(function(x){ return x.base === chuanHoa(c.nhan); })[0];
    if (h){ P.gan[c.ma] = {cot_nguon:[h.key], bien_doi:[]}; P.goiY[c.ma] = {trang:'mau_trong', uv:[h.key]}; }
    else P.goiY[c.ma] = {trang:'khong', uv:[]};
  });
}
function chonSheet(pd, tep, daDung){
  var goi = (pd.ten_sheet_goi_y || []).map(chuanHoa), i;
  for (i = 0; i < tep.sheet.length; i++) if (daDung.indexOf(i) < 0 && goi.indexOf(chuanHoa(tep.sheet[i].ten)) >= 0) return i;
  for (i = 0; i < tep.sheet.length; i++) if (daDung.indexOf(i) < 0) return i;
  return 0;
}
/* sheet nào của tệp mang đúng vân tay của một phần mẫu (theo dòng tiêu đề của mẫu) */
function sheetKhop(tp){
  for (var i = 0; i < S.tep.sheet.length; i++) if (vtBang(docSheet(S.tep.sheet[i], tp.dong_tieu_de).vanTay, tp.van_tay_tieu_de)) return i;
  return -1;
}
function mauKhopVanTay(m){ return m.phan.every(function(tp){ return sheetKhop(tp) >= 0; }); }

function docTep(tep){
  var d = S.duong;
  S.tep = tep; S.thongBao = []; S.mau = null; S.daSua = false; S.l3 = null; S.raLai = null; S.khop = []; S.cach_gan = 'tay';
  var daDung = [];
  S.phan = d.phan.map(function(pd){
    var i = chonSheet(pd, tep, daDung); daDung.push(i);
    var P = {ma_phan:pd.ma_phan, def:pd, sheet:i, dong_tieu_de:dongTieuDeMacDinh(tep.sheet[i]), gan:{}, goiY:{}, mauThieu:{}};
    napPhan(P); return P;
  });
  var soMauTrong = 0;
  S.phan.forEach(function(P){
    var a1 = a1Cua(tep.sheet[P.sheet]);
    if (a1 && a1 === d.mau_dich){ ganTheoNhan(P); P.mauTrong = true; soMauTrong++; return; }
    goiY(P);
    if (a1 && tenMauGoc(a1) === tenMauGoc(d.mau_dich)){
      /* ④ mục 3 (P-1 ✅): số hiệu CŨ ⇒ ⛔ gán 100 %; câu KT-6 + chênh lệch, đi đường ánh xạ thường */
      var co = P.doc.tieuDe.map(function(h){ return h.base; });
      var nhan = P.def.cot_dich.map(function(c){ return chuanHoa(c.nhan); });
      var moi = P.def.cot_dich.filter(function(c){ return co.indexOf(chuanHoa(c.nhan)) < 0; }).map(function(c){ return c.nhan; });
      var bo = P.doc.tieuDe.filter(function(h){ return nhan.indexOf(h.base) < 0; }).map(function(h){ return h.goc; });
      S.thongBao.push({loai:'vang', chu:'Tệp dùng mẫu <code>' + esc(a1) + '</code>, hệ thống đang dùng <code>' + esc(d.mau_dich) + '</code>' +
        (moi.length ? ' — bản mới thêm cột: <b>' + moi.map(esc).join(', ') + '</b>' : '') +
        (bo.length ? ' · cột tệp có mà mẫu mới ⛔ có: <b>' + bo.map(esc).join(', ') + '</b>' : '') +
        '. ⛔ Gán 100 % tự động — đi <b>đường ánh xạ thường</b> (tự gợi ý · bạn chọn).'});
    } else if (/^MAU-/.test(a1)){
      S.thongBao.push({loai:'vang', chu:'Ô A1 mang số hiệu <code>' + esc(a1) + '</code> — đường nhập này là <code>' + esc(d.mau_dich) + '</code>. Đi đường ánh xạ thường.'});
    }
  });
  if (soMauTrong === S.phan.length){
    S.cach_gan = 'tu_dong_mau_trong';
    S.thongBao.push({loai:'luc', chu:'Tệp mang đúng số hiệu <code>' + esc(d.mau_dich) + '</code> (mẫu trống hệ thống xuất) ⇒ <b>gán 100 % tự động theo tên cột</b>. Vẫn phải xem trước và tích ở dưới.'});
    return;
  }
  /* ④ mục 5 — nhận mẫu đã lưu theo vân tay: một ⇒ tự áp (vẫn dừng ở ②) · nhiều ⇒ người chọn */
  var ds = mauCuaDuong(d, truongCua(S.cb));

function thuTuXem(P){

    if (da[c.ma]) return;
    var g = (P.def.cap_de_nham || []).filter(function(gr){ return gr.indexOf(c.ma) >= 0; })[0];
    if (g){
      var tv = ds.filter(function(x){ return g.indexOf(x.ma) >= 0; });
      if (tv.length >= 2){ tv.forEach(function(x, i){ da[x.ma] = 1; out.push({c:x, nhom:tv, dau:i === 0}); }); return; }
    }
    da[c.ma] = 1; out.push({c:c});

}

function chanSiSo(pl){

/* Vẽ TRỌN màn hình xếp lớp: đầu màn · thanh lọc · dải mô tả · lưới · chân trang.

function veManXepLop(c){
 return `${c.dauMan||''}

/* Lưới: hàng đợi bên trái · ô lớp bên phải. Đây là phần DÙNG CHUNG thật sự. */

 const Q=c.hangDoi||[], L=c.lop||[], sua=!!c.choPhepSua;
 const ma=h=>c.maCua?c.maCua(h):h.ma;
 return `<div class="plwrap">

      ${c.veMeta?c.veMeta(h):''}</div>`).join('')
     :`<div class="empty" style="padding:26px">${c.chuHetHangDoi||'Đã phân hết hàng đợi'}</div>`}
    <div class="bal">${c.canDoiHangDoi?c.canDoiHangDoi(Q):''}</div></div>
   <div><div class="lgrid">${L.map(l=>{const nhap=(l.hs||[]).map(m=>c.hsCua(m));
     const dp=c.dongPhu?c.dongPhu(l):'';
     return `<div class="lbox" data-lop="${l.id}"><div class="lbh">${l.id}<span class="spacer" style="flex:1"></span>
       <span class="${c.siSo(l)>l.max?'over-ss':''}" style="font-size:11.5px;font-weight:400">${c.siSo(l)}/${l.max}</span></div>${dp?`
      ${dp}`:''}
      <div class="lbb">${nhap.length?nhap.map(h=>`<div class="si" draggable="true" data-q="${ma(h)}" data-from="${l.id}">
         <span>${h.n}</span><span style="color:var(--ink3);font-size:11px">${h.gt[0]} · ${h.hl}</span>
         ${sua?`<button class="x" data-x="unassign" data-ma="${ma(h)}" data-lop="${l.id}">✕</button>`:''}</div>`).join('')
        :`<div class="drop">${c.chuOTrong||'Kéo học sinh thả vào đây'}</div>`}</div>
      <div class="bal">${c.canDoiLop?c.canDoiLop(nhap):''}</div></div>`}).join('')||`<div class="empty">${c.chuChuaKhaiLop||'Chưa khai lớp của hệ này'}</div>`}</div></div>
  </div>`}

/* Chân trang — chỗ DUY NHẤT hai cửa khác nhau về hành vi.

   của bản CHỐT §4, ⛔ phải chuyện bày biện. */

 /* Có dây ký ⇒ BA chỗ đặt nút theo đúng thứ tự lưu → duyệt → ký (cửa quyết định).

 return k?`<div style="margin-top:13px;display:flex;gap:7px;flex-wrap:wrap;align-items:center">

 :`<div style="margin-top:13px;display:flex;gap:7px;flex-wrap:wrap;align-items:center">

   (cho.length||ngoai.length?'\n   <div class="xlcho">⏳ <b>Đang chờ ghi nhận: '+cho.length+' lượt</b>'+
     (cho.length?' — '+L.filter(l=>xlTrongLop(l.id).length).map(l=>l.id+' ('+xlTrongLop(l.id).length+')').join(' · '):'')+
     '. Thẻ các em vẫn <b>ở lại hàng đợi</b> để xem lại và sửa; danh sách chỉ cập nhật khi bấm <b>✓ Ghi nhận xếp lớp</b>.'+
     (ngoai.length?'<br><span class="st2 w">Còn '+ngoai.length+' lượt đang chờ ở lát cắt khác</span> — nút ghi nhận chỉ ghi lát cắt đang mở, hãy quay lại lát cắt ấy để ghi.':'')+
     '</div>':'')+
   (pick&&pick.ma?'\n   <div class="xlpick">🎯 Đang chọn <b>'+pick.n+'</b> — bấm vào <b>một hộp lớp</b> để xếp, hoặc <b>Esc</b> để bỏ chọn. <i>(lối thay cho kéo thả)</i></div>':''),

  /* 🔴 Khuôn dùng chung đọc danh sách trong hộp lớp từ `l.hs` — một mảng MÃ nằm
     TRÊN bản ghi lớp. `LOP` của M1.7 ⛔ có ô ấy, nên hộp lớp xưa nay LUÔN rỗng:
     kéo một em vào là em mất khỏi hàng đợi mà ⛔ hiện ra ở đâu cả. Đây mới là
     nguyên nhân thật của «kéo vào thì biến mất».
     ⇒ truyền BẢN SAO của bản ghi lớp, đính thêm `hs` = mã các em ĐANG CHỜ ghi.
     Bản sao, ⛔ bản gốc: `l.ss` chỉ được cộng ở bước ghi nhận, ⛔ ở bước kéo. */
  hangDoi:Q, lop:L.map(l=>Object.assign({},l,{hs:xlTrongLop(l.id).map(h=>h.ma)})),
  choPhepSua:xlSuaDuoc(), hsCua:xlOf,
  siSo:l=>l.ss+xlTrongLop(l.id).length,
  tieuDeHangDoi:'Hàng đợi — Khối '+xlKhoi+' · '+xlHe+' — chưa có lớp'+
   (cho.length?' <span class="st2 w">'+cho.length+' chờ ghi</span>':''),
  chuHetHangDoi:'Đã xếp hết hàng đợi của lát cắt này',
  chuChuaKhaiLop:'Chưa khai lớp của hệ này ở M10.1 · Lớp học',
  chuOTrong:xlSuaDuoc()?'Kéo thẻ học sinh thả vào đây':'Chưa có lượt nào chờ ghi nhận',
  /* Thẻ hàng đợi — ba tầng, ⛔ một dãy chữ: ① tên (khuôn vẽ ở .nm) ② dải chip
     nhận dạng ③ dòng mã. Em đang chờ ghi thì thêm tầng ④ nói rõ lớp đích. */
  veMeta:h=>'<div class="mt"><span class="st2 '+(h.ngv==='ts'?'w':'v')+'">'+XL_NGUON[h.ngv][0]+' · '+XL_NGUON[h.ngv][1]+'</span>'+
   '<span class="g'+(h.gt==='Nam'?'m':'f')+'">'+h.gt+'</span><span>Học lực '+h.hl+'</span>'+
   (h.cu?'<span>lớp cũ '+h.cu+'</span>':'')+(h.lo?'<span>'+h.lo+'</span>':'')+(h.dot?'<span>'+h.dot+'</span>':'')+'</div>'+
   '<div class="idl">'+h.ma+(h.md?' · CSDL '+h.md:' · <span class="st2 w">chưa có mã định danh ngành</span>')+'</div>'+
   (h.cho?'<div class="stg">→ đang chờ ghi vào <b>'+h.cho+'</b><span style="flex:1"></span>'+
     (xlSuaDuoc()?'<button class="btn xs" data-x="unassign" data-ma="'+h.ma+'">↺ bỏ</button>':'')+'</div>':'')+
   (xlXepDuoc(h)?'':'<div class="stg lk">⛔ xếp được ở tab này<span style="flex:1"></span>'+
     '<button class="btn xs" data-x="xlsangm14" data-ma="'+h.ma+'">↗ M1.4</button></div>'),
  canDoiHangDoi:Q=>'<span><b>'+Q.filter(h=>!h.cho).length+'</b> chưa xếp</span><span><b>'+Q.filter(h=>h.cho).length+'</b> đang chờ ghi</span>'+
   '<span>Nam '+Q.filter(h=>h.gt==='Nam').length+' · Nữ '+Q.filter(h=>h.gt==='Nữ').length+'</span>'+
   '<span>Học lực TB '+(Q.length?(Q.reduce((a,b)=>a+b.hl,0)/Q.length).toFixed(1):'—')+'</span>',
  dongPhu:l=>{const n=xlTrongLop(l.id).length, con=l.max-l.ss-n;
   return '<div class="lmeta">'+l.ss+' em đang học'+(l.giu?' · +'+l.giu+' giữ chỗ':'')+
    (n?' · <b class="cho">+'+n+' chờ ghi</b>':'')+
    ' · '+(con>0?'còn <b>'+con+'</b> chỗ':'<b class="het">hết chỗ</b>')+
    '<br>GVCN '+(l.gvcn||'— chưa phân —')+'</div>'},
  canDoiLop:nhap=>{if(!nhap.length)return '';
   const nam=nhap.filter(h=>h.gt==='Nam').length;
   return '<span>Chờ ghi: Nam '+nam+' · Nữ '+(nhap.length-nam)+'</span><span>TB '+(nhap.reduce((a,b)=>a+b.hl,0)/nhap.length).toFixed(1)+'</span>'},

  dayKy:null,                                   /* 🛑 cửa GHI NHẬN — M1.7 §7.5.1 */
  nutGhi:xlSuaDuoc()?'<button class="btn p" data-x="xlghi"'+(cho.length?'':' disabled')+'>✓ Ghi nhận '+(cho.length?cho.length+' lượt ':'')+'xếp lớp</button>':'',
  chuChanTrang:'Ghi thẳng, ⛔ có bước duyệt và ⛔ có ký công bố — <b>M1.7 §7.5.1</b>. Vết đủ vì chỉ <b>HT</b> và <b>PHT_ĐT</b> thao tác được.'});
}

/* ---- thao tác ---- */
/* KCNH 28/9/2026 — D4. Tab nay la LAN 2 cua viec dua hoc sinh vao lop (M3.3 §5.7.0).
   Em o NGUON ① da co ket luan len lop o nam lien truoc; bi sot chi la buoc THI HANH,
   quyet dinh thi da co. Nen xep lop o day sinh DUNG LOAI ban ghi ma M3.3 tab ② sinh ra,
   mang dau nguon «xep tay tai M1.7» — de muc ⑥ cua M10.1 dem vao dong Ket chuyen va
   nut 🚀 Bat dau nam hoc chan dung (M3.3 rang buoc 27).
   ⛔ Loai ban ghi thu hai; ⛔ de trong: em co lop ma tien do van bao thieu la ca te nhat.
   Lan nay ⛔ doc trang thai nam NGUON — chay duoc ca khi nam cu da Da ket thuc.
   🆕 6/10/2026: goi o BUOC GHI NHAN, ⛔ o buoc keo — keo roi bo thi ⛔ de lai vet. */
function xlGhiBanGhi(h){
 if(h.ngv!=='kc')return null;
 h.bg={loai:'ket_chuyen',nguon:'xep tay tai M1.7',lopCu:h.cu,lopMoi:h.lop,
   nguoi:R().n.split('—')[0].trim(),ngay:(typeof NGAY3!=='undefined'?NGAY3:'')};
 return h.bg;
}

/* Đặt một em vào hộp lớp — CHỈ là lượt chờ (h.cho), ⛔ ghi gì vào h.lop.
   Luôn render() ở cuối, kể cả lượt bị chặn, để bỏ highlight của thẻ đang chọn. */
function xlGan(ma,lopId){
 const h=xlOf(ma), l=lopOf(lopId);
 if(!h.ma||!l.id){render();return false}
 if(!xlXepDuoc(h)){toast('Em này đến từ đợt tuyển sinh — xếp lớp ở M1.4, nơi có PHT_ĐT duyệt và HT ký công bố');render();return false}
 if(h.cho===lopId){render();return false}                             /* thả lại đúng hộp cũ */
 if(!xlConCho(l)){
  toast('Lớp '+lopId+' đã đủ sĩ số '+l.max+' — không có ngoại lệ ở tab này vì nó không có bước duyệt nào để xin');render();return false}
 const cu=h.cho;
 h.cho=lopId;
 toast(cu?'Chuyển lượt chờ của '+h.n+': '+cu+' → '+lopId+'. Chưa ghi — bấm ✓ Ghi nhận xếp lớp.'
   :'Đang chờ ghi nhận: '+h.n+' → '+lopId+'. Thẻ vẫn ở hàng đợi; danh sách chỉ cập nhật khi bấm ✓ Ghi nhận xếp lớp.');
 render();return true;
}
function xlTraVe(ma){const h=xlOf(ma);if(h.ma)delete h.cho;render()}
function xlGoiY(){
 const Q=xlHangDoi().filter(h=>xlXepDuoc(h)&&!h.cho), L=xlLopCua();
 if(!L.length){toast('Chưa khai lớp của lát cắt này');return}
 if(!Q.length){toast('Không còn em nào chưa xếp trong lát cắt này');return}
 /* cân đối giới tính đơn giản: rải lần lượt vào lớp còn chỗ, ít sĩ số trước */
 let n=0;
 Q.forEach(h=>{const con=L.filter(xlConCho)
   .sort((a,b)=>(a.ss+xlTrongLop(a.id).length)-(b.ss+xlTrongLop(b.id).length));
  if(con.length){h.cho=con[0].id;n++}});
 toast(n?'Gợi ý '+n+' lượt — tất cả đang CHỜ ghi nhận, sửa lại được trước khi bấm ✓ Ghi nhận xếp lớp'
   :'Mọi lớp của lát cắt này đã hết chỗ');
 render();
}

/* ---- cửa duy nhất cho mọi thao tác của tab; app.js chỉ gọi xlAct() ---- */
function xlAct(a,d){
 if(a==='xlauto'){xlGoiY();return true}
 if(a==='xlreset'){xlDangCho().forEach(h=>delete h.cho);xlPick=null;
  toast('Đã bỏ hết lượt đang chờ — chưa có gì được ghi nên không để lại vết');render();return true}
 if(a==='unassign'){xlTraVe(d.ma);return true}
 if(a==='xlsangm14'){toast('Deep-link sang M1.4 §6.8 Phân lớp học sinh mới — em này đến từ một đợt tuyển sinh, xếp lớp cho em ấy có PHT_ĐT duyệt và HT ký công bố');return true}
 /* 2B′ 27/9/2026 — nối THẬT vào bộ nhập dùng chung của cụm MNXL (⛔ còn mô phỏng).
    Đường nhập khai ở app.09-duong-nhap.js; bước ③ đối chiếu ba mức và ④ bảng kết
    quả là hàm CỦA MENU ở tệp đó (luật MX-5). */
 if(a==='xlgan'){if(window.BNX&&BNX.menuM17)BNX.menuM17.mo();else toast('Bộ nhập dùng chung chưa nạp');return true}
 /* 🔑 ĐÂY là chỗ DUY NHẤT h.lop được đặt ở tab này — và cũng là chỗ duy nhất
    sinh bản ghi kết chuyển. Chỉ ghi lát cắt ĐANG MỞ, đúng như nút nói. */
 if(a==='xlghi'){const ds=[];xlLopCua().forEach(l=>xlTrongLop(l.id).forEach(h=>ds.push(h)));
  if(!ds.length){toast('Chưa có lượt nào đang chờ ghi nhận');return true}
  let kc=0;
  ds.forEach(h=>{const l=lopOf(h.cho);h.lop=h.cho;delete h.cho;if(l.id)l.ss++;if(xlGhiBanGhi(h))kc++});
  XLHS=XLHS.filter(h=>!h.lop);
  xlPick=null;
  toast('Đã ghi nhận '+ds.length+' lượt xếp lớp'+(kc?' — sinh '+kc+' bản ghi kết chuyển (dấu nguồn «xếp tay tại M1.7»), mục ⑥ của M10.1 đếm vào dòng Kết chuyển':'')+
   '. Không qua bước duyệt, không có ký công bố (M1.7 §7.5.1); sĩ số lớp cập nhật ngay');
  render();return true}
 return false}

/* ---- kéo thả: khuôn dùng chung chỉ VẼ, mỗi menu tự nối sự kiện (như M1.4) ---- */
let xlDrag=null, xlPick=null;
function bindXL(){
 /* ① Trang phục theo TRẠNG THÁI — làm trước khi nối sự kiện, vì khuôn dùng
       chung ⛔ có móc để gắn lớp CSS vào thẻ .qi (luật GC-6: ⛔ sửa khuôn). */
 document.querySelectorAll('.qi[data-q]').forEach(el=>{
  const h=xlOf(el.dataset.q);
  if(!xlXepDuoc(h)||!xlSuaDuoc()){el.draggable=false;el.classList.add('locked')}
  if(h.cho)el.classList.add('staged');
  if(xlPick===h.ma)el.classList.add('pick')});
 if(xlPick)document.querySelectorAll('.lbox').forEach(b=>{if(xlConCho(lopOf(b.dataset.lop)))b.classList.add('aim')});

 /* ② Kéo: thẻ hàng đợi (.qi) và thẻ trong hộp lớp (.si) đều kéo được. */
 document.querySelectorAll('.qi[draggable="true"],.si[draggable="true"]').forEach(el=>{
  el.addEventListener('dragstart',e=>{xlDrag=el.dataset.q;xlPick=null;el.classList.add('drag');e.dataTransfer.effectAllowed='move'});
  el.addEventListener('dragend',()=>{el.classList.remove('drag');
   document.querySelectorAll('.lbox.over,.qbox.over').forEach(b=>b.classList.remove('over','no'))})});

 /* ③ Hộp lớp: vùng thả + bấm để xếp thẻ đang chọn. Lớp hết chỗ thì viền đỏ
       NGAY LÚC KÉO — nói trước, ⛔ đợi thả rồi mới chặn bằng toast. */
 document.querySelectorAll('.lbox').forEach(box=>{
  const l=lopOf(box.dataset.lop);
  box.addEventListener('dragover',e=>{if(!xlDrag)return;e.preventDefault();
   const day=!xlConCho(l)&&xlOf(xlDrag).cho!==l.id;
   e.dataTransfer.dropEffect=day?'none':'move';
   box.classList.add('over');box.classList.toggle('no',day)});
  box.addEventListener('dragleave',()=>box.classList.remove('over','no'));
  box.addEventListener('drop',e=>{e.preventDefault();box.classList.remove('over','no');
   if(xlDrag)xlGan(xlDrag,box.dataset.lop);xlDrag=null});
  box.addEventListener('click',e=>{if(e.target.closest('button')||!xlPick)return;
   const ma=xlPick;xlPick=null;xlGan(ma,box.dataset.lop)})});

 /* ④ Thả NGƯỢC về hàng đợi — đường ra thứ hai cạnh nút ↺ bỏ. */
 const qb=document.querySelector('.qbox');
 if(qb){
  qb.addEventListener('dragover',e=>{if(!xlDrag||!xlOf(xlDrag).cho)return;e.preventDefault();qb.classList.add('over')});
  qb.addEventListener('dragleave',()=>qb.classList.remove('over'));
  qb.addEventListener('drop',e=>{e.preventDefault();qb.classList.remove('over');
   if(xlDrag&&xlOf(xlDrag).cho)xlTraVe(xlDrag);xlDrag=null})}

 /* ⑤ Bấm thẻ để chọn rồi bấm hộp lớp — lối cho chuột khó kéo và cho màn cảm ứng. */
 document.querySelectorAll('.qi[data-q]').forEach(el=>{
  el.addEventListener('click',e=>{if(e.target.closest('button')||!xlSuaDuoc())return;
   const h=xlOf(el.dataset.q);
   if(!xlXepDuoc(h)){toast('Em này đến từ đợt tuyển sinh — xếp lớp ở M1.4, nơi có PHT_ĐT duyệt và HT ký công bố');return}
   xlPick=(xlPick===h.ma?null:h.ma);render()})});

 const sel=(id,fn)=>{const el=document.querySelector(id);if(el)el.addEventListener('change',e=>{fn(e.target.value);xlPick=null;render()})};
 sel('#xlkhoi',v=>xlKhoi=+v); sel('#xldt',v=>xlDt=v); sel('#xlhe',v=>xlHe=v);

 /* Esc bỏ chọn — nối MỘT LẦN cho cả phiên, vì bindXL() chạy lại sau mỗi render. */
 if(!bindXL.esc){bindXL.esc=1;
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&xlPick){xlPick=null;render()}})}
}

/* 🛑 LỜI GỌI KHỞI ĐỘNG NẰM Ở ĐÂY, ⛔ ở cuối app.js — vì tệp này nạp SAU app.js.
   Để render() ở app.js thì nó chạy lúc XLHS còn chưa khởi tạo. */
render();
</script>
