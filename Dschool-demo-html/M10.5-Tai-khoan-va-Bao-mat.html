<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M10.5 Tài khoản &amp; Bảo mật — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.main{flex:1;padding:12px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:17px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.lk{opacity:.6;cursor:help;background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:8px 0 0;flex-wrap:wrap;align-items:flex-end}
.tab1{padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:6px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 6px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tfil{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:5px;flex-wrap:wrap}

.scope{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:7px 12px;font-size:12px;color:var(--ink2);margin:8px 0 9px;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.inp{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12.5px;background:#fff;min-width:180px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.hrow{display:grid;gap:9px;padding:8px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px;
 grid-template-columns:1.9fr 1.15fr 1.1fr 1.3fr 1.5fr}
.stage.open .hrow{grid-template-columns:1.9fr 1.2fr}
.stage.open .hcol{display:none}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.warn{background:#fffdf5}
.hdrow{display:grid;gap:9px;padding:7px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
 grid-template-columns:1.9fr 1.15fr 1.1fr 1.3fr 1.5fr}
.stage.open .hdrow{grid-template-columns:1.9fr 1.2fr}
.stage.open .hdrow div.hcol{display:none}
.who2{display:flex;gap:9px;align-items:center;min-width:0}
.ava2{width:31px;height:31px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 31px}
.ava2.ph{background:#fce7f3;color:#9d174d}
.who2 .i{min-width:0}
.who2 .i b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who2 .i span{font-size:11px;color:var(--ink3)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}
.st2.gr{background:#f1f5f9;color:#64748b}

.ph2{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph2 .n h2{font-size:15px;font-weight:700}
.ph2 .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pbody{padding:13px 15px;max-height:calc(100vh - 220px);overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:11px;overflow:hidden}
.ch{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.f{display:grid;grid-template-columns:140px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:12.5px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2)}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.rolnk.rd{color:#991b1b;background:var(--red-soft);border-color:#fecaca}
.rolnk.am{color:#92400e;background:var(--amber-soft);border-color:#fde68a}
.sech{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
.blk{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:12.5px}
.blk .ic{flex:0 0 16px;color:var(--ink3)}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:720px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.din{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.ta{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px;min-height:52px;resize:vertical}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:10px}

.pol{display:grid;grid-template-columns:1fr 150px;gap:11px;align-items:center;padding:9px 13px;border-bottom:1px solid var(--line);font-size:13px}
.pol:last-child{border-bottom:none}
.pol .d{font-size:11.5px;color:var(--ink3);margin-top:2px}
.pol input[type=number]{width:78px;border:1px solid var(--line2);border-radius:7px;padding:5px 8px}
.sw{width:42px;height:23px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;flex:0 0 42px}
.sw i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--green)}
.sw.on i{left:21px}
.sw.dis{opacity:.4;cursor:not-allowed}

.rolebar{background:#0f172a;color:#cbd5e1;padding:7px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.noacc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:40px;text-align:center}
.noacc h3{font-size:17px;margin-bottom:9px}
.noacc p{color:var(--ink2);font-size:13px;max-width:560px;margin:0 auto 9px}
/* TKCT-1A (24/9/2026) — tab ① thêm cột «App liên kết» (6 cột); tab ② giữ 5 cột */
.hrow.nsg,.hdrow.nsg{grid-template-columns:1.8fr 1.05fr 1.1fr 1.25fr 1.15fr 1.1fr}
/* TKPH-1A (25/9/2026) — tab ② «Liên kết App phụ huynh»: QR mô phỏng */
.lpqr{display:grid;grid-template-columns:repeat(11,12px);grid-template-rows:repeat(11,12px);border:8px solid #fff;outline:1px solid var(--line)}
.lpqr i{display:block}
.st2+.st2{margin-left:2px}

/* ═══ MNXL-0B — BỘ NHẬP / XUẤT DÙNG CHUNG · style.08-bo-nhap-xuat.css ═══
   🔁 MNXL-Z 26/9/2026 (HDMX bản 2): + .bnx-bao (BNX.bao) · toast #toast và modal #mask.bnx-tren-hop của menu nổi TRÊN hộp.
   🛑 TỆP NỀN (MX-4) — chép NGUYÊN BYTE sang demo khác, đo băm; ⛔ sửa ở bản chép.
   Mọi lớp tiền tố .bnx-; màu tự khai trong .bnx-lop (⛔ dựa biến của menu). */
.bnx-lop{--bnx-nen:#fff;--bnx-mo:#f1f5f9;--bnx-vien:#e2e8f0;--bnx-vien2:#cbd5e1;--bnx-chu:#0f172a;--bnx-chu2:#475569;--bnx-chu3:#94a3b8;
 --bnx-xanh:#1d4ed8;--bnx-xanh-nhat:#eff6ff;--bnx-do:#dc2626;--bnx-do-nhat:#fef2f2;--bnx-vang:#b45309;--bnx-vang-nhat:#fffbeb;
 --bnx-luc:#047857;--bnx-luc-nhat:#ecfdf5;--bnx-tim:#6d28d9;--bnx-tim-nhat:#f5f3ff;
 position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:900;display:none;align-items:flex-start;justify-content:center;
 padding:22px 12px;overflow:auto;font:13px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--bnx-chu)}
.bnx-lop.bnx-mo{display:flex}
.bnx-lop-phu{z-index:910;background:rgba(15,23,42,.35)}
.bnx-lop *{box-sizing:border-box}
.bnx-hop{background:var(--bnx-nen);border-radius:12px;width:min(1180px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100vh - 44px)}
.bnx-hop-nho{width:min(820px,100%)}
.bnx-dau{padding:13px 18px 10px;border-bottom:1px solid var(--bnx-vien);position:relative}
.bnx-tieu-de{font-weight:700;font-size:15px;padding-right:30px}
.bnx-x{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:7px;border:none;background:none;cursor:pointer;font-size:15px;color:var(--bnx-chu2)}
.bnx-x:hover{background:var(--bnx-mo)}
.bnx-than{padding:14px 18px;overflow:auto;flex:1}
.bnx-chan{padding:11px 18px;border-top:1px solid var(--bnx-vien);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bnx-gian{flex:1}
.bnx-mo-ta{font-size:11.5px;color:var(--bnx-chu2)}
.bnx-muc{font-weight:600;margin:14px 0 6px}
.bnx-nut{font:inherit;border:1px solid var(--bnx-vien2);background:#fff;color:var(--bnx-chu);border-radius:7px;padding:6px 12px;cursor:pointer}
.bnx-nut:hover:not([disabled]){background:var(--bnx-mo)}
.bnx-nut[disabled]{opacity:.45;cursor:not-allowed}
.bnx-nut.bnx-chinh{background:var(--bnx-xanh);border-color:var(--bnx-xanh);color:#fff}
.bnx-nut.bnx-chinh:hover:not([disabled]){background:#1e40af}
.bnx-nut.bnx-do{border-color:var(--bnx-do);color:var(--bnx-do)}
.bnx-nut.bnx-nho{padding:2px 8px;font-size:11.5px;border-radius:6px}
.bnx-nut.bnx-bat{background:var(--bnx-xanh-nhat);border-color:var(--bnx-xanh);color:var(--bnx-xanh)}
.bnx-nut-hang{white-space:nowrap}
.bnx-o{font:inherit;font-size:12px;border:1px solid var(--bnx-vien2);border-radius:6px;padding:3px 6px;background:#fff;max-width:230px;margin:1px 0}
.bnx-so-nho{width:58px}
.bnx-bang-doi{display:block;width:210px;height:52px;font-family:Consolas,monospace}
.bnx-them{color:var(--bnx-chu2)}
.bnx-buoc{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.bnx-b{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--bnx-chu3)}
.bnx-b .bnx-so{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--bnx-vien2);font-size:11px;font-weight:600}
.bnx-b.bnx-bat{color:var(--bnx-xanh);font-weight:600}
.bnx-b.bnx-bat .bnx-so{border-color:var(--bnx-xanh);background:var(--bnx-xanh);color:#fff}
.bnx-b.bnx-xong{color:var(--bnx-luc)}
.bnx-b.bnx-xong .bnx-so{border-color:var(--bnx-luc);color:var(--bnx-luc)}
.bnx-noi{width:26px;height:1.5px;background:var(--bnx-vien2)}
.bnx-hop-tin,.bnx-hop-xanh{background:var(--bnx-xanh-nhat);border-left:3px solid var(--bnx-xanh);padding:8px 11px;border-radius:6px;margin:0 0 9px}
.bnx-hop-vang{background:var(--bnx-vang-nhat);border-left:3px solid var(--bnx-vang);padding:8px 11px;border-radius:6px;margin:0 0 9px}
.bnx-hop-loi{background:var(--bnx-do-nhat);border-left:3px solid var(--bnx-do);padding:8px 11px;border-radius:6px;margin:9px 0}
.bnx-hop-loi ul{margin:4px 0 0 18px}
.bnx-hop-luc{background:var(--bnx-luc-nhat);border-left:3px solid var(--bnx-luc);padding:8px 11px;border-radius:6px;margin:9px 0}
.bnx-the{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;white-space:nowrap}
.bnx-the-luc{background:var(--bnx-luc-nhat);color:var(--bnx-luc)}
.bnx-the-vang{background:var(--bnx-vang-nhat);color:var(--bnx-vang)}
.bnx-the-xam{background:var(--bnx-mo);color:var(--bnx-chu2)}
.bnx-the-xanh{background:var(--bnx-xanh-nhat);color:var(--bnx-xanh)}
.bnx-the-tim{background:var(--bnx-tim-nhat);color:var(--bnx-tim)}
.bnx-chu-do{color:var(--bnx-do)}
.bnx-chu-vang{color:var(--bnx-vang)}
.bnx-chu-luc{color:var(--bnx-luc)}
.bnx-tep-ds{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:8px;margin-bottom:10px}
.bnx-tep{display:flex;gap:9px;align-items:flex-start;border:1.5px solid var(--bnx-vien);border-radius:9px;padding:9px 11px;cursor:pointer}
.bnx-tep.bnx-bat{border-color:var(--bnx-xanh);background:var(--bnx-xanh-nhat)}
.bnx-gap{border:1px solid var(--bnx-vien);border-radius:9px;padding:7px 11px;margin:8px 0}
.bnx-gap>summary{cursor:pointer;font-weight:600}
.bnx-loc{display:flex;gap:5px;margin:8px 0;flex-wrap:wrap}
.bnx-thanh-mau{padding:6px 0;font-size:12.5px}
.bnx-phan{border:1px solid var(--bnx-vien);border-radius:9px;padding:9px 11px;margin:10px 0}
.bnx-phan-dau{margin-bottom:7px}
.bnx-bang{border-collapse:collapse;width:100%;font-size:12px;margin:4px 0}

  'Qua chức danh <b>'+esc(co[0])+'</b>, phạm vi <b>'+pv+'</b>'+

function pol(k,ten,mo,kieu,dis){
 const v=POL[k];
 let ctrl;
 if(kieu==='num')ctrl='<input type="number" data-pol="'+k+'" value="'+v+'"'+(polSua()?'':' disabled')+'>';
 else ctrl='<div class="sw'+(v?' on':'')+(dis||!polSua()?' dis':'')+'"'+(dis?'':' data-pol-sw="'+k+'"')+'><i></i></div>';
 return '<div class="pol"><div><b>'+esc(ten)+'</b>'+(dis?' <span class="st2 gr">Ngoài phạm vi MVP</span>':'')+
  (mo?'<div class="d">'+esc(mo)+'</div>':'')+'</div><div style="display:flex;justify-content:flex-end">'+ctrl+'</div></div>'}

      (n.cum || []).forEach(function(cm){ cm.forEach(function(ma){ if (!cd.some(function(c){ return c.ma === ma; })) loi.push('nhom_phai_gan trỏ cột «' + ma + '» không có trong phần'); }); });
    });
    ['sdt', 'ho_ten', 'ngay', 'email'].forEach(function(kk){
      var ds = cd.filter(function(c){ return c.kieu === kk; });
      for (var i = 0; i < ds.length; i++) for (var j = i + 1; j < ds.length; j++){
        var cung = (pd.cap_de_nham || []).some(function(g){ return g.indexOf(ds[i].ma) >= 0 && g.indexOf(ds[j].ma) >= 0; });
        if (!cung) loi.push('«' + ds[i].nhan + '» và «' + ds[j].nhan + '» cùng kiểu ' + kk + ' mà ⛔ chung nhóm cap_de_nham — khai báo thiếu');
      }
    });
  });
  return loi;
};

/* ───────────── kho mẫu ───────────── */
function idMoi(loai){ B.kho.dem[loai]++; return (loai === 'mn' ? 'MN-' : 'MX-') + String(B.kho.dem[loai]).padStart(4, '0'); }
function napCongTy(ds, kho, loai){
  (ds || []).forEach(function(m){
    var id = m[loai === 'mn' ? 'mau_nhap_id' : 'mau_xuat_id'];
    if (kho.some(function(x){ return x[loai === 'mn' ? 'mau_nhap_id' : 'mau_xuat_id'] === id; })) return;
    var b = sao(m); b.nguon = 'cong_ty'; b.trang_thai = b.trang_thai || 'dung'; b.lich_su = b.lich_su || []; b.tao_boi = b.tao_boi || 'Công ty — phát hành kèm bản cập nhật'; b.tao_luc = b.tao_luc || '—';
    kho.push(b);
  });
}
/* ⑨ — mẫu gắn số hiệu mẫu đích CŨ ⇒ «cần rà lại», ⛔ tự áp, ⛔ tự nâng */
/* HDMX bản 2 ② mục 4 — một Feature NHIỀU mẫu đích: mẫu thuộc (ma_feature × tên gốc mẫu đích) */
function cungDuong(m, duong){ return m.duong_nhap.ma_feature === duong.ma_feature && tenMauGoc(m.duong_nhap.mau_dich) === tenMauGoc(duong.mau_dich); }
function raPhienBan(duong){
  B.kho.mauNhap.forEach(function(m){
    if (!cungDuong(m, duong) || m.trang_thai !== 'dung' || m.duong_nhap.mau_dich === duong.mau_dich) return;
    m.lich_su.push({boi:'Hệ thống', luc:bayGio(), thay_doi:'Mẫu đích đổi ' + m.duong_nhap.mau_dich + ' → ' + duong.mau_dich + ' — chuyển «cần rà lại», ⛔ tự áp'});
    m.trang_thai = 'can_ra_lai';
  });
}
function mauCuaDuong(duong, truong){
  return B.kho.mauNhap.filter(function(m){ return cungDuong(m, duong) && (m.nguon === 'cong_ty' || m.truong === truong); });
}

/* ═══════════════ KHUNG HIỂN THỊ (hai lớp: hộp chính · hộp phụ) ═══════════════ */
var LOP = null, PHU = null;
function dungLop(){
  if (LOP) return;
  LOP = document.createElement('div'); LOP.className = 'bnx-lop'; LOP.id = 'bnx-lop';
  LOP.innerHTML = '<div class="bnx-hop" role="dialog" aria-modal="true"><div class="bnx-dau" id="bnx-dau"></div><div class="bnx-than" id="bnx-than"></div><div class="bnx-chan" id="bnx-chan"></div></div>';
  PHU = document.createElement('div'); PHU.className = 'bnx-lop bnx-lop-phu'; PHU.id = 'bnx-phu';
  PHU.innerHTML = '<div class="bnx-hop bnx-hop-nho"><div class="bnx-dau" id="bnx-pdau"></div><div class="bnx-than" id="bnx-pthan"></div><div class="bnx-chan" id="bnx-pchan"></div></div>';
  document.body.appendChild(LOP); document.body.appendChild(PHU);
  [LOP, PHU].forEach(function(el){
    el.addEventListener('click', function(e){
      var t = e.target.closest('[data-bnx]');
      if (!t || !el.contains(t) || t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') return;
      xuLy(t.dataset.bnx, t, e);
    });
    el.addEventListener('change', function(e){
      var t = e.target.closest('[data-bnx]');
      if (!t || !el.contains(t)) return;
      if (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') xuLy(t.dataset.bnx, t, e);
    });
  });
}
/* 🔁 MNXL-Z — hộp bộ máy ⛔ che TOAST / MODAL của menu (quy ước demo: #toast · #mask.on).
   Trong lúc hộp mở: body mang lớp bnx-dang-mo ⇒ #toast nổi trên hộp (style.08); modal của menu MỞ
   SAU khi hộp mở ⇒ gắn bnx-tren-hop, nổi trên hộp; modal đã mở TRƯỚC (vd hộp Import của M4.1) giữ dưới. */
var QS_MASK = null;
function theoDoiMask(){
  var mk = document.getElementById('mask');
  if (!mk || QS_MASK || !window.MutationObserver) return;
  QS_MASK = new MutationObserver(function(){
    var on = mk.classList.contains('on'), mo = LOP && LOP.classList.contains('bnx-mo');
    var tren = mk.classList.contains('bnx-tren-hop');   /* ⛔ ghi lại lớp đã có — tránh vòng lặp của chính trình theo dõi */
    if (on && mo && !mk._bnxTruoc && !tren) mk.classList.add('bnx-tren-hop');
    if (!on){ if (tren) mk.classList.remove('bnx-tren-hop'); mk._bnxTruoc = false; }
  });
  QS_MASK.observe(mk, {attributes:true, attributeFilter:['class']});
}
function mo(){
  dungLop(); theoDoiMask();
  var mk = document.getElementById('mask'); if (mk) mk._bnxTruoc = mk.classList.contains('on');
  LOP.classList.add('bnx-mo'); document.body.classList.add('bnx-dang-mo');
}
B.dong = function(){
  if (LOP){ LOP.classList.remove('bnx-mo'); PHU.classList.remove('bnx-mo'); }
  document.body.classList.remove('bnx-dang-mo');
  var mk = document.getElementById('mask'); if (mk){ mk.classList.remove('bnx-tren-hop'); mk._bnxTruoc = false; }
  B._che = null;
};
/* BNX.bao(chu, loai) — toast NẰM TRÊN hộp bộ máy, cho menu nói một câu khi hộp đang mở (⛔ phải dựng hộp phụ) */
var BAO = null, BAO_T = null;

  BAO.className = 'bnx-bao bnx-bao-' + (loai || 'tin') + ' bnx-mo';
  BAO.innerHTML = chu;
  clearTimeout(BAO_T); BAO_T = setTimeout(function(){ BAO.classList.remove('bnx-mo'); }, 3600);
};
/* hộp phụ dùng chung — menu cũng gọi được (vd nút tạm ở app.09) */

var hanhDongMenu = {};
/* menu đăng ký nút riêng trong hộp phụ: <button data-bnx="menu:ten"> */
B.dangKyNut = function(ten, fn){ hanhDongMenu[ten] = fn; };
function veLai(){
  if (!LOP) return;

function the(loai, chu){ return '<span class="bnx-the bnx-the-' + loai + '">' + chu + '</span>'; }
function nhanTrangThai(m){
  return m.trang_thai === 'dung' ? the('luc', 'Đang dùng') : m.trang_thai === 'can_ra_lai' ? the('vang', 'Cần rà lại') : the('xam', 'Đã ngừng');
}

/* ═══════════════════════════ NHẬP ═══════════════════════════ */
var S = null;
B.moNhap = function(duong, cb){
  cb = cb || {};
  napCongTy(duong.mau_cong_ty, B.kho.mauNhap, 'mn');
  raPhienBan(duong);
  S = {duong:duong, cb:cb, buoc:1, tepChon:null, tep:null, phan:[], thongBao:[], mau:null, daSua:false,
       cach_gan:'tay', l3:null, loc:'dung', moKho:false, raLai:null, khop:[], khaiBao:B.kiemKhaiBao(duong),
       luuTen:'', ketQua3:null, ketQua4:null, hoanTac:null, maLo:null, chup:null};
  if (S.khaiBao.length && window.console) console.warn('[BNX] khai báo đường nhập thiếu:', S.khaiBao);
  B._che = 'nhap'; mo(); veLai();
};
function nguoiDung(cb){ var n = cb && cb.nguoi; return typeof n === 'function' ? n() : (n || 'Người dùng demo'); }
function truongCua(cb){ var t = cb && cb.truong; return typeof t === 'function' ? t() : (t || 'Trường demo'); }
function tenGoc(P, key){ var h = P.doc.tieuDe.filter(function(x){ return x.key === key; })[0]; return h ? h.goc + (key.indexOf('#') > 0 ? ' (' + key.split('#')[1] + ')' : '') : key; }
function napPhan(P){ P.doc = docSheet(S.tep.sheet[P.sheet], P.dong_tieu_de); }

/* ④ — tự gợi ý: khớp ĐÚNG MỘT cột nguồn ⇒ gán; nhiều / không ⇒ để trống, người chọn */
function goiY(P){
  P.gan = {}; P.goiY = {}; P.mauThieu = {};
  var cd = P.def.cot_dich, ungVien = {}, nguonDen = {};
  cd.forEach(function(c){
    var ten = [chuanHoa(c.nhan)].concat((c.ten_goi_y || []).map(chuanHoa));
    ungVien[c.ma] = P.doc.tieuDe.filter(function(h){ return ten.indexOf(h.base) >= 0; }).map(function(h){ return h.key; });
    ungVien[c.ma].forEach(function(k){ (nguonDen[k] = nguonDen[k] || []).push(c.ma); });
  });
  cd.forEach(function(c){
    var uv = ungVien[c.ma];
    if (uv.length === 1 && nguonDen[uv[0]].length === 1){ P.gan[c.ma] = {cot_nguon:[uv[0]], bien_doi:[]}; P.goiY[c.ma] = {trang:'tu', uv:uv}; }
    else if (uv.length > 1) P.goiY[c.ma] = {trang:'nhieu', uv:uv};
    else if (uv.length === 1) P.goiY[c.ma] = {trang:'trung_nguon', uv:uv, dich:nguonDen[uv[0]]};
    else P.goiY[c.ma] = {trang:'khong', uv:[]};
  });
}
/* ④ mục 2 — tệp là MẪU TRỐNG hệ thống xuất: gán 100 % theo nhan (vẫn chạy L1…L5, vẫn bắt tích L3) */
function ganTheoNhan(P){
  P.gan = {}; P.goiY = {}; P.mauThieu = {};
  P.def.cot_dich.forEach(function(c){
    var h = P.doc.tieuDe.filter(function(x){ return x.base === chuanHoa(c.nhan); })[0];
    if (h){ P.gan[c.ma] = {cot_nguon:[h.key], bien_doi:[]}; P.goiY[c.ma] = {trang:'mau_trong', uv:[h.key]}; }
    else P.goiY[c.ma] = {trang:'khong', uv:[]};
  });
}
function chonSheet(pd, tep, daDung){
  var goi = (pd.ten_sheet_goi_y || []).map(chuanHoa), i;
  for (i = 0; i < tep.sheet.length; i++) if (daDung.indexOf(i) < 0 && goi.indexOf(chuanHoa(tep.sheet[i].ten)) >= 0) return i;
  for (i = 0; i < tep.sheet.length; i++) if (daDung.indexOf(i) < 0) return i;
  return 0;
}
/* sheet nào của tệp mang đúng vân tay của một phần mẫu (theo dòng tiêu đề của mẫu) */
function sheetKhop(tp){
  for (var i = 0; i < S.tep.sheet.length; i++) if (vtBang(docSheet(S.tep.sheet[i], tp.dong_tieu_de).vanTay, tp.van_tay_tieu_de)) return i;
  return -1;
}
function mauKhopVanTay(m){ return m.phan.every(function(tp){ return sheetKhop(tp) >= 0; }); }

function docTep(tep){
  var d = S.duong;
  S.tep = tep; S.thongBao = []; S.mau = null; S.daSua = false; S.l3 = null; S.raLai = null; S.khop = []; S.cach_gan = 'tay';
  var daDung = [];
  S.phan = d.phan.map(function(pd){
    var i = chonSheet(pd, tep, daDung); daDung.push(i);
    var P = {ma_phan:pd.ma_phan, def:pd, sheet:i, dong_tieu_de:dongTieuDeMacDinh(tep.sheet[i]), gan:{}, goiY:{}, mauThieu:{}};
    napPhan(P); return P;
  });
  var soMauTrong = 0;
  S.phan.forEach(function(P){
    var a1 = a1Cua(tep.sheet[P.sheet]);
    if (a1 && a1 === d.mau_dich){ ganTheoNhan(P); P.mauTrong = true; soMauTrong++; return; }
    goiY(P);
    if (a1 && tenMauGoc(a1) === tenMauGoc(d.mau_dich)){
      /* ④ mục 3 (P-1 ✅): số hiệu CŨ ⇒ ⛔ gán 100 %; câu KT-6 + chênh lệch, đi đường ánh xạ thường */
      var co = P.doc.tieuDe.map(function(h){ return h.base; });
      var nhan = P.def.cot_dich.map(function(c){ return chuanHoa(c.nhan); });
      var moi = P.def.cot_dich.filter(function(c){ return co.indexOf(chuanHoa(c.nhan)) < 0; }).map(function(c){ return c.nhan; });
      var bo = P.doc.tieuDe.filter(function(h){ return nhan.indexOf(h.base) < 0; }).map(function(h){ return h.goc; });
      S.thongBao.push({loai:'vang', chu:'Tệp dùng mẫu <code>' + esc(a1) + '</code>, hệ thống đang dùng <code>' + esc(d.mau_dich) + '</code>' +
        (moi.length ? ' — bản mới thêm cột: <b>' + moi.map(esc).join(', ') + '</b>' : '') +
        (bo.length ? ' · cột tệp có mà mẫu mới ⛔ có: <b>' + bo.map(esc).join(', ') + '</b>' : '') +
        '. ⛔ Gán 100 % tự động — đi <b>đường ánh xạ thường</b> (tự gợi ý · bạn chọn).'});
    } else if (/^MAU-/.test(a1)){
      S.thongBao.push({loai:'vang', chu:'Ô A1 mang số hiệu <code>' + esc(a1) + '</code> — đường nhập này là <code>' + esc(d.mau_dich) + '</code>. Đi đường ánh xạ thường.'});
    }
  });
  if (soMauTrong === S.phan.length){
    S.cach_gan = 'tu_dong_mau_trong';
    S.thongBao.push({loai:'luc', chu:'Tệp mang đúng số hiệu <code>' + esc(d.mau_dich) + '</code> (mẫu trống hệ thống xuất) ⇒ <b>gán 100 % tự động theo tên cột</b>. Vẫn phải xem trước và tích ở dưới.'});
    return;
  }
  /* ④ mục 5 — nhận mẫu đã lưu theo vân tay: một ⇒ tự áp (vẫn dừng ở ②) · nhiều ⇒ người chọn */
  var ds = mauCuaDuong(d, truongCua(S.cb));
  S.khop = ds.filter(function(m){ return m.trang_thai === 'dung' && m.duong_nhap.mau_dich === d.mau_dich && mauKhopVanTay(m); });
  ds.filter(function(m){ return m.trang_thai === 'can_ra_lai' && mauKhopVanTay(m); }).forEach(function(m){
    S.thongBao.push({loai:'vang', chu:'Mẫu <b>«' + esc(m.ten) + '»</b> khớp vân tay tệp nhưng đang <b>cần rà lại</b> (gắn <code>' + esc(m.duong_nhap.mau_dich) + '</code>) — ⛔ tự áp. ' +
      (m.nguon === 'truong' ? '<button class="bnx-nut bnx-nho" data-bnx="ra-lai" data-bnx-id="' + m.mau_nhap_id + '">Rà lại mẫu này</button>' : 'Mẫu công ty chờ bản cập nhật sau — có thể <button class="bnx-nut bnx-nho" data-bnx="nhan-ban" data-bnx-id="' + m.mau_nhap_id + '">Nhân bản thành mẫu của trường</button> rồi rà lại bản nhân bản.')});
  });
  if (S.khop.length === 1){
    apMau(S.khop[0]);
    S.thongBao.push({loai:'xanh', chu:'Tệp cùng khuôn với mẫu <b>«' + esc(S.khop[0].ten) + '»</b> ⇒ <b>đã tự áp mẫu</b>. Máy vẫn dừng ở bước ② — xem trước và tích mới sang được ③.'});
  } else if (S.khop.length > 1){
    S.thongBao.push({loai:'vang', chu:'Tệp khớp <b>' + S.khop.length + ' mẫu</b> — ⛔ tự chọn. Bạn chọn một: ' +
      S.khop.map(function(m){ return '<button class="bnx-nut bnx-nho" data-bnx="ap-mau" data-bnx-id="' + m.mau_nhap_id + '">' + esc(m.ten) + ' · ' + (m.nguon === 'cong_ty' ? 'công ty' : 'trường') + '</button>'; }).join(' ')});
  }
}
function apMau(m){
  S.mau = m; S.daSua = false; S.cach_gan = 'ap_mau'; S.l3 = null;
  m.phan.forEach(function(tp){
    var P = S.phan.filter(function(p){ return p.ma_phan === tp.ma_phan; })[0]; if (!P) return;
    var i = sheetKhop(tp); if (i >= 0) P.sheet = i;
    P.dong_tieu_de = tp.dong_tieu_de; napPhan(P);
    P.gan = {}; P.goiY = {}; P.mauThieu = {}; P.mauTrong = false;
    P.def.cot_dich.forEach(function(c){ P.goiY[c.ma] = {trang:'mau_khong', uv:[]}; });
    var keys = P.doc.tieuDe.map(function(h){ return h.key; });
    tp.cot.forEach(function(c){
      var co = c.cot_nguon.filter(function(k){ return keys.indexOf(k) >= 0; });
      var thieu = c.cot_nguon.filter(function(k){ return keys.indexOf(k) < 0; });
      if (thieu.length) P.mauThieu[c.cot_dich] = thieu;
      /* cột nguồn mẫu cần mà tệp không có ⇒ ô gán TRỐNG, ⛔ đoán (④ mục 5) */
      if (co.length || laHang(c)) P.gan[c.cot_dich] = {cot_nguon:co, bien_doi:sao(c.bien_doi)};
      P.goiY[c.cot_dich] = {trang:'mau', uv:co};
    });
  });
}
function suaGan(){ S.l3 = null; if (S.mau) S.daSua = true; if (S.cach_gan === 'tu_dong_mau_trong') S.cach_gan = 'tay'; }

/* ───────────── tính toàn bộ bước ② (L1 · L2 · chặn · cột thừa · giá trị lạ) ───────────── */
function tinhPhan(P){
  var pd = P.def, d = S.duong, kq = {dong:[], l2:[], thieuBB:[], thieuPG:[], thieuNhom:[], dacBiet:{}, cotThua:[], la:{}, hangLoi:[], trungNguon:[], gopThieu:[], goiYNgay:{}};
  var dung = {};
  pd.cot_dich.forEach(function(c){
    var g = P.gan[c.ma]; if (!g) return;
    g.cot_nguon.forEach(function(k){ (dung[k] = dung[k] || []).push({c:c, truc:!(g.bien_doi || []).length}); });
  });
  kq.cotThua = P.doc.tieuDe.filter(function(h){ return !dung[h.key]; }).map(function(h){ return tenGoc(P, h.key); });
  Object.keys(dung).forEach(function(k){
    var tr = dung[k].filter(function(x){ return x.truc; });
    if (tr.length >= 2) kq.trungNguon.push({nguon:tenGoc(P, k), dich:tr.map(function(x){ return x.c.nhan; })});
  });
  P.doc.dong.forEach(function(dg){
    var gt = {}, loi = [];
    pd.cot_dich.forEach(function(c){
      var g = P.gan[c.ma];
      var r = g ? chay(g, dg.o, function(la){ var m = kq.la[c.ma] = kq.la[c.ma] || {}; m[la] = (m[la] || 0) + 1; }) : {v:'', goc:''};
      gt[c.ma] = r.v;
      if (laDacBiet(c, r.v)){ var db = kq.dacBiet[c.ma] = kq.dacBiet[c.ma] || {}; var tv = String(r.v).trim(); db[tv] = (db[tv] || 0) + 1; }
      var e = r.loi || kiemL1(c, r.v, d, P.gan);
      if (e) loi.push({cot_dich:c.ma, nhan:c.nhan, gia_tri_goc:r.goc, loi:e});
    });
    kq.dong.push({so_dong:dg.so_dong, gia_tri:gt, loi_l1:loi});
  });
  pd.cot_dich.forEach(function(c){

  const ly=$('#tkLy').value.trim();

  const r=tkO(hs);r.truoc=r.tt;r.tt='dang_khoa';r.khoa={ly:ly,boi:tkAi(),luc:d2s(HOMNAY)};
  tkGhi(hs,'khoa_hs','lý do: '+ly);closeModal();render();
  toast('Đã khóa · phiên của em đóng ngay · em thấy câu cố định, ⛔ không thấy lý do');return 1}

 if(x==='tkMoKhoa'){
  if(!tkCoKhoa()){toast('🔒 Chỉ Quản trị hệ thống và Hiệu trưởng');return 1}
  modal('🔓 Mở khóa — '+esc(h.ten),
   '<div class="info">Trạng thái về <b>'+(TKTT[(tkO(hs).truoc||'cho_doi_mk')]||TKTT.cho_doi_mk)[0]+'</b> '+
   '<i>(trạng thái trước khi khóa)</i>.</div>'+
   '<label class="lbl">Lý do <b>*</b></label><textarea class="ta" id="tkLy"></textarea>',
   '<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="tkMoKhoaOk" data-hs="'+hs+'">🔓 Mở khóa</button>');
  return 1}

 if(x==='tkMoKhoaOk'){
  const ly=$('#tkLy').value.trim();
  if(!ly){toast('⛔ <b>Lý do bắt buộc</b> khi mở khóa');return 1}
  const r=tkO(hs);r.tt=r.truoc||'cho_doi_mk';delete r.truoc;delete r.khoa;
  tkGhi(hs,'mo_khoa_hs','lý do: '+ly);closeModal();render();toast('Đã mở khóa');return 1}

 if(x==='tkInPhieu'){
  if(!tkCoIn()){toast('🔒 Vai này ⛔ xuất được');return 1}
  const lops=lpPhamVi().filter(o=>o.tt==='hoc'&&tkBat(o)).map(o=>o.lop).filter((v,i,s)=>s.indexOf(v)===i).sort();
  if(!lops.length){toast('⛔ Không lớp nào thuộc cấp học đã bật');return 1}
  modal('🖨 In phiếu tài khoản theo lớp',
   '<label class="lbl">Mục đích <b>*</b></label><select class="din" id="tkMD"><option value="">— chọn mục đích —</option>'+
   '<option>Phát tài khoản đầu năm</option><option>Phát lại cho em quên mật khẩu</option>'+
   '<option>Chuẩn bị buổi làm bài trên phòng máy</option></select>'+
   '<label class="lbl">Lớp</label><select class="din" id="tkLopIn">'+lops.map(l=>'<option'+(l==='9A2'?' selected':'')+'>'+l+'</option>').join('')+'</select>'+
   '<label style="display:flex;gap:7px;align-items:center;margin-top:9px;font-weight:700">'+
   '<input type="checkbox" id="tkCaDaDoi"> In cả những em đã đổi mật khẩu <i>(sẽ CẤP LẠI cho họ)</i></label>'+
   '<div class="ro" style="margin-top:10px;line-height:1.7">🛑 Là <b>xuất dữ liệu trẻ em</b> ⇒ <b>bắt chọn mục đích + ghi nhật ký</b> '+
   '<i>(Luật BVDLCN 91/2025)</i>. Máy <b>bỏ qua</b> em đã <b>Đang dùng</b> nếu không tích ô trên.</div>',
   '<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="tkInOk">🖨 In phiếu</button>');
  return 1}

 if(x==='tkInOk'){
  const md=$('#tkMD').value, lop=$('#tkLopIn').value, caDaDoi=$('#tkCaDaDoi').checked;
  if(!md){toast('⛔ <b>Bắt buộc chọn mục đích</b> — xuất dữ liệu trẻ em');return 1}
  const ds=lpPhamVi().filter(o=>o.lop===lop&&o.tt==='hoc'&&tkBat(o)), ok=[], bo=[];
  ds.forEach(function(o){const t=tkTt(o);
   if(t==='dang_khoa'){bo.push([o,'tài khoản đang khóa — mở khóa trước']);return}
   if(t==='dang_dung'&&!caDaDoi){bo.push([o,'đã đổi mật khẩu, đang dùng — ⛔ in lại để tránh cấp lại oan']);return}
   const r=tkO(o.id);r.tt='cho_doi_mk';r.dn='';ok.push([o,tkMkTam()])});
  tkGhi('—','xuat_phieu_hs','mục đích: '+md+' · lớp '+lop+' · '+ok.length+' em'+(caDaDoi?' · có cấp lại cho em đã đổi':''));
  modal('🖨 Phiếu tài khoản — lớp '+lop,
   '<div class="okbox">Mục đích: <b>'+esc(md)+'</b> · đã <b>ghi nhật ký</b> <i>(loại <code>xuat_phieu_hs</code>)</i></div>'+
   (ok.length?'<div class="sech">✅ Dải cắt — '+ok.length+' phiếu</div><table><tr><th>Họ tên</th><th>Mã học sinh</th><th>Mật khẩu tạm</th></tr>'+
     ok.map(r=>'<tr><td>'+esc(r[0].ten)+'</td><td class="mono">'+r[0].ma+'</td><td class="mono"><b>'+r[1]+'</b></td></tr>').join('')+'</table>':'')+
   (bo.length?'<div class="sech">⏭ Bỏ qua kèm lý do</div><table class="lpbo"><tr><th>Học sinh</th><th>Lý do</th></tr>'+
     bo.map(r=>'<tr><td>'+esc(r[0].ten)+'</td><td>'+r[1]+'</td></tr>').join('')+'</table>':'')+
   '<div class="ro" style="margin-top:10px">Phiếu cắt theo lớp — <b>họ tên · mã học sinh · mật khẩu tạm</b>. '+
   'Giáo viên chủ nhiệm <b>phát tay</b>; ở M2.9 T1 họ ⛔ <b>không có nút in</b> <i>(T1 cố ý không cấp bit XD)</i>.</div>',
   '<button class="btn p" data-x="close">Đóng</button>');
  render();return 1}

 return 0}
</script>
