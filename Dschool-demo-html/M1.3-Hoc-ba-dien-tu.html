<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1.3 Học bạ điện tử — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
mark{background:#fef08a;padding:0 1px;border-radius:2px}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:12px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:var(--bg);color:var(--ink2)}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:206px;flex:0 0 206px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;overflow-x:auto}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:260px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap;align-items:center}
.sum b{color:var(--ink)}
.chip{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12.5px;background:#fff;white-space:nowrap}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700}
.scopebar{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;padding:8px 12px;border-radius:9px;font-size:12.5px;margin-bottom:11px;display:flex;gap:8px;align-items:flex-start}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage.open .listw{flex:1 1 0;max-width:none}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;cursor:pointer}
.grow:hover{background:#eef2f7}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.lrow{display:grid;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;
 grid-template-columns:24px 1.7fr .5fr repeat(4,1fr) 1.2fr;font-size:12.5px;background:#fcfdfe;border-left:3px solid transparent}
.lrow:hover{background:var(--brand-soft)}
.lrow.on{background:#eff6ff;border-left-color:var(--brand)}
.lrow .nm{font-weight:700}
.stage.open .lrow{grid-template-columns:24px 1.7fr 1.2fr}
.stage.open .lcol{display:none}
.ldrow{display:grid;gap:9px;padding:8px 13px;background:#f1f5f9;border-bottom:1px solid var(--line);font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
 grid-template-columns:24px 1.7fr .5fr repeat(4,1fr) 1.2fr}
.stage.open .ldrow{grid-template-columns:24px 1.7fr 1.2fr}
.stage.open .ldrow div{display:none}
.stage.open .ldrow div.kc{display:block}
.srow{display:grid;gap:9px;padding:7px 13px 7px 46px;border-bottom:1px solid #f1f5f9;align-items:center;font-size:12.5px;
 grid-template-columns:2fr 1.2fr 1.6fr .6fr;cursor:pointer}
.srow:hover{background:var(--brand-soft)}
.stage.open .srow{grid-template-columns:2fr 1.6fr}
.stage.open .srow .scol{display:none}

.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px;
 grid-template-columns:2fr 1fr 1.5fr 1.4fr}
.stage.open .hrow{grid-template-columns:2fr 1.4fr}
.stage.open .hcol{display:none}
.stage.open .hcol.keep{display:block}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.sub{padding-left:40px}
.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
 grid-template-columns:2fr 1fr 1.5fr 1.4fr}
.stage.open .hdrow{grid-template-columns:2fr 1.4fr}
.stage.open .hdrow div{display:none}
.stage.open .hdrow div.kc{display:block}
.who2{display:flex;gap:9px;align-items:center;min-width:0}
.ava2{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.who2 .i{min-width:0}
.who2 .i b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who2 .i span{font-size:11px;color:var(--ink3)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:8px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.wrapx{overflow-x:auto}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}
.tier{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;white-space:nowrap}
.tier .dotx{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.dotx.ok{background:var(--green)}.dotx.no{background:var(--line2)}.dotx.part{background:var(--amber)}
.mine{background:#eef2ff;outline:1.5px solid var(--brand);border-radius:6px;padding:2px 5px}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph h2{font-size:16px;font-weight:700}
.ph .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pbody{padding:14px 15px;max-height:calc(100vh - 230px);overflow-y:auto}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:10px 13px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.ok{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap;margin-left:5px}

.hb{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:13px}
.hbh{padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.hbh .sp{flex:1}
.f2{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:7px 12px;font-size:12.5px}
.f2+.f2{border-top:1px solid #f1f5f9}
.f2 .k{color:var(--ink2)}
.f2 .v{font-weight:600}
.ct{font-size:11px;color:var(--ink3);font-family:ui-monospace,monospace;background:var(--bg);padding:2px 6px;border-radius:5px;display:inline-block;margin-top:3px}
.sigs{display:flex;flex-direction:column;gap:6px}
.sig{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border-radius:8px;background:var(--bg);font-size:12px}
.sig.done{background:var(--green-soft)}
.sig.skip{background:var(--amber-soft)}
.sig.void{background:var(--red-soft)}
.sig .t{font-weight:700;flex:0 0 96px}
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:16px}
.tli{position:relative;padding:9px 0}
.tli::before{content:"";position:absolute;left:-22px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.tli.tk::before{background:var(--ink3)}.tli.cho::before{background:var(--amber)}
.tli.dc::before{background:var(--violet)}.tli.doi::before{background:var(--amber)}
.yr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.yr b{font-size:13.5px}
.wk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;background:#fff}
.wk:hover{border-color:var(--brand);background:var(--brand-soft)}
.wk.on{border-color:var(--brand);background:#eff6ff}
.wk .ic{font-size:19px;flex:0 0 26px}
.wk .bd{flex:1;min-width:0}
.wk .bd b{display:block;font-size:13.5px}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:900px;max-width:95vw;max-height:88vh;display:flex;flex-direction:column}
.modal.sm{width:620px}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:36px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.noacc{padding:50px 30px;text-align:center}
.noacc .ic{font-size:38px;margin-bottom:12px}

/* ===== v2.1 — phan loai mon hoc (9/9/2026) ===== */
.secth{font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin:0 0 7px}
.sub{color:var(--ink3);font-size:11px}
.quote{padding:10px 12px;font-size:12.5px;line-height:1.75}
.csx{color:#b45309;font-weight:800;cursor:help}
.gdptbar{padding:8px 12px;background:var(--brand-soft);border-bottom:1px solid var(--line);
 font-size:11.5px;line-height:1.6;color:var(--ink2)}
.hb.truong{border-color:#c4b5fd}
.hb.truong>.hbh{background:#f5f3ff;color:#5b21b6}
.trbar{padding:8px 12px;background:#faf5ff;border-bottom:1px solid #e9d5ff;font-size:11.5px;line-height:1.6;color:#5b21b6}

/* ═══ MNXL-0B — BỘ NHẬP / XUẤT DÙNG CHUNG · style.08-bo-nhap-xuat.css ═══
   🔁 MNXL-Z 26/9/2026 (HDMX bản 2): + .bnx-bao (BNX.bao) · toast #toast và modal #mask.bnx-tren-hop của menu nổi TRÊN hộp.
   🛑 TỆP NỀN (MX-4) — chép NGUYÊN BYTE sang demo khác, đo băm; ⛔ sửa ở bản chép.
   Mọi lớp tiền tố .bnx-; màu tự khai trong .bnx-lop (⛔ dựa biến của menu). */
.bnx-lop{--bnx-nen:#fff;--bnx-mo:#f1f5f9;--bnx-vien:#e2e8f0;--bnx-vien2:#cbd5e1;--bnx-chu:#0f172a;--bnx-chu2:#475569;--bnx-chu3:#94a3b8;
 --bnx-xanh:#1d4ed8;--bnx-xanh-nhat:#eff6ff;--bnx-do:#dc2626;--bnx-do-nhat:#fef2f2;--bnx-vang:#b45309;--bnx-vang-nhat:#fffbeb;
 --bnx-luc:#047857;--bnx-luc-nhat:#ecfdf5;--bnx-tim:#6d28d9;--bnx-tim-nhat:#f5f3ff;
 position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:900;display:none;align-items:flex-start;justify-content:center;
 padding:22px 12px;overflow:auto;font:13px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--bnx-chu)}
.bnx-lop.bnx-mo{display:flex}
.bnx-lop-phu{z-index:910;background:rgba(15,23,42,.35)}
.bnx-lop *{box-sizing:border-box}
.bnx-hop{background:var(--bnx-nen);border-radius:12px;width:min(1180px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100vh - 44px)}
.bnx-hop-nho{width:min(820px,100%)}
.bnx-dau{padding:13px 18px 10px;border-bottom:1px solid var(--bnx-vien);position:relative}
.bnx-tieu-de{font-weight:700;font-size:15px;padding-right:30px}
.bnx-x{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:7px;border:none;background:none;cursor:pointer;font-size:15px;color:var(--bnx-chu2)}
.bnx-x:hover{background:var(--bnx-mo)}
.bnx-than{padding:14px 18px;overflow:auto;flex:1}
.bnx-chan{padding:11px 18px;border-top:1px solid var(--bnx-vien);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bnx-gian{flex:1}
.bnx-mo-ta{font-size:11.5px;color:var(--bnx-chu2)}
.bnx-muc{font-weight:600;margin:14px 0 6px}
.bnx-nut{font:inherit;border:1px solid var(--bnx-vien2);background:#fff;color:var(--bnx-chu);border-radius:7px;padding:6px 12px;cursor:pointer}
.bnx-nut:hover:not([disabled]){background:var(--bnx-mo)}
.bnx-nut[disabled]{opacity:.45;cursor:not-allowed}
.bnx-nut.bnx-chinh{background:var(--bnx-xanh);border-color:var(--bnx-xanh);color:#fff}
.bnx-nut.bnx-chinh:hover:not([disabled]){background:#1e40af}
.bnx-nut.bnx-do{border-color:var(--bnx-do);color:var(--bnx-do)}
.bnx-nut.bnx-nho{padding:2px 8px;font-size:11.5px;border-radius:6px}
.bnx-nut.bnx-bat{background:var(--bnx-xanh-nhat);border-color:var(--bnx-xanh);color:var(--bnx-xanh)}
.bnx-nut-hang{white-space:nowrap}
.bnx-o{font:inherit;font-size:12px;border:1px solid var(--bnx-vien2);border-radius:6px;padding:3px 6px;background:#fff;max-width:230px;margin:1px 0}
.bnx-so-nho{width:58px}
.bnx-bang-doi{display:block;width:210px;height:52px;font-family:Consolas,monospace}
.bnx-them{color:var(--bnx-chu2)}
.bnx-buoc{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.bnx-b{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--bnx-chu3)}
.bnx-b .bnx-so{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--bnx-vien2);font-size:11px;font-weight:600}
.bnx-b.bnx-bat{color:var(--bnx-xanh);font-weight:600}
.bnx-b.bnx-bat .bnx-so{border-color:var(--bnx-xanh);background:var(--bnx-xanh);color:#fff}
.bnx-b.bnx-xong{color:var(--bnx-luc)}
.bnx-b.bnx-xong .bnx-so{border-color:var(--bnx-luc);color:var(--bnx-luc)}
.bnx-noi{width:26px;height:1.5px;background:var(--bnx-vien2)}
.bnx-hop-tin,.bnx-hop-xanh{background:var(--bnx-xanh-nhat);border-left:3px solid var(--bnx-xanh);padding:8px 11px;border-radius:6px;margin:0 0 9px}

/* ===== PHAN LOAI MON — doc tu M10.2 (D1: M10.2 la menu chu, M1.3 CHI DOC) =====
   MOT truong that:  Nguon chuong trinh = CT GDPT | Cua truong  -> quyet dinh HOC BA
   MOT nhan dan xuat: ★ mon chuyen  (mon == he.Mon chuyen cua he) -> KHONG dung toi hoc ba
   M1.3 doc DUY NHAT "Nguon chuong trinh". Loc hoc ba theo nhan ★
   = xoa mon Toan khoi hoc ba cua hoc sinh chuyen Toan. */
/* Mon chuyen cua he — M10.2 §5.5, Master, 0..1. Doc tu he dao tao cua lop. */
const MONCHUYEN={'Chuyên Toán':'Toán','Chuyên Tin':'Tin học','Chuyên Văn':'Ngữ văn'};
const lopOf=id=>LOP.find(x=>x.id===id)||{};
const monTruong=id=>lopOf(id).mtr||[];
/* Nhan ★ mon chuyen — DAN XUAT (M10.2 R27), khong co o nhap, khong luu o M1.3.
   Ban dau tep quyet dinh co truong "Muc noi dung" khai tay; da bo 9/9/2026
   (_phan-loai-mon-hoc-he-chuyen.md §3.2b) vi khong hanh vi nao can toi no. */
const laCS=(id,mon)=>MONCHUYEN[lopOf(id).he]===mon;
const dtrOf=h=>h.dtr||{};

/* ═══ GDDP-2B §3.1b — PHEP DEM TANG 1: dem CHU KY, khong dem MON ═══
   monCTcua(lop)  — cac mon CT GDPT cua lop, doc tu bang diem cua hoc sinh dau tien (mon `Cua truong` o `dtr`, khong vao day)
   ckCan(lop)     — MOI CHU KY CAN CO: mot dong cho moi (mon, phan) da co nguoi phu trach
   🛑 Mon mot phan ⇒ dung MOT dong, ten phan = ten mon ⇒ 1/1 y het truoc v2.4 (ca PC1). */
const capOf = lop => (lopOf(lop).cap) || (parseInt(lop, 10) >= 10 ? 'THPT' : 'THCS');
/* lop chua co hoc ba nao trong bo mau (7A3) van phai dem duoc — lay khung mon CT GDPT theo CAP */
const MONKHUNG={THCS:['Toán','Ngữ văn','Tiếng Anh','Khoa học tự nhiên','Lịch sử và Địa lí','GDCD','Tin học','Công nghệ','GDTC','Nghệ thuật'],
 THPT:['Toán','Ngữ văn','Tiếng Anh','Lịch sử','Vật lí','Hóa học','Sinh học','Tin học','GDKT&PL','GDTC']};
function monCTcua(lop){
 const h=HB.find(x=>x.lop===lop&&!x.roi)||HB.find(x=>x.lop===lop);
 if(h) return Object.keys(h.diem);
 return MONKHUNG[capOf(lop)]||MONKHUNG.THCS;
}
function ckCan(lop){
 const out=[];
 monCTcua(lop).forEach(mon=>phanCua(mon).forEach(ph=>{
  const gv=gvPhan(lop,mon,ph); if(gv) out.push({mon,phan:ph,gv,nhieu:nhieuPhan(mon)})}));
 return out;
}
const ckKey=z=>z.mon+'|'+z.phan;
const ckThieu=l=>ckCan(l.id).filter(z=>!((CK[l.id]||{})[ckKey(z)]));
/* gieo CK tu `thieuCK` cua tung lop: moi chu ky can co deu DA KY, tru nhung dong liet ke o `thieuCK` */
LOP.forEach(l=>{
 const mat=(l.thieuCK||[]).map(a=>a[0]+'|'+a[1]);
 CK[l.id]={}; ckCan(l.id).forEach(z=>{if(!mat.includes(ckKey(z))) CK[l.id][ckKey(z)]=1});
 /* t1 la DAN XUAT — giu ten truong cu de phan con lai cua man hinh khong phai viet lai */
 Object.defineProperty(l,'t1',{get(){const can=ckCan(l.id),thieu=ckThieu(l);
  return {ky:can.length-thieu.length,tong:can.length,mon:monCTcua(l.id).length,thieu}}});
});
const thieuTr=id=>{const hs=HB.filter(h=>h.lop===id&&!h.roi);
 return monTruong(id).map(m=>({m,co:hs.filter(h=>dtrOf(h)[m]!=null).length,tong:hs.length}))};
const canhBaoTr=id=>{const T=thieuTr(id); if(!T.length)return '';
 const ke=T.filter(t=>t.co<t.tong);
 return `<div class="warn"><b>⚠ Lớp ${id} có ${T.length} môn không thuộc Chương trình GDPT</b>
   ${T.map(t=>`<div style="margin-top:4px">• <b>${t.m}</b> — ${t.co}/${t.tong} em đã có điểm${t.co<t.tong?` <span style="color:var(--red)">⚠ còn ${t.tong-t.co} em trống</span>`:''}</div>`).join('')}
   <div style="margin-top:7px;font-size:11.5px">Các môn này <b>KHÔNG in vào học bạ số</b> — cấu trúc trường dữ liệu do Bộ quy định
    (<b>TT 70/2026</b> Điều 6). Điểm nằm ở <b>Phiếu kết quả môn học của nhà trường</b>, xuất riêng ở F6, <b>không ký cùng học bạ</b>.
    ${ke.length?'Phiếu in lúc này sẽ mang dấu <b>BẢN CHƯA ĐẦY ĐỦ</b>.':''}</div>
   <div style="margin-top:7px"><button class="btn xs" data-x="canccu">📖 Căn cứ</button>
    <button class="btn xs" data-x="phieu" data-lop="${id}">🖨 Phiếu kết quả môn của trường</button>
    <span class="rolnk" data-go="M10.2?tab=danh_muc_mon&return=M1.3">🔗 → M10.2 Danh mục môn</span></div></div>`};

function tierState(l,t){
 /* GDDP-2B §3.1b b — man hinh NOI RA ca hai con so, khong de nguoi dung tu hoi vi sao mau so lech so mon */
 if(t===1)return l.t1.ky===l.t1.tong?['ok','✓ đủ '+l.t1.tong+' chữ ký · '+l.t1.mon+' môn']:['part',l.t1.ky+'/'+l.t1.tong+' chữ ký'];
 const x=l['t'+t];
 return x.ok?[x.boqua?'part':'ok',x.boqua?'✓ chưa ký số':'✓ '+x.ngay]:['no','Chưa']}
const dukien=l=>l.t1.ky===l.t1.tong&&l.t2.ok;
/* tang con thieu = tang THAP NHAT chua xong, ke ca tang 1 */
const tangKe=l=>l.t1.ky<l.t1.tong?1:!l.t2.ok?2:!l.t3.ok?3:!l.t4.ok?4:0;
const lopTT=l=>{const k=tangKe(l);
 return k===0?['Hoàn tất','o']:k===4?['Chờ HT ký chốt','w']:k===3?['Chờ PHT duyệt','w']
  :k===2?['Chờ GVCN ký','n']:['Chờ GVBM ký '+(l.t1.tong-l.t1.ky)+' chữ ký','n']};
/* dong phu neu DICH DANH phan con thieu — N <= 3 liet ke du, hon thi rut gon; panel §6.2.3 co danh sach day du */
function thieuTom(l){
 const t=l.t1.thieu; if(!t.length) return '';
 const ten=z=>z.nhieu?z.mon+' · phần '+z.phan:z.mon;
 return t.length<=3?t.map(ten).join(' · '):t.slice(0,3).map(ten).join(' · ')+' … và '+(t.length-3)+' chữ ký khác';
}
const toiKyLop=l=>!!kyCua(l)&&tangKe(l)===kyCua(l)&&dukien(l);

function viec(){
 const out=[], L=scopeLop();
 L.filter(toiKyLop).forEach(l=>out.push({k:'phien',l}));
 LE.filter(x=>(R().ky===34?[3,4].includes(x.tang):x.tang===kyCua())&&L.some(l=>l.id===x.lop)).forEach(x=>out.push({k:'le',x}));
 DC.forEach(d=>{
  if(R().sc!=='school'&&d.dt!==R().dt)return;
  if(d.tt==='cho_duyet'&&R().duyetDC)out.push({k:'dc',d});
  if(d.tt==='cho_ky'&&R().kyDC)out.push({k:'dc',d})});
 return out}

function sidebar(){
 const a=R().menu,full=a==='all',nv=R().chan?0:viec().length;
 $('#side').innerHTML=NAV.map(([id,n,items])=>{const on=full||id===''||a.includes(id);
  return `<div class="sgrp">${n}</div>`+items.map(it=>{const cu=it[0]==='M1.3';
   return `<div class="snav ${cu&&!R().chan?'on':''} ${on?'':'off'}"><span style="font-size:10.5px;opacity:.55;min-width:28px">${it[0]}</span>
    <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it[1]}</span>
    ${it[2]==='x'?(nv?`<span class="nb">${nv}</span>`:''):it[2]?`<span class="nb">${it[2]}</span>`:''}</div>`}).join('')}).join('')}

function scopeNote(){
 const r=R();
 if(r.sc==='school')return `<div class="scopebar">🌐<div><b>Phạm vi: Toàn trường.</b> ${r.n} thấy và ký được học bạ của mọi điểm trường.</div></div>`;
 if(r.sc==='branch')return `<div class="scopebar">📍<div><b>Phạm vi: ${r.dt}.</b> ${r.n} <b>chỉ</b> thấy lớp thuộc điểm trường mình —
   lớp của điểm trường khác <b>không có trong dữ liệu trả về</b>, không phải chỉ ẩn nút. Bộ chọn điểm trường ở header vì thế <b>khóa lại</b>.</div></div>`;
 return `<div class="scopebar">👥<div><b>Phạm vi: Lớp ${r.lop}.</b> Giáo viên chủ nhiệm chỉ thấy lớp mình chủ nhiệm.</div></div>`}

/* ===== TAB 1 ===== */
function tabTra(){
 const q=($('#q')?.value||'').trim().toLowerCase();
 let list=scopeHS();
 if(fRoi==='Đang theo học')list=list.filter(h=>!h.roi);
 else if(fRoi==='Đã rời trường')list=list.filter(h=>!!h.roi);
 if(q)list=list.filter(h=>h.n.toLowerCase().includes(q)||h.ma.toLowerCase().includes(q));
 const flat=!!q||!list.length;
 let body='';
 if(!list.length)body='<div class="empty">Không tìm thấy học sinh</div>';
 else if(flat)body=list.map(h=>hsRow(h)).join('');
 else{
  const dts=[...new Set(list.map(dtOf))].sort();
  body=dts.map(d=>{const rd=list.filter(h=>dtOf(h)===d),k='t-'+d,op=openG[k]!==false;
   const lops=[...new Set(rd.map(h=>h.lop))].sort();
   const inner=lops.map(l=>{const rl=rd.filter(h=>h.lop===l),k2='tl-'+d+l,o2=openG[k2]!==false;
    return `<div class="grow" data-g="${k2}" style="padding-left:26px"><span class="ar">${o2?'▼':'▶'}</span>Lớp ${l}
      <span class="ct"><span>${rl.length} HS</span></span></div>${o2?rl.map(h=>hsRow(h,1)).join(''):''}`}).join('');
   return `<div class="grow" data-g="${k}"><span class="ar">${op?'▼':'▶'}</span>${d}
     <span class="ct"><span>${rd.length} HS</span></span></div>${op?inner:''}`}).join('');
 }
 return `${scopeNote()}
  <div class="bar"><input class="inp" id="q" placeholder="🔍 Họ tên, mã học sinh, mã định danh CSDL ngành…" value="${$('#q')?.value||''}">
   <select class="fs" id="froi">${['Đang theo học','Đã rời trường','Tất cả'].map(o=>`<option${fRoi===o?' selected':''}>${o}</option>`).join('')}</select>
   <div class="sum"><span>Học sinh <b>${list.length}</b></span></div></div>
  <div class="ro">Dòng chính là <b>học sinh</b>. Tab này tra cứu <b>xuyên năm</b> — bộ chọn <b>Năm học ở header không áp dụng</b>.
   Mở một em ra thấy <b>học bạ trọn khóa</b>, mọi năm, kèm bản đính chính của từng năm.</div>
  <div class="stage ${curHS?'open':''}">
   <div class="listw">
    <div class="hdrow"><div class="kc">Học sinh</div><div>Lớp</div><div class="kc">Học bạ</div><div>Trạng thái</div></div>
    ${body}<div class="lgd"><span>Gom <b>Điểm trường → Lớp → Học sinh</b>. Đang tìm kiếm thì <b>tự phẳng hóa</b>.</span></div></div>
   <div class="panel">${curHS?panelHS():''}</div></div>`}

function hsRow(h,sub){
 const q=($('#q')?.value||'').trim();
 const hl=t=>q?t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'):t;
 const ns=(NAMHOC[h.ma]||[]).filter(laHB), chua=ns.filter(y=>CHUA.includes(y[3]));
 return `<div class="hrow ${sub?'sub':''} ${curHS===h.ma?'on':''}" data-hs="${h.ma}">
  <div class="who2"><div class="ava2">${h.n.split(' ').slice(-2).map(x=>x[0]).join('')}</div>
   <div class="i"><b>${hl(h.n)}</b><span>${sub?h.ma:dtOf(h)+' · '+h.lop}</span></div></div>
  <div class="hcol">${h.lop}</div>
  <div class="hcol keep"><b>${ns.length}</b> năm${chua.length
   ?`<br><span style="font-size:11px;color:var(--amber)">${chua.length} năm chưa hoàn tất</span>`
   :`<br><span style="font-size:11px;color:var(--green)">đủ chữ ký</span>`}</div>
  <div class="hcol">${h.roi?`<span class="st2 n">${h.roi}</span>`:'<span class="st2 o">Đang học</span>'}</div></div>`}

function panelHS(){
 const h=HB.find(x=>x.ma===curHS); if(!h)return'';
 const ns=NAMHOC[h.ma]||[], chua=ns.filter(y=>CHUA.includes(y[3])), nHB=ns.filter(laHB).length, xd=xuatDuoc(h);
 return `<div class="ph"><div><h2>${h.n}</h2>
   <div class="m"><span class="pill">${h.ma}</span><span class="pill">${h.ns} · ${h.gt}</span>
    <span class="pill">${dtOf(h)} · ${h.lop}</span>
    ${h.roi?`<span class="st2 n">${h.roi}</span>`:'<span class="st2 o">Đang học</span>'}</div></div>
   <div class="spacer"></div><button class="btn sm" id="pclose">✕ Đóng</button></div>
  <div class="pbody">
   <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px">
    <button class="btn sm p" data-x="tronkhoa">📘 Học bạ trọn khóa</button>
    ${xd?'<button class="btn sm" data-x="inall">🖨 Xuất bản in đầy đủ</button>':''}
    ${R().xuat?'<button class="btn sm" data-x="chotcd">📤 Chốt học bạ chuyển đi</button>':''}</div>
   ${chua.length?`<div class="warn"><b>Còn ${chua.length} năm chưa hoàn tất chữ ký:</b>
     ${chua.map(y=>`${y[0]} (${STN[y[3]][0]})`).join(' · ')}.<br>
     Theo <code>nh1.2</code> §4.1, <b>không chốt được học bạ chuyển đi</b> khi còn năm chưa Hoàn tất.</div>`
    :`<div class="ok"><b>✓ Toàn bộ ${nHB} năm học bạ đã Hoàn tất.</b></div>`}
   ${laChuyenDi(h)?`<div class="${xd?'ro':'warn'}"><b>Học sinh đã chuyển trường.</b> Học bạ các năm em học ở trường vẫn <b>xem được</b> theo phạm vi như mọi em.
     ${xd?`<b>Xuất bản sao</b> chỉ dành cho Hiệu trưởng · Phó hiệu trưởng · Văn thư — bắt buộc chọn mục đích, ghi audit.`
       :`<b>Học sinh đã chuyển trường — bản sao học bạ do Văn thư cấp.</b> Giáo viên chủ nhiệm tra được, <b>không xuất được</b>.`}
     <span class="hint">(§6.1.4 · ràng buộc 61)</span></div>`:''}
   <div style="font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 9px">
    Dòng thời gian học bạ — ${nHB} năm${nHB<ns.length?' · '+(ns.length-nHB)+' năm chuyển đi giữa chừng':''}</div>
   <div class="tl">${ns.map(y=>{const st=STN[y[3]];
    if(y[3]==='cdi')return `<div class="tli ${y[3]}">
     <div class="yr"><b>${y[0]}</b><span class="pill">Lớp ${y[1]}</span><span class="st2 ${st[1]}">${st[0]}</span></div>
     <div style="font-size:12px;color:var(--ink2);margin-top:3px">${y[2]} — em rời trường trước khi tổng kết. <b>Năm này không có học bạ ở trường này</b>
      và sẽ không bao giờ có: <b>trường mới</b> tổng kết cả năm. Trường cũ bàn giao <b>Giấy xác nhận quá trình học tập</b>.
      <span class="rolnk" data-go="M1.5?tab=chuyen_di&ctx=${h.ma}&return=M1.3">→ M1.5 §5.4</span></div></div>`;
    const dcs=DC.filter(d=>d.ma===h.ma&&d.nam===y[0]);
    return `<div class="tli ${y[3]}">
     <div class="yr"><b>${y[0]}</b><span class="pill">Lớp ${y[1]}</span><span class="st2 ${st[1]}">${st[0]}</span></div>
     <div style="font-size:12px;color:var(--ink2);margin-top:3px">${y[2]}</div>
     <div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">
      <button class="btn xs p" data-x="xemhb" data-ma="${h.ma}" data-nam="${y[0]}">👁 Xem học bạ năm này</button>
      ${xd?`<button class="btn xs" data-x="pdf" data-ma="${h.ma}" data-nam="${y[0]}">⬇ PDF năm này</button>`:''}
      ${y[3]==='tk'?'<span class="st2 n" style="align-self:center">chỉ đọc tuyệt đối</span>':''}</div>
     ${dcs.length?`<div style="margin-top:7px;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:7px 10px;font-size:11.5px">
       <b style="color:#5b21b6">${dcs.length} bản đính chính của năm này</b>
       ${dcs.map(d=>`<div style="margin-top:3px">${d.id} — ${d.noi.map(c=>c[0]).join(', ')}
        <button class="btn xs" data-x="opendc" data-id="${d.id}" style="margin-left:4px">Mở</button></div>`).join('')}</div>`:''}
    </div>`}).join('')}</div>
   ${ns.some(y=>y[3]==='tk')?`<div class="warn" style="margin-top:12px">Năm <b>Nhận từ trường khác</b> là <b>chỉ đọc tuyệt đối</b>.
     Việc tiếp nhận thực hiện ở <b>M1.5 Chuyển trường — luồng Nhận học sinh chuyển đến</b>, không phải ở Menu này.
     <span class="rolnk" data-go="M1.5">→ M1.5</span></div>`:''}
  </div>`}

/* ===== TAB 2 ===== */
function tabNam(){
 const L=scopeLop();
 const f=l=>{const k=tangKe(l);
  if(fTang==='Tất cả')return true;
  if(fTang==='Chưa xong tầng 1')return l.t1.ky<l.t1.tong;
  if(fTang==='Chờ GVCN ký')return k===2;
  if(fTang==='Chờ PHT duyệt')return k===3;
  if(fTang==='Chờ HT ký chốt')return k===4;
  if(fTang==='Quá hạn')return quaHanLop(l);
  return k===0};
 const LL=L.filter(f), my=kyCua();
 const dts=[...new Set(LL.map(l=>l.dt))].sort();
 const cell=(l,t)=>{const [c,x]=tierState(l,t), isMine=kyCua(l)===t&&tangKe(l)===t&&dukien(l);
  return `<div class="lcol"><span class="tier ${isMine?'mine':''}"><span class="dotx ${c}"></span>${x}</span></div>`};
 let body=dts.map(d=>{const rd=LL.filter(l=>l.dt===d),k='n-'+d,op=openG[k]!==false;
  return `<div class="grow" data-g="${k}"><span class="ar">${op?'▼':'▶'}</span>${d}
    <span class="ct"><span>${rd.length} lớp</span><span>${rd.reduce((a,b)=>a+b.ss,0)} học bạ</span></span></div>
   ${op?rd.map(l=>{const [tl,tc]=lopTT(l), k2='ns-'+l.id, o2=!!openG[k2];
    const hs=HB.filter(h=>h.lop===l.id&&!h.roi);
    return `<div class="lrow ${cur===l.id?'on':''}" data-lop="${l.id}">
      <div><span class="ar" data-sub="${k2}" style="cursor:pointer">${o2?'▼':'▶'}</span></div>
      <div class="nm">${l.id}<br><span style="font-weight:400;font-size:11px;color:var(--ink3)">GVCN ${l.gvcn}</span></div>
      <div class="lcol">${l.ss}</div>${cell(l,1)}${cell(l,2)}${cell(l,3)}${cell(l,4)}
      <div><span class="st2 ${tc}">${tl}</span>${quaHanLop(l)?'<br><span class="st2 r" title="Qua hạn tạo lập 30/06 — TT 70/2026 Điều 7. Chỉ cảnh báo, vẫn ký được." style="margin-top:3px">🔴 quá hạn</span>':''}</div></div>
     ${o2?hs.map(h=>`<div class="srow" data-hs2="${h.ma}">
       <div><b>${h.n}</b> <span style="color:var(--ink3);font-size:11px">${h.ma}</span>${HAN8[h.ma]?` <span class="st2 v" title="${HAN8[h.ma].ly} — ${HAN8[h.ma].ai} · ${HAN8[h.ma].ngay}">⏱ hạn 30/08</span>`:''}</div>

/* ===== HB24 — dải hạn tạo lập học bạ số (§6.2.4) ===== */
const namHienHanh=()=>(($('#nam')||{}).value||'Năm học 2025-2026').includes('2025-2026');
/* lớp XONG = đủ bốn tầng và KHÔNG tầng nào bỏ qua ký số — «Đã duyệt — chưa ký số» chưa phải học bạ số hợp lệ */
const xongLop=l=>tangKe(l)===0&&!(l.t3.ok&&l.t3.boqua)&&!(l.t4.ok&&l.t4.boqua);
const quaHanLop=l=>namHienHanh()&&quaHanChinh()&&!xongLop(l);
const ganHanDuoc=l=>!!(R().ky)&&namHienHanh()&&!xongLop(l);
function hanBand(L){
 if(!namHienHanh())return `<div class="ro">📅 <b>Hạn tạo lập học bạ số</b> áp từ năm học hệ thống vận hành — năm đang chọn đã chốt, không có dải hạn.</div>`;
 const tong=L.reduce((a,l)=>a+l.ss,0), xong=L.filter(xongLop).reduce((a,l)=>a+l.ss,0);
 const dbEm=Object.keys(HAN8).filter(m=>{const h=HB.find(x=>x.ma===m);return h&&L.some(l=>l.id===h.lop&&!xongLop(l))});
 const qua=quaHanChinh(), con=soNgay(HOM_NAY,HAN_TL.chinh), conDB=soNgay(HOM_NAY,HAN_TL.db);
 const cls=xong===tong?'ok':qua?'danger':con<=30?'warn':'ro';
 return `<div class="${cls}">📅 <b>Hạn tạo lập học bạ số năm học 2025–2026: ${ngayVN(HAN_TL.chinh)}</b> —
   ${xong===tong?'<b>✓ mọi lớp trong phạm vi đã hoàn tất</b>':qua?`<b>đã quá hạn ${-con} ngày</b>`:`còn <b>${con} ngày</b>`}
   <span class="hint">(TT 70/2026 Điều 7)</span>
   <div style="margin-top:5px">Phạm vi đang xem: <b>${xong}/${tong}</b> học bạ đã Hoàn tất · <b>${tong-xong}</b> chưa
    ${dbEm.length?` · <b>${dbEm.length} em</b> gắn «trường hợp đặc biệt» — hạn <b>${ngayVN(HAN_TL.db)}</b>, ${conDB>=0?'còn '+conDB+' ngày':'đã quá '+(-conDB)+' ngày'}`:''}.
    Học bạ <b>Đã duyệt — chưa ký số</b> <b>không</b> tính là đã xong.</div>
   ${xong<tong?`<div style="margin-top:5px;font-size:11.5px">🛑 <b>Chỉ cảnh báo, không chặn</b> — vẫn mở Phiên ký và ký bình thường;
    học bạ ký sau hạn mang dấu <b>⚠ Ký sau hạn TT 70/2026 Điều 7</b> và vào nhật ký <b>M10.7</b>.
    «Trường hợp đặc biệt» <b>do người gắn theo từng em</b> (nút ⏱ khi bung lớp) — thông tư không định nghĩa nên hệ thống không tự suy.</div>`:''}
   <div style="margin-top:7px"><button class="btn xs" data-x="canchan">📖 Căn cứ</button>
    ${xong<tong&&qua?'<button class="btn xs" data-ft="Quá hạn">Chỉ hiện lớp chưa xong</button>':''}</div>
   <div class="hint" style="margin-top:5px">Mô phỏng: hôm nay ${ngayVN(HOM_NAY)}. TT 70/2026 có hiệu lực từ 08/10/2026 — trên thực tế hạn đầu tiên là 30/06/2027; demo áp cho năm 2025–2026 để thấy dải hạn.</div></div>`}

function hbNam(ma,nam){
 const h=HB.find(x=>x.ma===ma), list=NAMHOC[ma]||[], idx=list.findIndex(z=>z[0]===nam);
 if(!h||idx<0)return null;
 const y=list[idx], cur0=idx===0;
 const seed=([...nam].reduce((a,c)=>a+c.charCodeAt(0),0)+idx*3)%7;
 const diem={}; Object.entries(h.diem).forEach(([m,v],i)=>{
  diem[m]= typeof v==='number' ? (cur0? v : Math.max(3.8,Math.min(9.7,+(v-0.5+((i+seed)%6)*0.16).toFixed(1)))) : v});
 const XL=['Tốt','Khá','Đạt'];
 return {ma,n:h.n,ns:h.ns,gt:h.gt,nam,lop:y[1],kl:y[2],tt:y[3],diem,
  hl:cur0?h.hl:XL[(seed+1)%3],hk:cur0?h.hk:XL[seed%3],
  gvcn:cur0?((LOP.find(l=>l.id===y[1])||{}).gvcn||'—'):['Trần Thị Mai','Lê Minh Quang','Phạm Văn Đức','Hoàng Thu Trang'][seed%4],
  dtr:cur0?(h.dtr||{}):{},
  cb:cur0?h.cb:[],void1:cur0?h.void1:null,cur:cur0}}

  var ds = KHUON.filter(function(k){ return vals.every(function(v){ return docNgay(v, k) !== null; }); });
  if (ds.indexOf('dd/mm/yyyy') >= 0) ds = ds.filter(function(k){ return k !== 'd/m/yyyy'; });
  return ds;
}
B.docNgay = docNgay;

/* ───────────── ⑥ L1 — kiểm kiểu theo cột đích, từng ô ───────────── */
function kiemL1(c, v, duong, gan){
  var t = v == null ? '' : String(v).trim();
  if (!t) return batBuoc(c, gan) ? 'Trống — cột bắt buộc' : null;
  if (laDacBiet(c, t)) return null;                     /* giá trị đặc biệt hợp lệ — bước ③ của menu vẫn thấy chuỗi */
  if (/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/.test(String(v))) return 'Có ký tự điều khiển';
  var k = kieuCua(c), s;
  switch (k.loai){
    case 'chuoi':  return t.length > 255 ? 'Dài quá 255 ký tự' : null;
    case 'ho_ten': return t.length > 100 ? 'Họ tên dài quá 100 ký tự' : null;
    case 'ngay':   return docNgay(t, 'dd/mm/yyyy') ? null : '«' + t + '» không phải ngày dd/mm/yyyy có thật';
    case 'so':     return /^-?\d+([.,]\d+)?$/.test(t) ? null : '«' + t + '» không phải số';
    case 'sdt':
      s = t.replace(/[\s.\-]/g, '');
      if (/^[1-9]\d{8}$/.test(s)) return '«' + t + '» mất số 0 đầu (ô số) — ⛔ tự thêm';
      return /^0\d{9}$/.test(s) ? null : '«' + t + '» không phải SĐT 10 chữ số bắt đầu bằng 0';
    case 'email':  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t) ? null : '«' + t + '» không phải email';
    case 'ma_dinh_danh':
      var km = khuonMaCua(c);
      if (!km) return '«' + t + '» — cột chưa khai loai_ma, ⛔ có khuôn để kiểm';
      return new RegExp(km.khuon).test(t) ? null : '«' + t + '» sai khuôn mã' + (km.mo_ta ? ' (' + km.mo_ta + ')' : '');
    case 'danh_muc':
      var ds = ((duong && duong.danh_muc) || {})[k.dm] || [];
      return ds.indexOf(t) >= 0 ? null : '«' + t + '» không có trong danh mục ' + k.dm;
    case 'co_khong': return (t === 'Có' || t === 'Không') ? null : '«' + t + '» — chỉ nhận Có / Không';

}
B.kiemL1 = kiemL1;

/* ───────────── ⑤ PHÉP BIẾN ĐỔI — danh sách ĐÓNG (N3) ───────────── */
var BD = {
  tach_ho_ten: {ten:'Tách họ và tên', chay:function(v, p){

  }},
  gop_cot: {ten:'Gộp cột'},                             /* chạy trước mọi phép khác — xem chay() */
  doi_dinh_dang_ngay: {ten:'Đổi định dạng ngày', chay:function(v, p){

  bang_doi_gia_tri: {ten:'Bảng đổi giá trị', chay:function(v, p){

    var f = (p.cap || []).filter(function(c){ var tu = String(c.tu).trim(); return ph ? tu === s : tu.toLowerCase() === s.toLowerCase(); })[0];
    return f ? {v:String(f.thanh)} : {v:s, la:s};          /* giá trị lạ GIỮ NGUYÊN để L1 bắt */
  }},
  chuan_hoa_chuoi: {ten:'Bỏ khoảng trắng / hoa thường', chay:function(v, p){
    var s = String(v);
    if (p.cat_khoang_trang !== false) s = s.trim().replace(/\s+/g, ' ');
    var h = p.hoa_thuong || 'giu';
    if (h === 'thuong') s = s.toLocaleLowerCase('vi');
    else if (h === 'hoa') s = s.toLocaleUpperCase('vi');
    else if (h === 'hoa_chu_dau') s = s.toLocaleLowerCase('vi').replace(/(^|\s)(\S)/g, function(m, a, b){ return a + b.toLocaleUpperCase('vi'); });
    return {v:s};
  }},
  gia_tri_hang: {ten:'Giá trị hằng cho cả cột'}
};
var BD_THEM = ['gop_cot', 'tach_ho_ten', 'doi_dinh_dang_ngay', 'bang_doi_gia_tri', 'chuan_hoa_chuoi'];
function bdMoi(ma){
  if (ma === 'tach_ho_ten') return {ma:ma, lay:'ten'};
  if (ma === 'gop_cot') return {ma:ma, noi:' '};
  if (ma === 'doi_dinh_dang_ngay') return {ma:ma, khuon:'dd/mm/yyyy'};
  if (ma === 'bang_doi_gia_tri') return {ma:ma, cap:[], phan_biet_hoa_thuong:false};

  return {ma:'gia_tri_hang', gia_tri:''};
}
function laHang(g){ return !!(g && g.bien_doi && g.bien_doi.length && g.bien_doi[0].ma === 'gia_tri_hang'); }
function coGop(g){ return !!(g && g.bien_doi && g.bien_doi.length && g.bien_doi[0].ma === 'gop_cot'); }
/* một cột đích: {cot_nguon[], bien_doi[]} × một dòng ⇒ {v, loi, goc} — chạy THEO THỨ TỰ KHAI */
function chay(g, o, ghiLa){
  var bd = g.bien_doi || [];
  if (laHang(g)) return {v:String(bd[0].gia_tri == null ? '' : bd[0].gia_tri), goc:''};
  var vals = (g.cot_nguon || []).map(function(k){ return o[k] == null ? '' : String(o[k]); });
  var v, loi = null, i0 = 0;
  if (coGop(g)){ v = vals.map(function(s){ return s.trim(); }).filter(Boolean).join(bd[0].noi == null ? ' ' : bd[0].noi); i0 = 1; }
  else v = vals.length ? vals[0] : '';
  for (var i = i0; i < bd.length; i++){
    var f = BD[bd[i].ma]; if (!f || !f.chay) continue;
    var r = f.chay(v, bd[i]);
    if (r.la != null && ghiLa) ghiLa(r.la);
    if (r.loi && !loi) loi = r.loi;

  }

}
B.bienDoi = {danhSach:BD, chay:chay, moi:bdMoi};

/* ───────────── đọc tệp giả · vân tay ④ ───────────── */
function khoaTieuDe(hdr){
  var raw = hdr.map(function(h, i){ return {i:i, goc:h == null ? '' : String(h).trim(), base:chuanHoa(h)}; });
  var dem = {}, thu = {}, td = [];
  raw.forEach(function(h){ if (h.base) dem[h.base] = (dem[h.base] || 0) + 1; });
  raw.forEach(function(h){
    if (!h.base) return;
    var key = h.base;
    if (dem[h.base] > 1){ thu[h.base] = (thu[h.base] || 0) + 1; key = h.base + '#' + thu[h.base]; }
    td.push({i:h.i, goc:h.goc, base:h.base, key:key});
  });
  return td;
}
/* van_tay_tieu_de = TẬP (⛔ thứ tự) các chuan_hoa(tiêu đề) khác rỗng; trùng ⇒ #1 #2 */
B.vanTay = function(hdr){ return khoaTieuDe(hdr).map(function(h){ return h.key; }).sort(); };
function docSheet(sh, dongTD){
  var rows = (sh && sh.o) || [], td = khoaTieuDe(rows[dongTD - 1] || []), dong = [];
  for (var r = dongTD; r < rows.length; r++){
    var row = rows[r] || [];
    if (!row.some(function(v){ return !laTrong(v); })) continue;
    var o = {};
    td.forEach(function(h){ o[h.key] = row[h.i] == null ? '' : String(row[h.i]); });
    dong.push({so_dong:r + 1, o:o});                   /* số DÒNG EXCEL, ⛔ STT */
  }
  return {tieuDe:td, dong:dong, vanTay:td.map(function(h){ return h.key; }).sort()};
}
function a1Cua(sh){ return String((((sh && sh.o) || [])[0] || [])[0] == null ? '' : sh.o[0][0]).trim(); }
function dongTieuDeMacDinh(sh){
  if (/^MAU-/.test(a1Cua(sh))) return 2;              /* tệp mẫu hệ thống ⇒ dòng 2 */
  var rows = (sh && sh.o) || [];
  for (var r = 0; r < rows.length; r++) if ((rows[r] || []).some(function(v){ return !laTrong(v); })) return r + 1;
  return 1;
}
function vtBang(a, b){ return (a || []).slice().sort().join('|') === (b || []).slice().sort().join('|'); }
function soChung(a, b){ var s = {}; (b || []).forEach(function(x){ s[x] = 1; }); return (a || []).filter(function(x){ return s[x]; }).length; }

/* ───────────── ② kiểm khai báo đường nhập (HDMX ② mục 1–2) ───────────── */
B.kiemKhaiBao = function(duong){
  var loi = [];
  (duong.phan || []).forEach(function(pd){
    var cd = pd.cot_dich || [];
    cd.forEach(function(c){
      if (!c.kieu || !c.muc) loi.push('Cột đích «' + c.nhan + '» thiếu kieu hoặc muc — ⛔ dựng được L1 L2');
      var k = kieuCua(c);
      if (k.loai === 'danh_muc' && !((duong.danh_muc || {})[k.dm])) loi.push('Cột «' + c.nhan + '» trỏ danh mục «' + k.dm + '» mà đường nhập không khai');
      if (k.loai === 'ma_dinh_danh' && !(c.loai_ma && B.khuonMa[c.loai_ma])) loi.push('Cột «' + c.nhan + '» kiểu ma_dinh_danh thiếu loai_ma (khuôn đọc tham số M10.8 — ⛔ khai khuôn số cứng)');
      if (c.phai_gan && c.muc === 'bat_buoc') loi.push('Cột «' + c.nhan + '»: phai_gan chỉ đi với tuy_chon · co_dieu_kien (bat_buoc đã phải gán)');
    });
    (pd.nhom_phai_gan || []).forEach(function(n){
      (n.cum || []).forEach(function(cm){ cm.forEach(function(ma){ if (!cd.some(function(c){ return c.ma === ma; })) loi.push('nhom_phai_gan trỏ cột «' + ma + '» không có trong phần'); }); });
    });
    ['sdt', 'ho_ten', 'ngay', 'email'].forEach(function(kk){
      var ds = cd.filter(function(c){ return c.kieu === kk; });
      for (var i = 0; i < ds.length; i++) for (var j = i + 1; j < ds.length; j++){
        var cung = (pd.cap_de_nham || []).some(function(g){ return g.indexOf(ds[i].ma) >= 0 && g.indexOf(ds[j].ma) >= 0; });
        if (!cung) loi.push('«' + ds[i].nhan + '» và «' + ds[j].nhan + '» cùng kiểu ' + kk + ' mà ⛔ chung nhóm cap_de_nham — khai báo thiếu');
      }
    });
  });
  return loi;
};

/* ⑨ — mẫu gắn số hiệu mẫu đích CŨ ⇒ «cần rà lại», ⛔ tự áp, ⛔ tự nâng */
/* HDMX bản 2 ② mục 4 — một Feature NHIỀU mẫu đích: mẫu thuộc (ma_feature × tên gốc mẫu đích) */
function cungDuong(m, duong){ return m.duong_nhap.ma_feature === duong.ma_feature && tenMauGoc(m.duong_nhap.mau_dich) === tenMauGoc(duong.mau_dich); }

/* ═══════════════ KHUNG HIỂN THỊ (hai lớp: hộp chính · hộp phụ) ═══════════════ */

}
/* 🔁 MNXL-Z — hộp bộ máy ⛔ che TOAST / MODAL của menu (quy ước demo: #toast · #mask.on).
   Trong lúc hộp mở: body mang lớp bnx-dang-mo ⇒ #toast nổi trên hộp (style.08); modal của menu MỞ
   SAU khi hộp mở ⇒ gắn bnx-tren-hop, nổi trên hộp; modal đã mở TRƯỚC (vd hộp Import của M4.1) giữ dưới. */
var QS_MASK = null;
function theoDoiMask(){
  var mk = document.getElementById('mask');
  if (!mk || QS_MASK || !window.MutationObserver) return;
  QS_MASK = new MutationObserver(function(){
    var on = mk.classList.contains('on'), mo = LOP && LOP.classList.contains('bnx-mo');
    var tren = mk.classList.contains('bnx-tren-hop');   /* ⛔ ghi lại lớp đã có — tránh vòng lặp của chính trình theo dõi */
    if (on && mo && !mk._bnxTruoc && !tren) mk.classList.add('bnx-tren-hop');
    if (!on){ if (tren) mk.classList.remove('bnx-tren-hop'); mk._bnxTruoc = false; }
  });

}
function mo(){
  dungLop(); theoDoiMask();

  LOP.classList.add('bnx-mo'); document.body.classList.add('bnx-dang-mo');
}

/* ═══════════════════════════ NHẬP ═══════════════════════════ */

/* ④ — tự gợi ý: khớp ĐÚNG MỘT cột nguồn ⇒ gán; nhiều / không ⇒ để trống, người chọn */
function goiY(P){
  P.gan = {}; P.goiY = {}; P.mauThieu = {};
  var cd = P.def.cot_dich, ungVien = {}, nguonDen = {};
  cd.forEach(function(c){

  const l = LOP.find(x => x.id === h.lop);
  return (l && l.t4 && l.t4.ok) ? {ai: l.t4.ai, ngay: l.t4.ngay, cd: 'Hiệu trưởng'} : null;
 }
 if (h.tt === 'tk') return null;
 const y = +String(h.nam).slice(0, 4);
 const ai = y >= 2024 ? TRUONG.ht : 'Nguyễn Thị Hồng';
 return {ai: ai, ngay: '28/5/' + (y + 1), cu: ai !== TRUONG.ht,
   cd: 'Hiệu trưởng — người đã ký tầng 4 của năm học ' + h.nam};
}

/* ===== mảnh vẽ ===== */
function oAnh(kind, ten) {
 /* Có ảnh  → ô ảnh mang rõ tên tệp. Demo CỐ Ý không vẽ một con dấu đỏ trông như thật:
    một ảnh chụp màn hình demo mà giống hệt giấy tờ có dấu là thứ mang đi dùng được.
    Chưa khai → ĐỂ TRỐNG, không khung, không nét vẽ giả (ràng buộc 36). */
 if (!ten) return '<div class="oanh trong"></div>';
 return `<div class="oanh ${kind}"><span class="ic">✍️</span>
   <span class="fn">${ten}</span></div>`;
}
function gl(k, v) {return `<div class="gl"><span class="k">${k}</span><span class="v">${v}</span></div>`}
function nhanXetMon(m, d) {
 if (typeof d !== 'number') return 'Tham gia đầy đủ, đạt yêu cầu cần đạt của môn học.';
 if (d >= 8.5) return 'Nắm chắc kiến thức, vận dụng tốt; có tiến bộ rõ trong học kì II.';
 if (d >= 6.5) return 'Có tiến bộ; cần luyện thêm dạng bài vận dụng.';
 if (d >= 5) return 'Đạt yêu cầu cần đạt; còn hạn chế ở phần vận dụng cao.';
 return 'Chưa đạt yêu cầu ở một số nội dung, cần rèn luyện thêm.';
}

/* HB24 (v2.6 §6.6.1b) — mã tra cứu và QR là của HỆ THỐNG HỌC BẠ SỐ TẬP TRUNG (Sở / Bộ), ⛔ không phải của trường.
   Chỉ in khi trường ĐÃ KẾT NỐI và năm ấy ĐÃ CÓ MÃ trên đó; chưa có thì ô để trống, không in chữ thay.
   Demo: công tắc mô phỏng ở hộp Xuất — mặc định CHƯA kết nối (chuẩn kết nối của Bộ chưa ban hành). */
let ketNoiSo = 0;
const coMaSo = h => !!ketNoiSo && ['ht', 'dc'].includes(h.tt);
const cauXacThuc = () => ketNoiSo
 ? 'Xác thực bằng <b>mã và QR học bạ số</b> của hệ thống tập trung Sở / Bộ ở cuối trang.'
 : 'Trường <b>chưa kết nối</b> hệ thống học bạ số tập trung Sở / Bộ — bản in <b>không có mã tra cứu và QR</b>.';

function daiPhapLy(ban) {
 if (!banCoAnh(ban)) return '';
 if (!khaiAnh) return '';
 return `<div class="daipl">🛡 <div><b>Bản in từ học bạ số — giá trị pháp lý nằm ở CHỮ KÝ SỐ.</b>
   Ảnh chữ ký trên bản in này <b>chỉ để đọc cho giống bản giấy</b>, nó
   <b>không tạo ra giá trị pháp lý nào</b>. ${cauXacThuc()}</div></div>`;
}

function maTraCuu(h) {
 if (!coMaSo(h)) return `<div class="qrbox trong"><div class="qr trong"></div>
   <div class="scrn">↖ Ô mã tra cứu và QR <b>để trống</b> trên bản in — ${ketNoiSo
     ? 'học bạ năm này <b>chưa có mã</b> trên hệ thống học bạ số tập trung (chưa ký số đủ chuỗi hoặc chưa đồng bộ)'
     : 'trường <b>chưa kết nối</b> hệ thống học bạ số tập trung Sở / Bộ'}.
   Trường <b>không tự sinh mã</b>, không dựng trang xác thực. <i>(chú thích màn hình — không in)</i></div></div>`;
 const ma = '25.' + String(h.nam).slice(2, 4) + '.' + h.ma.replace(/\D/g, '').slice(-8);
 return `<div class="qrbox"><div class="qr"></div>
   <div><b>Mã học bạ số:</b> <code>${ma}</code><br>
   <span class="sub">Quét QR để mở học bạ số của học sinh trên <b>hệ thống dữ liệu tập trung của Sở GD&amp;ĐT / Bộ GD&amp;ĐT</b>.</span></div></div>`;
}

/* ===== bộ chọn mẫu ===== */
function mauBar(ma, nam) {
 return `<div class="maubar"><b>Mẫu xem:</b>
  <button class="mchip ${mauXem === 'tt22' ? 'on' : ''}" data-x="mau" data-m="tt22" data-ma="${ma}" data-nam="${nam}">📄 Mẫu TT 22 — như bản giấy</button>
  <button class="mchip ${mauXem === 'lam_viec' ? 'on' : ''}" data-x="mau" data-m="lam_viec" data-ma="${ma}" data-nam="${nam}">🖥 Bản làm việc trên màn hình</button>
  <span class="mchip xam" title="TT 70/2026 Điều 6 giao Bộ quy định cấu trúc trường dữ liệu, định dạng, quy tắc hiển thị và mã hóa. Tra 18/9/2026: chưa có văn bản hướng dẫn kỹ thuật nào. Không đoán trước nội dung chuẩn đó.">🗄 Bản dữ liệu gửi ngành — ⏳ chờ quy định kỹ thuật của Bộ</span>
  <span class="sp"></span>
  <button class="mchip demo" data-x="khaianh" data-v="${khaiAnh ? 0 : 1}">🎛 Demo: ${khaiAnh ? 'ĐÃ' : 'CHƯA'} có ai khai ảnh chữ ký</button></div>`;
}

/* ===== bản in mẫu TT 22 ===== */
function giayTT22(h, ban) {
 const ll = llOf(h.ma), cap = capOf(h.lop), anh = ANHHS[h.ma];
 const k4 = nguoiKy4(h), mtr = h.cur ? monTruong(h.lop) : [];
 const cks = [];   /* ai chưa khai ảnh chữ ký — gom lại ghi một dòng chú dưới khối ký */
 const oKy = (ten) => {
  if (!ten) return '<div class="oanh trong"></div>';
  if (coCK(ten, ban)) return oAnh('ck', CKCN[ten]);
  if (banCoAnh(ban) && khaiAnh) cks.push(ten);
  return '<div class="oanh trong"></div>';
 };
 /* 🔁 BADD 30/9/2026 — o anh dau GO HAN (rang buoc 38 xoa). Lap luan cu «dau dong LEN chu ky»
    chi doi rui ro tu «dau khong kem ai» sang «dau kem mot cai anh» — anh chu ky cung ⛔ phai chu ky.
    Thu khu duoc rui ro la CHU KY SO, va no da co. */
 const kyLD = !!(k4 && coCK(k4.ai, ban));
 /* 🆕 GDDP-2B §6.3.3b1 · ràng buộc 48 — ô `Chữ ký của giáo viên môn học` chứa MỘT KHỐI CHO MỖI PHẦN.
    Môn một phần ⇒ MỘT khối, KHÔNG in tên phần (tên phần của PT0 là tên môn — in lại là in hai lần) ⇒ ca PC1.
    Ràng buộc 36 áp cho TỪNG khối: ai chưa khai ảnh thì ô của RIÊNG người đó để trống, không khung giả, không nét ký giả.
    🛑 Không thêm cột, không thêm dòng — nhiều khối xếp dọc vẫn là MỘT ô của một dòng môn ⇒ bản in còn ĐÚNG MẪU. */
 const bangMon = Object.entries(h.diem).map(([m, d]) => {
  const num = typeof d === 'number', ds = phanCua(m), nh = ds.length > 1;
  /* 🛑 PC1 — MON MOT PHAN giu NGUYEN VAN markup cu: khong boc them <div class="kyk">.
     Boc them thi o ky co padding cua .kyk, tuc la doi mot chut khoang cach tren to giay cua
     moi mon mot phan — dung loai thay doi ma ca chong hoi quy phai bat. */
  const oKhoi = nh
   ? ds.map(ph => {
      const gv = gvPhan(h.lop, m, ph) || h.gvcn;
      return `<div class="kyk"><div class="kyp">${ph}</div>${oKy(gv)}<span class="ten">${gv}</span></div>`;
     }).join('')
   : (() => { const gv = gvPhan(h.lop, m, ds[0]) || h.gvcn;
      return `${oKy(gv)}<span class="ten">${gv}</span>`; })();
  return `<tr><td class="l"><b>${m}</b>${nh ? `<div class="sub">${PHUONGTHUC[m].ten}</div>` : ''}</td>
   <td>${num ? (d - 0.3).toFixed(1) : d}</td><td>${num ? (d + 0.15).toFixed(1) : d}</td>
   <td><b>${num ? d.toFixed(1) : d}</b></td><td></td>
   <td class="l nx">${nhanXetMon(m, d)}</td>
   <td class="kyo${nh ? ' nhieu' : ''}">${oKhoi}</td></tr>`;
 }).join('');

 return `<div class="giay">
  <div class="gpage">
   <div class="qh">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<br><span>Độc lập - Tự do - Hạnh phúc</span></div>
   <h3 class="gt">HỌC BẠ</h3>
   <div class="gt2">${cap === 'THPT' ? 'TRUNG HỌC PHỔ THÔNG' : 'TRUNG HỌC CƠ SỞ'}</div>
   <div class="syl">
    <div class="anhbox">${anh
      ? `<div class="anh4x6" style="background:${anh}">${h.n.split(' ').slice(-2).map(x => x[0]).join('')}</div>`
      : '<div class="anh4x6 trong">Ảnh 4×6</div>'}
     <div class="sub" style="text-align:center;margin-top:4px">${anh ? 'Ảnh 4×6 — 🔗 M1.1' : 'chưa có ảnh ở M1.1'}</div></div>
    <div class="glist">
     ${gl('Họ và tên', '<b>' + h.n.toUpperCase() + '</b>')}
     ${gl('Giới tính', h.gt)}
     ${gl('Ngày, tháng, năm sinh', h.ns)}
     ${gl('Nơi sinh', ll.ns2)}
     ${gl('Dân tộc', ll.dt)}
     ${gl('Đối tượng (con liệt sĩ, thương binh…)', ll.dtuong + ' <span class="rolnk" data-go="M1.2">🔗 M1.2</span>')}
     ${gl('Chỗ ở hiện tại', ll.oh)}
     ${gl('Họ và tên cha', ll.cha)}
     ${gl('Họ và tên mẹ', ll.me)}
    </div></div>
   <div class="kyhang">
    <div></div>
    <div class="kyo2"><div class="nt">${TRUONG.tinh}, ngày 28 tháng 5 năm ${+String(h.nam).slice(0, 4) + 1}</div>
     <div class="cd">HIỆU TRƯỞNG</div><div class="sub">(Ký, ghi rõ họ tên và đóng dấu)</div>
     <div class="dauky">${oKy(k4 ? k4.ai : null)}</div>
     <div class="ten">${k4 ? k4.ai : '<span class="sub">(chưa ký tầng 4 — in ra để ký tay)</span>'}</div></div></div>
  </div>

  <div class="gpage">
   <h3 class="gt">QUÁ TRÌNH HỌC TẬP</h3>
   <div class="glist nganh">
    ${gl('Năm học', '<b>' + h.nam + '</b>')}
    ${gl('Lớp', h.lop)}
    ${gl('Tên trường', TRUONG.ten)}
    ${gl('Huyện/Quận', TRUONG.huyen)}
    ${gl('Tỉnh/Thành phố', TRUONG.tinh)}
   </div>
   <div class="wrapx"><table class="gtbl">
    <tr><th rowspan="2" class="c1">Môn học/<br>Hoạt động giáo dục</th>
     <th colspan="3">Điểm trung bình môn học hoặc mức đánh giá</th>
     <th rowspan="2" class="c5">Điểm TB hoặc mức ĐG<br>sau đánh giá lại<br><i>(nếu có)</i></th>
     <th rowspan="2" class="c6">Nhận xét sự tiến bộ, ưu điểm nổi bật,<br>hạn chế chủ yếu <i>(nếu có)</i></th>
     <th rowspan="2" class="c7">Chữ ký của<br>giáo viên môn học</th></tr>
    <tr><th>Học kì I</th><th>Học kì II</th><th>Cả năm</th></tr>
    ${bangMon}
   </table></div>
   <div class="glist">
    ${gl('Tổng số buổi nghỉ học cả năm học', ll.nghi + ' buổi')}
    ${gl('Kết quả rèn luyện cả năm học', '<b>' + h.hk + '</b>')}
    ${gl('Kết quả học tập cả năm học', '<b>' + h.hl + '</b>')}
    ${gl('Rèn luyện trong kì nghỉ hè <i>(nếu có)</i>', '—')}
    ${gl('Kết quả xét lên lớp', '<b>' + (h.kl === '—' ? 'Chưa có — M3.3 chưa xét' : h.kl) + '</b>')}
    ${gl('Khen thưởng <i>(nếu có)</i>', '— <span class="rolnk" data-go="M2.10">🔗 M2.10</span>')}
   </div>
   <div class="nxcn"><b>Nhận xét của giáo viên chủ nhiệm:</b><br>
    ${h.n} ${h.hk === 'Tốt' ? 'chấp hành tốt nội quy, có tinh thần giúp bạn' : 'chấp hành nội quy, cần chủ động hơn trong hoạt động tập thể'};
    ${h.hl === 'Tốt' ? 'kết quả học tập tốt và đều ở các môn' : h.hl === 'Khá' ? 'kết quả học tập khá, còn lệch giữa các môn' : 'cần cố gắng nhiều hơn ở các môn có kết quả thấp'}.</div>
   <div class="kyhang2">
    <div class="kyo2"><div class="cd">XÁC NHẬN CỦA HIỆU TRƯỞNG</div><div class="sub">(Ký, ghi rõ họ tên và đóng dấu)</div>
     <div class="dauky">${oKy(k4 ? k4.ai : null)}</div>
     <div class="ten">${k4 ? k4.ai : '<span class="sub">(chưa ký tầng 4 — in ra để ký tay)</span>'}</div></div>
    <div class="kyo2"><div class="nt">Ngày 28 tháng 5 năm ${+String(h.nam).slice(0, 4) + 1}</div>
     <div class="cd">GIÁO VIÊN CHỦ NHIỆM</div><div class="sub">(Ký, ghi rõ họ tên)</div>
     <div class="dauky">${oKy(h.gvcn)}</div>
     <div class="ten">${h.gvcn}</div></div></div>
   ${k4 && k4.cu ? `<div class="giaychu">🖊 <b>Ảnh chữ ký lãnh đạo lấy theo NGƯỜI ĐÃ KÝ TẦNG 4 CỦA CHÍNH NĂM ${h.nam}</b>
     — ${k4.ai}, ${k4.cd} — <b>không phải</b> Hiệu trưởng đương nhiệm (${TRUONG.ht}).
     Học bạ là hồ sơ của <b>một năm học</b>: in chữ ký người đang tại chức lên trang của năm mà họ chưa ký
     là làm sai lệch chính cái mà chữ ký chứng thực. <i>(H5-P1)</i></div>` : ''}
   ${!khaiAnh && banCoAnh(ban) ? `<div class="giaychu">⬜ <b>Chưa ai khai ảnh chữ ký (<code>M4.1</code>)</b>
     — mọi ô ảnh <b>để trống</b>, không khung giả, không nét vẽ giả. <b>Bản in vẫn hợp lệ và vẫn đúng mẫu TT 22</b>:
     nó là tờ học bạ giấy chưa ký, in ra rồi <b>ký tay và đóng dấu thật</b>. Ảnh chữ ký là <b>tùy chọn</b> —
     không khai thì không có gì hỏng, chỉ là bản in không giống bản giấy đã ký.</div>` : ''}
   ${banCoAnh(ban) ? `<div class="giaychu">🔴 <b>Bản in không có ô con dấu — và đó là chủ ý</b> <i>(30/9/2026 · cụm <code>BADD</code>)</i>.
     Con dấu là thứ <b>người giữ dấu đóng lên giấy</b>; một tệp ảnh dấu nhúng sẵn làm ra tờ giấy
     <b>trông như đã đóng dấu mà không ai đóng</b>. Trường <code>anh_dau</code> ở <code>M10.2</code> đã <b>gỡ hẳn</b>.
     Muốn bản in mang giá trị của con dấu thì đường đi là <b>chữ ký số tổ chức</b>
     <span class="rolnk" data-go="M10.2">🔗 M10.2</span> — xem <code>Bản chuyển trường</code>.</div>` : ''}
   ${cks.length ? `<div class="giaychu">⬜ <b>Ô chữ ký của ${[...new Set(cks)].join(' · ')} để TRỐNG</b> vì những người này
     <b>chưa khai ảnh chữ ký</b> ở <code>M4.1</code>. Ràng buộc <b>36</b> áp cho <b>từng người</b>: môn ba giáo viên mà hai người đã khai ảnh
     thì in <b>hai ảnh và một ô trống</b>, bản in <b>vẫn hợp lệ và vẫn đúng mẫu</b>. Bản in <b>vẫn hợp lệ</b> — ô trống để ký tay lên bản in,
     đúng như tờ học bạ giấy chưa ký. <b>Không vẽ khung giả, không vẽ nét ký giả.</b></div>` : ''}
   ${mtr.length ? `<div class="giaychu tr">🏫 <b>Lớp ${h.lop} còn ${mtr.length} môn của nhà trường</b>
     (${mtr.join(' · ')}) — <b>mẫu TT 22 không có cột cho chúng</b>, và thêm cột vào là làm bản in
     <b>không đúng chuẩn dữ liệu</b> (TT 70/2026 Điều 4 khoản 2).
     Điểm không mất: xem ở <b>Bản làm việc</b>, in ở <b>Phiếu kết quả môn học của nhà trường</b>.
     <div style="margin-top:6px"><button class="btn xs" data-x="mau" data-m="lam_viec" data-ma="${h.ma}" data-nam="${h.nam}">🖥 Mở Bản làm việc</button>
      <button class="btn xs" data-x="phieu" data-lop="${h.lop}">🖨 Phiếu kết quả môn của trường</button></div></div>` : ''}
   ${maTraCuu(h)}
  </div></div>`;
}

function xemTT22(ma, nam, ban) {
 const h = hbNam(ma, nam); if (!h) return;
 ban = ban || 'mot_nam';
 mauCtx = {ma, nam, ban};
 const st = STN[h.tt];
 $('#mdl').classList.remove('sm');
 modal(`📄 Mẫu TT 22 — Học bạ ${nam} · ${h.n} <span class="st2 ${st[1]}" style="margin-left:7px">${st[0]}</span>`,
  `${mauBar(ma, nam)}
   ${ban === 'chuyen_truong' ? `<div class="danger"><b>Bản chuyển trường — KHÔNG có ảnh chữ ký.</b>
     Khóa cứng, không có công tắc. Trường nhận đọc bản này <b>như một học bạ hợp lệ</b>, nên thứ duy nhất
     được phép đứng ở chỗ chữ ký là <b>chữ ký số của Hiệu trưởng</b> và <b>chữ ký số của tổ chức</b>.
     <b>Chữ ký số của tổ chức chính là con dấu trong môi trường điện tử</b> — đây là bản duy nhất
     mang giá trị ấy, và nó có được nhờ <b>ký số</b> chứ không nhờ một tệp ảnh.</div>
    <div class="ok"><b>✓ Hai chữ ký số trên bản này:</b> 🔐 Hiệu trưởng ${TRUONG.ht} · 🔐 Chứng thư số tổ chức của trường
     <span class="rolnk" data-go="M10.2">🔗 M10.2</span> — ${cauXacThuc()}</div>` : ''}
   ${chuaKS(h) ? `<div class="danger">🖨 <b>Dòng đầu trang của bản in:</b> <i>«Chưa ký số — không phải học bạ số. Chỉ có giá trị khi in ra, ký tay và đóng dấu.»</i>
     <span class="hint">(TT 70/2026 Điều 4 khoản 2 — §3.5)</span></div>` : ''}
   ${daiPhapLy(ban)}
   ${h.tt === 'tk' ? `<div class="warn"><b>Học bạ nhận từ trường khác — chỉ đọc tuyệt đối.</b> Bản in giữ nguyên
     nội dung trường cũ; nhãn <b>Chưa xác thực được chữ ký nguồn</b> đi theo mọi bản xuất.</div>` : ''}
   ${!h.cur ? `<div class="ro">Đang xem <b>năm học đã qua</b> — bản đã chốt của năm ${nam}. Mọi thao tác ghi đều không còn.</div>` : ''}
   ${giayTT22(h, ban)}`,
  [['Đóng', 0], ['📘 Học bạ trọn khóa', () => tronKhoa(ma)],
   xuatDuoc(HB.find(x => x.ma === ma)) ? ['⬇ Xuất PDF', () => act('pdf', {ma: ma, nam: nam})] : null]);
}
/* HB24 — năm «chưa ký số»: năm cũ mang trạng thái ks, hoặc năm hiện hành có tầng 3 / tầng 4 bỏ qua ký số */
function chuaKS(h) {
 if (h.tt === 'ks') return true;
 if (!h.cur) return false;
 const l = LOP.find(x => x.id === h.lop);
 return !!(l && ((l.t3.ok && l.t3.boqua) || (l.t4.ok && l.t4.boqua)));
}

/* ===== F6 — Xuất PDF (thay nhánh cũ, giữ nguyên bốn bản xuất) ===== */
function xuatPDF(d) {
 d = d || {}; xuatD = d;
 const h = HB.find(x => x.ma === (d.ma || curHS)) || HB[0];
 const ns0 = NAMHOC[h.ma] || [], ns = ns0.filter(laHB), chua = ns.filter(y => CHUA.includes(y[3]));
 const cdi = ns0.filter(y => !laHB(y)), ksN = ns.filter(y => y[3] === 'ks');
 const mtrX = monTruong(h.lop), TX = thieuTr(h.lop), keX = TX.filter(t => t.co < t.tong);
 if (banXuat === 'phieu' && !mtrX.length) banXuat = 'mot_nam';
 const row = (id, ten, sub, mon, kyso) => {
  const anhCot = id === 'mot_nam' || id === 'day_du'
   ? (khaiAnh ? '<span class="st2 o">✓ có — kèm dải giá trị pháp lý</span>'
             : '<span class="sub">trường chưa khai ⇒ ô trống</span>')
   : id === 'chuyen_truong' ? '<b style="color:var(--red)">KHÔNG BAO GIỜ</b><br><span class="sub">khóa cứng</span>'
   : '<span class="sub">không — in ra rồi ký tay, đóng dấu thật</span>';
  return `<tr class="${banXuat === id ? 'sel' : ''}"><td><input type="radio" name="bx" data-bx="${id}" ${banXuat === id ? 'checked' : ''} style="width:15px;height:15px"></td>
   <td><b>${ten}</b><br><span class="sub">${sub}</span></td>
   <td>${mon}</td><td>${anhCot}</td><td>${kyso}</td></tr>`;
 };
 const monCot = mtrX.length ? '<span class="st2 w">kèm phiếu rời — tắt được</span>' : '<span class="sub">lớp không có</span>';
 modal('🖨 Xuất học bạ — ' + h.n,
  `<div class="ro">Bản in gồm <b>${ns.length} năm học bạ</b>. ${cauXacThuc()}
     <label style="display:flex;gap:7px;align-items:center;margin-top:7px;font-size:12px"><input type="checkbox" id="ketnoi" ${ketNoiSo ? 'checked' : ''} style="width:15px;height:15px">
      🔌 <b>Mô phỏng:</b> trường đã kết nối hệ thống học bạ số tập trung Sở / Bộ <span class="hint">(§6.6.1b — chuẩn kết nối của Bộ chưa ban hành)</span></label></div>
   ${cdi.length ? `<div class="info"><b>Năm ${cdi.map(y => y[0]).join(', ')}</b> — chuyển đi giữa năm: <b>không có học bạ</b> ở trường này, không có trang nào trong bản in (§6.1.3).</div>` : ''}
   ${ksN.length ? `<div class="warn"><b>Năm ${ksN.map(y => y[0]).join(', ')} chưa ký số</b> — trang của năm ấy in dòng đầu trang
     <i>«Chưa ký số — không phải học bạ số. Chỉ có giá trị khi in ra, ký tay và đóng dấu.»</i> (§3.5)</div>` : ''}
   ${chua.length ? `<div class="warn"><b>${chua.length} năm chưa Hoàn tất</b> — bản in đóng dấu
     <b>"BẢN CHƯA CÓ HIỆU LỰC PHÁP LÝ"</b> lên đúng các trang đó.</div>` : ''}
   <div class="secth">Mẫu in</div>
   <div class="mauxuat">
    <label class="mrow on"><input type="radio" name="mx" checked style="width:15px;height:15px">
     <div><b>📄 Mẫu TT 22 — như bản giấy</b> <span class="st2 b">mặc định</span><br>
      <span class="sub">Đúng Phụ lục <b>TT 22/2021</b>: trang bìa và sơ yếu lý lịch có <b>ảnh học sinh</b>,
      bảng kết quả từng môn có cột <b>chữ ký giáo viên môn học</b>, khối chữ ký cuối trang có
      <b>ảnh chữ ký</b> nếu người ký đã khai. <b>Không có ô con dấu</b> — con dấu phải được đóng.</span></div></label>
    <label class="mrow xam"><input type="radio" name="mx" disabled style="width:15px;height:15px">
     <div><b>🗄 Bản dữ liệu gửi ngành</b> <span class="st2 n">⏳ chưa dựng</span><br>
      <span class="sub"><b>TT 70/2026 Điều 6</b> giao Bộ quy định riêng cấu trúc trường dữ liệu, định dạng,
      quy tắc hiển thị và mã hóa. Tra <b>18/9/2026: chưa có văn bản hướng dẫn kỹ thuật nào.</b>
      Dựng một mẫu bây giờ là <b>đoán chuẩn của Bộ</b> rồi bắt cả trường đi theo cái đoán ấy.
      Việc thật ở đây là <b>màn hình đối chiếu trước khi đẩy</b> tại <b>M10.8</b>, không phải một mẫu in.
      <span class="rolnk" data-go="M10.8">🔗 M10.8</span></span></div></label></div>
   <div class="secth" style="margin-top:12px">Bản xuất — bản nào chứa gì</div>
   <div class="wrapx"><table><tr><th style="width:26px"></th><th>Bản xuất</th><th>Môn <i>Của trường</i></th>
     <th>Ảnh dấu · ảnh chữ ký</th><th>Chữ ký số</th></tr>
    ${row('mot_nam', 'Học bạ một năm', 'Đúng mẫu theo cấp', monCot, 'chuỗi ký học bạ')}
    ${row('day_du', 'Học bạ đầy đủ', 'Mọi năm, kèm năm nhận từ trường khác', monCot, 'chuỗi ký học bạ')}
    ${row('chuyen_truong', 'Bản chuyển trường', 'Dùng ở M1.5', '<b style="color:var(--red)">KHÔNG BAO GIỜ</b><br><span class="sub">khóa cứng, không có công tắc</span>', 'HT + chữ ký số tổ chức')}
    ${mtrX.length ? row('phieu', '🏫 Phiếu kết quả môn học của nhà trường', 'Chỉ môn Của trường — in rời', 'chính nó', '<b>không có ô ký số nào</b>') : ''}
   </table></div>
   <div class="danger" style="margin-top:11px"><b>Vì sao Bản chuyển trường không có ảnh chữ ký — và không có công tắc để bật.</b>
    Trường nhận đọc bản đó <b>như một học bạ hợp lệ</b>. Ảnh chữ ký <b>không kiểm chứng được</b>:
    ai có tệp ảnh cũng dán được, và dán xong thì bản in <b>trông y như đã ký</b>. Con dấu thì <b>không có ảnh nào</b> —
    nó phải được đóng, hoặc thay bằng <b>chữ ký số tổ chức</b> như chính bản này. Thứ duy nhất trả lời được
    câu <i>"ai ký, ký lúc nào, nội dung có bị đổi sau đó không"</i> là <b>chữ ký số</b>. Cùng lập luận với việc bản đó
    không được nhét môn ngoài chuẩn — <b>TT 70/2026</b> Điều 4 khoản 2 đòi <b>đúng chuẩn dữ liệu và được ký số</b>.</div>
   ${khaiAnh ? `<div class="warn"><b>Bản in mang ảnh chữ ký phải có dải ghi rõ giá trị pháp lý</b> ở đầu bản:
     <i>"Bản in từ học bạ số — giá trị pháp lý nằm ở chữ ký số; ảnh chữ ký chỉ để đọc cho giống bản giấy"</i>,
     kèm <b>mã tra cứu và QR</b> khi đã kết nối hệ thống tập trung. Không có dải này thì tờ giấy tự nhận là bản gốc.</div>` : ''}
   ${mtrX.length && keX.length ? `<div class="warn"><b>Phiếu môn của trường sẽ mang dấu "BẢN CHƯA ĐẦY ĐỦ"</b> —
     còn ${keX.length} môn chưa đủ kết quả (${keX.map(t => t.m + ': thiếu ' + (t.tong - t.co) + ' em').join(' · ')}).
     <b>Không chặn xuất</b> — chốt chặn của việc thiếu kết quả đặt ở đây, <b>không phải ở Phiên ký</b>.</div>` : ''}
   <div style="margin:11px 0"><b>Phạm vi</b><select class="fldi">
     <option>Toàn bộ ${ns.length} năm</option><option>Chỉ các năm học tại trường mình</option><option>Chọn từng năm…</option></select></div>
   <div><b>Mục đích xuất</b> <span style="color:var(--red)">*bắt buộc — ghi audit (Luật BVDLCN 91/2025)</span>
    <select class="fldi ${canhMD && !mucDich ? 'err' : ''}" id="mucdich">
     <option value="">— Chọn mục đích —</option>
     ${['Cấp bản sao theo yêu cầu gia đình', 'Hồ sơ chuyển trường', 'Hồ sơ xét tuyển đầu cấp', 'Yêu cầu của cơ quan quản lý']
       .map(o => `<option${mucDich === o ? ' selected' : ''}>${o}</option>`).join('')}</select>
    ${canhMD && !mucDich ? '<div class="errm">⛔ Chưa chọn mục đích — không xuất được. Audit không có mục đích thì về sau không trả lời được câu <i>"bản này in ra để làm gì"</i>.</div>' : ''}</div>`,
  [['Hủy', 0],
   ['👁 Xem trước bản in', () => {mauXem = 'tt22'; xemTT22(h.ma, (d.nam || (ns[0] || ['2025-2026'])[0]), banXuat)}],
   ['🖨 Xuất', () => {
     if (!mucDich) {canhMD = 1; toast('⛔ Chưa chọn mục đích xuất — Luật BVDLCN 91/2025 bắt buộc'); xuatPDF(xuatD); return}
     canhMD = 0;
     const ten = {mot_nam: 'Học bạ một năm', day_du: 'Học bạ đầy đủ', chuyen_truong: 'Bản chuyển trường', phieu: 'Phiếu kết quả môn học của nhà trường'}[banXuat];
     toast(`Đã xuất <b>${ten}</b> · mẫu <b>TT 22</b> · mục đích "<b>${mucDich}</b>" · ghi audit`
      + (ketNoiSo ? ' · <b>mã và QR học bạ số</b> của hệ thống tập trung Sở / Bộ' : ' · <b>không có mã tra cứu và QR</b> — chưa kết nối hệ thống tập trung')
      + (banCoAnh(banXuat) && khaiAnh ? ' · có ảnh chữ ký ⇒ in kèm <b>dải giá trị pháp lý</b>'
         : banXuat === 'chuyen_truong' ? ' · <b>không ảnh chữ ký</b> · ký số HT + ký số tổ chức' : ''));
   }]]);
}

/* ===== móc nối ===== */
function actTT22(a, d) {
 d = d || {};
 if (a === 'mau') {
  mauXem = d.m;
  if (d.m === 'tt22') xemTT22(d.ma, d.nam, (mauCtx && mauCtx.ban) || 'mot_nam');
  else xemHB(d.ma, d.nam);
  return true;
 }
 if (a === 'khaianh') {
  khaiAnh = +d.v;
  toast(khaiAnh ? 'Một số người ĐÃ khai ảnh chữ ký (M4.1)'
                : 'CHƯA ai khai ảnh chữ ký — mọi ô ảnh để TRỐNG, bản in vẫn hợp lệ');
  if (mauCtx) {mauXem === 'tt22' ? xemTT22(mauCtx.ma, mauCtx.nam, mauCtx.ban) : xemHB(mauCtx.ma, mauCtx.nam)}
  return true;
 }
 /* BADD 30/9/2026 — nhanh 'taidau' (chan tai anh dau ra tep roi, H5-P3) DA GO:
    khong con anh dau de ma tai. Rang buoc 40 xoa han. */
 return false;
}
function chgTT22(e) {
 const bx = e.target.closest('[data-bx]');
 if (bx) {banXuat = bx.dataset.bx; xuatPDF(xuatD); return true}
 if (e.target.id === 'mucdich') {mucDich = e.target.value; if (mucDich) canhMD = 0; return true}
 if (e.target.id === 'ketnoi') {ketNoiSo = e.target.checked ? 1 : 0; xuatPDF(xuatD); return true}   /* HB24 */
 return false;
}
</script>
