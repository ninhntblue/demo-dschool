<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1.1 Hồ sơ học sinh — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
mark{background:#fef08a;padding:0 1px;border-radius:2px}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:206px;flex:0 0 206px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:250px}
/* multi-select chip dropdown */
.ms{position:relative}
.msb{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap}
.msb.act{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.msb .cnt{background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:8px}
.msp{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:0 8px 22px rgba(15,23,42,.14);min-width:190px;max-height:250px;overflow-y:auto;z-index:20;display:none;padding:5px}
.msp.on{display:block}
.mso{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:12.5px;cursor:pointer}
.mso:hover{background:var(--bg)}
.mso input{width:15px;height:15px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

/* layout tang 2 */
.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:flex-basis .2s}
.stage.open .listw{flex:1 1 0;max-width:none}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;cursor:pointer}
.grow:hover{background:#eef2f7}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.grow.g2{background:#fcfdfe;padding-left:26px;font-weight:600}
.miss{color:var(--amber);font-weight:700}
.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px;
 grid-template-columns:2fr 1fr 1.35fr 1fr 1.4fr}
.stage.open .hrow{grid-template-columns:1.7fr 1.1fr}
.stage.open .hcol{display:none}
.stage.open .hcol.keep{display:block}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.sub{padding-left:40px}
.who2{display:flex;gap:9px;align-items:center;min-width:0}
.ava2{width:32px;height:32px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 32px}
.who2 .i{min-width:0}
.who2 .i b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who2 .i span{font-size:11px;color:var(--ink3)}
.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
 grid-template-columns:2fr 1fr 1.35fr 1fr 1.4fr}
.stage.open .hdrow{grid-template-columns:1.7fr 1.1fr}
.stage.open .hdrow div{display:none}
.stage.open .hdrow div.kc{display:block}

.hs2{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap;display:inline-block}
.hs2.full{background:var(--green-soft);color:var(--green)}
.hs2.warn{background:var(--amber-soft);color:var(--amber)}
.hs2.late{background:var(--red-soft);color:var(--red)}
.hs2.tmp{background:var(--bg);color:var(--ink2)}
.stt{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.stt.dh{background:var(--green-soft);color:var(--green)}
.stt.bl{background:var(--amber-soft);color:var(--amber)}
.stt.cxl{background:#e0e7ff;color:#3730a3}
.stt.tn{background:#ede9fe;color:#5b21b6}.stt.cd{background:var(--bg);color:var(--ink2)}
.stt.thh{background:var(--bg);color:var(--ink2)}
.viewer{display:grid;grid-template-columns:1fr 200px;gap:13px}
@media(max-width:700px){.viewer{grid-template-columns:1fr}}
.vpage{background:#334155;border-radius:10px;min-height:290px;display:grid;place-items:center;position:relative;overflow:hidden}
.vsheet{background:#fff;width:78%;height:88%;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:14px 16px;font-size:9px;color:#334155;line-height:1.7;overflow:hidden}
.vsheet h4{font-size:10px;text-align:center;font-weight:800;margin-bottom:7px}
.vsheet .ln{height:5px;background:#e2e8f0;border-radius:3px;margin:5px 0}
.vtool{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.86);border-radius:999px;padding:4px 6px;display:flex;gap:3px}
.vtool button{color:#e2e8f0;font-size:11.5px;padding:3px 9px;border-radius:999px}
.vtool button:hover{background:#334155;color:#fff}
.vmeta{font-size:11.5px}
.vmeta .r{padding:6px 0;border-bottom:1px solid var(--line)}
.vmeta .r b{display:block;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.locked{background:#f8fafc;border:1px solid var(--line2);color:var(--ink2);padding:10px 13px;border-radius:9px;font-size:12.5px;margin-bottom:12px;display:flex;gap:9px;align-items:flex-start}
.flags{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.fl{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px}
.fl.uu{background:#fce7f3;color:#9d174d}.fl.di{background:var(--amber-soft);color:var(--amber)}
.fl.no{background:var(--red-soft);color:var(--red)}.fl.kl{background:#ede9fe;color:#5b21b6}

/* panel */
.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ava3{width:50px;height:50px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:17px;font-weight:700;flex:0 0 50px}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sdband{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:8px 0 0;padding:8px 11px;
 border:1px solid #bbf7d0;background:#f0fdf4;border-radius:9px;font-size:12px}
.sdband.roi{border-color:#fecaca;background:var(--red-soft)}
.sdband .v{font-weight:800;color:#166534}
.sdband.roi .v{color:#991b1b}
.sdband .ns{font-weight:800;color:#9d174d}
.sdband .lb{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.sdband .lk{color:var(--brand);font-weight:600;cursor:pointer}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.ptabs{display:flex;gap:2px;padding:0 11px;border-bottom:1px solid var(--line);background:#fafbfc;overflow-x:auto}
.ptab{padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptab.on{color:var(--brand);border-bottom-color:var(--brand);background:#fff}
.pbody{padding:14px 15px;max-height:calc(100vh - 250px);overflow-y:auto}

.grp{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.gh{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12px;font-weight:700}
.gh .sp{flex:1}
.gb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr auto;gap:11px;align-items:center;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f.t2{background:var(--amber-soft)}
.f.t3{background:#f8fafc}
.f.lack{background:var(--red-soft);box-shadow:inset 3px 0 0 var(--red)}
.f .k{color:var(--ink2);font-size:12.5px;display:flex;align-items:center;gap:6px}
.f .v{font-weight:600;min-width:0}
.f.t3 .v{font-weight:500;color:var(--ink2)}
.f input.ed{width:100%;border:1px solid var(--brand);border-radius:7px;padding:5px 8px;font-size:13px}
.lo{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.lo.l1{background:var(--red)}.lo.l2a{background:var(--amber)}.lo.l2b{background:#6366f1}.lo.l3{background:var(--line2)}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap;margin-left:6px}
.rolnk:hover{background:#e0e7ff}
.rotag{font-size:10px;color:var(--ink3);font-weight:600;white-space:nowrap}
.pending{font-size:10.5px;background:#fff;border:1px solid var(--amber);color:var(--amber);padding:1px 7px;border-radius:999px;font-weight:600;white-space:nowrap}
.lacktag{font-size:10.5px;background:#fff;border:1px solid var(--red);color:var(--red);padding:1px 7px;border-radius:999px;font-weight:700;white-space:nowrap}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}.st2.n{background:var(--bg);color:var(--ink2)}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.chk{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:13px}
.chkr{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px}
.chkr .lb{flex:1}
.chkr .pr{font-weight:700}

.tl{border-left:2px solid var(--line);margin-left:7px;padding-left:15px}
.tli{position:relative;padding:8px 0;font-size:12.5px}
.tli::before{content:"";position:absolute;left:-21px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.tli.man::before{background:var(--amber)}.tli.int::before{background:var(--violet)}
.tli b{display:block;font-weight:600}
.tli .mm{color:var(--ink3);font-size:11.5px;display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.tli .mm code{background:var(--bg);padding:0 5px;border-radius:4px;font-size:10px;font-weight:700;color:var(--brand)}
/* F5 — năm loại sự kiện + lớp ghi chú nội bộ (P15) */
.q-ht{--c:#2563eb}.q-tt{--c:#ca8a04}.q-hd{--c:#059669}.q-kl{--c:#b4536b}.q-khac{--c:#64748b}.q-gc{--c:#7c3aed}
.qtband{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12px;color:var(--ink2);margin-bottom:10px;display:flex;flex-direction:column;gap:3px}
.qtbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.qtbar .lbq{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.qtbar .spacer{flex:1}
.qchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:12px;background:#fff;color:var(--ink3)}
.qchip i{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.35}
.qchip.on{color:var(--ink);border-color:var(--c);font-weight:600}
.qchip.on i{opacity:1}
.qchip span{font-size:10.5px;color:var(--ink3);font-weight:700}
.qchip.q-gc{border-style:dashed}.qchip.q-gc i{background:#fff;border:2px dashed var(--c);width:7px;height:7px}
.qsep{width:1px;height:18px;background:var(--line2);margin:0 3px}
.qtan{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:5px;margin-left:4px}
.ygrp{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden}
.yh{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#f8fafc;cursor:pointer;font-size:12.5px;flex-wrap:wrap}
.yh .ar{color:var(--ink3);font-size:10px;width:10px}
.yh .ct{margin-left:auto;color:var(--ink3);font-size:11.5px}
.ygrp.op .yh{border-bottom:1px solid var(--line)}
.ygrp .tl{margin:6px 12px 6px 19px}
.ycur{font-size:10px;font-weight:700;background:var(--brand-soft);color:var(--brand);padding:1px 7px;border-radius:999px}
.ycur.hh{background:var(--green-soft);color:var(--green)}
.tli.q::before{background:var(--c)}
.tli.q-gc::before{background:#fff;border:2px dashed var(--c)}
.tli .qtype{color:var(--c);font-weight:700}
.tli.thuhoi>b{color:var(--ink3)}
.tli.an{opacity:.62}
.qst{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:3px;white-space:nowrap}
.qst.th{background:var(--bg);color:var(--ink2);border:1px solid var(--line2)}
.qst.dc{background:#e0f2fe;color:#075985}
.qst.an{background:var(--bg);color:var(--ink2);white-space:normal}
.qlock{font-size:10.5px;color:var(--ink3)}
.tli .act{display:flex;gap:5px;margin-top:4px;align-items:center}
.qtnone{padding:8px 0;color:var(--ink3);font-size:12px}
.badge-int{font-size:9.5px;font-weight:700;background:#ede9fe;color:#5b21b6;padding:1px 6px;border-radius:4px}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:640px;max-width:94vw;max-height:86vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}

.dcsw{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}

function hsRow(h,sub){
 const [c,lb,n,na,nb]=hsState(h), fl=[];
 if(h.uu&&['DQ','VT','GVCN','KT','HT','PH'].includes(role))fl.push('<span class="fl uu">Ưu tiên</span>');
 if(h.di&&['DQ','VT','GVCN','YT','HT','PH'].includes(role))fl.push('<span class="fl di">Dị ứng</span>');
 if(h.no&&['DQ','VT','GVCN','KT','HT'].includes(role))fl.push('<span class="fl no">Nợ quá hạn</span>');
 if(h.kl&&['DQ','VT','GVCN','HT'].includes(role))fl.push('<span class="fl kl">Thời hiệu KL</span>');
 const q=$('#q')?.value.trim();
 const hl=t=>q?t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'):t;
 /* TKPH-1A: ⛔ khái niệm «Liên hệ chính» (PH8) — cột hiện ô đầu tiên CÓ SỐ theo thứ tự hồ sơ cha → mẹ → người giám hộ; cờ `chinh` trong dữ liệu giữ nguyên, ⛔ đọc */
 const lhP=[h.cha,h.me,h.gh].filter(p=>p&&p.sdt)[0]||{n:'—',sdt:''};
 const lienhe=R().lienhe!=='none'?`${lhP.n}<br><span style="color:var(--ink3)">${lhP.sdt}</span>`:'<span style="color:var(--ink3)">—</span>';
 return `<div class="hrow ${sub?'sub':''} ${cur===h.id?'on':''}" data-id="${h.id}">
  <div class="who2"><div class="ava2">${h.i}</div><div class="i"><b>${hl(h.n)}</b>
   <span>${sub?h.ma:h.dt+' · '+(h.lop||'<b style="color:#4338ca">Chưa xếp lớp</b>')}</span>${fl.length?`<div class="flags">${fl.join('')}</div>`:''}</div></div>
  <div class="hcol">${h.ns}<br><span style="color:var(--ink3)">${h.gt}</span></div>
  <div class="hcol keep"><span class="hs2 ${c}">${lb}</span>${n?`<br><span style="font-size:11px;color:var(--ink3)">thiếu ${n}: ${missTxt(na,nb)}</span>`:''}
   ${(()=>{const s=ngState(h);return s.tt==='du'?'':`<br><span class="hs2 ${NGMAU[s.tt]}" style="font-size:10.5px;margin-top:3px" title="Gia đình: ${s.gd.join(' · ')||'—'}&#10;Nhà trường: ${s.nt.join(' · ')||'—'}">${ngChu(s)}</span>`})()}</div>
  <div class="hcol"><span class="stt ${h.tt}">${h.tt==='dh'?'Đang học':h.tt==='cxl'?'Chờ xếp lớp':ROIT[h.tt]||'Bảo lưu'}</span></div>
  <div class="hcol" style="font-size:11.5px">${lienhe}</div></div>`}

function listTab(){
 const r=rows(), q=($('#q')?.value||'').trim();
 const flat = !!q || r.length===0 || new Set(r.map(h=>h.lop)).size<=1 || role==='GVCN';
 const noDT = hdtVal()!=='Toàn trường' || new Set(r.map(h=>h.dt)).size<=1;
 let body='';
 if(!r.length)body=`<div class="empty">Không có học sinh phù hợp bộ lọc</div>`;
 else if(flat)body=r.map(h=>hsRow(h)).join('');
 else{
  const dts=[...new Set(r.map(h=>h.dt))].sort();
  body=dts.map(d=>{
   const rd=r.filter(h=>h.dt===d), key='d-'+d, op=openG[key]!==false;
   const lops=[...new Set(rd.map(h=>h.lop))].sort();
   const inner=lops.map(l=>{const rl=rd.filter(h=>h.lop===l),k2='l-'+d+l,o2=openG[k2]!==false;
    if(!l){
     /* GCHS-1A: nhan theo NGUON. Nhieu nguon trong cung mot diem truong thi dem
        tung nguon — mot nhan chung la deep-link chet voi 9 khoi (M1.1 §2). */
     const dem={};rl.forEach(h=>{const t=dichXL(h)[1];dem[t]=(dem[t]||0)+1;});
     const ts=Object.keys(dem),nhan=ts.length===1?ts[0]:ts.map(t=>dem[t]+' '+t).join(' · ');
     return `<div class="grow g2" data-g="${k2}"><span class="ar">${o2?'▼':'▶'}</span>⏳ Chưa xếp lớp
      <span class="ct"><span>${rl.length} HS</span><span class="miss">${nhan}</span></span></div>
     ${o2?rl.map(h=>hsRow(h,1)).join(''):''}`;}
    const ml=rl.filter(h=>hsState(h)[0]!=='full').length;
    return `<div class="grow g2" data-g="${k2}"><span class="ar">${o2?'▼':'▶'}</span>Lớp ${l}
      <span class="ct"><span>${rl.length} HS</span>${ml?`<span class="miss">${ml} thiếu hồ sơ</span>`:''}</span></div>
     ${o2?rl.map(h=>hsRow(h,1)).join(''):''}`}).join('');
   const md=rd.filter(h=>hsState(h)[0]!=='full').length;
   return noDT? inner
    : `<div class="grow" data-g="${key}"><span class="ar">${op?'▼':'▶'}</span>${d}
       <span class="ct"><span>${rd.length} HS</span>${md?`<span class="miss">${md} thiếu hồ sơ</span>`:''}</span></div>
      ${op?inner:''}`}).join('');
 }
 return `${dlBang()}${filters()}
  <div class="stage ${cur?'open':''}">
   <div class="listw">
    ${flat&&q?`<div class="ro" style="margin:9px 13px">🔍 Đang tìm kiếm — danh sách <b>tự phẳng hóa</b>, mỗi dòng hiện Điểm trường · Lớp</div>`:''}
    <div class="hdrow"><div class="kc">Học sinh</div><div>Ngày sinh</div><div class="kc">Hồ sơ</div><div>Trạng thái</div><div>Liên hệ gia đình</div></div>
    ${body}
    <div class="lgd"><span>Gom nhóm: ${flat?'<b>phẳng</b> (đang tìm kiếm hoặc chỉ 1 lớp)':noDT?'<b>Lớp → HS</b> (header đã chọn 1 ĐT)':'<b>ĐT → Lớp → HS</b>'}</span></div>
   </div>
   <div class="panel" id="panel">${cur?panelHTML():''}</div>
  </div>`}

const TANG={'Họ và tên':2,'Ngày sinh':2,'Giới tính':2,'Số định danh cá nhân':2,'Nơi sinh':2,'Dân tộc':2,
 'Tôn giáo':2,'Địa chỉ thường trú':2,'Địa chỉ liên hệ hiện tại':1,'Mã định danh CSDL ngành':3,
 'Điểm trường':3,'Lớp':3,'Hệ đào tạo':3,'Trạng thái':3,'Mã học sinh':3,'Số điện thoại':1,'Email':1,
 'Họ tên':2,'Năm sinh':2,'Nghề nghiệp':2,'Nơi công tác':2,'Vai trò':3,
 /* cum CSDL 19/9/2026 */
 'Tên gọi khác':2,'Dân tộc trên giấy khai sinh':2,'Nơi khai sinh':2,'Quê quán':2,'Quốc tịch':2,
 'CCCD — Ngày cấp':2,'CCCD — Nơi cấp':2,'Số hộ chiếu':2,'Hộ chiếu — Ngày cấp':2,'Hộ chiếu — Nơi cấp':2,
 'Thứ tự trong lớp':3,'Quốc tịch thứ hai':2,'Nơi thường trú':2,'Tạm trú':2,'Chỗ ở hiện tại':1};

/* ===== RSHS-1B (23/9/2026) — O NHAP THEO KIEU, thay cho MOT khuon o text duy nhat =====
   Truoc do moi truong deu ra `<input class="ed">`, ke ca ngay thang va dan toc.
   🛑 ⛔ KHONG ep moi «ngay» ve kieu Date — ho so truong hoc co BA loai khac nhau:
     date  ngay day du   Ngay sinh HS · CCCD/Ho chieu Ngay cap · moc Qua trinh hoc tap
     year  NAM           Nam sinh cua cha, me, nguoi giam ho  (demo gieo `1957`, `1978`)
     month thang/nam     moc cu tru  Tu · Den
   Ep `Nam sinh` thanh Date la BIA ra ngay va thang — va cai bia ay DI LEN CSDL nganh
   (M10.8 §3.4a co dong anh xa Nam sinh cua nguoi giam ho). Dung loai sai ma HDCS ③ da cam:
   «chua biet» ⛔ khong duoc bien thanh mot gia tri trong nhu da biet. */
const KIEU_O={
 'Ngày sinh':'date','CCCD — Ngày cấp':'date','Hộ chiếu — Ngày cấp':'date',
 'Năm sinh':'year',
 'Dân tộc':'dantoc','Dân tộc trên giấy khai sinh':'dantoc',
 'Giới tính':'gioitinh'};
const HOM_NAY=new Date().toISOString().slice(0,10);
const dmy2iso=s=>{const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((s||'').trim());
 return m?m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2):''};
const iso2dmy=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]:''};

function oDanToc(v,cho){
 const cur=(v||'').trim();
 const la=DANTOC.some(d=>d[1]===cur);
 return `<select class="fs" ${cho||''}>
   <option value=""${cur?'':' selected'}>— chọn dân tộc —</option>
   ${DANTOC.map(d=>`<option value="${d[1]}"${d[1]===cur?' selected':''}>${d[0]} · ${d[1]}${d[2]?' ('+d[2].split(' · ')[0]+'…)':''}</option>`).join('')}
   ${cur&&!la?`<option value="${cur}" selected>⚠ ${cur} — ngoài danh mục</option>`:''}
  </select>${cur&&!la?' <span class="cchtag">⚠ chưa chuẩn hóa</span>':''}`}

function oNhap(k,v){
 const kieu=KIEU_O[k];
 if(kieu==='date'){const iso=dmy2iso(v);
  return `<input class="ed" type="date" max="${HOM_NAY}" value="${iso}">`+
   (v&&!iso?` <span class="cchtag">⚠ chưa chuẩn hóa — giữ nguyên «${v}»</span>`:'')}
 if(kieu==='year')
  return `<input class="ed" type="number" min="1900" max="${new Date().getFullYear()}" step="1" placeholder="VD: 1978" value="${v||''}"> <span class="rotag">năm — 4 chữ số</span>`;
 if(kieu==='dantoc') return oDanToc(v);
 if(kieu==='gioitinh')
  return `<select class="fs"><option value=""${v?'':' selected'}>— chọn —</option><option${v==='Nam'?' selected':''}>Nam</option><option${v==='Nữ'?' selected':''}>Nữ</option></select>`;
 return `<input class="ed" value="${v||''}">`}

/* RSHS-1B rang buoc `a` — ngay sinh lech qua ±3 tuoi so voi tuoi chuan cua khoi lop thi
   CANH BAO MEM, 🛑 ⛔ KHONG CHAN: hoc som, hoc muon, luu ban deu la ca binh thuong.
   (Ngay tuong lai thi chan cung — `max` cua chinh o nhap.) */
function nhacTuoi(h,v){
 const iso=dmy2iso(v); if(!iso||!h.lop) return '';
 const khoi=parseInt(String(h.lop).match(/^\d+/)||[0],10); if(!khoi) return '';
 const nam=new Date().getFullYear(), tuoi=nam-(+iso.slice(0,4));
 const chuan=khoi+6, lech=tuoi-chuan;
 if(Math.abs(lech)<=3) return '';
 return ` <span class="cchtag" style="border-color:#fcd34d;color:#92400e" title="Học sớm, học muộn, lưu ban đều là ca bình thường — không chặn">⚠ ${tuoi} tuổi · lệch ${lech>0?'+':''}${lech} so với khối ${khoi}</span>`}

function fld(k,v,h,gid){
 const t=TANG[k]||3, lo=LOAI[k]||3;
 /* HS chua tung co lop: phan lop lan dau o M1.4, khong phai Chuyen lop o M1.7 */
 let ro=RO[k];
 if(ro&&k==='Lớp'&&h.tt==='cxl')ro=[dichXL(h)[0],'Phân lớp lần đầu — HS chưa từng có lớp, chưa phải nghiệp vụ Chuyển lớp — '+dichXL(h)[1]];
 const lack=(h.hoso.l2.includes(k)||h.hoso.l1.includes(k));
 const pend=h.pending.includes(k);
 const ed = !ro && !daRoi(h) && editGrp===gid && ((R().edit===1)||(R().edit==='tang1'&&t!==3));
 /* vai tro khong co quyen o Menu chu thi khong hien deep-link */
 const canGo = ro && ro[0] && ['DQ','VT','HT','PHT_DT'].includes(role);
 return `<div class="f ${lack?'lack':'t'+t}">
  <div class="k">${ro?'🔗':t===3?'🔒':t===2?'📝':''}${cham(k)}${k}</div>
  <div class="v">${ed?oNhap(k,v):(v||'<span style="color:var(--ink3);font-weight:400">— chưa có —</span>')}${k==='Ngày sinh'?nhacTuoi(h,v):''}${canGo?` <span class="rolnk" data-ro="${k}">→ ${ro[0]}</span>`:''}</div>
  <div>${pend?'<span class="pending">Chờ duyệt</span>':lack?'<span class="lacktag">Còn thiếu</span>':laNG(k)&&!v?ngTag(h):ro?`<span class="rotag" title="${ro[1]}">chỉ đọc</span>`:''}</div></div>`}

const GRP_RO={gsk:'M6.6'};   /* nhom la ban chieu chi doc tu Menu khac */
function grp(title,gid,fields,h,note){
 const allRO = fields.every(f=>RO[f[0]]) || !!GRP_RO[gid];
 /* B4: HS da roi truong -> ho so khoa sua, moi sua doi phai qua nghiep vu dinh chinh o M1.3 */
 const canEdit = !allRO && !daRoi(h) && (R().edit===1 || (R().edit==='tang1'));
 const locked = fields.some(f=>h.pending.includes(f[0]));
 const ed=editGrp===gid;
 return `<div class="grp"><div class="gh">${title}<span class="sp"></span>
   ${GRP_RO[gid]?`<span class="rotag">chỉ đọc</span> <span class="rolnk" data-go="${GRP_RO[gid]}">→ ${GRP_RO[gid]}</span>`:
     locked?'<span class="pending">Nhóm khóa — có yêu cầu chờ duyệt</span>':
     canEdit?(ed?`<button class="btn xs p" data-save="${gid}">Lưu nhóm</button> <button class="btn xs" data-cancel="1">Hủy</button>`
                :`<button class="btn xs" data-eg="${gid}">✎ Sửa nhóm</button>`):''}</div>
  <div class="gb">${fields.map(f=>f[0]==='@raw'?f[1]:fld(f[0],f[1],h,gid)).join('')}</div>
  ${note?`<div style="padding:8px 12px;border-top:1px solid #f1f5f9;font-size:11.5px;color:var(--ink3)">${note}</div>`:''}</div>`}

function AB(h){
 const r=R(),out=[];
 if(daRoi(h))out.push(`<div class="locked">🔒<div><b>Hồ sơ đã khóa — ${ROIT[h.tt].toLowerCase()}.</b>
   ${h.roi||''}<br>Hồ sơ <b>giữ vĩnh viễn</b> để tra cứu và cấp bản sao, nhưng <b>không sửa được nữa</b> —
   học bạ và các quyết định đã ký dựa trên dữ liệu này. Cần đính chính thì làm tại <b>M1.3 Học bạ điện tử</b>.
   <span class="rolnk" data-go="M1.3">→ M1.3</span></div></div>`);
 out.push(`<div class="ro">Mỗi trường có <b>hai nhãn</b>: nền vàng 📝 = tầng 2 (cần duyệt), nền xám 🔒 = tầng 3 (chỉ trường ghi).
  <b>🔗 = chỉ đọc tại Menu này</b>, phải sang Menu khác chạy đúng nghiệp vụ mới sửa được.<br>
  Chấm màu = <b>mức yêu cầu</b> <i>(§3.0.5)</i> — <span class="lo l1" style="display:inline-block"></span> ① bắt buộc (tạo hồ sơ) ·
  <span class="lo l2a" style="display:inline-block"></span> ② <b>gia đình bổ sung</b> ·
  <span class="lo l2b" style="display:inline-block"></span> ② <b>nhà trường hoàn thiện</b> ·
  <span class="lo l3" style="display:inline-block"></span> ③ nên có. <b>📋</b> cạnh chấm = trường ② đếm ở dòng <b>Khai báo CSDL ngành</b>, ⛔ không ở «Đủ hồ sơ».
  Không chấm = trường <b>chỉ có khi có sự việc</b> hoặc <b>theo nguồn</b> (menu khác sinh). Trường viền đỏ = <b>còn thiếu</b>.</div>`);
 out.push(grp('🔒 Thông tin cơ bản','g0',[['Họ và tên',h.n],['Ngày sinh',h.ns],['Giới tính',h.gt]],h,
  'Mọi vai trò truy cập Menu đều thấy nhóm này.'));
 out.push(grp('🎓 Học tập','ght',
  [['Mã học sinh',h.ma],['Điểm trường',h.dt],['Lớp',h.lop],['Hệ đào tạo','Đại trà'],
   ['Trạng thái',h.tt==='dh'?'Đang học':h.tt==='cxl'?'Chờ xếp lớp':'Đang bảo lưu'],
   ['Mã định danh CSDL ngành',h.cs]],h,
  'Trường có 🔗 <b>chỉ đọc tại đây</b> — thuộc sở hữu của Menu khác, bấm <b>→ Mxx</b> để sang đúng nghiệp vụ, mở sẵn với học sinh này.<br>'+
  '<b>Mã định danh CSDL ngành nhập được tại đây</b> — văn thư đọc từ học bạ cấp trước hoặc giấy chứng nhận. M10.8 <b>dùng mã này để đối khớp</b> khi đồng bộ, và có thể ghi đè khi pull về từ Sở.'));

 if(r.sk!=='none'){
  const f=[]; if(r.sk==='full')f.push(['Tình trạng sức khỏe',h.suckhoe]);
  f.push(['Dị ứng',h.diung||'Không']);
  out.push(grp('🩺 Sức khỏe','gsk',f,h,
   'Projection chỉ đọc từ <b>M6.6 Y tế học đường</b>.'))}

 if(r.lienhe==='none'){
  out.push(`<div class="warn">🔒 Vai trò <b>${r.n}</b> không có quyền xem <b>thông tin liên hệ gia đình</b>.
   Cần trao đổi với phụ huynh thì dùng <b>M8.2 Nhắn tin</b> — kênh chat không lộ số điện thoại.</div>`)}
 else if(r.lienhe==='khancap'||r.lienhe==='nhacno'){
  const p=h.cha.chinh?h.cha:h.me;
  out.push(grp(r.lienhe==='khancap'?'📞 Liên hệ khẩn cấp':'📞 Liên hệ nhắc công nợ','glh',
   [['Họ tên',p.n],['Số điện thoại',p.sdt]],h,
   'Lát cắt riêng — không hiển thị nghề nghiệp, nơi công tác, hoàn cảnh gia đình.'))}
 else{
  /* ===== nhom dinh danh: +8 truong cua cum CSDL (19/9/2026 — §6.3.6) ===== */
  /* ✅ P-1: co Quoc tich thu hai thi khoi ho chieu TU MO */
  const hcMo = h.qt!=='Việt Nam' || !!h.qt2 || h.hc_mo || !!h.hc_so;
  const f1=[['@raw',anhRow(h)],['Số định danh cá nhân',h.cccd]];   /* MYC-2C — ô ảnh đầu nhóm (§6.3.6b) */
  if(h.cccd){f1.push(['CCCD — Ngày cấp',h.cccd_nc],['CCCD — Nơi cấp',h.cccd_nn])}
  f1.push(['Tên gọi khác',h.tgk],['Dân tộc',h.dan],['Dân tộc trên giấy khai sinh',h.dan_ks]);
  if(h.dan_ks&&h.dan&&h.dan_ks!==h.dan)
   f1.push(['@raw',`<div class="ckshint">⚠ <b>Dân tộc trên giấy khai sinh</b> lệch với <b>Dân tộc</b> đang ghi — đề nghị gia đình làm thủ tục đính chính theo giấy khai sinh. ⛔ <b>Không chặn lưu.</b></div>`]);
  f1.push(['Tôn giáo',h.ton],['Quốc tịch',h.qt]);
  /* ✅ P-1 chot 19/9/2026 — chi hien khi bam ＋ hoac da co gia tri */
  if(h.qt2||h.qt2_mo){
   f1.push(['Quốc tịch thứ hai',h.qt2]);
   f1.push(['@raw',`<div class="ckshint" style="border-color:#c7d2fe;background:#eef2ff">🛑 <b>Khi đồng bộ lên CSDL ngành: mặc định đẩy <u>Quốc tịch</u> — ô thứ nhất</b> <i>(${h.qt})</i>.
     ⛔ Không đẩy ô thứ hai, ⛔ không ghép hai giá trị vào một ô của cổng — ô của cổng <b>chỉ nhận một giá trị</b>.
     Em vừa có quốc tịch Việt Nam vừa có quốc tịch khác ⇒ ô thứ nhất ghi <b>Việt Nam</b>: em học theo <b>chế độ học sinh Việt Nam</b>.
     Ô thứ hai <b>nằm lại trong hồ sơ của trường</b> — hồ sơ giàu hơn ô nhận của cổng, ⛔ không cắt bớt cho khớp <i>(CS-S4)</i>.</div>`]);
  } else f1.push(['@raw',`<div class="f"><div class="k">Quốc tịch thứ hai</div><div class="v" style="font-weight:400;color:var(--ink3)">Ẩn — ca rất ít, chỉ hiện khi bấm
     <span class="rolnk" data-qt2mo="1">＋ Có quốc tịch thứ hai</span></div><div></div></div>`]);
  f1.push(['@raw',dcRow(h,'nsinh','Nơi sinh','g1')]);
  f1.push(['@raw',dcRow(h,'nksinh','Nơi khai sinh','g1')]);
  f1.push(['@raw',dcRow(h,'qq','Quê quán','g1')]);
  f1.push(['@raw',`<div class="ckshint" style="border-color:#fde68a;background:#fffbeb">⚠ <b>Quê quán là ca điển hình của chế độ tự do</b> — quê quán theo <b>đơn vị hành chính đã giải thể</b> thì để tự do, ⛔ <b>không ép chọn mã hiện hành</b>: mã hiện hành trỏ tới một xã khác, ghi nó vào hồ sơ là <b>ghi sai lịch sử của một người</b>.</div>`]);
  f1.push(['Thứ tự trong lớp',h.ttlop?String(h.ttlop):'']);
  if(hcMo){f1.push(['Số hộ chiếu',h.hc_so],['Hộ chiếu — Ngày cấp',h.hc_nc],['Hộ chiếu — Nơi cấp',h.hc_nn])}
  else f1.push(['@raw',`<div class="f"><div class="k">Hộ chiếu</div><div class="v" style="font-weight:400;color:var(--ink3)">Ẩn — chỉ hiện khi <b>Quốc tịch ≠ Việt Nam</b> hoặc bấm <b>＋ Có hộ chiếu</b>
     <span class="rolnk" data-hcmo="1">＋ Có hộ chiếu</span></div><div></div></div>`]);
  out.push(grp('👤 Thông tin định danh','g1',f1,h,
   'Tám trường thêm 19/9/2026 <i>(cụm CSDL · §6.3.6)</i>. <b>Thứ tự trong lớp</b> máy sinh theo alphabet khi xếp lớp, văn thư sửa tay được; trùng trong cùng lớp ⇒ ⚠, ⛔ không chặn. <b>Số CCCD giữ nguyên cách lưu</b> — hai ô Ngày cấp / Nơi cấp chỉ mở khi đã có số.'));

  /* ===== nhom dia chi: cum sau phan, HAI che do nhap (§6.3.8 — ✅ CS-4) ===== */
  out.push(grp('🏠 Địa chỉ','g2',[
    ['@raw',dcRow(h,'tt_ho','Nơi thường trú','g2')],
    ['@raw',dcRow(h,'tt_tam','Tạm trú','g2')],
    ['@raw',dcRow(h,'hien_tai','Chỗ ở hiện tại','g2')]],h,
   'Mỗi ô là <b>cụm sáu phần</b> của HDCS ① — chính quyền <b>hai cấp</b>, ⛔ không có cấp huyện <i>(TT 13/2025 · TT 26/2025)</i>.<br>'+
   '🛑 Chế độ <b>Nhập tự do</b> là <b>chế độ nhập hợp lệ</b>, ⛔ <b>không phải lỗi</b>: ⛔ không chặn lưu, ⛔ không chặn tạo hồ sơ, ⛔ không sinh việc ở M0.2, ⛔ không vào trạng thái hoàn thiện hồ sơ.<br>'+
   '🗂 Danh mục hành chính <b>34 tỉnh, thành phố</b> — <span class="cchtag">bản nạp sẵn — chưa đồng bộ</span> ⛔ <b>không phải cấu hình của trường</b>: dữ liệu toàn quốc, M10.6 giữ <b>zero-write</b>, kéo về qua <b>M10.8</b>. Danh sách Phường/Xã chỉ nạp cho tỉnh có trong dữ liệu mẫu — ⛔ <b>không nạp một danh sách sưu tầm trên mạng</b>.<br>'+
   'Nút <b>⇄ Chuẩn hóa</b> chỉ <b>gợi ý</b>, <b>người xác nhận</b> — 🛑 ⛔ <b>máy không bao giờ tự đổi</b>, dò sai thì sai im lặng. Đổi <b>hai chiều bất cứ lúc nào, không cần lý do</b>.<br>'+
   '⚠ Khi đẩy lên cổng: dòng ở chế độ tự do <b>nằm lại M10.8 tab ④ Việc chưa xong</b> — nhãn ⚠ không vô hại, nó là lý do dòng đó chưa lên được Sở.'));
  out.push(cutruGrp(h));
  out.push(nganhGrp(h));
  out.push(aceGrp(h));
  const per=(p,lb,g,who)=>grp(lb,g,[['Họ tên',p.n],['Quan hệ với học sinh',who==='cha'?'Cha':who==='me'?'Mẹ':'Người giám hộ'],
   ...(who==='gh'?[['@raw',ngRow('Năm sinh',p.ns,h,g)],['@raw',ngRow('Giới tính',p.gt,h,g)]]:[['Năm sinh',p.ns]]),   /* MYC-2C — cổng bắt khai cả ba ô của người giám hộ · RSHS-1A truyền gid */
   ['@raw',cccdRow(h,who,'CCCD',g)],['Nghề nghiệp',p.ngh],
   ['Nơi công tác',p.nc],['Số điện thoại',p.sdt],['Email',p.mail],
   ['Vai trò','Được phép đón HS']],h,   /* TKPH-1A — ⛔ «Liên hệ chính» (PH8) */

function genTL(h){
 if(TLX[h.id])return TLX[h.id];
 const kh=+((h.kh.match(/\d+/)||[6])[0]), sfx=(h.lop||'6A1').replace(/^\d+/,'');
 let y0=2026-(kh-6), yN=2026, x=[], nam=[];

 /* GCHS-1A 26/9/2026: em den tu LO NHAP thi he thong CHI biet nam hoc dang chon
    (M1.9 §4.1 — lo chi ghi vao nam hoc dang chon). Cac nam truoc do nam o so
    giay cua truong, KHONG co moc nao trong he thong: khong ket qua ca nam cua
    M3.1, khong quyet dinh len lop cua M3.3. Vi the y0 = yN — dung MOT nam, dung
    MOT moc «Nhap lo». Truoc phien nay ban ghi cxl duy nhat la khoi 6 nen y0 vo
    tinh bang yN va loi nay khong the lo ra. */
 if(h.tt==='cxl'&&NGV(h)==='lo')y0=yN;
 for(let y=y0,k=6;y<=yN;y++,k++){const nh=y+'-'+(y+1),lop=h.tt==='cxl'?'chưa xếp':k+sfx;nam.push([nh,lop]);

    nd:h.tt==='cxl'?('Nhập '+(lo?'lô — ':'học — ')+dichXL(h)[1]):'Nhập học lớp '+lop});}

   x.push(h.tt==='tn'&&y===yN?{nh,d:'15/06/'+(y+1),loai:'ht',src:'M3.4',ref:'QĐ-TN '+(y+1),nd:'Công nhận tốt nghiệp THCS'}

 if(h.tt==='bl')x.push({nh:NAM_HH,d:'21/09/2026',loai:'ht',src:'M1.6',ref:'QĐ-BL 2627-002',nd:'Bảo lưu kết quả học tập — nghỉ điều trị dài ngày'});

/* ===== GIU VI TRI CUON quanh render() — RSHS-1A, 23/9/2026 =====

   khung cuon bi dung lai va trinh duyet tra con tro ve 0. Bam bat ky nut nao trong
   tab Ca nhan / Gia dinh la mat cho dang doc.

   cung het loi; dat o tung handler thi nut them sau nay lai quen.  */
function khoaCuon(el){
 const c=(el.classList&&el.classList[0])||'';
 if(!c) return null;
 const ds=[...document.querySelectorAll('#content .'+c)];
 return c+'#'+ds.indexOf(el)}
function docCuon(){
 const m={_y:window.scrollY||0, _side:($('#side')||{}).scrollTop||0};
 document.querySelectorAll('#content [class]').forEach(el=>{
  if(el.scrollTop>0){const k=khoaCuon(el); if(k)m[k]=el.scrollTop}});
 return m}
function datCuon(m){
 Object.keys(m).forEach(k=>{
  if(k[0]==='_') return;
  const p=k.split('#'), el=document.querySelectorAll('#content .'+p[0])[+p[1]];
  if(el) el.scrollTop=m[k]});
 const sd=$('#side'); if(sd) sd.scrollTop=m._side;
 window.scrollTo(0,m._y)}

function dongTieuDeMacDinh(sh){
  if (/^MAU-/.test(a1Cua(sh))) return 2;              /* tệp mẫu hệ thống ⇒ dòng 2 */
  var rows = (sh && sh.o) || [];
  for (var r = 0; r < rows.length; r++) if ((rows[r] || []).some(function(v){ return !laTrong(v); })) return r + 1;
  return 1;
}
function vtBang(a, b){ return (a || []).slice().sort().join('|') === (b || []).slice().sort().join('|'); }
function soChung(a, b){ var s = {}; (b || []).forEach(function(x){ s[x] = 1; }); return (a || []).filter(function(x){ return s[x]; }).length; }

/* ───────────── ② kiểm khai báo đường nhập (HDMX ② mục 1–2) ───────────── */
B.kiemKhaiBao = function(duong){
  var loi = [];
  (duong.phan || []).forEach(function(pd){
    var cd = pd.cot_dich || [];
    cd.forEach(function(c){
      if (!c.kieu || !c.muc) loi.push('Cột đích «' + c.nhan + '» thiếu kieu hoặc muc — ⛔ dựng được L1 L2');
      var k = kieuCua(c);
      if (k.loai === 'danh_muc' && !((duong.danh_muc || {})[k.dm])) loi.push('Cột «' + c.nhan + '» trỏ danh mục «' + k.dm + '» mà đường nhập không khai');
      if (k.loai === 'ma_dinh_danh' && !(c.loai_ma && B.khuonMa[c.loai_ma])) loi.push('Cột «' + c.nhan + '» kiểu ma_dinh_danh thiếu loai_ma (khuôn đọc tham số M10.8 — ⛔ khai khuôn số cứng)');
      if (c.phai_gan && c.muc === 'bat_buoc') loi.push('Cột «' + c.nhan + '»: phai_gan chỉ đi với tuy_chon · co_dieu_kien (bat_buoc đã phải gán)');
    });
    (pd.nhom_phai_gan || []).forEach(function(n){
      (n.cum || []).forEach(function(cm){ cm.forEach(function(ma){ if (!cd.some(function(c){ return c.ma === ma; })) loi.push('nhom_phai_gan trỏ cột «' + ma + '» không có trong phần'); }); });
    });
    ['sdt', 'ho_ten', 'ngay', 'email'].forEach(function(kk){
      var ds = cd.filter(function(c){ return c.kieu === kk; });
      for (var i = 0; i < ds.length; i++) for (var j = i + 1; j < ds.length; j++){
        var cung = (pd.cap_de_nham || []).some(function(g){ return g.indexOf(ds[i].ma) >= 0 && g.indexOf(ds[j].ma) >= 0; });
        if (!cung) loi.push('«' + ds[i].nhan + '» và «' + ds[j].nhan + '» cùng kiểu ' + kk + ' mà ⛔ chung nhóm cap_de_nham — khai báo thiếu');
      }
    });
  });
  return loi;
};

/* ───────────── kho mẫu ───────────── */
function idMoi(loai){ B.kho.dem[loai]++; return (loai === 'mn' ? 'MN-' : 'MX-') + String(B.kho.dem[loai]).padStart(4, '0'); }
function napCongTy(ds, kho, loai){
  (ds || []).forEach(function(m){
    var id = m[loai === 'mn' ? 'mau_nhap_id' : 'mau_xuat_id'];
    if (kho.some(function(x){ return x[loai === 'mn' ? 'mau_nhap_id' : 'mau_xuat_id'] === id; })) return;
    var b = sao(m); b.nguon = 'cong_ty'; b.trang_thai = b.trang_thai || 'dung'; b.lich_su = b.lich_su || []; b.tao_boi = b.tao_boi || 'Công ty — phát hành kèm bản cập nhật'; b.tao_luc = b.tao_luc || '—';
    kho.push(b);
  });
}
/* ⑨ — mẫu gắn số hiệu mẫu đích CŨ ⇒ «cần rà lại», ⛔ tự áp, ⛔ tự nâng */
/* HDMX bản 2 ② mục 4 — một Feature NHIỀU mẫu đích: mẫu thuộc (ma_feature × tên gốc mẫu đích) */
function cungDuong(m, duong){ return m.duong_nhap.ma_feature === duong.ma_feature && tenMauGoc(m.duong_nhap.mau_dich) === tenMauGoc(duong.mau_dich); }
function raPhienBan(duong){
  B.kho.mauNhap.forEach(function(m){
    if (!cungDuong(m, duong) || m.trang_thai !== 'dung' || m.duong_nhap.mau_dich === duong.mau_dich) return;
    m.lich_su.push({boi:'Hệ thống', luc:bayGio(), thay_doi:'Mẫu đích đổi ' + m.duong_nhap.mau_dich + ' → ' + duong.mau_dich + ' — chuyển «cần rà lại», ⛔ tự áp'});
    m.trang_thai = 'can_ra_lai';
  });
}
function mauCuaDuong(duong, truong){
  return B.kho.mauNhap.filter(function(m){ return cungDuong(m, duong) && (m.nguon === 'cong_ty' || m.truong === truong); });
}

/* ═══════════════ KHUNG HIỂN THỊ (hai lớp: hộp chính · hộp phụ) ═══════════════ */
var LOP = null, PHU = null;
function dungLop(){
  if (LOP) return;
  LOP = document.createElement('div'); LOP.className = 'bnx-lop'; LOP.id = 'bnx-lop';
  LOP.innerHTML = '<div class="bnx-hop" role="dialog" aria-modal="true"><div class="bnx-dau" id="bnx-dau"></div><div class="bnx-than" id="bnx-than"></div><div class="bnx-chan" id="bnx-chan"></div></div>';
  PHU = document.createElement('div'); PHU.className = 'bnx-lop bnx-lop-phu'; PHU.id = 'bnx-phu';
  PHU.innerHTML = '<div class="bnx-hop bnx-hop-nho"><div class="bnx-dau" id="bnx-pdau"></div><div class="bnx-than" id="bnx-pthan"></div><div class="bnx-chan" id="bnx-pchan"></div></div>';
  document.body.appendChild(LOP); document.body.appendChild(PHU);
  [LOP, PHU].forEach(function(el){
    el.addEventListener('click', function(e){
      var t = e.target.closest('[data-bnx]');
      if (!t || !el.contains(t) || t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') return;
      xuLy(t.dataset.bnx, t, e);
    });
    el.addEventListener('change', function(e){
      var t = e.target.closest('[data-bnx]');
      if (!t || !el.contains(t)) return;
      if (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') xuLy(t.dataset.bnx, t, e);
    });
  });
}
/* 🔁 MNXL-Z — hộp bộ máy ⛔ che TOAST / MODAL của menu (quy ước demo: #toast · #mask.on).
   Trong lúc hộp mở: body mang lớp bnx-dang-mo ⇒ #toast nổi trên hộp (style.08); modal của menu MỞ
   SAU khi hộp mở ⇒ gắn bnx-tren-hop, nổi trên hộp; modal đã mở TRƯỚC (vd hộp Import của M4.1) giữ dưới. */
var QS_MASK = null;
function theoDoiMask(){
  var mk = document.getElementById('mask');
  if (!mk || QS_MASK || !window.MutationObserver) return;
  QS_MASK = new MutationObserver(function(){
    var on = mk.classList.contains('on'), mo = LOP && LOP.classList.contains('bnx-mo');
    var tren = mk.classList.contains('bnx-tren-hop');   /* ⛔ ghi lại lớp đã có — tránh vòng lặp của chính trình theo dõi */
    if (on && mo && !mk._bnxTruoc && !tren) mk.classList.add('bnx-tren-hop');
    if (!on){ if (tren) mk.classList.remove('bnx-tren-hop'); mk._bnxTruoc = false; }
  });
  QS_MASK.observe(mk, {attributes:true, attributeFilter:['class']});
}
function mo(){
  dungLop(); theoDoiMask();
  var mk = document.getElementById('mask'); if (mk) mk._bnxTruoc = mk.classList.contains('on');
  LOP.classList.add('bnx-mo'); document.body.classList.add('bnx-dang-mo');
}
B.dong = function(){
  if (LOP){ LOP.classList.remove('bnx-mo'); PHU.classList.remove('bnx-mo'); }
  document.body.classList.remove('bnx-dang-mo');
  var mk = document.getElementById('mask'); if (mk){ mk.classList.remove('bnx-tren-hop'); mk._bnxTruoc = false; }
  B._che = null;
};
/* BNX.bao(chu, loai) — toast NẰM TRÊN hộp bộ máy, cho menu nói một câu khi hộp đang mở (⛔ phải dựng hộp phụ) */
var BAO = null, BAO_T = null;
B.bao = function(chu, loai){
  if (!BAO){ BAO = document.createElement('div'); BAO.className = 'bnx-bao'; BAO.id = 'bnx-bao'; BAO.setAttribute('role', 'status'); document.body.appendChild(BAO); }
  BAO.className = 'bnx-bao bnx-bao-' + (loai || 'tin') + ' bnx-mo';
  BAO.innerHTML = chu;
  clearTimeout(BAO_T); BAO_T = setTimeout(function(){ BAO.classList.remove('bnx-mo'); }, 3600);
};
/* hộp phụ dùng chung — menu cũng gọi được (vd nút tạm ở app.09) */
B.hop = function(dau, than, chan){
  dungLop();
  document.getElementById('bnx-pdau').innerHTML = dau;
  document.getElementById('bnx-pthan').innerHTML = than;
  document.getElementById('bnx-pchan').innerHTML = chan || '<button class="bnx-nut" data-bnx="phu-dong">Đóng</button>';
  PHU.classList.add('bnx-mo');
};
B.dongHop = function(){ if (PHU) PHU.classList.remove('bnx-mo'); };
var hanhDongMenu = {};
/* menu đăng ký nút riêng trong hộp phụ: <button data-bnx="menu:ten"> */
B.dangKyNut = function(ten, fn){ hanhDongMenu[ten] = fn; };
function veLai(){
  if (!LOP) return;
  var th = document.getElementById('bnx-than'), cuon = LOP.scrollTop, cuonThan = th.scrollTop;
  if (B._che === 'nhap') veNhap(); else if (B._che === 'xuat') veXuat();
  LOP.scrollTop = cuon; th.scrollTop = cuonThan;
}
function the(loai, chu){ return '<span class="bnx-the bnx-the-' + loai + '">' + chu + '</span>'; }
function nhanTrangThai(m){
  return m.trang_thai === 'dung' ? the('luc', 'Đang dùng') : m.trang_thai === 'can_ra_lai' ? the('vang', 'Cần rà lại') : the('xam', 'Đã ngừng');
}
function nhanNguon(m){ return m.nguon === 'cong_ty' ? the('tim', 'Mẫu của công ty') : the('xanh', 'Mẫu của trường'); }

/* ═══════════════════════════ NHẬP ═══════════════════════════ */
var S = null;
B.moNhap = function(duong, cb){
  cb = cb || {};
  napCongTy(duong.mau_cong_ty, B.kho.mauNhap, 'mn');
  raPhienBan(duong);
  S = {duong:duong, cb:cb, buoc:1, tepChon:null, tep:null, phan:[], thongBao:[], mau:null, daSua:false,
       cach_gan:'tay', l3:null, loc:'dung', moKho:false, raLai:null, khop:[], khaiBao:B.kiemKhaiBao(duong),
       luuTen:'', ketQua3:null, ketQua4:null, hoanTac:null, maLo:null, chup:null};
  if (S.khaiBao.length && window.console) console.warn('[BNX] khai báo đường nhập thiếu:', S.khaiBao);
  B._che = 'nhap'; mo(); veLai();
};
function nguoiDung(cb){ var n = cb && cb.nguoi; return typeof n === 'function' ? n() : (n || 'Người dùng demo'); }
function truongCua(cb){ var t = cb && cb.truong; return typeof t === 'function' ? t() : (t || 'Trường demo'); }
function tenGoc(P, key){ var h = P.doc.tieuDe.filter(function(x){ return x.key === key; })[0]; return h ? h.goc + (key.indexOf('#') > 0 ? ' (' + key.split('#')[1] + ')' : '') : key; }
function napPhan(P){ P.doc = docSheet(S.tep.sheet[P.sheet], P.dong_tieu_de); }

/* ④ — tự gợi ý: khớp ĐÚNG MỘT cột nguồn ⇒ gán; nhiều / không ⇒ để trống, người chọn */
function goiY(P){
  P.gan = {}; P.goiY = {}; P.mauThieu = {};
  var cd = P.def.cot_dich, ungVien = {}, nguonDen = {};
  cd.forEach(function(c){
    var ten = [chuanHoa(c.nhan)].concat((c.ten_goi_y || []).map(chuanHoa));
    ungVien[c.ma] = P.doc.tieuDe.filter(function(h){ return ten.indexOf(h.base) >= 0; }).map(function(h){ return h.key; });
    ungVien[c.ma].forEach(function(k){ (nguonDen[k] = nguonDen[k] || []).push(c.ma); });
  });
  cd.forEach(function(c){
    var uv = ungVien[c.ma];
    if (uv.length === 1 && nguonDen[uv[0]].length === 1){ P.gan[c.ma] = {cot_nguon:[uv[0]], bien_doi:[]}; P.goiY[c.ma] = {trang:'tu', uv:uv}; }
    else if (uv.length > 1) P.goiY[c.ma] = {trang:'nhieu', uv:uv};
    else if (uv.length === 1) P.goiY[c.ma] = {trang:'trung_nguon', uv:uv, dich:nguonDen[uv[0]]};
    else P.goiY[c.ma] = {trang:'khong', uv:[]};
  });
}
/* ④ mục 2 — tệp là MẪU TRỐNG hệ thống xuất: gán 100 % theo nhan (vẫn chạy L1…L5, vẫn bắt tích L3) */
function ganTheoNhan(P){
  P.gan = {}; P.goiY = {}; P.mauThieu = {};
  P.def.cot_dich.forEach(function(c){
    var h = P.doc.tieuDe.filter(function(x){ return x.base === chuanHoa(c.nhan); })[0];
    if (h){ P.gan[c.ma] = {cot_nguon:[h.key], bien_doi:[]}; P.goiY[c.ma] = {trang:'mau_trong', uv:[h.key]}; }
    else P.goiY[c.ma] = {trang:'khong', uv:[]};
  });
}
function chonSheet(pd, tep, daDung){
  var goi = (pd.ten_sheet_goi_y || []).map(chuanHoa), i;
  for (i = 0; i < tep.sheet.length; i++) if (daDung.indexOf(i) < 0 && goi.indexOf(chuanHoa(tep.sheet[i].ten)) >= 0) return i;
  for (i = 0; i < tep.sheet.length; i++) if (daDung.indexOf(i) < 0) return i;
  return 0;
}
/* sheet nào của tệp mang đúng vân tay của một phần mẫu (theo dòng tiêu đề của mẫu) */
function sheetKhop(tp){
  for (var i = 0; i < S.tep.sheet.length; i++) if (vtBang(docSheet(S.tep.sheet[i], tp.dong_tieu_de).vanTay, tp.van_tay_tieu_de)) return i;
  return -1;
}
function mauKhopVanTay(m){ return m.phan.every(function(tp){ return sheetKhop(tp) >= 0; }); }

function docTep(tep){
  var d = S.duong;
  S.tep = tep; S.thongBao = []; S.mau = null; S.daSua = false; S.l3 = null; S.raLai = null; S.khop = []; S.cach_gan = 'tay';
  var daDung = [];
  S.phan = d.phan.map(function(pd){
    var i = chonSheet(pd, tep, daDung); daDung.push(i);
    var P = {ma_phan:pd.ma_phan, def:pd, sheet:i, dong_tieu_de:dongTieuDeMacDinh(tep.sheet[i]), gan:{}, goiY:{}, mauThieu:{}};
    napPhan(P); return P;
  });
  var soMauTrong = 0;
  S.phan.forEach(function(P){
    var a1 = a1Cua(tep.sheet[P.sheet]);
    if (a1 && a1 === d.mau_dich){ ganTheoNhan(P); P.mauTrong = true; soMauTrong++; return; }
    goiY(P);
    if (a1 && tenMauGoc(a1) === tenMauGoc(d.mau_dich)){
      /* ④ mục 3 (P-1 ✅): số hiệu CŨ ⇒ ⛔ gán 100 %; câu KT-6 + chênh lệch, đi đường ánh xạ thường */
      var co = P.doc.tieuDe.map(function(h){ return h.base; });
      var nhan = P.def.cot_dich.map(function(c){ return chuanHoa(c.nhan); });
      var moi = P.def.cot_dich.filter(function(c){ return co.indexOf(chuanHoa(c.nhan)) < 0; }).map(function(c){ return c.nhan; });
      var bo = P.doc.tieuDe.filter(function(h){ return nhan.indexOf(h.base) < 0; }).map(function(h){ return h.goc; });
      S.thongBao.push({loai:'vang', chu:'Tệp dùng mẫu <code>' + esc(a1) + '</code>, hệ thống đang dùng <code>' + esc(d.mau_dich) + '</code>' +
        (moi.length ? ' — bản mới thêm cột: <b>' + moi.map(esc).join(', ') + '</b>' : '') +
        (bo.length ? ' · cột tệp có mà mẫu mới ⛔ có: <b>' + bo.map(esc).join(', ') + '</b>' : '') +
        '. ⛔ Gán 100 % tự động — đi <b>đường ánh xạ thường</b> (tự gợi ý · bạn chọn).'});
    } else if (/^MAU-/.test(a1)){
      S.thongBao.push({loai:'vang', chu:'Ô A1 mang số hiệu <code>' + esc(a1) + '</code> — đường nhập này là <code>' + esc(d.mau_dich) + '</code>. Đi đường ánh xạ thường.'});
    }
  });
  if (soMauTrong === S.phan.length){
    S.cach_gan = 'tu_dong_mau_trong';
    S.thongBao.push({loai:'luc', chu:'Tệp mang đúng số hiệu <code>' + esc(d.mau_dich) + '</code> (mẫu trống hệ thống xuất) ⇒ <b>gán 100 % tự động theo tên cột</b>. Vẫn phải xem trước và tích ở dưới.'});
    return;
  }
  /* ④ mục 5 — nhận mẫu đã lưu theo vân tay: một ⇒ tự áp (vẫn dừng ở ②) · nhiều ⇒ người chọn */
  var ds = mauCuaDuong(d, truongCua(S.cb));
  S.khop = ds.filter(function(m){ return m.trang_thai === 'dung' && m.duong_nhap.mau_dich === d.mau_dich && mauKhopVanTay(m); });
  ds.filter(function(m){ return m.trang_thai === 'can_ra_lai' && mauKhopVanTay(m); }).forEach(function(m){
    S.thongBao.push({loai:'vang', chu:'Mẫu <b>«' + esc(m.ten) + '»</b> khớp vân tay tệp nhưng đang <b>cần rà lại</b> (gắn <code>' + esc(m.duong_nhap.mau_dich) + '</code>) — ⛔ tự áp. ' +
      (m.nguon === 'truong' ? '<button class="bnx-nut bnx-nho" data-bnx="ra-lai" data-bnx-id="' + m.mau_nhap_id + '">Rà lại mẫu này</button>' : 'Mẫu công ty chờ bản cập nhật sau — có thể <button class="bnx-nut bnx-nho" data-bnx="nhan-ban" data-bnx-id="' + m.mau_nhap_id + '">Nhân bản thành mẫu của trường</button> rồi rà lại bản nhân bản.')});
  });
  if (S.khop.length === 1){
    apMau(S.khop[0]);
    S.thongBao.push({loai:'xanh', chu:'Tệp cùng khuôn với mẫu <b>«' + esc(S.khop[0].ten) + '»</b> ⇒ <b>đã tự áp mẫu</b>. Máy vẫn dừng ở bước ② — xem trước và tích mới sang được ③.'});
  } else if (S.khop.length > 1){
    S.thongBao.push({loai:'vang', chu:'Tệp khớp <b>' + S.khop.length + ' mẫu</b> — ⛔ tự chọn. Bạn chọn một: ' +
      S.khop.map(function(m){ return '<button class="bnx-nut bnx-nho" data-bnx="ap-mau" data-bnx-id="' + m.mau_nhap_id + '">' + esc(m.ten) + ' · ' + (m.nguon === 'cong_ty' ? 'công ty' : 'trường') + '</button>'; }).join(' ')});
  }
}
function apMau(m){
  S.mau = m; S.daSua = false; S.cach_gan = 'ap_mau'; S.l3 = null;
  m.phan.forEach(function(tp){
    var P = S.phan.filter(function(p){ return p.ma_phan === tp.ma_phan; })[0]; if (!P) return;
    var i = sheetKhop(tp); if (i >= 0) P.sheet = i;
    P.dong_tieu_de = tp.dong_tieu_de; napPhan(P);
    P.gan = {}; P.goiY = {}; P.mauThieu = {}; P.mauTrong = false;
    P.def.cot_dich.forEach(function(c){ P.goiY[c.ma] = {trang:'mau_khong', uv:[]}; });
    var keys = P.doc.tieuDe.map(function(h){ return h.key; });
    tp.cot.forEach(function(c){
      var co = c.cot_nguon.filter(function(k){ return keys.indexOf(k) >= 0; });
      var thieu = c.cot_nguon.filter(function(k){ return keys.indexOf(k) < 0; });
      if (thieu.length) P.mauThieu[c.cot_dich] = thieu;
      /* cột nguồn mẫu cần mà tệp không có ⇒ ô gán TRỐNG, ⛔ đoán (④ mục 5) */
      if (co.length || laHang(c)) P.gan[c.cot_dich] = {cot_nguon:co, bien_doi:sao(c.bien_doi)};
      P.goiY[c.cot_dich] = {trang:'mau', uv:co};
    });
  });
}
function suaGan(){ S.l3 = null; if (S.mau) S.daSua = true; if (S.cach_gan === 'tu_dong_mau_trong') S.cach_gan = 'tay'; }

/* ───────────── tính toàn bộ bước ② (L1 · L2 · chặn · cột thừa · giá trị lạ) ───────────── */
function tinhPhan(P){
  var pd = P.def, d = S.duong, kq = {dong:[], l2:[], thieuBB:[], thieuPG:[], thieuNhom:[], dacBiet:{}, cotThua:[], la:{}, hangLoi:[], trungNguon:[], gopThieu:[], goiYNgay:{}};
  var dung = {};
  pd.cot_dich.forEach(function(c){
    var g = P.gan[c.ma]; if (!g) return;
    g.cot_nguon.forEach(function(k){ (dung[k] = dung[k] || []).push({c:c, truc:!(g.bien_doi || []).length}); });
  });
  kq.cotThua = P.doc.tieuDe.filter(function(h){ return !dung[h.key]; }).map(function(h){ return tenGoc(P, h.key); });
  Object.keys(dung).forEach(function(k){
    var tr = dung[k].filter(function(x){ return x.truc; });
    if (tr.length >= 2) kq.trungNguon.push({nguon:tenGoc(P, k), dich:tr.map(function(x){ return x.c.nhan; })});
  });
  P.doc.dong.forEach(function(dg){
    var gt = {}, loi = [];
    pd.cot_dich.forEach(function(c){
      var g = P.gan[c.ma];
      var r = g ? chay(g, dg.o, function(la){ var m = kq.la[c.ma] = kq.la[c.ma] || {}; m[la] = (m[la] || 0) + 1; }) : {v:'', goc:''};
      gt[c.ma] = r.v;
      if (laDacBiet(c, r.v)){ var db = kq.dacBiet[c.ma] = kq.dacBiet[c.ma] || {}; var tv = String(r.v).trim(); db[tv] = (db[tv] || 0) + 1; }
      var e = r.loi || kiemL1(c, r.v, d, P.gan);
      if (e) loi.push({cot_dich:c.ma, nhan:c.nhan, gia_tri_goc:r.goc, loi:e});
    });
    kq.dong.push({so_dong:dg.so_dong, gia_tri:gt, loi_l1:loi});
  });
  pd.cot_dich.forEach(function(c){
    var g = P.gan[c.ma], bb = batBuoc(c, P.gan);
    if (!g || (!g.cot_nguon.length && !laHang(g))){ if (bb) kq.thieuBB.push(c); else if (phaiGan(c, P.gan)) kq.thieuPG.push(c); return; }
    if (laHang(g)){
      var hv = g.bien_doi[0].gia_tri;
      var he = laTrong(hv) ? 'Giá trị hằng đang trống' : kiemL1(c, hv, d, P.gan);
      if (he) kq.hangLoi.push({c:c, loi:he});           /* hằng kiểm L1 NGAY ở ② (phiếu 0A D.1 mục 5) */
      return;
    }
    if (coGop(g) && g.cot_nguon.length < 2) kq.gopThieu.push(c);
    var mau = 0, dat = 0;
    kq.dong.forEach(function(r){
      var v = String(r.gia_tri[c.ma] == null ? '' : r.gia_tri[c.ma]).trim();
      var sai = r.loi_l1.some(function(e){ return e.cot_dich === c.ma; });
      if (laDacBiet(c, v)) return;                       /* giá trị đặc biệt ⇒ RA KHỎI mẫu số L2 (HDMX bản 2 ⑥) */
      if (bb){ mau++; if (v && !sai) dat++; } else if (v){ mau++; if (!sai) dat++; }
    });
    var tl = mau ? dat / mau : 1;
    var ket = mau >= B.THAM_SO.L2_MAU_SO_TOI_THIEU ? (tl >= B.THAM_SO.L2_NGUONG ? 'dat' : 'chan') : 'chua_du';
    kq.l2.push({cot_dich:c.ma, nhan:c.nhan, ti_le:tl, dat:dat, mau:mau, ket:ket, nguon:g.cot_nguon.map(function(k){ return tenGoc(P, k); }), c:c});
    if (kieuCua(c).loai === 'ngay' && !(g.bien_doi || []).some(function(b){ return b.ma === 'doi_dinh_dang_ngay'; }) && dat < mau){
      var vals = P.doc.dong.map(function(dg){ return dg.o[g.cot_nguon[0]]; });
      kq.goiYNgay[c.ma] = khuonKhop(vals);
    }
  });
  /* nhom_phai_gan — ÍT NHẤT MỘT cụm được gán ĐỦ (HDMX bản 2 ② mục 5) */
  (pd.nhom_phai_gan || []).forEach(function(n){
    var du = (n.cum || []).some(function(cm){ return cm.every(function(ma){ return coGanCot(P.gan[ma]); }); });
    if (!du) kq.thieuNhom.push(n);
  });
  return kq;
}
/* gợi ý cột nguồn gần đúng — theo TÊN (lệch ≤ 2) và theo DỮ LIỆU (≥ 90 % ô qua L1 của cột đích) */
function goiYNguon(P, c, boQua){
  var ten = [chuanHoa(c.nhan)].concat((c.ten_goi_y || []).map(chuanHoa)), out = [];
  var dangDung = {};
  Object.keys(P.gan).forEach(function(m){ P.gan[m].cot_nguon.forEach(function(k){ dangDung[k] = 1; }); });
  P.doc.tieuDe.forEach(function(h){
    if (boQua && boQua.indexOf(h.key) >= 0) return;
    /* ngưỡng theo ĐỘ DÀI (khuôn M1.9 §5.3.2): ≤ 4 ký tự ⛔ đoán · ≤ 8 lệch 1 · dài hơn lệch 2 */
    var gan = ten.some(function(t){ if (!t || !h.base) return false; var n = Math.min(t.length, h.base.length); return lev(t, h.base) <= (n <= 4 ? 0 : n <= 8 ? 1 : 2); });
    var k = kieuCua(c).loai, theoDL = false;
    if (['ngay', 'sdt', 'email', 'ma_dinh_danh', 'danh_muc', 'co_khong', 'so'].indexOf(k) >= 0){
      var vals = P.doc.dong.map(function(dg){ return dg.o[h.key]; }).filter(function(v){ return !laTrong(v); });
      if (vals.length >= 3){
        var ok = vals.filter(function(v){ return !laDacBiet(c, v) && !kiemL1({kieu:c.kieu, muc:'tuy_chon', loai_ma:c.loai_ma, khuon:c.khuon, mo_ta_khuon:c.mo_ta_khuon}, v, S.duong); }).length;
        theoDL = ok / vals.length >= B.THAM_SO.L2_NGUONG;
      }
    }
    if (gan || theoDL) out.push('«' + esc(tenGoc(P, h.key)) + '»' + (theoDL ? ' <i>(' + (dangDung[h.key] ? 'đang gán chỗ khác, ' : '') + 'dữ liệu đúng kiểu ' + esc(tenKieu(c)) + ')</i>' : ' <i>(tên gần giống)</i>'));
  });
  return out.slice(0, 3);
}
function tinhTatCa(){
  var kq = S.phan.map(tinhPhan), chan = [];
  kq.forEach(function(k, pi){
    var P = S.phan[pi], ten = S.phan.length > 1 ? '[' + esc(P.def.ten || P.ma_phan) + '] ' : '';
    if (!P.doc.dong.length) chan.push(ten + 'Sheet «' + esc(S.tep.sheet[P.sheet].ten) + '» ⛔ có dòng dữ liệu nào dưới dòng tiêu đề ' + P.dong_tieu_de + '.');
    k.thieuBB.forEach(function(c){
      var gy = goiYNguon(P, c);
      chan.push(ten + 'Cột bắt buộc <b>«' + esc(c.nhan) + '»</b> chưa gán' + (gy.length ? ' — gần đúng: ' + gy.join(' · ') : '') + '.');
    });
    k.thieuPG.forEach(function(c){
      var gy = goiYNguon(P, c), f = c.phai_gan;
      chan.push(ten + 'Cột <b>«' + esc(c.nhan) + '»</b> phải gán một cột nguồn <span class="bnx-mo-ta">(ô được trống' + (f && f.loi ? ' — ' + esc(f.loi) : '') + ')</span> — chưa gán' + (gy.length ? ' — gần đúng: ' + gy.join(' · ') : '') + '.');
    });
    k.thieuNhom.forEach(function(n){
      var nh = function(ma){ var x = P.def.cot_dich.filter(function(c){ return c.ma === ma; })[0]; return x ? x.nhan : ma; };
      chan.push(ten + 'Phải gán <b>đủ ít nhất một cụm</b>' + (n.loi ? ' <span class="bnx-mo-ta">(' + esc(n.loi) + ')</span>' : '') + ': ' +
        n.cum.map(function(cm){ return '«' + cm.map(function(ma){ return esc(nh(ma)); }).join(' + ') + '»'; }).join(' hoặc ') + '.');
    });
    k.l2.filter(function(x){ return x.ket === 'chan'; }).forEach(function(x){
      var gy = goiYNguon(P, x.c, P.gan[x.cot_dich].cot_nguon);
      chan.push(ten + 'Cột <b>«' + esc(x.nhan) + '»</b> chỉ có <b>' + x.dat + '/' + x.mau + ' dòng (' + pt(x.ti_le) + ')</b> đúng kiểu ' + esc(tenKieu(x.c)) +
        ' — có phải đang nhận dữ liệu của cột <b>«' + x.nguon.map(esc).join(' + ') + '»</b>?' + (gy.length ? ' Cột trông đúng kiểu: ' + gy.join(' · ') + '.' : '') +
        ' <span class="bnx-mo-ta">Gỡ bằng chọn lại cột hoặc thêm phép biến đổi — ⛔ có nút «vẫn tiếp tục».</span>');
    });
    k.hangLoi.forEach(function(x){ chan.push(ten + 'Giá trị hằng của <b>«' + esc(x.c.nhan) + '»</b>: ' + esc(x.loi) + '.'); });
    k.gopThieu.forEach(function(c){ chan.push(ten + '<b>«' + esc(c.nhan) + '»</b>: «Gộp cột» cần ≥ 2 cột nguồn.'); });
  });
  return {kq:kq, chan:chan};
}

/* ───────────── ⑧ bản chụp ánh xạ theo lô (L5) ───────────── */
function chupAnhXa(tt){
  var nguoi = nguoiDung(S.cb);
  var cach = S.cach_gan === 'ap_mau' && S.daSua ? 'tay' : S.cach_gan;

  S.phan.forEach(function(P){
    (P.def.cap_de_nham || []).forEach(function(g){ var co = g.filter(function(m){ return P.gan[m]; }); if (co.length >= 2) l4.push(co); });
  });
  return {
    mau_dich: S.duong.mau_dich,
    mau_nhap: S.mau ? {mau_nhap_id:S.mau.mau_nhap_id, ten:S.mau.ten, nguon:S.mau.nguon, so_dong_lich_su:S.mau.lich_su.length} : null,
    cach_gan: cach,
    phan: S.phan.map(function(P){
      return {ma_phan:P.ma_phan, ten_sheet:S.tep.sheet[P.sheet].ten, dong_tieu_de:P.dong_tieu_de, van_tay_tieu_de:P.doc.vanTay.slice(),
        cot:P.def.cot_dich.filter(function(c){ return P.gan[c.ma]; }).map(function(c){ return {cot_dich:c.ma, cot_nguon:P.gan[c.ma].cot_nguon.slice(), bien_doi:sao(P.gan[c.ma].bien_doi)}; })};
    }),
    cot_thua: [].concat.apply([], tt.kq.map(function(k){ return k.cotThua; })),
    l2: [].concat.apply([], tt.kq.map(function(k){ return k.l2.map(function(x){ return {cot_dich:x.cot_dich, ti_le:Math.round(x.ti_le * 1000) / 1000}; }); })),
    l3: {boi:S.l3 ? S.l3.boi : nguoi, luc:S.l3 ? S.l3.luc : bayGio()},

}
function tenBD(b){
  var f = BD[b.ma], t = f ? f.ten : b.ma;
  if (b.ma === 'tach_ho_ten') t += ' → ' + (b.lay === 'ho_dem' ? 'họ đệm' : 'tên');
  if (b.ma === 'gop_cot') t += ' nối «' + b.noi + '»';
  if (b.ma === 'doi_dinh_dang_ngay') t += ' ' + b.khuon;
  if (b.ma === 'bang_doi_gia_tri') t += ' ' + (b.cap || []).map(function(c){ return c.tu + '→' + c.thanh; }).join(', ');
  if (b.ma === 'chuan_hoa_chuoi') t += ' (' + (b.hoa_thuong || 'giu') + ')';
  if (b.ma === 'gia_tri_hang') t += ' = «' + b.gia_tri + '»';
  return t;
}

/* ───────── bước ③ của đường ① (M1.1 §6.7.3) ───────── */
function phanLoaiDS(kq){
  var trongLo = {};
  return kq.phan.hoc_sinh.dong.map(function(r){
    var g = r.gia_tri, md = tr(g.ma_dinh_danh), chan = [], canh = [], ghi = [];
    r.loi_l1.forEach(function(x){ chan.push('<b>' + e(x.nhan) + '</b>: ' + e(x.loi) + ' <i>(L1)</i>'); });

    /* ⛔ Chặn — mã TRÙNG hồ sơ đã có của năm, hoặc trùng trong chính lô (§6.7.3) */
    if (md && HS.some(function(h){ return h.cs === md; }))
      chan.push('<b>Mã định danh đã có hồ sơ trong năm</b> — cửa này ⛔ ghi đè hồ sơ; sửa từng em ở tab <code>Danh sách học sinh</code>.');
    if (md && trongLo[md]) chan.push('<b>Mã lặp trong chính tệp này</b> — dòng ' + trongLo[md] + ' đã dùng.');
    else if (md) trongLo[md] = r.so_dong;

    /* 🔁 MYC-4 (21/9): ô mã TRỐNG ⛔ chặn — hồ sơ vẫn tạo, nhận mức ② nhánh nhà trường */
    if (!md && !r.loi_l1.length)
      ghi.push('② <b>Chờ mã định danh</b> — hồ sơ vẫn tạo, nhận <b>mức ② nhánh nhà trường</b> <i>(M1.1 §3.0.4 · chốt MYC-4)</i>');

    /* ⚠ Cảnh báo mềm — nghi trùng khi KHÔNG có mã để đối khớp (§6.7.3) */
    if (!md){
      var ten = tr(g.ho_ten).toLowerCase(), ns = tr(g.ngay_sinh);
      var nghi = HS.filter(function(h){ return h.n.toLowerCase() === ten && h.ns === ns; })[0];
      if (nghi) canh.push('<b>Nghi trùng</b> — đã có <b>' + e(nghi.n) + '</b> cùng ngày sinh ' + e(ns) + ' <i>(' + e(nghi.ma) + ')</i>. Dòng trống mã ⇒ ⛔ có khóa đối khớp.');
    }

    /* ⛔ Lớp ⛔ khớp danh mục — cột Lớp TRỐNG thì ⛔ chặn (§6.7.1 ghi chú *) */
    var lop = tr(g.lop);
    if (lop && dmLop().indexOf(lop) < 0)
      chan.push('<b>Lớp ⛔ có trong danh mục</b> — khai lớp ở <code>M10.1 · Lớp học</code> rồi nạp lại.');
    if (!lop && !chan.length)
      ghi.push('⏳ <b>Chưa có lớp</b> — em vào hàng đợi <code>Chờ xếp lớp</code>, xếp ở <b>M1.7 tab 🎯 Xếp lớp</b>');

    return {r:r, g:g, md:md, lop:lop, chan:chan, canh:canh, ghi:ghi};
  });
}

      {ten:'MAU-B10-bu-ho-so-v1.xlsx', loai:'xlsx',
       mo_ta:'Tệp hệ thống XUẤT RA (đã có sẵn ba cột khóa) — trường điền phần còn thiếu rồi nạp lại; 1 dòng mã lạ để thử luật «chỉ ghi, ⛔ tạo»',
       sheet:[{ten:'Bổ sung', o:[['MAU-B10-bu-ho-so-v1'], nhan].concat(rows).concat([['013150999990','Người lạ','','Hà Nội','Kinh','','','','','','','']])}]}
    ]};
}

function phanLoaiBu(kq){
  return kq.phan.bu_ho_so.dong.map(function(r){
    var g = r.gia_tri, md = tr(g.ma_dinh_danh), chan = [], canh = [], ghi = [];
    r.loi_l1.forEach(function(x){ chan.push('<b>' + e(x.nhan) + '</b>: ' + e(x.loi) + ' <i>(L1)</i>'); });
    var hs = HS.filter(function(h){ return h.cs === md; })[0];
    /* 🛑 §6.8.2 — LÔ BỔ SUNG CHỈ GHI, ⛔ BAO GIỜ TẠO */
    if (md && !r.loi_l1.some(function(x){ return x.cot_dich === 'ma_dinh_danh'; }) && !hs)
      chan.push('<b>Mã ⛔ khớp hồ sơ nào</b> — lô bổ sung <b>⛔ có khả năng tạo hồ sơ</b>, ⛔ âm thầm sinh hồ sơ thứ hai <i>(M1.1 §6.8.2)</i>. Tạo hồ sơ mới thì dùng tab <code>📥 Nhập danh sách</code>.');
    var coGi = NHOM3.filter(function(k){ return tr(g[k]); });
    if (!chan.length && !coGi.length) canh.push('<b>Để trống toàn bộ</b> cột cần bù — dòng ⛔ ghi gì <i>(ô trống ⛔ ghi đè)</i>.');
    if (!tr(g.tt_tinh) && !tr(g.tt_xa) && tr(g.tt_chi_tiet))
      ghi.push('🏠 Địa chỉ <b>chế độ tự do</b> — <b>✓ hợp lệ</b>, nhãn ⚠ chưa chuẩn hóa <i>(HDCS ① · ⛔ phải cảnh báo)</i>');
    return {r:r, g:g, md:md, hs:hs, chan:chan, canh:canh, ghi:ghi, so:coGi.length};
  });
}
function hangBu(x, why, mau){
  return '<div class="bnx-r ' + mau + '"><div>' + x.r.so_dong + '</div><div>' + e(x.hs ? x.hs.n : (tr(x.g.ho_ten) || '—')) + '</div>' +
    '<div><code>' + e(x.md) + '</code></div><div>' + why + '</div></div>';
}
function doiChieuBu(kq){
  var pl = phanLoaiBu(kq);
  var ok = pl.filter(function(x){ return !x.chan.length && x.so; });
  var trong = pl.filter(function(x){ return !x.chan.length && !x.so; });
  var bo = pl.filter(function(x){ return x.chan.length; });
  var o = ok.reduce(function(a, x){ return a + x.so; }, 0);
  return {choGhi: ok.length > 0, nhanNutGhi: '💾 Ghi ' + o + ' ô vào ' + ok.length + ' hồ sơ',
    html:
      '<div class="mets"><div class="met"><div class="k">Dòng trong tệp</div><div class="v">' + pl.length + '</div></div>' +
      '<div class="met r"><div class="k">⛔ Chặn</div><div class="v">' + bo.length + '</div></div>' +
      '<div class="met w"><div class="k">Trống — ⛔ ghi gì</div><div class="v">' + trong.length + '</div></div>' +
      '<div class="met g"><div class="k">✓ Ô sẽ ghi</div><div class="v">' + o + '</div></div></div>' +
      '<div class="ro">🛑 <b>Lô này CHỈ GHI, ⛔ bao giờ tạo hồ sơ</b> <i>(M1.1 §6.8.2)</i>. Ô trống trong tệp ⛔ ghi đè giá trị đang có. ' +
      '📅 Đồng hồ hạn Loại 2a tính từ <b>NGÀY LÔ</b>, ⛔ từ ngày vào trường <i>(§6.8.3)</i>.</div>' +
      '<div class="card"><div class="ch">⛔ Dòng bị chặn</div><div class="bnx-r hd"><div>Dòng</div><div>Học sinh</div><div>Mã</div><div>Lý do</div></div>' +
      (bo.length ? bo.map(function(x){ return hangBu(x, x.chan.join('<br>'), 'r'); }).join('') : '<div class="lgd">Không có.</div>') + '</div>' +
      '<div class="card"><div class="ch">✓ Sẽ ghi</div><div class="bnx-r hd"><div>Dòng</div><div>Học sinh</div><div>Mã</div><div>Số ô · ghi chú</div></div>' +
      (ok.length ? ok.map(function(x){ return hangBu(x, '<b>' + x.so + '</b> ô' + (x.ghi.length ? '<br><i>' + x.ghi.join('<br>') + '</i>' : ''), 'g'); }).join('') : '<div class="lgd">Không có.</div>') + '</div>'};
}
function ghiBu(kq){
  var pl = phanLoaiBu(kq);
  var ok = pl.filter(function(x){ return !x.chan.length && x.so; });
  var bo = pl.filter(function(x){ return x.chan.length; });
  var truoc = JSON.stringify(HS.map(function(h){ return {cccd:h.cccd, nsinh:h.nsinh, dan:h.dan, ton:h.ton}; }));
  var o = 0;
  ok.forEach(function(x){
    if (tr(x.g.so_dinh_danh)){ x.hs.cccd = tr(x.g.so_dinh_danh); o++; }
    if (tr(x.g.noi_sinh)){ x.hs.nsinh = tr(x.g.noi_sinh); o++; }
    if (tr(x.g.dan_toc)){ x.hs.dan = tr(x.g.dan_toc); o++; }
    if (tr(x.g.ton_giao)){ x.hs.ton = tr(x.g.ton_giao); o++; }
  });
  var id = maLoMoi();
  M.ls.unshift({id:id, t:gio(), u:R().cd || role, loai:'Bổ sung hồ sơ theo lô', ghi:o, bo:bo.length,
                tep:kq.tep.ten, mau_dich:kq.duong_nhap.mau_dich, anh_xa_chup:kq.anh_xa_chup});
  M.lo[id] = {hoanTac:function(){
    var cu = JSON.parse(truoc);
    HS.forEach(function(h, i){ if (cu[i]){ h.cccd = cu[i].cccd; h.nsinh = cu[i].nsinh; h.dan = cu[i].dan; h.ton = cu[i].ton; } });
    return o + ' ô';
  }};
  if (typeof render === 'function') render();
  return {ma_lo:id, html:
    '<div class="info">💾 Lô <code>' + id + '</code> — ghi <b>' + o + '</b> ô vào <b>' + ok.length + '</b> hồ sơ · bỏ qua <b>' + bo.length + '</b> dòng. ' +
    '⛔ Tạo một hồ sơ nào.</div>' +
    '<div class="card"><div class="ch">⛔ Bỏ qua — kèm lý do</div><div class="bnx-r hd"><div>Dòng</div><div>Học sinh</div><div>Mã</div><div>Lý do</div></div>' +
    (bo.length ? bo.map(function(x){ return hangBu(x, x.chan.join('<br>'), 'r'); }).join('') : '<div class="lgd">Không có.</div>') + '</div>'};
}

/* ───────── hoàn tác + nối vào tab ───────── */
function hoanTac(id){
  var r = M.lo[id]; if (!r) return 'Lô ⛔ hoàn tác được.';
  var s = r.hoanTac(); delete M.lo[id];
  if (typeof render === 'function') render();
  return 'Đã hoàn tác ' + s + ' — dữ liệu về như trước lô.';
}
function cb(dc, gh){ return {onDoiChieu:dc, onGhi:gh, onHoanTac:hoanTac, truong:TRUONG, nguoi:function(){ return R().cd || role; }}; }

M.moNhapDS = function(){
  B.duongNhap['m1.1.nhap_danh_sach'] = duongNhapDS();          /* khai LƯỜI — xem khối đầu tệp */
  B.moNhap(B.duongNhap['m1.1.nhap_danh_sach'], cb(doiChieuDS, ghiDS));
};
M.moBuHoSo = function(){
  B.duongNhap['m1.1.bo_sung_ho_so'] = duongBuHoSo();
  B.moNhap(B.duongNhap['m1.1.bo_sung_ho_so'], cb(doiChieuBu, ghiBu));
};
})();

/* ═════════════════════════════════════════════════════════════════════════
   M1.1 — HAI TAB LÔ ở tầng 1 · cụm GCHS phiên 2A (27/9/2026)
     📥 Nhập danh sách   (m1.1.nhap_danh_sach — F10)
     🧩 Bổ sung hồ sơ    (m1.1.bo_sung_ho_so  — F11)
   Tài liệu: M1.1 §6.7 · §6.8 · §7.1b. Cửa nhập đi qua bộ nhập dùng chung của
   cụm MNXL; đường khai ở app.09-duong-nhap.js.

   🛑 Khai bằng `function`, ⛔ bằng `const` — gen-demo nối MỌI tệp vào MỘT script
   theo thứ tự app.js TRƯỚC rồi app.08 · 09 · 20, nên thứ app.js gọi tới phải
   được cẩu lên đầu script. Lời gọi khởi động render() cũng chuyển xuống cuối
   tệp này. Hai điều ấy đã làm trắng trang một lần ở phiên 2B.
   ═════════════════════════════════════════════════════════════════════════ */

/* Bit ID gác cửa (M1.1 §7 — sáu dòng quyền chép nguyên bit từ M1.9):
     📥 Nhập danh sách : HT · PHT_DT            (VT chỉ đọc và xuất — ⛔ T, ⛔ S)
     🧩 Bổ sung hồ sơ  : VT (vai chủ) · HT · PHT_DT
   🛑 NÚT VẪN HIỆN VỚI MỌI VAI — nguyên tắc demo của dự án: «file demo hiển thị
   hết mọi chức năng, ⛔ ẩn theo chức danh; mỗi thao tác gắn thẻ chức danh sở
   hữu». Vai ⛔ có bit thì bấm ra khoá 🔒 kèm tên bit, ⛔ phải nút biến mất. */
var LO_CHU = {nhap:['HT', 'PHT_DT'], bu:['VT', 'HT', 'PHT_DT']};
function loMoDuoc(f){ return LO_CHU[f].indexOf(role) >= 0 || role === 'DQ'; }
function loThe(f){ return '<span class="st2 v">chức danh sở hữu: ' + LO_CHU[f].join(' · ') + '</span>'; }

function loCho(){ return HS.filter(function(h){ return h.tt === 'cxl'; }).length; }
function loThieu(){ return HS.filter(function(h){ return h.hoso && h.hoso.l2 && h.hoso.l2.length; }).length; }
function loLS(){ return (window.BNX && BNX.menuM11) ? BNX.menuM11.ls : []; }

function loTabNhap(){
  var mo = loMoDuoc('nhap');
  return '<div class="ro"><b>Tạo hồ sơ học sinh theo lô</b> — mẫu <b>MAU-B09-danh-sach-hoc-sinh-v1</b> ' +
    '<i>(13 cột · 8 bắt buộc — M1.1 §6.7.1)</i>. Tệp đi qua <b>bộ nhập dùng chung</b>: ① chọn tệp → ② ánh xạ cột → ' +
    '③ đối chiếu ba mức → ④ ghi + bảng kết quả. Hoàn tác được <b>7 ngày</b>.</div>' +
    '<div class="ro">🔑 Đây là <b>cửa duy nhất</b> để thêm học sinh hàng loạt. Một em thì thêm tay ở tab ' +
    '<b>Danh sách học sinh</b>; nhiều em thì nạp tệp ở đây <i>(cụm GCHS 27/9/2026 — trước ở M1.9)</i>.</div>' +
    '<div style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn p" data-lo="nhap">📄 Chọn tệp</button> ' + loThe('nhap') +
    (mo ? '' : ' <span class="st2 r">🔒 vai đang xem ⛔ có bit <code>ID</code></span>') +
    '</div>' + loBangLS('Nhập danh sách học sinh');
}

function loTabBu(){
  var mo = loMoDuoc('bu');
  return '<div class="ro"><b>Bù dữ liệu vào hồ sơ ĐÃ CÓ</b> — mẫu <b>MAU-B10-bu-ho-so-v1</b>. ' +
    '🛑 <b>Lô này CHỈ GHI, ⛔ bao giờ tạo hồ sơ</b> <i>(M1.1 §6.8.2)</i>; ô trống ⛔ ghi đè giá trị đang có.</div>' +
    '<div class="ro">Mẫu ⛔ phải tệp trống: <b>hệ thống xuất ra</b> hồ sơ đang thiếu, trường điền rồi nạp lại ' +
    '<i>(§6.8.1)</i>. 📅 Đồng hồ hạn Loại 2a tính từ <b>NGÀY LÔ</b> <i>(§6.8.3)</i> — <b>' + loThieu() + '</b> hồ sơ đang thiếu mục Loại 2.</div>' +
    /* ⏳ NL-1 — nói thẳng trên màn hình thay vì để người thử tưởng demo hỏng */
    '<div class="ro" style="border-left:3px solid var(--red)">⏳ <b>Điểm chờ chốt NL-1:</b> dữ liệu mẫu của menu này dùng ' +
    'mã định danh <b>14 chữ số</b>, còn khuôn của <b>tham số M10.8</b> mà bộ nhập đang đọc là <b>11–12 chữ số</b> ' +
    '<i>(giá trị demo)</i> ⇒ mọi dòng xuất ra từ hồ sơ cũ đều bị lớp <b>L1</b> chặn. Đây là <b>lệch tham số giữa hai cụm</b>, ' +
    '⛔ phải lỗi của cửa này — xem M1.1 §9. Đường nhập vẫn chạy đúng: thử bằng hồ sơ do tab <b>📥 Nhập danh sách</b> tạo ra.</div>' +
    '<div style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn p" data-lo="bu">⬆ Xuất mẫu và nạp tệp đã điền</button> ' + loThe('bu') +
    (mo ? '' : ' <span class="st2 r">🔒 vai đang xem ⛔ có bit <code>ID</code></span>') +
    '</div>' + loBangLS('Bổ sung hồ sơ theo lô');
}

function loBangLS(loai){
  var ds = loLS().filter(function(l){ return l.loai === loai; });
  if (!ds.length) return '<div class="ro" style="color:var(--ink3)">Chưa chạy lô nào trong phiên này.</div>';
  return '<div class="card"><div class="ch">🕘 Lô đã chạy — hoàn tác được 7 ngày</div>' +
    ds.map(function(l){
      return '<div class="bnx-r g"><div>' + l.t + '</div><div><code>' + l.id + '</code></div>' +
        '<div>ghi <b>' + l.ghi + '</b> · bỏ <b>' + l.bo + '</b></div>' +
        '<div>' + l.tep + ' · <i>' + l.mau_dich + '</i>' +
        (BNX.menuM11.lo[l.id] ? ' <button class="btn xs" data-loht="' + l.id + '">↩ Hoàn tác</button>' : ' <span class="st2">đã hoàn tác</span>') +
        '</div></div>'; }).join('') + '</div>';
}

/* nối sự kiện — đặt ở pha nổi bọt trên body, ⛔ sửa bộ bắt của app.js */
document.addEventListener('click', function(ev){
  var b = ev.target.closest && ev.target.closest('[data-lo]');
  if (b){
    if (!window.BNX || !BNX.menuM11) return;
    var f = b.dataset.lo;
    if (!loMoDuoc(f)){                       /* gác bit ID TRƯỚC khi mở hộp (HDMX ⑪) */
      if (typeof toast === 'function')
        toast('🔒 ' + R().n + ' ⛔ có bit ID của ' + (f === 'nhap' ? 'm1.1.nhap_danh_sach' : 'm1.1.bo_sung_ho_so') +
              ' — chức danh sở hữu: ' + LO_CHU[f].join(' · '));
      return;
    }
    if (f === 'nhap') BNX.menuM11.moNhapDS(); else BNX.menuM11.moBuHoSo();
    return;
  }
  var h = ev.target.closest && ev.target.closest('[data-loht]');
  if (h && window.BNX && BNX.menuM11){
    var r = BNX.menuM11.lo[h.dataset.loht];
    if (r){ var s = r.hoanTac(); delete BNX.menuM11.lo[h.dataset.loht];
      if (typeof toast === 'function') toast('↩ Đã hoàn tác ' + s + ' — dữ liệu về như trước lô');
      if (typeof render === 'function') render(); }
  }
});

/* 🛑 Lời gọi khởi động nằm ở ĐÂY, ⛔ ở cuối app.js — tệp này nạp sau. */
render();
</script>
